# Biomarker universe: the master list of biomarkers the catalog should eventually cover.
# One [[marker]] per biomarker. See catalog/UNIVERSE.md for sources, method and counts.
#
# slug       lowercase-kebab, stable (existing src/seed.rs slugs are kept unchanged)
# loinc      verified against the NLM Clinical Tables LOINC API; "" with loinc_note when none fits
# category   grouping used by lint coverage reports
# priority   core (routinely ordered / high value) | common | specialist
# derived    true when computed from other measurements (ratios, formulas, scores)

