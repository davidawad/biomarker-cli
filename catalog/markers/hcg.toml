]
note = "Non-parametric 97.5th percentile upper reference limit for System B, which gave the highest limits of the four systems. Converted from the source's IU/L (8.2) to mIU/mL using factor 1. Alternative to the default hcg-postmenopausal-clia-2026 reference range for the same population."

