slug = "hcg"
name = "Human Chorionic Gonadotropin, Quantitative (beta-hCG)"
category = "pregnancy"
unit = "mIU/mL"
description = "Quantitative beta subunit of human chorionic gonadotropin in serum. Used to confirm and date pregnancy, to judge whether an early pregnancy is viable and intrauterine, and to monitor pregnancy of unknown location. Pituitary secretion raises values modestly in perimenopausal and postmenopausal women."

[[range]]
set = "clinical"
kind = "reference"
high = 5.0
when = { pregnant = false }
population = "Conventional adult non-pregnant reference interval, as cited by the authors of a 2026 age-specific hCG study"
evidence = "reference-interval-study"
citations = [
  { pmid = "41253215", doi = "10.1016/j.cca.2025.120729", url = "https://pubmed.ncbi.nlm.nih.gov/41253215/", title = "Establishing age-specific reference intervals for serum beta-human chorionic gonadotropin using Hoffmann and nonparametric methods: A big data study based on laboratory databases.", locator = "Abstract, Background" },
]
note = "Conventional upper reference limit for non-pregnant adults. The source authors cite it as the conventional value and show it may be inappropriate for women aged 45 and over. Converted from the source's IU/L (5) to mIU/mL using factor 1."

[[range]]
set = "hcg-postmenopausal-clia-2026"
kind = "reference"
high = 7.1
when = { menopause = "post" }
population = "Healthy postmenopausal women (n=355 analysed), 460 enrolled, four CLIA systems (method: chemiluminescence immunoassay, Beckman UniCel DxI 800 (System A))"
evidence = "reference-interval-study"
citations = [
  { pmid = "42607919", doi = "10.1016/j.cca.2026.121282", url = "https://pubmed.ncbi.nlm.nih.gov/42607919/", title = "Redefining \"Normal\" for hCG in postmenopausal women: 97.5th percentile reference intervals and 99th percentile thresholds across four chemiluminescence immunoassay systems.", locator = "Abstract, Results" },
]
note = "Non-parametric 97.5th percentile upper reference limit for System A. Assay-specific; values from other platforms differ. Converted from the source's IU/L (7.1) to mIU/mL using factor 1."

