slug = "h-pylori-breath"
name = "Helicobacter pylori Urea Breath Test"
category = "infectious"
unit = "per mil"
loinc = "29891-9"
description = "Non-invasive test for active Helicobacter pylori infection. The patient drinks a labelled urea substrate (13C or 14C) and exhaled breath is analysed for labelled CO2; the result is the change from baseline (delta over baseline, DOB) in per mil. Reported as positive or negative against a cut-off. Expected result: negative (DOB below the cut-off)."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "diagnostic"
kind = "warn"
high = 3.5
population = "Dyspeptic adults from Buenos Aires, Argentina (154 volunteers, initial diagnosis, histology as reference), 13C-UBT by isotope-ratio mass spectrometry with a commercial kit"
evidence = "cohort"
citations = [
  { pmid = "41822258", doi = "10.3389/fgstr.2025.1634183", url = "https://pubmed.ncbi.nlm.nih.gov/41822258/", title = "Improving (13)C-urea breath test performance metrics for diagnosis of Helicobacter pylori infection.", locator = "Abstract (Results)" },
]
note = "DOB at or above 3.5 per mil called positive for initial diagnosis in this single-centre study (sensitivity 93.0%, specificity 95.6%). This is a study cut-off, not a guideline cut-off. The same study found the optimal value could be lowered to 3.0 per mil in its own laboratory. Source kind: diagnostic. Source band >= 3.5; stored as the warn high bound 3.5."
