evidence = "reference-interval-study"
citations = [
  { pmid = "26552478", doi = "10.1186/s13048-015-0201-z", title = "Determination of reference intervals of serum levels of human epididymis protein 4 (HE4) in Chinese women.", locator = "Abstract, Methods and Results" },
]
note = "Premenopausal healthy reference range (2.5-97.5 % central interval)."

