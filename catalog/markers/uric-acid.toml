slug = "uric-acid"
name = "Uric Acid"
category = "metabolic"
unit = "mg/dL"
description = "Serum urate. Hyperuricaemia is the main risk factor for gout; treat-to-target urate-lowering therapy aims for a serum urate below 6 mg/dL in people with gout. Reference intervals are sex-specific."
