slug = "sleep-efficiency"
name = "Sleep Efficiency"
category = "wearable"
unit = "%"
description = "Percentage of time in bed that is spent asleep (total sleep time divided by time in bed), measured by actigraphy, polysomnography or wearable sleep tracking. Low values indicate fragmented or poor-quality sleep."
aliases = ["sleep efficiency index", "se"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "sleep-2011-actigraphy-poor-sleep"
kind = "warn"
high = 85
population = "Healthy middle-aged community adults with 3-day actigraphy in a cross-sectional wave of a follow-up study (method: actigraphy)"
evidence = "cohort"
citations = [
  { pmid = "21286244", doi = "10.1093/sleep/34.2.225", url = "https://pubmed.ncbi.nlm.nih.gov/21286244/", title = "Relationship of sleep quantity and quality with 24-hour urinary catecholamines and salivary awakening cortisol in healthy middle-aged adults.", locator = "Abstract, Measurements and Results" },
]
note = "Research classification of objectively poor sleepers: actigraphy sleep efficiency below 85% (boundary < 85%). A study-defined threshold, not a clinical guideline cut-off; above 85% counts as good sleep in this comparison. Source kind: decision."

