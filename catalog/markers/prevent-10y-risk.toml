slug = "prevent-10y-risk"
name = "AHA PREVENT 10-year CVD Risk"
category = "composite"
unit = "%"
description = "Estimated 10-year risk of cardiovascular disease (ASCVD and heart failure) from the American Heart Association PREVENT equations, which use age, sex, lipids, blood pressure, diabetes, smoking, BMI, eGFR and treatments, without race. It is an alternative to the Pooled Cohort Equations for primary-prevention risk estimation."
aliases = ["prevent", "prevent cvd risk", "aha prevent 10-year risk"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "acc-aha-2026-dyslipidemia"
kind = "warn"
high = 3
population = "US adults aged 30-79 years without known cardiovascular disease, PREVENT-based 10-year risk"
evidence = "guideline"
citations = [
  { pmid = "42828255", doi = "10.1016/j.ajpc.2026.101711", url = "https://pubmed.ncbi.nlm.nih.gov/42828255/", title = "Risk-Treatment Discordance and Fatal Cardiovascular Disease: A Nationwide Analysis Using PREVENT Thresholds.", locator = "Methods, risk category definitions (full text)" },
]
note = "Low risk, <3% 10-year PREVENT risk. Categories as stated in the cited paper, which attributes them to the 2026 multisociety dyslipidemia guideline; the quote does not name the risk outcome, the paper applies them to PREVENT-ASCVD. Upper limit is exclusive. Source kind: decision."

