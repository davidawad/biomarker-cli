slug = "appendicular-lean-mass-index"
name = "Appendicular Lean Mass Index (ALM/height2)"
category = "body"
unit = "kg/m2"
description = "Appendicular lean mass (muscle mass of the arms and legs, usually from DXA or bioimpedance) divided by height squared. Used as the muscle-quantity criterion for sarcopenia; low values indicate low muscle quantity."
aliases = ["alm/height2", "appendicular skeletal muscle index", "asm/height2", "smi"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "ewgsop2-2019"
kind = "warn"
low = 7.0
when = { sex = "male" }
population = "Older adults (European consensus); cut-offs for low muscle quantity in men"
evidence = "consensus"
citations = [
  { pmid = "30312372", doi = "10.1093/ageing/afy169", url = "https://pubmed.ncbi.nlm.nih.gov/30312372/", title = "Sarcopenia: revised European consensus on definition and diagnosis.", locator = "Table 3, EWGSOP2 cut-off points for low muscle quantity" },
]
note = "Low muscle quantity if below 7.0 kg/m2 in men (strict less-than boundary). Confirms sarcopenia when combined with low strength. Measurement method not specified in the quoted text. Source kind: decision. Source band <= 7.0; stored as the warn low bound 7.0."

