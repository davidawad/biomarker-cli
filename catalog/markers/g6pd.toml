slug = "g6pd"
name = "G6PD activity"
category = "cbc"
unit = "U/g Hb"
loinc = "2357-2"
description = "Activity of the red-cell enzyme glucose-6-phosphate dehydrogenase, expressed per gram of haemoglobin. Low activity (G6PD deficiency) predisposes to oxidant-induced haemolysis, for example after primaquine or tafenoquine, so the result decides whether these 8-aminoquinoline drugs can be given."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "g6pd-thailand-2025"
kind = "warn"
high = 6.1
population = "patients with Plasmodium vivax in Thailand receiving radical cure after quantitative G6PD testing (pilot implementation)"
evidence = "cohort"
citations = [
  { pmid = "40274286", doi = "10.1136/bmjgh-2024-016720", title = "Prospective observational study to assess the feasibility and safety of appropriate Plasmodium vivax radical cure with tafenoquine or primaquine after quantitative G6PD testing during pilot implementation in Thailand.", locator = "Methods, treatment allocation" },
]
note = "Eligibility for tafenoquine 300 mg single dose (G6PD normal). Intermediate patients were allocated primaquine in this protocol. The sources do not convert U/g Hb values to percent of normal; the 2026 Peru paper refers to 30% and 70% activity thresholds without stating the U/g Hb equivalents. Source kind: diagnostic. Source band >= 6.1; stored as the warn high bound 6.1."

[[range]]
set = "alt-1"
kind = "warn"
high = 4.1
population = "patients with Plasmodium vivax in Thailand receiving radical cure after quantitative G6PD testing (pilot implementation)"
evidence = "cohort"
citations = [
  { pmid = "40274286", doi = "10.1136/bmjgh-2024-016720", title = "Prospective observational study to assess the feasibility and safety of appropriate Plasmodium vivax radical cure with tafenoquine or primaquine after quantitative G6PD testing during pilot implementation in Thailand.", locator = "Methods, treatment allocation" },
]
note = "Eligibility for primaquine 15 mg/day for 14 days (G6PD normal or intermediate). Deficient (<=4.0 U/g Hb) patients received weekly primaquine 45 mg for 8 weeks instead. Source kind: diagnostic. Source band >= 4.1; stored as the warn high bound 4.1. Alternative to the default g6pd-thailand-2025 warn range for the same population."
