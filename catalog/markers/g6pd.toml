slug = "g6pd"
name = "G6PD activity"
category = "cbc"
unit = "U/g Hb"
loinc = "2357-2"
description = "Activity of the red-cell enzyme glucose-6-phosphate dehydrogenase, expressed per gram of haemoglobin. Low activity (G6PD deficiency) predisposes to oxidant-induced haemolysis, for example after primaquine or tafenoquine, so the result decides whether these 8-aminoquinoline drugs can be given."

[[range]]
set = "g6pd-peru-2026"
kind = "warn"
low = 4.0
population = "987 adults and children with Plasmodium vivax in the Peruvian Amazon, semi-quantitative G6PD activity assay in a radical-cure programme"
evidence = "cohort"
citations = [
  { pmid = "42500357", doi = "10.1016/j.lana.2026.101568", title = "Health-care provider compliance with a revised <i>Plasmodium vivax</i> radical cure algorithm incorporating tafenoquine and quantitative G6PD testing in the Peruvian Amazon: a prospective observational study.", locator = "Table 2" },
]
note = "Programme cut-off for deficiency (about the 30% activity threshold per the same paper's discussion). Semi-quantitative point-of-care device, not a reference laboratory assay. Source kind: deficient. Source band <= 4.0; stored as the warn low bound 4.0."

