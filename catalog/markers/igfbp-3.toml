  { pmid = "42736152", doi = "10.3760/cma.j.cn112150-20260205-00111", url = "https://pubmed.ncbi.nlm.nih.gov/42736152/", title = "[Multicenter study on the establishment of continuous reference intervals for capillary blood IGF-1 and IGFBP-3 in children aged 0-6 years in Jiangsu Province].", locator = "Abstract, Results" },
