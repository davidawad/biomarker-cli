kind = "warn"
high = 52.9
when = { sex = "female", conditions = ["pcos"] }
population = "Women with PCOS referred to a neurosurgical centre, retrospective study, 2009-2020 (657 PCOS patients)"
evidence = "cohort"
citations = [
  { pmid = "37057215", doi = "10.7150/ijms.80891", url = "https://pubmed.ncbi.nlm.nih.gov/37057215/", title = "What is the optimal prolactin cutoff for predicting the presence of a pituitary adenoma in patients with polycystic ovary syndrome?", locator = "Abstract, Results" },
]
note = "ROC cut-off for detecting a pituitary adenoma in hyperprolactinaemic PCOS patients; PRL at or above this value warrants sella MRI. Differs from the 85.2 ng/mL value in a different cohort, so use with caution. Source kind: diagnostic. Source band >= 52.9; stored as the warn high bound 52.9."
