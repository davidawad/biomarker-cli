[[range]]
set = "endocrine-review-hyperprolactinaemia-2018"
kind = "warn"
high = 250
population = "Patients with hyperprolactinaemia; overview by the Neuroendocrinology Department of the Brazilian Society of Endocrinology and Metabolism"
evidence = "consensus"
citations = [
  { pmid = "29768629", doi = "10.20945/2359-3997000000032", url = "https://pubmed.ncbi.nlm.nih.gov/29768629/", title = "Controversial issues in the management of hyperprolactinemia and prolactinomas - An overview by the Neuroendocrinology Department of the Brazilian Society of Endocrinology and Metabolism.", locator = "Full text" },
]
note = "Restates the prolactinoma threshold from an open-access review rather than the primary Endocrine Society or Pituitary Society guideline text. PRL above 250 ng/mL is highly suggestive of prolactinoma. Lower values are common with stalk dysfunction, drugs or systemic disease. Macroprolactin should be excluded when values are discordant (hook effect). Source kind: diagnostic. Source band >= 250; stored as the warn high bound 250."

[[range]]
set = "pcos-prolactinoma-threshold-2018"
kind = "warn"
high = 85.2
when = { sex = "female", conditions = ["pcos"] }
population = "Women with PCOS and hyperprolactinaemia, retrospective case-control (n=528 PCOS women, 60 with elevated PRL)"
evidence = "cohort"
citations = [
  { pmid = "29845629", doi = "10.1111/eci.12961", url = "https://pubmed.ncbi.nlm.nih.gov/29845629/", title = "The value of prolactin in predicting prolactinοma in hyperprolactinaemic polycystic ovarian syndrome.", locator = "Abstract, Conclusions" },
]
note = "ROC threshold for prolactinoma (MRI-confirmed) among hyperprolactinaemic PCOS women: 77% sensitivity, 100% specificity. Values above this favour pituitary imaging. Single-centre, small case count. Source kind: diagnostic. Source band >= 85.2; stored as the warn high bound 85.2."

[[range]]
