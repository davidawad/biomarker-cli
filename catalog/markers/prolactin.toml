slug = "prolactin"
name = "Prolactin"
category = "hormone"
unit = "ng/mL"
description = "Pituitary hormone from lactotroph cells that regulates lactation and modulates gonadal function. Elevated levels (hyperprolactinaemia) have physiological causes such as pregnancy, stress and sleep, and pathological causes such as prolactinoma and drugs. Assay results vary with macroprolactin, so assay-specific ranges matter."
loinc = "2842-3"
aliases = ["prl"]

