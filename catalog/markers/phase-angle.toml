slug = "phase-angle"
name = "Phase Angle (BIA)"
category = "body-composition"
unit = "°"
loinc = "107160-4"
description = "Phase angle (PhA, degrees) calculated from body resistance and reactance measured by bioelectrical impedance analysis (BIA). An indicator of cellular integrity and body cell mass, tracked as a body-composition and nutrition marker. Expected result: sex- and age-specific; higher in men than women, peaking in midlife and declining with age. No single cut-off applies across populations."

