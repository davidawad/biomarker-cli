high = 8.7
when = { sex = "male", age = [10.0, 20.0] }
population = "Healthy Colombian males aged 10-19 years (n=533 in the 10-19 y band)"
evidence = "reference-interval-study"
citations = [
  { pmid = "42000911", doi = "10.1038/s41430-026-01744-z", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC13341315/", title = "Reference values for bioelectrical impedance-derived phase angle: a cross-sectional study of 5,049 healthy individuals from Colombia.", locator = "Table 2" },
]
note = "Source Table 2 gives P3 to P97 (central 94%, not 2.5th-97.5th), tabulated as normative reference values."

