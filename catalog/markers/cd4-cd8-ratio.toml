description = "Ratio of CD4+ helper T cells to CD8+ cytotoxic T cells in blood, from lymphocyte subset flow cytometry. Used in HIV monitoring (a low ratio is associated with non-AIDS mortality in people living with HIV) and in immune deficiency or immune dysregulation work-up. Expected result in healthy adults: within the reference interval."

