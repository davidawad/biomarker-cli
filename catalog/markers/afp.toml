]
note = "Proposed lower screening threshold: AFP >= 10 ng/mL in MASLD, ALD and cured-HCV cirrhosis raised sensitivity with little loss of specificity. A borderline/early-warning band rather than a diagnostic cut-off. Alternative to the default afp-screening-thresholds-2026 warn range for the same population."

