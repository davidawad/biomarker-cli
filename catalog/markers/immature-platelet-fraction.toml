slug = "immature-platelet-fraction"
name = "Immature Platelet Fraction"
category = "hematology"
unit = "%"
loinc = "71693-6"
description = "Percentage of circulating platelets that are immature (reticulated), reported by automated haematology analysers as IPF. Reflects platelet production in the marrow. Raised values suggest consumptive or recovering thrombocytopenia; low values suggest marrow failure. Expected result in healthy adults: within the reference interval (roughly 1-9 percent, depending on analyser)."

[[range]]
set = "clinical"
kind = "reference"
low = 1.6
high = 9.6
population = "153 healthy Caucasian adults from Spain, Sysmex XN-2000 analyser, non-parametric percentile method per CLSI; no significant sex difference"
evidence = "reference-interval-study"
citations = [
  { pmid = "29472803", doi = "10.11613/BM.2018.010708", title = "Reference interval for immature platelet fraction on Sysmex XN haematology analyser in adult population.", locator = "Abstract, Results" },
]
note = "Analyser-specific (Sysmex XN-2000) reference interval; 153 adults."

