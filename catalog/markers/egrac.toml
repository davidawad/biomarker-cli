slug = "egrac"
name = "Erythrocyte glutathione reductase activation coefficient (EGRAC)"
category = "vitamin"
unit = "ratio"
description = "Functional riboflavin (vitamin B2) status: the ratio of erythrocyte glutathione reductase activity with added FAD to activity without it. Higher values mean lower riboflavin status; cut-offs vary between laboratories and methods."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "jnutr-2026-riboflavin"
kind = "warn"
low = 1.4
population = "females of reproductive age and children in population samples from Ireland, UK, Cambodia, DR Congo, and cohorts in Northern Ireland, Spain, Canada, Malaysia, Lao PDR, Uganda"
evidence = "consensus"
citations = [
  { pmid = "41735095", doi = "10.1016/j.tjnut.2025.101277", title = "Riboflavin Deficiency Is Highly Prevalent in Females and Children across High and Low/Middle Income Countries Worldwide.", locator = "Methods" },
]
note = "Deficiency at 1.40 or above, as used in the 2026 multi-country study. Other national surveys have used a lower threshold: the UK NDNS analysis cited EGRAC of 1.30 or above as deficient (PMID 19102813), and the authors call for re-evaluating the threshold because the method changes results. Source kind: deficient."

