slug = "inhibin-b"
name = "Inhibin B"
category = "hormone"
unit = "pg/mL"
description = "Glycoprotein secreted by Sertoli cells in men and by granulosa cells of growing follicles in women. Suppresses pituitary FSH. In men it is a marker of spermatogenesis; in women it reflects early follicular activity and ovarian reserve."

[[range]]
set = "clinical"
kind = "reference"
low = 62.75
when = { sex = "male" }
population = "Control men with normal total sperm number (WHO 2010), Rome, retrospective study; the 5th percentile was taken as the lower limit"
evidence = "reference-interval-study"
citations = [
  { pmid = "30531061", doi = "10.4103/aja.aja_93_18", url = "https://pubmed.ncbi.nlm.nih.gov/30531061/", title = "Inhibin B: are modified ranges needed for orchiectomised testicular cancer patients?", locator = "Results, Table 4" },
]
note = "Lower limit (5th percentile) of inhibin B in normozoospermic control men. Value was derived in one centre, so treat as local rather than universal."

[[range]]
set = "alt-1"
kind = "reference"
low = 80
high = 350
when = { sex = "male" }
population = "Men with normal spermatogenesis, as cited by the authors for postpubertal men"
evidence = "reference-interval-study"
citations = [
  { pmid = "30531061", doi = "10.4103/aja.aja_93_18", url = "https://pubmed.ncbi.nlm.nih.gov/30531061/", title = "Inhibin B: are modified ranges needed for orchiectomised testicular cancer patients?", locator = "Methods, Assay performance" },
]
note = "Normal postpubertal range as stated by the authors. The source gives no percentile or sample size for this range, so it is a secondary citation. Alternative to the default inhibin-b-normozoospermic-controls-2019 reference range for the same population."

[[range]]
set = "bulgarian-women-inhibin-b-2004"
kind = "reference"
low = 33.15
high = 190.75
when = { sex = "female", age = [20.0, 40.0] }
population = "Healthy fertile Bulgarian women aged 20-40 years (n=65), single centre"
evidence = "reference-interval-study"
citations = [
  { pmid = "15518284", url = "https://pubmed.ncbi.nlm.nih.gov/15518284/", title = "[Measurement of basal inhibin B level in Bulgarian women of the childbearing age].", locator = "Abstract, Results" },
]
note = "5th-95th percentile in a small, older single-centre study. Cycle phase is not stated in the abstract. Assay-dependent and not validated against newer assays."

[[range]]
set = "puberty-inhibin-b-girls-2000"
kind = "reference"
high = 100
when = { sex = "female" }
population = "Healthy prepubertal schoolgirls aged 6-20 years (n=403 across puberty stages)"
evidence = "reference-interval-study"
citations = [
  { pmid = "10770209", doi = "10.1210/jcem.85.4.6512", url = "https://pubmed.ncbi.nlm.nih.gov/10770209/", title = "Serum inhibin A and inhibin B in healthy prepubertal, pubertal, and adolescent girls and adult women: relation to age, stage of puberty, menstrual cycle, follicle-stimulating hormone, luteinizing hormone, and estradiol levels.", locator = "Abstract, Results" },
]
note = "Upper 95% prediction limit for prepubertal girls (Tanner stage 1). The lower limit is below 20 pg/mL. Levels are low or undetectable before puberty. Applies only to: tanner_min=1; tanner_max=1."

[[range]]
set = "alt-1"
kind = "reference"
low = 28
high = 227
when = { sex = "female" }
population = "Healthy schoolgirls aged 6-20 years at pubertal stage III (n=403 across puberty stages)"
evidence = "reference-interval-study"
citations = [
  { pmid = "10770209", doi = "10.1210/jcem.85.4.6512", url = "https://pubmed.ncbi.nlm.nih.gov/10770209/", title = "Serum inhibin A and inhibin B in healthy prepubertal, pubertal, and adolescent girls and adult women: relation to age, stage of puberty, menstrual cycle, follicle-stimulating hormone, luteinizing hormone, and estradiol levels.", locator = "Abstract, Results" },
]
note = "95% prediction interval at the peak of inhibin B in puberty (stage III). Median 84 pg/mL. Applies only to: tanner_min=3; tanner_max=3. Alternative to the default puberty-inhibin-b-girls-2000 reference range for the same population."

[[range]]
set = "male-infertility-inhibin-b-cutoffs-2021"
kind = "warn"
low = 58.25
when = { sex = "male", conditions = ["severe-oligozoospermia"] }
population = "Subfertile Chinese men, 324 patients with different spermatogenesis status"
evidence = "cohort"
citations = [
  { pmid = "34181290", doi = "10.1002/jcla.23882", url = "https://pubmed.ncbi.nlm.nih.gov/34181290/", title = "Clinical application value of Inhibin B alone or in combination with other hormone indicators in subfertile men with different spermatogenesis status: A study of 324 Chinese men.", locator = "Abstract, Results" },
]
note = "Upper cut-off for severe oligozoospermia (ISO) in the source. Values at or below this favour impaired spermatogenesis. Single-centre, derived from the same cohort it was tested in. Source kind: diagnostic. Source band <= 58.25; stored as the warn low bound 58.25."

[[range]]
set = "alt-1"
kind = "warn"
low = 45.9
when = { sex = "male", conditions = ["nonobstructive-azoospermia"] }
population = "Subfertile Chinese men, 324 patients with different spermatogenesis status"
evidence = "cohort"
citations = [
  { pmid = "34181290", doi = "10.1002/jcla.23882", url = "https://pubmed.ncbi.nlm.nih.gov/34181290/", title = "Clinical application value of Inhibin B alone or in combination with other hormone indicators in subfertile men with different spermatogenesis status: A study of 324 Chinese men.", locator = "Abstract, Results" },
]
note = "Cut-off to diagnose non-obstructive azoospermia versus obstructive azoospermia; values below this favour NOA. Single-centre. Source kind: diagnostic. Source band <= 45.9; stored as the warn low bound 45.9. Alternative to the default male-infertility-inhibin-b-cutoffs-2021 warn range for the same population."

[[range]]
set = "tese-inhibin-b-cutoff-2016"
kind = "warn"
high = 19.1
when = { sex = "male", conditions = ["azoospermia"] }
population = "Azoospermia patients undergoing testicular sperm extraction (TESE), Chinese cohort"
evidence = "cohort"
citations = [
  { pmid = "29282914", url = "https://pubmed.ncbi.nlm.nih.gov/29282914/", title = "[Level of serum inhibin B for predicting the results of testicular sperm extraction in azoospermia patients].", locator = "Abstract, Results" },
]
note = "ROC cut-off for predicting TESE result. Values at or above this favour sperm retrieval. Single-centre, small sample. Source kind: diagnostic. Source band >= 19.1; stored as the warn high bound 19.1."

