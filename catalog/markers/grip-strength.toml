slug = "grip-strength"
name = "Handgrip Strength"
category = "body"
unit = "kg"
description = "Maximum voluntary force produced by squeezing a hand dynamometer, in kilograms. Used as the muscle strength criterion for sarcopenia; low grip strength predicts disability and mortality."
aliases = ["grip strength", "hand grip strength", "handgrip"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "dodds-2014-grip"
kind = "warn"
high = 32
when = { sex = "male" }
population = "Adults aged 20 to 80+ years from twelve British studies (normative data)"
evidence = "reference-interval-study"
citations = [
  { pmid = "25474696", doi = "10.1371/journal.pone.0113637", url = "https://pubmed.ncbi.nlm.nih.gov/25474696/", title = "Grip strength across the life course: normative data from twelve British studies.", locator = "Discussion" },
]
note = "Authors' weak-grip band: T-score -2 or below, equivalent to 32 kg in men. The authors note a T-score of -2.5 (27 kg in men) may be more discriminatory. Band, not a diagnostic cut-off."

