slug = "cgm-glucose-cv"
name = "CGM glucose coefficient of variation"
category = "glycemic"
unit = "%"
description = "Within-person coefficient of variation (CV, standard deviation divided by mean glucose) of CGM glucose, a measure of glycemic variability. Consensus target for people with diabetes; reference values from healthy participants."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "optimal"
kind = "optimal"
high = 33
when = { conditions = ["diabetes"] }
population = "Adults and children with diabetes receiving insulin or sulfonylureas"
evidence = "consensus"
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table listing CGM metrics for clinical care, footnote" },
]
note = "For people with diabetes receiving insulin or sulfonylureas: lower CV target (below 33 percent) suggested by some studies to give additional protection against hypoglycemia; footnote to the consensus table, not a consensus target."

[[range]]
set = "target"
kind = "optimal"
high = 36
when = { conditions = ["diabetes"] }
population = "Adults and children with type 1 or type 2 diabetes"
evidence = "consensus"
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table listing CGM metrics for clinical care" },
]
note = "Glycemic variability target: CV at or below 36 percent. Source kind: target."
