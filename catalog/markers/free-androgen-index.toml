slug = "free-androgen-index"
name = "Free Androgen Index"
category = "hormone"
unit = "%"
description = "Calculated index of androgen activity: total testosterone divided by SHBG, times 100. Used as a biochemical marker of hyperandrogenism, mainly in women with suspected polycystic ovary syndrome."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "pcos-lcms-2021"
kind = "warn"
low = 2.5
when = { sex = "female", conditions = ["pcos"] }
population = "Women with PCOS (n=102) and healthy volunteers (n=41), Chinese cohort, androgens by LC-MS/MS (method: lc-ms/ms; test: ROC analysis for hyperandrogenemia)"
evidence = "cohort"
citations = [
  { pmid = "33583431", doi = "10.1186/s13048-021-00781-5", url = "https://pubmed.ncbi.nlm.nih.gov/33583431/", title = "Comparison of the efficacy of different androgens measured by LC-MS/MS in representing hyperandrogenemia and an evaluation of adrenal-origin androgens with a dexamethasone suppression test in patients with PCOS.", locator = "Abstract, Results" },
]
note = "Optimal ROC cut-off for hyperandrogenemia in PCOS (sensitivity 87.0%, specificity 92.68%). Values above the cut-off indicate hyperandrogenemia in this study. Single-centre diagnostic accuracy, not a reference interval. The abstract does not state the FAI formula; check the full text before applying the cut-off to other assays. Source kind: diagnostic. Source band <= 2.5; stored as the warn low bound 2.5."
