slug = "bnp"
name = "B-type Natriuretic Peptide"
category = "cardiac"
unit = "pg/mL"
loinc = "30934-4"
description = "B-type natriuretic peptide, a hormone released by the heart ventricles in response to stretch. It is used to help diagnose or rule out heart failure, with cut-offs that depend on setting, body weight and other conditions."
aliases = ["brain natriuretic peptide"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "hf-guideline-review-2026"
kind = "warn"
high = 35
population = "Adults assessed for suspected heart failure in the community (non-acute setting) (setting: ambulatory)"
evidence = "guideline"
citations = [
  { pmid = "41778370", doi = "10.1093/ehjqcco/qcag029", url = "https://pubmed.ncbi.nlm.nih.gov/41778370/", title = "Heart failure with reduced ejection fraction: a systematic review of clinical practice guidelines and recommendations.", locator = "Full text, guideline diagnostic criteria table" },
]
note = "Community (non-acute) heart failure diagnostic criterion: BNP at or above 35 pg/mL (boundary inclusive). Criteria are as tabulated in a systematic review of HF guideline recommendations. Source kind: decision. Source band >= 35; stored as the warn high bound 35."

[[range]]
set = "alt-1"
kind = "warn"
high = 100
population = "Adults presenting to the emergency department with acute dyspnoea (setting: acute-dyspnoea)"
evidence = "guideline"
citations = [
  { pmid = "41778370", doi = "10.1093/ehjqcco/qcag029", url = "https://pubmed.ncbi.nlm.nih.gov/41778370/", title = "Heart failure with reduced ejection fraction: a systematic review of clinical practice guidelines and recommendations.", locator = "Full text, guideline diagnostic criteria table" },
]
note = "Emergency-setting heart failure diagnostic criterion: BNP at or above 100 pg/mL (boundary inclusive). Source kind: decision. Source band >= 100; stored as the warn high bound 100. Alternative to the default hf-guideline-review-2026 warn range for the same population."

[[range]]
set = "breathing-not-properly-2006"
kind = "warn"
low = 100
population = "Patients presenting to the emergency department with acute dyspnoea (Breathing Not Properly multinational study) (setting: acute-dyspnoea)"
evidence = "cohort"
citations = [
  { pmid = "16431187", doi = "10.1016/j.amjmed.2005.04.029", url = "https://pubmed.ncbi.nlm.nih.gov/16431187/", title = "Impact of the history of congestive heart failure on the utility of B-type natriuretic peptide in the emergency diagnosis of heart failure: results from the Breathing Not Properly Multinational Study.", locator = "Abstract, Results" },
]
note = "Low-range rule-out band in the emergency department: BNP below 100 pg/mL (strict <100). Reported negative predictive value of 90% in the study. Source kind: decision. Source band <= 100; stored as the warn low bound 100."

[[range]]
set = "alt-2"
kind = "warn"
high = 500
population = "Patients presenting to the emergency department with acute dyspnoea (Breathing Not Properly multinational study) (setting: acute-dyspnoea)"
evidence = "cohort"
citations = [
  { pmid = "16431187", doi = "10.1016/j.amjmed.2005.04.029", url = "https://pubmed.ncbi.nlm.nih.gov/16431187/", title = "Impact of the history of congestive heart failure on the utility of B-type natriuretic peptide in the emergency diagnosis of heart failure: results from the Breathing Not Properly Multinational Study.", locator = "Abstract, Results" },
]
note = "High-range rule-in band in the emergency department: BNP above 500 pg/mL (strict >500). Reported positive predictive value of 87%. Values from 100 to 500 pg/mL are the ambiguous medium range. Source kind: decision. Source band >= 500; stored as the warn high bound 500. Alternative to the default breathing-not-properly-2006 warn range for the same population."

[[range]]
set = "breathing-not-properly-2006"
kind = "warn"
high = 110
when = { conditions = ["overweight-obesity"] }
population = "Patients with acute heart failure in the Breathing Not Properly multinational study, overweight or obese (not severely obese)"
evidence = "cohort"
citations = [
  { pmid = "16644321", doi = "10.1016/j.ahj.2005.10.011", url = "https://pubmed.ncbi.nlm.nih.gov/16644321/", title = "How obesity affects the cut-points for B-type natriuretic peptide in the diagnosis of acute heart failure. Results from the Breathing Not Properly Multinational Study.", locator = "Abstract, Results" },
]
note = "Obesity-adjusted BNP cut-point for overweight or obese patients, chosen to keep 90% sensitivity for heart failure. Boundary inclusive (>=110). Lean patients need a higher cut-point (170 pg/mL reported in the same study). Source kind: decision. Source band >= 110; stored as the warn high bound 110."

[[range]]
set = "alt-1"
kind = "warn"
high = 54
when = { conditions = ["severe-obesity"] }
population = "Patients with acute heart failure in the Breathing Not Properly multinational study, severely or morbidly obese"
evidence = "cohort"
citations = [
  { pmid = "16644321", doi = "10.1016/j.ahj.2005.10.011", url = "https://pubmed.ncbi.nlm.nih.gov/16644321/", title = "How obesity affects the cut-points for B-type natriuretic peptide in the diagnosis of acute heart failure. Results from the Breathing Not Properly Multinational Study.", locator = "Abstract, Results and Conclusion" },
]
note = "Obesity-adjusted BNP cut-point for severely or morbidly obese patients, chosen to keep 90% sensitivity. The study recommends this lower cut-point in severe obesity to preserve sensitivity (boundary inclusive, >=54). Source kind: decision. Source band >= 54; stored as the warn high bound 54. Alternative to the default breathing-not-properly-2006 warn range for the same population."
