note = "Consensus algorithm cut-off for discontinuing antibiotics in ED and inpatients (<= 0.25 ug/L; strong recommendation <= 0.1). 1 ug/L equals 1 ng/mL. Converted from the source's µg/L (0.25) to ng/mL using factor 1. Source kind: decision."

