description = "Gamma globulin fraction of serum protein electrophoresis (SPEP), reported as percent of total serum protein. It is mostly immunoglobulin (antibodies) and is tracked to assess low or high immunoglobulin levels and as part of the evaluation of plasma cell disorders. Expected result in a healthy adult: a value within the reference interval below, with no monoclonal (M) band on the electrophoresis."

