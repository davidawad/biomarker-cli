slug = "anti-xa"
name = "Anti-Xa activity (heparin)"
category = "coagulation"
unit = "IU/mL"
loinc = "3274-8"
description = "Chromogenic anti-factor Xa activity measured on heparin or low-molecular-weight heparin, used to monitor anticoagulant dosing. Levels below the target range suggest under-anticoagulation; levels above it suggest bleeding risk."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "acc-aha-valve-guideline-as-cited"
kind = "optimal"
low = 0.7
high = 1.2
when = { pregnant = true, conditions = ["mechanical-prosthetic-valve", "on-lmwh-bid"] }
population = "Pregnant women with mechanical prosthetic heart valves on adjusted-dose twice-daily subcutaneous LMWH (30 patients, 187 paired measurements)"
evidence = "guideline"
citations = [
  { pmid = "24607762", doi = "10.1177/1074248414524302", title = "Monitoring of anti-Xa in pregnant patients with mechanical prosthetic valves receiving low-molecular-weight heparin: peak or trough levels?", locator = "Background" },
]
note = "Target peak anti-Xa level as stated in the cited paper (quoting ACC/AHA guidance; the guideline text itself was not checked). The paper reports that peak-level targeting often left trough levels subtherapeutic. Units given as U/mL in the source, equivalent to IU/mL. Source kind: therapeutic."

[[range]]
set = "heparin-therapeutic-range-korea-2016"
kind = "optimal"
low = 0.3
high = 0.7
when = { conditions = ["on-ufh"] }
population = "Adults with venous thromboembolism receiving continuous intravenous unfractionated heparin (71 patients, 134 ex vivo samples, single centre in Korea)"
evidence = "cohort"
citations = [
  { pmid = "27722127", doi = "10.5045/br.2016.51.3.171", title = "Establishing the heparin therapeutic range using aPTT and anti-Xa measurements for monitoring unfractionated heparin therapy.", locator = "Abstract, Results" },
]
note = "Range derived by correlating aPTT with anti-Xa in one laboratory; the source describes 0.3-0.7 IU/mL as the therapeutic range. Not checked against a CHEST or ASH guideline text (not retrievable). Source kind: therapeutic."
