slug = "retinol"
name = "Retinol (vitamin A)"
category = "vitamin"
unit = "µg/dL"
aliases = ["vitamin-a"]
description = "Serum retinol, the circulating form of vitamin A, which reflects liver vitamin A stores when inflammation is absent. Low values indicate vitamin A deficiency, which causes night blindness and xerophthalmia and raises infection risk."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "who"
kind = "warn"
low = 20.06
population = "Preschool children and general population, as the WHO cut-off for biochemical vitamin A deficiency (VAD), as quoted in a 2018 review"
evidence = "consensus"
citations = [
  { pmid = "30134568", doi = "10.3390/nu10091132", title = "Vitamin A Deficiency and the Lung.", locator = "Introduction, para 1" },
]
note = "WHO cut-off 0.70 µmol/L converted to µg/dL with factor 28.65. Value is 'below' the cut-off. Inflammation can lower retinol; retinol-binding protein is an alternative marker. Source kind: deficient. Source band <= 20.06; stored as the warn low bound 20.06."

[[range]]
set = "who"
kind = "critical"
low = 10.03
population = "General population; WHO severe vitamin A deficiency cut-off, as quoted in a 2018 review"
evidence = "consensus"
citations = [
  { pmid = "30134568", doi = "10.3390/nu10091132", title = "Vitamin A Deficiency and the Lung.", locator = "Introduction, para 1" },
]
note = "Severe deficiency cut-off 0.35 µmol/L converted to µg/dL with factor 28.65. Associated with marked increases in risk of clinical manifestations such as xerophthalmia and nyctalopia. Source band <= 10.03; stored as the critical low bound 10.03."

[[range]]
set = "who"
kind = "warn"
low = 20.06
when = { pregnant = true }
population = "Pregnant women; WHO definition of VAD in pregnancy, as quoted in a 2019 narrative review"
evidence = "consensus"
citations = [
  { pmid = "30909386", doi = "10.3390/nu11030681", title = "Vitamin A and Pregnancy: A Narrative Review.", locator = "Text on vitamin A deficiency in pregnancy" },
]
note = "Same 0.70 µmol/L cut-off as for the general population, converted with factor 28.65. Source kind: deficient. Source band <= 20.06; stored as the warn low bound 20.06."

[[range]]
set = "fortification-meta-2019"
kind = "warn"
low = 30.08
population = "Lactating mothers, as a vitamin A deficiency outcome definition in a 2019 meta-analysis of LMIC fortification studies"
evidence = "consensus"
citations = [
  { pmid = "30997493", doi = "10.1093/ajcn/nqz023", title = "Improved micronutrient status and health outcomes in low- and middle-income countries following large-scale fortification: evidence from a systematic review and meta-analysis.", locator = "Table 2, Definitions of outcomes" },
]
note = "Outcome definition used by the meta-analysis (1.05 µmol/L converted with factor 28.65). Outcome definition used by the meta-analysis; not presented as a general clinical threshold. Applies only to: lactating=True. Source kind: deficient. Source band <= 30.08; stored as the warn low bound 30.08."
