set = "diagnostic"
kind = "warn"
high = 20
population = "Adults; average sleep-onset latency over 2 weeks of sleep-log data, primary insomnia vs normal sleepers"
evidence = "cohort"
citations = [
  { pmid = "16676781", doi = "10.1093/sleep/29.4.479", title = "Defining insomnia: quantitative criteria for insomnia severity and frequency.", locator = "Abstract, Results" },
]
note = "Research classification cut-off for primary insomnia (sensitivity 94.4%, specificity 79.6% in that study); 20 min or longer is the flagged value. Not a population reference interval. Source kind: diagnostic. Source band >= 20; stored as the warn high bound 20."
