set = "friend-2015-cpx-percentiles"
kind = "reference"
low = 29.0
high = 66.3
when = { sex = "male", age = [20.0, 30.0] }
population = "Men aged 20–29 years without known cardiovascular disease, maximal treadmill CPX (respiratory exchange ratio >= 1.0) in eight US laboratories, FRIEND registry 2014-2015"
evidence = "reference-interval-study"
citations = [
  { pmid = "26455884", doi = "10.1016/j.mayocp.2015.07.026", url = "https://pubmed.ncbi.nlm.nih.gov/26455884/", title = "Reference Standards for Cardiorespiratory Fitness Measured With Cardiopulmonary Exercise Testing: Data From the Fitness Registry and the Importance of Exercise National Database.", locator = "Table 3, Sex-Specific Percentiles, FRIEND men row 20–29" },
]
note = "Measured treadmill VO2max, 5th to 95th percentile (central 90% of the FRIEND distribution for this sex and age decade). Registry of tested adults, not a random population sample; values are mL/kg/min."

