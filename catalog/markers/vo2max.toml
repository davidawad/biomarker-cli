slug = "vo2max"
name = "VO2 Max"
category = "vitals"
unit = "mL/kg/min"
description = "Maximal oxygen uptake per kilogram of body weight, the standard measure of cardiorespiratory fitness. Higher values are associated with lower all-cause and cardiovascular mortality. Some cut-offs below are published in METs (1 MET = 3.5 mL/kg/min by convention)."
loinc = "94122-9"
aliases = ["vo2 max", "vo2-max"]
no_reference = "legacy catalog entry without a reference range; needs research"

