slug = "crp"
name = "C-Reactive Protein (standard assay)"
category = "inflammation"
unit = "mg/L"
loinc = "1988-5"
description = "Conventional (standard-sensitivity) C-reactive protein, an acute-phase protein made by the liver. Higher values indicate acute inflammation, most often from infection or tissue injury. Distinct from the high-sensitivity assay used for cardiovascular risk."
aliases = ["standard crp", "crp-standard"]

[[range]]
set = "clinical"
kind = "reference"
high = 5.0
population = "Women in sports (HemSter study); the 5.0 mg/L value is the proposed healthy-population cut-off cited by the authors, alongside their own calculated interval (<2.9 mg/L)"
evidence = "reference-interval-study"
citations = [
  { pmid = "33380889", doi = "10.11613/BM.2021.010702", url = "https://pubmed.ncbi.nlm.nih.gov/33380889/", title = "Women in sports: the applicability of common national reference intervals for inflammatory and coagulation biomarkers (HemSter Study).", locator = "Abstract, Results" },
]
note = "Conventional CRP upper reference limit of 5.0 mg/L (boundary < 5.0 mg/L) for a healthy population, as proposed in the source. The study's own calculated interval was lower (<2.9 mg/L) in a female sports cohort, so the value is not a sex-neutral or universal limit."

[[range]]
set = "pregnancy-crp-ri-2021"
kind = "reference"
high = 19
when = { pregnant = true }
population = "Healthy pregnant women (n=322) in a longitudinal study; pregnancy-specific upper reference limit, similar across trimesters"
evidence = "reference-interval-study"
citations = [
  { pmid = "33647266", doi = "10.1016/j.cca.2021.02.015", url = "https://pubmed.ncbi.nlm.nih.gov/33647266/", title = "Pregnancy-specific reference intervals for C-reactive protein improve diagnostic accuracy for infection: A longitudinal study.", locator = "Abstract, Results" },
]
note = "Pregnancy-specific upper reference limit for CRP of 19 mg/L (boundary above 19 mg/L). CRP rises in pregnancy and also increases with body mass index, so the general-population limits do not apply."

[[range]]
set = "ijid-bmc-2021-crp-viral-bacterial"
kind = "warn"
low = 10
when = { age = [5.0, 200] }
population = "Patients aged 5 years and over with non-malaria acute undifferentiated fever in tropical areas (individual patient data)"
evidence = "cohort"
citations = [
  { pmid = "33644814", doi = "10.1093/trstmh/traa186", url = "https://pubmed.ncbi.nlm.nih.gov/33644814/", title = "Value of C-reactive protein in differentiating viral from bacterial aetiologies in patients with non-malaria acute undifferentiated fever in tropical areas: a meta-analysis and individual patient data study.", locator = "Abstract, Results" },
]
note = "CRP below 10 mg/L favours a viral aetiology (52% sensitivity, 95% specificity for viral infection in this study). Boundary is strictly less than 10 mg/L. Not a stand-alone diagnosis. Source kind: decision. Source band <= 10; stored as the warn low bound 10."

[[range]]
set = "ijid-bmc-2021-crp-viral-bacterial"
kind = "warn"
high = 40
population = "Patients aged 5 years and over with non-malaria acute undifferentiated fever in tropical areas (individual patient data)"
evidence = "cohort"
citations = [
  { pmid = "33644814", doi = "10.1093/trstmh/traa186", url = "https://pubmed.ncbi.nlm.nih.gov/33644814/", title = "Value of C-reactive protein in differentiating viral from bacterial aetiologies in patients with non-malaria acute undifferentiated fever in tropical areas: a meta-analysis and individual patient data study.", locator = "Abstract, Results" },
]
note = "CRP above 40 mg/L favours a bacterial aetiology (74% sensitivity, 84% specificity for bacterial infection in this study). Boundary is strictly greater than 40 mg/L. Source kind: decision. Source band >= 40; stored as the warn high bound 40."

[[range]]
set = "pediatr-2026-crp-fever-without-source"
kind = "warn"
high = 20
population = "Children aged 36 months or younger with fever without source (systematic review and meta-analysis)"
evidence = "cohort"
citations = [
  { pmid = "41837198", doi = "10.3389/fped.2026.1697210", url = "https://pubmed.ncbi.nlm.nih.gov/41837198/", title = "Identifying the thresholds of C-reactive protein, procalcitonin, and interleukin-6 among children ≤36 months' old with fever without source at risk of serious bacterial infections: a systematic review and meta-analysis.", locator = "Abstract, Conclusion" },
]
note = "Best-performing CRP cut-off band for serious bacterial infection in this group (10 to 20 mg/L). The source reports the band as the optimum, not a single threshold. Source kind: decision. Source band 10-20; stored as the warn high bound 20."

[[range]]
set = "emej-2025-sepsis-crp"
kind = "warn"
high = 48
population = "Patients in diagnostic studies of sepsis (44 studies, 10 755 patients), Sepsis-2 and Sepsis-3 definitions (setting: suspected-sepsis)"
evidence = "cohort"
citations = [
  { pmid = "40214293", doi = "10.1097/MEJ.0000000000001235", url = "https://pubmed.ncbi.nlm.nih.gov/40214293/", title = "Diagnostic performances of procalcitonin and C-reactive protein for sepsis: a systematic review and meta-analysis.", locator = "Abstract, Results" },
]
note = "Optimal (sensitivity-weighted) CRP cut-off for sepsis, 48 mg/L with 72% sensitivity and 55% specificity. Pooled AUC for CRP was 0.67, so discrimination is limited; this is not a rule-in threshold on its own. Source kind: decision. Source band >= 48; stored as the warn high bound 48."
