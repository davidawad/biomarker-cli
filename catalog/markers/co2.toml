[[range]]
set = "alt-1"
kind = "reference"
low = 22
high = 30
population = "Healthy adults aged about 18-75 years (n = 182, both sexes), Pakistan; venous blood gas bicarbonate, 2.5-97.5 percentile (specimen: venous-blood-gas)"
evidence = "reference-interval-study"
citations = [
  { pmid = "39712818", doi = "10.7759/cureus.74223", title = "Reference Intervals for Venous Blood Gas in Healthy Adults: A One-Year Prospective Study", locator = "Table 2" },
]
note = "Venous blood gas bicarbonate, not serum total CO2 (a different specimen and method). Use for orientation only; no serum total CO2 reference interval from an open-access adult study was found in the sources checked. The source's 90 % confidence limits are 22-23 and 28-30 mmol/L. Single-population reference interval, kept out of the default clinical set because the marker has a general clinical reference range. Alternative to the default population-ri reference range for the same population."

[[range]]
set = "alt-1"
kind = "warn"
low = 22
when = { conditions = ["ckd"] }
population = "Adults with non-dialysis-dependent CKD (moderate and advanced; male cohort)"
evidence = "cohort"
citations = [
  { pmid = "19015169", doi = "10.1093/ndt/gfn633", title = "Association of serum bicarbonate levels with mortality in patients with non-dialysis-dependent CKD.", locator = "Results" },
  { pmid = "23348878", doi = "10.1093/ndt/gfs609", title = "Serum bicarbonate and mortality in adults in NHANES III.", locator = "Results" },
]
note = "Strictly below 22 mmol/L: highest mortality in this non-dialysis CKD cohort (multivariable HR 1.33 vs 22 or higher, per the source). Source band <= 22; stored as the warn low bound 22. Alternative to the default clinical warn range for the same population."

