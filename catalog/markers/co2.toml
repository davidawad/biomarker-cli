slug = "co2"
name = "Carbon Dioxide (Bicarbonate)"
category = "cmp"
unit = "mmol/L"
description = "Serum bicarbonate (total CO2) reflects the metabolic component of acid-base balance. In CKD, low bicarbonate is common and associated with worse outcomes, and KDIGO recommends considering treatment of acidosis when bicarbonate falls below 18 mmol/L."
loinc = "2028-9"
aliases = ["bicarbonate", "hco3", "carbon dioxide, total"]

[[range]]
set = "clinical"
kind = "reference"
low = 20.0
high = 29.0
legacy = true

[[range]]
set = "clinical"
kind = "warn"
low = 18
when = { conditions = ["ckd"] }
population = "Adults with chronic kidney disease"
evidence = "guideline"
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", locator = "Practice Point 3.10.1" },
]
note = "KDIGO 2024: in people with CKD, consider pharmacological treatment (with or without diet) to prevent acidosis when bicarbonate is below 18 mmol/L. Monitor so that bicarbonate does not exceed the upper limit of normal. Source band <= 18; stored as the warn low bound 18."

[[range]]
set = "population-ri"
kind = "reference"
low = 18
high = 37
population = "Healthy elderly adults (Asmara, Eritrea; CLSI C28-A3 reference interval study)"
evidence = "reference-interval-study"
citations = [
  { pmid = "29258577", doi = "10.1186/s13104-017-3087-6", title = "Biochemistry reference intervals for healthy elderly population in Asmara, Eritrea.", locator = "Table 1" },
]
note = "Reference interval for healthy elderly Eritrean adults (combined sexes, 2.5th-97.5th percentile). Broader than typical adult intervals; use with care. Single-population reference interval, kept out of the default clinical set because the marker has a general clinical reference range."

[[range]]
set = "population-ri"
kind = "reference"
low = 11.15
high = 22.51
when = { age = [0.0, 2.0] }
population = "Healthy Chinese children aged 28 days to under 2 years (Shenzhen, residual serum, CLSI EP28-A3c nonparametric method)"
evidence = "reference-interval-study"
citations = [
