slug = "frax-10y"
name = "FRAX 10-Year Fracture Risk"
category = "bone"
unit = "%"
description = "FRAX 10-year probability of major osteoporotic fracture (MOF: clinical spine, hip, forearm or humerus), computed from clinical risk factors with or without femoral neck BMD. Used to choose between lifestyle advice, BMD testing and drug treatment. Shard encodes the MOF probability only; the hip-fracture probability has separate thresholds that the single-slug schema cannot distinguish."

[[range]]
set = "clinical"
kind = "reference"
low = 3.4
high = 8.8
when = { age = [50.0, 55.0] }
population = "Men and women aged 50-54 years assessed with UK FRAX (NOGG thresholds)"
evidence = "guideline"
citations = [
  { pmid = "40921943", doi = "10.1007/s11657-025-01588-3", title = "The 2024 UK clinical guideline for the prevention and treatment of osteoporosis.", locator = "Table 4" },
]
note = "Intermediate risk between lower (LAT) and upper (UAT) assessment thresholds: BMD indicated. Two-sided band stored as a reference range in its own set because it has no clinical reference range to orient it as a warn or critical cut point."

