kind = "reference"
low = 0.62
high = 1.64
population = "Adults (women and men) from 21 Spanish clinical laboratories, measured as complement C3c with Tina-Quant reagents on RD/Hitachi analysers"
evidence = "reference-interval-study"
citations = [
  { pmid = "17378738", doi = "10.1515/CCLM.2007.069", url = "https://pubmed.ncbi.nlm.nih.gov/17378738/", title = "Multicentre physiological reference intervals for serum concentrations of immunoglobulins A, G and M, complement C3c and C4 measured with Tina-Quant reagents systems.", locator = "Abstract, Results and conclusions" },
]
note = "Multicentre adult reference interval (sexes combined) for complement C3c, the assay measured by this method; C3c is used as the clinical C3 measure here. Assay-specific; check against the local assay's own interval."

[[range]]
