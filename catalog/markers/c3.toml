slug = "c3"
name = "Complement C3"
category = "immune"
unit = "g/L"
loinc = "4485-9"
description = "The central protein of the complement system, which helps clear pathogens and immune complexes. Low levels suggest complement consumption, as seen in active lupus and some other immune conditions."
aliases = ["complement component 3"]

[[range]]
set = "clinical"
kind = "reference"
low = 0.656
high = 1.52
when = { sex = "male", age = [20.0, 70.0] }
population = "Healthy Chinese Han males aged 20-69 years from a community survey (n=1,234)"
evidence = "reference-interval-study"
citations = [
  { pmid = "24839820", doi = "10.7754/clin.lab.2013.130514", url = "https://pubmed.ncbi.nlm.nih.gov/24839820/", title = "Determination of reference intervals for serum complement C3 and C4 levels in Chinese Han ethnic males.", locator = "Abstract, Methods" },
  { pmid = "24839820", doi = "10.7754/clin.lab.2013.130514", url = "https://pubmed.ncbi.nlm.nih.gov/24839820/", title = "Determination of reference intervals for serum complement C3 and C4 levels in Chinese Han ethnic males.", locator = "Abstract, Results" },
]
note = "Central 95% interval (mean plus or minus 2 SD, parametric), immunoturbidimetry. Males only; the authors also report BMI-specific intervals, as C3 rises with BMI. Not a lupus classification threshold."

[[range]]
