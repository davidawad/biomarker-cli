kind = "reference"
low = 0.63
high = 1.92
when = { age = [18.0, 51.0] }
population = "Apparently healthy adult blood donors aged 18-60 years in Zimbabwe (n=95, 50 males and 45 females)"
evidence = "reference-interval-study"
citations = [
  { pmid = "14562600", url = "https://pubmed.ncbi.nlm.nih.gov/14562600/", title = "Determination of normal ranges for serum C3 and C4 levels in an adult Zimbabwean population.", locator = "Abstract, Results" },
]
note = "Local adult C3 interval for ages 18-50 (63-192 mg/dL), not partitioned by sex. Small single-country sample; the study reports age-related lowering of C3 at 51-60 years (separate range). Converted from the source's mg/dL (63-192) to g/L using factor 0.01."

