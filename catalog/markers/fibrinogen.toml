population = "adults with major bleeding and trauma-induced coagulopathy (European trauma guideline, 4th edition)"
evidence = "guideline"
citations = [
  { pmid = "27072503", doi = "10.1186/s13054-016-1265-x", title = "The European guideline on management of major bleeding and coagulopathy following trauma: fourth edition.", locator = "Recommendation 28" },
]
note = "Replacement threshold band: Recommendation 28 (Grade 1C) advises fibrinogen concentrate or cryoprecipitate when significant bleeding is accompanied by viscoelastic signs of functional fibrinogen deficit or fibrinogen below 1.5-2.0 g/L. Guideline gives a band, not a single cut-off."

