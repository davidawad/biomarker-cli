slug = "ana-screen"
name = "Antinuclear Antibody (ANA) Screen"
category = "autoimmune"
unit = "titer"
loinc = "8061-4"
description = "Screen for antinuclear antibodies by indirect immunofluorescence on HEp-2 cells (or an immunoassay), reported as positive or negative and, when positive, as a serum titer (dilution). Tracked as an autoimmune screening test; a positive result is non-specific and must be interpreted with clinical findings. Expected result: negative. Low-titer positives occur in a minority of healthy people."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

