evidence = "cohort"
citations = [
  { pmid = "9324014", title = "Range of antinuclear antibodies in \"healthy\" individuals.", locator = "Abstract (Results and Conclusion)" },
]
note = "Titer at or above which the multi-laboratory study proposed a high-specificity positive cut-off to confirm disease (excludes about 95% of healthy individuals). Not a guideline cut-off. Source kind: diagnostic. Source band >= 160; stored as the warn high bound 160."
