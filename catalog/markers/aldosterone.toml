slug = "aldosterone"
name = "Aldosterone"
category = "adrenal"
unit = "ng/dL"
description = "Mineralocorticoid produced by the adrenal zona glomerulosa; regulates sodium and potassium balance. Interpreted together with renin (aldosterone-to-renin ratio) to screen for primary aldosteronism, and by its suppression response to confirmatory tests."

