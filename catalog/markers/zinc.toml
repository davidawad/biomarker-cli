high = 125
when = { sex = "male", fasting = true, age = [18.0, 66.0] }
population = "Apparently healthy men aged 18-65 y from a rural community in Bangladesh, overnight fasting samples (n=154 adults, both sexes)"
evidence = "reference-interval-study"
citations = [
  { pmid = "32549879", title = "Reference Value for Serum Zinc Level of Adult Population in Bangladesh.", locator = "Abstract, Results" },
]
note = "2.5th-97.5th percentiles, GF-AAS, IFCC recommendations. Sex-specific values reported in the same abstract."

