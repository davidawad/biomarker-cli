slug = "dunedinpace"
name = "DunedinPACE (Pace of Aging)"
category = "aging"
unit = "years/year"
description = "DNA methylation estimate of the pace of biological ageing, expressed as biological years gained per chronological year. A value of 1.0 means ageing at the average rate of one biological year per calendar year; higher values indicate faster ageing and higher morbidity and mortality risk."
aliases = ["pace of aging", "dunedinpace dnam"]

