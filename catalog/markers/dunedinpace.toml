note = "Observed range of Pace of Aging in the Dunedin cohort, from slowest (0.40) to fastest (2.44) study member. The reported population mean is 1.0 biological year per chronological year with SD 0.29, but a range built from mean and SD is not quoted here. Not a clinical reference interval."
