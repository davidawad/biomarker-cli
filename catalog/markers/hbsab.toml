note = "Anti-HBs at or above 10 mIU/mL is the protective (immune) level after a complete vaccine series (>=10 is immune). Below 10 mIU/mL the person should be revaccinated and retested. Source kind: decision. Source band >= 10; stored as the warn high bound 10."
