slug = "ctx"
name = "C-Terminal Telopeptide (β-CrossLaps, serum CTX)"
category = "bone"
unit = "ng/mL"
description = "Serum fragment of type I collagen released during bone resorption (beta-CrossLaps, CTX-I). A bone resorption marker used to assess fracture risk and response to antiresorptive treatment. Sample handling matters: measure in the morning after an overnight fast."

