slug = "acth"
name = "Adrenocorticotropic Hormone"
category = "pituitary"
unit = "pg/mL"
description = "Pituitary hormone that stimulates cortisol production by the adrenal cortex. Measured in the morning (plasma, cold-collected) to help separate primary from secondary or tertiary adrenal insufficiency and ACTH-dependent from ACTH-independent Cushing's syndrome."

[[range]]
set = "clinical"
kind = "reference"
low = 8.0
high = 93.0
when = { age = [20.0, 69.0] }
population = "50 healthy subjects from the general population aged 20-69 years, equally distributed by sex and age (specimen: plasma)"
evidence = "reference-interval-study"
citations = [
  { pmid = "16397312", url = "https://pubmed.ncbi.nlm.nih.gov/16397312/", title = "Establishment of reference values for endocrine tests. Part IV: Adrenal insufficiency.", locator = "Abstract, Results" },
]
note = "09:00 plasma ACTH reference interval (mean +/- 2 SD after log transformation). ng/L is numerically equal to pg/mL. 2005 study, older assay; use the local lab range where available. Converted from the source's ng/L (8-93) to pg/mL using factor 1. Applies only to: time_of_day=morning."

[[range]]
set = "cushing-acth-review-2023"
kind = "warn"
low = 10
when = { conditions = ["cushing-syndrome"] }
population = "Patients with suspected hypercortisolism (Cushing syndrome), as restated in a laboratory-medicine review"
evidence = "consensus"
citations = [
  { pmid = "37189516", doi = "10.3390/diagnostics13081415", url = "https://pubmed.ncbi.nlm.nih.gov/37189516/", title = "Pitfalls in the Diagnosis and Management of Hypercortisolism (Cushing Syndrome) in Humans; A Review of the Laboratory Medicine Perspective.", locator = "Full text (Cushing diagnosis section)" },
]
note = "ACTH below about 10 pg/mL suggests an adrenal (ACTH-independent) cortisol source once exogenous glucocorticoids are excluded. The source notes that the level varies between assays. Restates a review's threshold; not verified against the primary guideline. Source kind: diagnostic. Source band <= 10; stored as the warn low bound 10."

[[range]]
set = "alt-1"
kind = "warn"
high = 20
when = { conditions = ["cushing-syndrome"] }
population = "Patients with suspected hypercortisolism (Cushing syndrome), as restated in a laboratory-medicine review"
evidence = "consensus"
citations = [
  { pmid = "37189516", doi = "10.3390/diagnostics13081415", url = "https://pubmed.ncbi.nlm.nih.gov/37189516/", title = "Pitfalls in the Diagnosis and Management of Hypercortisolism (Cushing Syndrome) in Humans; A Review of the Laboratory Medicine Perspective.", locator = "Full text (Cushing diagnosis section)" },
]
note = "ACTH above about 20 pg/mL (or an intermediate value) indicates an ACTH-dependent cause of hypercortisolism. Restates a review's threshold; not verified against the primary guideline. Source kind: diagnostic. Source band >= 20; stored as the warn high bound 20. Alternative to the default cushing-acth-review-2023 warn range for the same population."
