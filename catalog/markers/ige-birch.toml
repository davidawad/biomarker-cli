slug = "ige-birch"
name = "Specific IgE, Birch (White Birch)"
category = "allergy"
unit = "kU/L"
loinc = "41874-9"
description = "Serum IgE specific to birch pollen allergen, used to support the diagnosis of IgE-mediated birch pollen allergy. Interpret with symptoms and skin testing; a positive level does not by itself prove clinical allergy."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "clinical"
kind = "warn"
high = 1.0
population = "Schoolchildren (Norway) with allergic rhinoconjunctivitis, serum sIgE on the Siemens IMMULITE 2000"
evidence = "cohort"
citations = [
  { pmid = "24628428", doi = "10.1111/apa.12631", url = "https://pubmed.ncbi.nlm.nih.gov/24628428/", title = "Establishing IMMULITE® 2000 cut-off values for serum allergen-specific immunoglobulin and exploring their relationship to exhaled nitric oxide.", locator = "Table 3" },
]
note = "Screening cut-off giving 90% sensitivity for allergic rhinoconjunctivitis to birch pollen (sensitivity 90.4%, specificity 85.1%). Values below this argue against the diagnosis; values at or above it warrant further testing. Single observational study. Source band >= 1.0; stored as the warn high bound 1.0."

[[range]]
set = "alt-1"
kind = "warn"
high = 6.77
population = "Children aged 2-18 years with atopic dermatitis and birch sensitization (Korea), ImmunoCAP"
evidence = "cohort"
citations = [
  { pmid = "30636944", doi = "10.3346/jkms.2019.34.e11", url = "https://pubmed.ncbi.nlm.nih.gov/30636944/", title = "Clinical Characteristics of Oral Allergy Syndrome in Children with Atopic Dermatitis and Birch Sensitization: a Single Center Study.", locator = "Abstract, Results" },
]
note = "Cut-off associated with oral allergy syndrome (OAS) in birch-sensitized children with atopic dermatitis (sensitivity 55.6%, specificity 79.0%, AUC 0.653). Weak discrimination; this is an OAS association, not a birch allergy diagnostic threshold. Unit as stated by the source (kUA/L). Source band >= 6.77; stored as the warn high bound 6.77. Alternative to the default clinical warn range for the same population."

