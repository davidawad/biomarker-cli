high = 13.0
when = { sex = "male", age = [15.0, 200] }
population = "males over 15 years of age (WHO anaemia definition, as quoted by BSG 2021)"
evidence = "guideline"
citations = [
  { pmid = "34497146", doi = "10.1136/gutjnl-2021-325210", title = "British Society of Gastroenterology guidelines for the management of iron deficiency anaemia in adults.", locator = "Anaemia section" },
