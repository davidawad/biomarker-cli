slug = "hemoglobin"
name = "Hemoglobin"
category = "cbc"
unit = "g/dL"
description = "Concentration of the oxygen-carrying protein hemoglobin in whole blood. Low values define anemia; high values suggest polycythemia, dehydration, smoking or altitude."
loinc = "718-7"
aliases = ["hgb", "hb", "haemoglobin"]

[[conversion]]
from = "mmol/L"
factor = 1.611

