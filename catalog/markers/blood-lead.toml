slug = "blood-lead"
name = "Lead, Blood"
category = "pediatric"
unit = "µg/dL"
description = "Concentration of lead in whole blood, the main biomarker of childhood lead exposure. Results are compared with the CDC blood lead reference value to decide when to act on an elevated level."

[[range]]
set = "clinical"
kind = "reference"
high = 3.5
when = { age = [1.0, 5.0] }
population = "US children aged 1-5 years; CDC blood lead reference value based on the 97.5th percentile of NHANES children's blood lead levels (specimen: blood)"
evidence = "consensus"
citations = [
  { pmid = "40434772", doi = "10.1001/jamanetworkopen.2025.12796", url = "https://pubmed.ncbi.nlm.nih.gov/40434772/", title = "Early-Life Low Lead Levels and Academic Achievement in Childhood and Adolescence.", locator = "Introduction" },
  { pmid = "40434772", doi = "10.1001/jamanetworkopen.2025.12796", url = "https://pubmed.ncbi.nlm.nih.gov/40434772/", title = "Early-Life Low Lead Levels and Academic Achievement in Childhood and Adolescence.", locator = "Introduction" },
]
note = "CDC blood lead reference value (BLRV), lowered from 5 µg/dL in 2021. Values at or above 3.5 µg/dL flag a child for follow-up. The cited sentence does not state unambiguously which NHANES survey period matches which threshold. The BLRV is a population-based reference value, not a toxicity limit."
