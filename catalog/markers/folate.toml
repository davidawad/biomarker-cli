set = "clinical"
kind = "reference"
low = 3.0
legacy = true

[[range]]
set = "nutrients-2017-review"
kind = "warn"
low = 5.9
population = "Women of reproductive age and pregnant women in Ethiopia, Kenya, Nigeria and South Africa (systematic review; cut-offs quoted from a reference cited in the review)"
evidence = "consensus"
citations = [
  { pmid = "28981457", doi = "10.3390/nu9101096", title = "Micronutrient Status and Dietary Intake of Iron, Vitamin A, Iodine, Folate and Zinc in Women of Reproductive Age and Pregnant Women in Ethiopia, Kenya, Nigeria and South Africa: A Systematic Review of Data from 2005 to 2015.", locator = "Methods, cut-off definitions (full text)" },
]
note = "Quoted as possible deficiency (6.8-13.4 nmol/L). The same review gives severe deficiency as below 3 ng/mL (6.8 nmol/L). These bands overlap the WHO deficient band (<4.4 ng/mL) above, so pick one set for a given lab. Source kind: insufficient. Source band 3-5.9; stored as the warn low bound 5.9."

