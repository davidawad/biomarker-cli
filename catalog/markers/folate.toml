slug = "folate"
name = "Folate"
category = "vitamin"
unit = "ng/mL"
description = "Serum folate reflects recent dietary folate intake and is the first-line test for folate status. Low values indicate folate deficiency or insufficiency; the metabolic consequence of low folate is raised homocysteine."
loinc = "2284-8"
aliases = ["folic acid"]

[[conversion]]
from = "nmol/L"
factor = 0.4413

[[range]]
set = "clinical"
kind = "reference"
low = 3.0
legacy = true

[[range]]
set = "who-2018-review"
kind = "warn"
low = 4.4
population = "Serum folate cut-offs derived from NHANES III folate data (Bio-Rad radioassay) and used in WHO folate-status assessment"
evidence = "consensus"
citations = [
  { pmid = "30239016", doi = "10.1111/nyas.13963", title = "Global folate status in women of reproductive age: a systematic review with emphasis on methodological issues.", locator = "Table 1 footnote (full text)" },
]
note = "10 nmol/L is about 4.4 ng/mL. The WHO-authored review says rising homocysteine appears at higher serum folate levels (10 or 14 nmol/L). Cut-offs depend strongly on the assay: microbiological assays with 5-methyl-THF calibration give lower values than folic acid calibration. Source kind: deficient. Source band <= 4.4; stored as the warn low bound 4.4."

[[range]]
set = "nutrients-2017-review"
kind = "warn"
low = 5.9
population = "Women of reproductive age and pregnant women in Ethiopia, Kenya, Nigeria and South Africa (systematic review; cut-offs quoted from a reference cited in the review)"
evidence = "consensus"
citations = [
  { pmid = "28981457", doi = "10.3390/nu9101096", title = "Micronutrient Status and Dietary Intake of Iron, Vitamin A, Iodine, Folate and Zinc in Women of Reproductive Age and Pregnant Women in Ethiopia, Kenya, Nigeria and South Africa: A Systematic Review of Data from 2005 to 2015.", locator = "Methods, cut-off definitions (full text)" },
]
note = "Quoted as possible deficiency (6.8-13.4 nmol/L). The same review gives severe deficiency as below 3 ng/mL (6.8 nmol/L). These bands overlap the WHO deficient band (<4.4 ng/mL) above, so pick one set for a given lab. Source kind: insufficient. Source band 3-5.9; stored as the warn low bound 5.9."

[[range]]
set = "who-1972-historic"
kind = "reference"
low = 6
high = 20
population = "Historical normal range from early folate studies, which formed the basis for WHO serum folate guidance in 1972 (Lactobacillus microbiological assay era)"
evidence = "consensus"
citations = [
  { pmid = "21593497", doi = "10.3945/ajcn.111.013367", title = "Folate status assessment history: implications for measurement of biomarkers in NHANES.", locator = "Results or history section (full text)" },
]
note = "Historical reference only. Current assays and calibrators give different values, so this band should not be used for modern assays without local validation."

[[range]]
set = "clarke-2003"
kind = "warn"
low = 2.2
when = { markers = [{ marker = "homocysteine", op = ">=", value = 15 }], age = [65.0, 200] }
population = "Older persons aged 65 and over in Oxford (population study, n=1562); borderline folate with raised homocysteine"
evidence = "cohort"
citations = [
  { pmid = "12716678", doi = "10.1093/ajcn/77.5.1241", title = "Screening for vitamin B-12 and folate deficiency in older persons.", locator = "Design, para 1 (Abstract)" },
]
note = "Borderline band (5-7 nmol/L) counts as high risk of folate deficiency only with homocysteine above 15 micromol/L. In the same study, folate below 5 nmol/L (about 2.2 ng/mL) put people in the high-risk group without a homocysteine condition. Source band 2.2-3.1; stored as the warn low bound 2.2."
