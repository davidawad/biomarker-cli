population = "Adults with histology-graded steatosis (individual patient data meta-analysis of FibroScan M-probe studies; mainly hepatitis B, hepatitis C and NAFLD/NASH)"
evidence = "cohort"
citations = [
  { pmid = "28039099", doi = "10.1016/j.jhep.2016.12.022", title = "Individual patient data meta-analysis of controlled attenuation parameter (CAP) technology for assessing steatosis.", locator = "Abstract (Results)" },
]
note = "Below 248 dB/m: S0 (no steatosis). Cut-off 95% CI 237-261. Source reports NAFLD/NASH and diabetes shift CAP upward by about 10 dB/m, and BMI by 4.4 dB/m per unit."
