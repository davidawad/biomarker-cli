slug = "plr"
name = "Platelet-to-Lymphocyte Ratio"
category = "hematology"
unit = "ratio"
description = "Platelet-to-lymphocyte ratio (PLR) is the platelet count divided by the lymphocyte count from a complete blood count, a computed inflammation index. It is tracked as a low-cost systemic inflammation marker and is studied as a prognostic index in cancer and cardiovascular disease. No single clinical cut-off is established. Expected result in healthy people: within the sex- and age-specific reference interval, which varies by study and analyser."

[[range]]
set = "clinical"
kind = "reference"
low = 63.15
high = 191.34
when = { sex = "male" }
population = "Healthy adults, Jiangsu region, Eastern China (males, all ages), Sysmex platform"
evidence = "reference-interval-study"
citations = [
  { pmid = "37145057", doi = "10.7754/Clin.Lab.2022.220837", title = "Establishment of Reference Intervals for SII, NLR, PLR, and LMR in Healthy Adults in Jiangsu Region in Eastern China.", locator = "Results" },
]
note = "Non-parametric 2.5th-97.5th percentile interval, males; the study reports no significant age differences. Analyser-specific."

