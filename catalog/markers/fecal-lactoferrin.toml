slug = "fecal-lactoferrin"
name = "Fecal Lactoferrin"
category = "stool"
unit = "µg/g"
loinc = "42924-1"
description = "Lactoferrin measured in stool by immunoassay as a marker of intestinal inflammation, used to help distinguish inflammatory bowel disease from irritable bowel syndrome. Expected result: below the cut-off used in the cited study, i.e. not indicative of intestinal inflammation. The ranges below are single-study cut-offs, not reference intervals."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "diagnostic"
kind = "warn"
high = 13
population = "Children with inflammatory bowel disease (Crohn disease, ulcerative colitis), aged 0.92 to 18 years, and IBD-free controls"
evidence = "cohort"
citations = [
  { pmid = "26339799", doi = "10.18388/abp.2015_982", url = "https://pubmed.ncbi.nlm.nih.gov/26339799/", title = "Fecal lactoferrin, a marker of intestinal inflammation in children with inflammatory bowel disease.", locator = "Abstract" },
]
note = "Cut-off that optimally distinguished children with IBD from controls in this single study (sensitivity 80.7%, specificity 92.7%). Single-study cut-off, not a reference interval. Direction (at or above) is implied by the cut-off use, not stated verbatim. Source kind: diagnostic. Source band >= 13; stored as the warn high bound 13."

[[range]]
set = "alt-1"
kind = "warn"
high = 7.75
population = "Patients with IBD, patients with IBS (Rome III), and healthy controls, Dhaka, Bangladesh, 2016 to 2017 (cross-sectional)"
evidence = "cohort"
citations = [
  { pmid = "40370884", doi = "10.7759/cureus.82187", url = "https://pubmed.ncbi.nlm.nih.gov/40370884/", title = "Diagnostic Value of Fecal Lactoferrin in Differentiating Inflammatory Bowel Disease From Irritable Bowel Syndrome: A Comparative Study in a Bangladeshi Cohort.", locator = "Methods" },
]
note = "Cut-off that separated IBD from IBS in this single cross-sectional study (sensitivity 88%, specificity 84%). Single-study cut-off, not a reference interval. Direction (at or above) is implied by the cut-off use, not stated verbatim. Source kind: diagnostic. Source band >= 7.75; stored as the warn high bound 7.75. Alternative to the default diagnostic warn range for the same population."
