slug = "tetanus-antitoxin"
name = "Tetanus Antitoxin IgG"
category = "infectious"
unit = "IU/mL"
description = "Serum IgG antibody to tetanus toxin (tetanus antitoxin), measured against WHO international standards. It indicates protection against tetanus; levels fall with time after vaccination, so adults often have low or undetectable titres."
aliases = ["tetanus igg", "anti-tetanus toxoid igg", "tetanus toxin antibody", "tetanus antibody"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "zhejiang-2026-tetanus-waning"
kind = "warn"
high = 0.01
population = "Healthy individuals in Zhejiang, China (cross-sectional study of 3,659 people in 2024) (method: elisa)"
evidence = "cohort"
citations = [
  { pmid = "42266706", doi = "10.3389/fimmu.2026.1824381", url = "https://pubmed.ncbi.nlm.nih.gov/42266706/", title = "Population waning trajectories of vaccine-induced tetanus immunity in Zhejiang, China.", locator = "Abstract, Methods" },
]
note = "Seropositivity: IgG at or above 0.01 IU/mL by ELISA (boundary >= 0.01). Indicates detectable antibody only; the WHO position paper threshold could not be retrieved as text, so this is taken from the population study that adopted it. Source kind: decision. Source band >= 0.01; stored as the warn high bound 0.01."

