slug = "immature-reticulocyte-fraction"
name = "Immature reticulocyte fraction (IRF)"
category = "cbc"
unit = "%"
description = "Percentage of reticulocytes that are the most recently released, RNA-rich (immature) forms, measured on automated analysers. Higher values indicate faster marrow recovery or increased erythropoietic demand; low values suggest reduced marrow output."

[[range]]
set = "clinical"
kind = "reference"
low = 1.6
high = 12.1
population = "132 haematologically normal outpatients aged 13-80 (54.5% women), university hospital, Sysmex XE-5000; IFCC reference-interval method"
evidence = "reference-interval-study"
citations = [
  { pmid = "27863758", doi = "10.1016/j.bjhh.2016.07.001", title = "Determination of reference ranges for immature platelet and reticulocyte fractions and reticulocyte hemoglobin equivalent.", locator = "Abstract, Results" },
]
note = "Single-centre, all ages and both sexes pooled; reference interval determined per IFCC recommendations."

