slug = "vitamin-k1"
name = "Phylloquinone (vitamin K1)"
category = "vitamin"
unit = "ng/mL"
description = "Plasma phylloquinone (vitamin K1), the dietary form of vitamin K used for clotting and bone/vascular carboxylation. Low values reflect low intake or fat malabsorption and are used to assess vitamin K status, mainly in lipid malabsorption; values are very low and assay-dependent."

