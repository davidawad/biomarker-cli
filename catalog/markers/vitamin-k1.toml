note = "Original HPLC method from 1989; limits given by the authors as a normal range derived from the lognormal distribution (0.29-2.64 nmol/L, converted with factor 0.4505). Plasma phylloquinone correlated with triglycerides and alpha-tocopherol. Modern LC-MS/MS methods differ and this range is not method-validated for them. Deficiency thresholds were not found in the retrieved sources."
