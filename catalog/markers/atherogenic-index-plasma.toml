slug = "atherogenic-index-plasma"
name = "Atherogenic Index of Plasma"
category = "derived"
unit = "index"
description = "Atherogenic Index of Plasma (AIP) is the base-10 logarithm of the triglyceride to HDL cholesterol ratio, with both lipids in mmol/L. It is used as a marker of atherogenic dyslipidaemia and cardiovascular risk."
aliases = ["aip", "log(tg/hdl-c)", "log tg/hdl ratio", "atherogenic-index-of-plasma"]

[[range]]
set = "dobiasova-frohlich-aip-bands"
kind = "warn"
low = 0.11
population = "Adults in cardiovascular and metabolic risk studies; zones attributed to Dobiasova and Frohlich"
evidence = "consensus"
citations = [
  { pmid = "42187998", doi = "10.3390/metabo16050289", url = "https://pubmed.ncbi.nlm.nih.gov/42187998/", title = "Atherogenic Index of Plasma Relationship with Cardiovascular Risk Factors and Frailty and Value as Determinant of Mortality in Elderly Patients with Severe Aortic Stenosis.", locator = "Full text, Results (AIP categories)" },
]
note = "Low atherogenic risk: AIP below 0.11 (boundary < 0.11). Band is reported as a risk zone, not a diagnostic cut-off. Original Dobiasova and Frohlich paper not retrievable; band taken from a 2026 Metabolites paper. Source kind: decision. Source band <= 0.11; stored as the warn low bound 0.11."

[[range]]
set = "clinical"
kind = "reference"
low = 0.11
high = 0.21
population = "Adults in cardiovascular and metabolic risk studies; zones attributed to Dobiasova and Frohlich"
evidence = "consensus"
citations = [
  { pmid = "42187998", doi = "10.3390/metabo16050289", url = "https://pubmed.ncbi.nlm.nih.gov/42187998/", title = "Atherogenic Index of Plasma Relationship with Cardiovascular Risk Factors and Frailty and Value as Determinant of Mortality in Elderly Patients with Severe Aortic Stenosis.", locator = "Full text, Results (AIP categories)" },
]
note = "Intermediate atherogenic risk: AIP 0.11 to 0.21 inclusive of the lower boundary (described as moderate risk in the source). Risk zone, not a diagnostic cut-off. Source kind: decision. Two-sided band stored as a reference range in its own set because it has no clinical reference range to orient it as a warn or critical cut point."

