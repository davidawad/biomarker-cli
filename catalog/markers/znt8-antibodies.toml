description = "IgG autoantibodies against zinc transporter 8 (ZnT8), a beta-cell antigen, measured by immunoassay (ELISA or radiobinding). Tracked as one of the islet autoantibodies (with GADA, IA-2A, IAA) to screen for and classify type 1 diabetes, and to tell autoimmune diabetes from type 2 diabetes in young people. Expected result: negative (below the age-specific cut-off)."

