]
note = "NICE NG203 recommendation 1.1.13: a confirmed ACR of 3 mg/mmol or more is clinically important proteinuria (boundary >=3). Replaces the earlier ERBP commentary citation, which restated the same threshold secondhand. Converted from the source's mg/mmol (3) to mg/g using factor 8.84. Source kind: decision. Source band >= 26.52; stored as the warn high bound 26.52. Alternative to the default nice-ng203 warn range for the same population."

