slug = "urine-acr"
name = "Urine Albumin-to-Creatinine Ratio"
category = "urinalysis"
unit = "mg/g"
loinc = "9318-7"
description = "Albumin excreted in urine relative to creatinine, measured on a spot sample. It is the standard screen for albuminuria, the earliest marker of kidney damage in diabetes and hypertension, and an independent cardiovascular risk marker."
aliases = ["urine acr", "microalbumin-to-creatinine ratio", "urine albumin/creatinine ratio"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "kdigo-2024"
kind = "warn"
low = 30
population = "People with chronic kidney disease, albuminuria category A1 (normal to mildly increased)"
evidence = "guideline"
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", locator = "Table 3 | Albuminuria categories in chronic kidney disease" },
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", locator = "Figure caption defining albuminuria categories A1-A3" },
]
note = "KDIGO 2024 A1 band: ACR below 30 mg/g (boundary <30, so 30 itself is not in A1). The mg/mmol equivalent is <3. Source kind: decision. Source band <= 30; stored as the warn low bound 30."

[[range]]
set = "alt-1"
kind = "warn"
high = 300
population = "People with chronic kidney disease, albuminuria category A3 (severely increased)"
evidence = "guideline"
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", locator = "Table 3 | Albuminuria categories in chronic kidney disease" },
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", locator = "Figure caption defining albuminuria categories A1-A3" },
]
note = "KDIGO 2024 A3 band: ACR above 300 mg/g (boundary >300, mg/mmol equivalent >30). Source kind: decision. Source band >= 300; stored as the warn high bound 300. Alternative to the default kdigo-2024 warn range for the same population."

[[range]]
set = "nice-ng203"
kind = "warn"
low = 26.52
population = "Adults with chronic kidney disease, ACR category A1"
evidence = "guideline"
citations = [
  { url = "https://www.nice.org.uk/guidance/ng203/chapter/Recommendations", locator = "Table 1 (ACR categories)" },
]
note = "NICE NG203 ACR category A1 (normal to mildly increased), boundary less than 3 mg/mmol. Converted from the source's mg/mmol (3) to mg/g using factor 8.84. Source kind: decision. Source band <= 26.52; stored as the warn low bound 26.52."

[[range]]
set = "alt-2"
kind = "warn"
high = 265.2
population = "Adults with chronic kidney disease, ACR category A3"
evidence = "guideline"
citations = [
