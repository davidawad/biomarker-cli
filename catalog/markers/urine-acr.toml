]
note = "NICE NG203 ACR category A3 (severely increased), above 30 mg/mmol (boundary >30). Converted from the source's mg/mmol (30) to mg/g using factor 8.84. Source kind: decision. Source band >= 265.2; stored as the warn high bound 265.2. Alternative to the default nice-ng203 warn range for the same population."

[[range]]
set = "alt-3"
kind = "warn"
high = 26.52
population = "Adults and children with a confirmed raised urine ACR"
evidence = "guideline"
citations = [
