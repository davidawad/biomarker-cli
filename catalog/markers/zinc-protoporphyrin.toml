slug = "zinc-protoporphyrin"
name = "Zinc Protoporphyrin"
category = "iron"
unit = "umol/mol heme"
loinc = "33007-6"
description = "Erythrocyte porphyrin that rises when iron is short for heme synthesis; measured (ZPP/heme) with a portable haematofluorometer to screen for iron deficiency. Expected result for a healthy child: within the age- and sex-specific 2.5th to 97.5th percentile limits in the cited pediatric study; values above the iron-deficiency cut-offs suggest iron deficiency."

[[range]]
set = "clinical"
kind = "reference"
low = 16.6
high = 73.6
when = { sex = "female", age = [0.0, 1.0] }
population = "Children aged 0 to 12 months, female (pediatric hospital patients, n = 6478 specimens, 0-17 years)"
evidence = "reference-interval-study"
citations = [
  { pmid = "12554055", doi = "10.1016/s0009-9120(02)00405-8", title = "Pediatric reference ranges for zinc protoporphyrin.", locator = "Abstract (Results and Conclusions)" },
]
note = "2.5th to 97.5th percentile (Hoffman approach); reported as 9 to 40 microg/dL in the source."

