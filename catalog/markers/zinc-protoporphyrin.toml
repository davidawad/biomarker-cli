note = "Conventional whole-blood ZPP cut-off, strictly above 70 umol/mol heme, cited as giving gross overestimates of iron deficiency prevalence in this population; not validated here. Source kind: diagnostic. Source band >= 70; stored as the warn high bound 70. Alternative to the default diagnostic warn range for the same population."
