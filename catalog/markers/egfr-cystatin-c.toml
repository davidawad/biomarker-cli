slug = "egfr-cystatin-c"
name = "eGFR (Cystatin C)"
category = "kidney"
unit = "mL/min/1.73m2"
loinc = "50210-4"
description = "Estimated glomerular filtration rate calculated from serum cystatin C alone, reported in mL/min/1.73 m2 and classed into GFR categories G1-G5 (KDIGO 2024). Used with albuminuria to stage chronic kidney disease. Expected result for a healthy adult: 90 or higher (G1). A GFR category alone does not define CKD; CKD also requires markers of kidney damage or GFR below 60 for more than 3 months."

