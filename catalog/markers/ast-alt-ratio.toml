slug = "ast-alt-ratio"
name = "AST/ALT Ratio (De Ritis)"
category = "liver"
unit = "ratio"
loinc = "1916-6"
description = "Ratio of aspartate aminotransferase to alanine aminotransferase (AST/ALT), the De Ritis ratio. Used to help separate alcohol-related liver injury from nonalcoholic steatohepatitis and to flag possible cirrhosis. Expected result in a healthy adult is about 0.7 to 2.1; values below 1 suggest NASH and values of 2 or above suggest alcoholic liver disease."

[[range]]
set = "clinical"
kind = "reference"
low = 0.7
high = 2.1
population = "Healthy adults, Gandaki Province, Nepal (combined sexes)"
evidence = "reference-interval-study"
citations = [
  { pmid = "38722987", doi = "10.1371/journal.pgph.0001865", title = "Establishment of dry-chemistry-based reference intervals of routine liver function tests for the adult population of Gandaki Province, Nepal.", locator = "Abstract" },
]
note = "Combined 95% reference interval for AST/ALT ratio in healthy adults."

