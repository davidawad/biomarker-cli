slug = "wbc"
name = "White Blood Cells"
category = "cbc"
unit = "10^3/µL"
description = "Total leukocyte count in blood, the sum of neutrophils, lymphocytes, monocytes, eosinophils and basophils. Low values (leukopenia) occur with marrow failure, drugs, infection, or benign ethnic / Duffy-null neutropenia; high values (leukocytosis) occur with infection, inflammation, stress, steroids or leukaemia."
loinc = "6690-2"
aliases = ["white blood cell count", "leukocytes"]

