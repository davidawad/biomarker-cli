citations = [
  { pmid = "36676660", doi = "10.3390/medicina59010036", url = "https://pubmed.ncbi.nlm.nih.gov/36676660/", title = "Diagnosis and Management of Fetal and Neonatal Thyrotoxicosis.", locator = "Full text" },
]
note = "Restates the ATA pregnancy advice (secondary source, not checked against the ATA text): a high TRAb is more than three times the upper normal maternal limit or more than 5 IU/L, then thioamide counselling and TRAb retesting at 30-34 weeks. The 3x ULN form is the next range. Source kind: diagnostic. Source band >= 5; stored as the warn high bound 5."

