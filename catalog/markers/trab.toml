slug = "trab"
name = "TSH Receptor Antibodies (TRAb/TSI)"
category = "thyroid"
unit = "IU/L"
description = "Antibodies that stimulate or block the TSH receptor; the main cause of Graves disease and a predictor of fetal and neonatal thyroid dysfunction in pregnancy. Cut-offs are assay-specific and not interchangeable across platforms."

