slug = "meld"
name = "MELD Score (Model for End-Stage Liver Disease)"
category = "liver"
unit = "points"
loinc = "44760-7"
description = "Model for End-Stage Liver Disease score, calculated from serum creatinine, total bilirubin and INR. Used to rank liver transplant candidates and to estimate short-term (3-month) waiting-list mortality. There is no normal range; a higher score means more severe liver disease and higher mortality risk."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "diagnostic"
kind = "warn"
low = 9
when = { conditions = ["cirrhosis"] }
population = "Adult liver transplant candidates with chronic liver disease on the OPTN waiting list (2A/2B status, 1999-2001)"
evidence = "cohort"
citations = [
  { pmid = "12512033", doi = "10.1053/gast.2003.50016", title = "Model for end-stage liver disease (MELD) and allocation of donor livers.", locator = "Abstract (Results)" },
]
note = "Lowest MELD risk band: 3-month mortality 1.9%. Strictly below 9 (the source says '<9'). Risk category, not a diagnosis. Source kind: diagnostic. Source band <= 9; stored as the warn low bound 9."

[[range]]
set = "alt-1"
kind = "warn"
high = 40
when = { conditions = ["cirrhosis"] }
population = "Adult liver transplant candidates with chronic liver disease on the OPTN waiting list (2A/2B status, 1999-2001)"
evidence = "cohort"
citations = [
  { pmid = "12512033", doi = "10.1053/gast.2003.50016", title = "Model for end-stage liver disease (MELD) and allocation of donor livers.", locator = "Abstract (Results)" },
]
note = "Highest MELD risk band: 3-month mortality 71.3% (score 40 or more). Risk category, not a diagnosis. Source kind: diagnostic. Source band >= 40; stored as the warn high bound 40. Alternative to the default diagnostic warn range for the same population."
