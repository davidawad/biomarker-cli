[[range]]
set = "optimal"
kind = "optimal"
high = 10
population = "Adults in a general population cohort (China Cardiometabolic Disease and Cancer Cohort, 82,509 participants, median follow-up 3.0 years) (specimen: spot-urine)"
evidence = "cohort"
citations = [
  { pmid = "42584389", doi = "10.1016/j.jacasi.2026.06.032", title = "Lifestyle and Metabolic Health, Low-Grade to Clinically Elevated Albuminuria, and Cardiovascular-Renal Diseases.", locator = "Abstract, Results" },
]
note = "Below 10 mg/g, the lowest-risk region of a J-shaped association with cardiorenal outcomes; risk already rises from 10 mg/g in this cohort. Not a guideline threshold: a single cohort, and the guideline cut-offs remain 30 and 300 mg/g."
