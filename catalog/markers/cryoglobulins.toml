description = "Immunoglobulins in serum or plasma that precipitate when cooled. Screened on a warm-collected serum sample held for up to 7 days, then reported as present or absent and classified by type (I, II or III). Associated with hepatitis C infection, lymphoproliferative disease and autoimmune disease. Expected result: not detected (negative)."
