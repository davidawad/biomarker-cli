]
note = "HbA1c goal for complex/intermediate older adults with diabetes, as tabulated from ADA 2023 by a review. Limited life expectancy or very complex/poor health are not covered by this quote; the source lists separate goals for them. Source kind: target. Alternative to the default target optimal range for the same population."

