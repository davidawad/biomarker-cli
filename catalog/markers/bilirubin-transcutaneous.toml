slug = "bilirubin-transcutaneous"
name = "Bilirubin, Transcutaneous (Newborn)"
category = "pediatric"
unit = "mg/dL"
loinc = "58941-6"
description = "Skin bilirubin estimated non-invasively with a transcutaneous bilirubinometer (TcB) on the newborn's skin, used to screen for neonatal hyperbilirubinemia and decide whether a serum total bilirubin (TSB) is needed. TcB underestimates TSB, most in phototherapy. Expected result: below the age-specific phototherapy threshold; a TcB above the cut-off below means a serum TSB should be measured."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "clinical"
kind = "warn"
high = 14.62
population = "Newborns with TcB measurement, cited as the AAP-based recommendation in a Swedish multicentre home-phototherapy study"
evidence = "guideline"
citations = [
  { pmid = "40131901", doi = "10.1371/journal.pone.0320067", title = "Transcutaneous bilirubin in newborns before, during, and after home phototherapy-Results from a secondary analysis of a randomized controlled trial.", locator = "Introduction, paragraph 3" },
]
note = "Serum TSB confirmation threshold for TcB, stated in the source as a recommendation (citing AAP guidance). Bound is strictly above 250 umol/L (kept in the source unit, not converted). Secondary citation: the source reports the AAP recommendation, not a primary guideline text. Converted from the source's µmol/L (250) to mg/dL using factor 0.05848. Source band >= 14.62; stored as the warn high bound 14.62."
