slug = "selenium"
name = "Selenium, Serum/Plasma"
category = "mineral"
unit = "µg/L"
description = "Serum or plasma selenium, the marker of selenium status used with selenoprotein P and glutathione peroxidase activity. Low status is linked to mortality, immune and cognitive outcomes, and high status is not automatically beneficial, so the U-shaped relation with status matters."

[[range]]
set = "us-epa-2002"
kind = "warn"
low = 1000
population = "Adults with selenium exposure; threshold taken from the US EPA (2002) value quoted in a 2020 review (specimen: whole-blood)"
evidence = "guideline"
citations = [
  { pmid = "31388899", doi = "10.1007/s42000-019-00125-5", title = "Selenium intake, status, and health: a complex relationship.", locator = "Section on mercury exposure in the Brazilian Amazon" },
]
note = "Whole-blood selenium considered toxic. Value cited secondhand from a review (Rayman 2020); the primary EPA document was not retrieved. Source kind: toxic."

[[range]]
set = "clinical"
kind = "reference"
low = 90
high = 125
population = "Healthy people (plasma or serum selenium), as described in a critical-care review"
evidence = "consensus"
citations = [
  { pmid = "33049573", doi = "10.1016/j.nut.2020.110989", title = "Pharmaconutrition revisited for critically ill patients with coronavirus disease 2019 (COVID-19): Does selenium have a place?", locator = "Discussion (selenium kinetics paragraph)" },
]
note = "The source describes 90-125 ug/L as the normal physiologic range associated with maximal GPX3 activity (daily intake 55-70 ug). It is a narrative citation of earlier work, not a measured reference interval. Assay and selenoprotein P status are not stated."

[[range]]
set = "combs-2015"
kind = "optimal"
