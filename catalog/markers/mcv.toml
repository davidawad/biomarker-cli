slug = "mcv"
name = "Mean Corpuscular Volume"
category = "cbc"
unit = "fL"
description = "Average volume of a red blood cell. Low values (microcytosis) suggest iron deficiency or thalassaemia trait; high values (macrocytosis) suggest B12 or folate deficiency, alcohol use, liver disease or reticulocytosis."
loinc = "787-2"
aliases = []

