citations = [
  { pmid = "19202968", title = "Evaluation of macrocytosis.", locator = "Abstract" },
]
note = "Review (American Family Physician) defining macrocytosis as MCV above 100 fL; abstract-level citation, not a guideline threshold. No microcytosis (low MCV) cutoff was found in retrievable open-access text, so none is encoded. Source band >= 100; stored as the warn high bound 100."
