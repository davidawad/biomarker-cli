kind = "reference"
low = 82
high = 98
when = { age = [18.0, 90.0] }
population = "1826 healthy Nordic adults aged 18-90 (NORIP), venous EDTA blood, 12 analyser types; no sex-specific interval reported"
evidence = "reference-interval-study"
citations = [
  { pmid = "15223702", doi = "10.1080/00365510410002797", title = "A multicentre study of reference intervals for haemoglobin, basic blood cell counts and erythrocyte indices in the adult population of the Nordic countries.", locator = "Abstract" },
]
note = "Non-parametric 2.5th-97.5th percentiles. The NORIP abstract reports one interval for both sexes."

[[range]]
set = "am-fam-physician-2009"
kind = "warn"
high = 100
population = "adults with an incidental raised MCV on a complete blood count (macrocytosis evaluation review)"
