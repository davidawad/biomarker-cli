slug = "toxoplasma-igg"
name = "Toxoplasma IgG"
category = "infectious"
unit = "IU/mL"
loinc = "22580-5"
description = "Serum IgG antibody against Toxoplasma gondii, reported in IU/mL by immunoassay as negative, equivocal or positive. Tracked to establish past or latent infection, and during pregnancy or immunosuppression to assess risk. Expected result: negative (no prior exposure) or, if previously infected, positive; a positive IgG alone does not date infection, so IgM and IgG avidity testing are used with it."

[[range]]
set = "diagnostic"
kind = "warn"
high = 4.4
population = "384 routine-screening sera, Pitie-Salpetriere Hospital, Paris, tested with Platelia Toxo IgG and Western blot (method: platelia-toxo-igg)"
evidence = "cohort"
citations = [
  { pmid = "26187780", doi = "10.1051/parasite/2015022", title = "The impact of lowering the cut-off value on the sensitivity of the Platelia Elisa IgG (Bio-Rad) test for toxoplasmosis diagnosis.", locator = "Abstract" },
]
note = "Seropositive (IgG positivity) on Platelia Toxo IgG; cut-off chosen in one study against Western blot, and lower than the manufacturer's cut-off. Source kind: diagnostic. Source band >= 4.4; stored as the warn high bound 4.4."

