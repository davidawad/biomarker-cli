slug = "pulse-pressure"
name = "Pulse Pressure"
category = "vitals"
unit = "mmHg"
description = "Systolic minus diastolic blood pressure. Tracked as a marker of arterial stiffness and cardiovascular risk. No population reference interval was verified for this shard; the ranges below are cut-offs from single observational studies in specific patient groups."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "clinical"
kind = "warn"
low = 30
when = { conditions = ["heart-failure"] }
population = "Adults admitted with heart failure (retrospective cohort, 21,768 patients, China)"
evidence = "cohort"
citations = [
  { pmid = "42147065", doi = "10.3389/fcvm.2026.1747168", title = "Low admission pulse pressure and increased in-hospital mortality in patients with heart failure.", locator = "Abstract (Results)" },
]
note = "Low admission pulse pressure: strictly below 30 mmHg, associated with higher in-hospital mortality. Single-study cut-off. Source band <= 30; stored as the warn low bound 30."

[[range]]
set = "alt-1"
kind = "warn"
high = 60
when = { conditions = ["heart-failure"] }
population = "Adults admitted with heart failure (retrospective cohort, 21,768 patients, China)"
evidence = "cohort"
citations = [
  { pmid = "42147065", doi = "10.3389/fcvm.2026.1747168", title = "Low admission pulse pressure and increased in-hospital mortality in patients with heart failure.", locator = "Results (pulse pressure categories)" },
]
note = "High admission pulse pressure: strictly above 60 mmHg. Study category, not a clinical threshold. Source band >= 60; stored as the warn high bound 60. Alternative to the default clinical warn range for the same population."

[[range]]
set = "alt-1"
kind = "warn"
high = 60
when = { conditions = ["stable-coronary-artery-disease"] }
population = "Adults with stable coronary artery disease and normal ejection fraction (prospective cohort, 7,027 patients)"
evidence = "cohort"
citations = [
  { pmid = "42082683", doi = "10.1038/s44325-026-00118-5", title = "Pulse pressure associates with severity and worse outcomes in patients with stable coronary artery disease.", locator = "Figure 1 legend" },
]
note = "Highest pulse-pressure quartile (Q4) in the study cohort. Quartile boundary, not a clinical threshold. Source band >= 60; stored as the warn high bound 60. Alternative to the default clinical warn range for the same population."
