slug = "vitamin-b12"
name = "Vitamin B12"
category = "vitamin"
unit = "pg/mL"
description = "Total serum vitamin B12 (cobalamin), including the inactive haptocorrin-bound fraction. Low values indicate deficiency or depletion, but serum B12 alone misses many cases of functional deficiency, so it is usually read together with methylmalonic acid, holotranscobalamin or homocysteine."
loinc = "2132-9"
aliases = ["b12", "cobalamin"]

[[conversion]]
from = "pmol/L"
factor = 1.355

[[range]]
set = "clinical"
kind = "reference"
low = 232.0
high = 1245.0
legacy = true

[[range]]
set = "optimal"
kind = "optimal"
low = 500.0
legacy = true

[[range]]
set = "epi-review-2011"
kind = "warn"
low = 200.5
population = "Clinical B12 deficiency threshold as summarised in an epidemiologic review of cobalamin biomarkers (adults, megaloblastic anaemia studies)"
evidence = "consensus"
citations = [
  { pmid = "21593511", doi = "10.3945/ajcn.111.013441", title = "Biomarkers of cobalamin (vitamin B-12) status in the epidemiologic setting: a critical overview of context, applications, and performance characteristics of cobalamin, methylmalonic acid, and holotranscobalamin II.", locator = "Performance characteristics, para 1 (full text)" },
]
note = "148 pmol/L is the traditional cut-off (about 200 pg/mL). It is about 95-97% sensitive for clinical deficiency but only 38-39% sensitive against metabolic (MMA or homocysteine) criteria in non-clinical surveys. Higher cut-offs of 221 or 258 pmol/L have been proposed; they raise sensitivity and lower specificity. The 1.355 factor is 1/0.7378 (1 pg/mL = 0.7378 pmol/L). Source kind: deficient. Source band <= 200.5; stored as the warn low bound 200.5."

[[range]]
set = "nhanes-roundtable-2011"
kind = "warn"
low = 271.0
population = "US adults in NHANES (roundtable on B12 biomarker cut-offs; general population)"
evidence = "consensus"
citations = [
  { pmid = "21593512", doi = "10.3945/ajcn.111.013243", title = "Biomarkers of vitamin B-12 status in NHANES: a roundtable summary.", locator = "Roundtable discussion, cut-off relevance (full text)" },
]
note = "Band between the 3-SD (148 pmol/L) and 2-SD (about 200 pmol/L) cut-offs. The roundtable notes that a 148 pmol/L cut-off misses 3-5% of clinically deficient patients while about 200 pmol/L catches all of them but gives more false positives. Source band 200.5-271.0; stored as the warn low bound 271.0."

[[range]]
set = "pregnancy-prevalence-2019"
kind = "warn"
low = 284.6
when = { pregnant = true }
population = "Pregnant women in the PREFORM prospective cohort (Toronto, n=368), sampled at 12-16 gestational weeks and at delivery"
evidence = "consensus"
citations = [
  { pmid = "30845641", doi = "10.3390/nu11030557", title = "The Effects of Vegetarian and Vegan Diet during Pregnancy on the Health of Mothers and Offspring.", locator = "Maternal B12 status section, para 1 (full text)" },
]
note = "No pregnancy-specific B12 threshold was found in the retrieved sources; this is the suboptimal cut-off used in a pregnancy cohort, cited in a review. Deficiency at <148 pmol/L was 17% at 12-16 weeks and 38% at delivery in the same cohort. Source kind: insufficient. Source band <= 284.6; stored as the warn low bound 284.6."

[[range]]
set = "frontiers-2016"
kind = "reference"
low = 338.8
population = "General adult population; normal range used by most clinical chemistry laboratories, as cited from Clarke 2003 and others"
evidence = "consensus"
citations = [
  { pmid = "27446930", doi = "10.3389/fmolb.2016.00027", title = "Biomarkers and Algorithms for the Diagnosis of Vitamin B12 Deficiency.", locator = "Total serum vitamin B12 section, para 1 (full text)" },
]
note = "Normal lower limit >250 pmol/L (about 339 pg/mL) as quoted in a 2016 review. Values 150-249 pmol/L are labelled low. Many labs use different assays, so local ranges should be checked."

[[range]]
set = "clarke-2003"
kind = "warn"
low = 271.0
when = { markers = [{ marker = "methylmalonic-acid", op = ">=", value = 350 }], age = [65.0, 200] }
population = "Older persons aged 65 and over in Oxford (population study, n=1562), borderline B12 with raised MMA or homocysteine"
evidence = "cohort"
citations = [
  { pmid = "12716678", doi = "10.1093/ajcn/77.5.1241", title = "Screening for vitamin B-12 and folate deficiency in older persons.", locator = "Design, para 1 (Abstract)" },
]
note = "Borderline band 150-200 pmol/L counts as high risk of B12 deficiency only when MMA is above 0.35 micromol/L (350 nmol/L) or homocysteine is above 15 micromol/L (see the MMA and homocysteine files). The marker condition here encodes the MMA arm only. Source band 203.3-271.0; stored as the warn low bound 271.0."
