description = "Plasma riboflavin (vitamin B2), the free vitamin measured by reversed-phase HPLC with fluorescence detection after acid protein precipitation. Riboflavin is the precursor of the coenzymes FMN and FAD. People track it to assess vitamin B2 status, mainly in at-risk individuals or during supplementation. Expected result: within the reference interval (about 6.7-50.1 nmol/L in the cited study); lower values suggest low riboflavin status."

