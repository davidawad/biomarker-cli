population = "Apparently healthy adult men (n=1043) from five Chinese cities, 2013; reference interval derived without partition by age (method: immunoassay)"
evidence = "reference-interval-study"
citations = [
  { pmid = "29729137", doi = "10.1515/cclm-2017-0749", url = "https://pubmed.ncbi.nlm.nih.gov/29729137/", title = "Establishing reference intervals for sex hormones and SHBG in apparently healthy Chinese adult men based on a multicenter study.", locator = "Abstract, Results" },
]
note = "Reference interval as reported (median 29.4 nmol/L). The abstract does not state the percentile limits; the parametric method is usually 2.5th-97.5th. Automated immunoassay. Age was a source of variation for SHBG (rises with age), so the interval is not age-specific. Applies only to: ethnicity=Chinese."
