slug = "shbg"
name = "Sex Hormone Binding Globulin"
category = "hormone"
unit = "nmol/L"
description = "Liver-made carrier protein that binds testosterone and estradiol and sets how much of each is free and active. Interpret with total testosterone and estradiol; levels vary with sex, age, puberty and oral contraceptive use."
loinc = "13967-5"
aliases = ["sex hormone binding globulin"]

