slug = "waist-to-height-ratio"
name = "Waist-to-Height Ratio"
category = "body"
unit = "ratio"
description = "Waist circumference divided by height, both in the same unit. It is a simple index of central adiposity and cardiometabolic risk that does not need sex- or ethnicity-specific cut-offs. A value of 0.5 is the commonly used boundary."
aliases = ["whtr", "waist-to-height", "waist to height ratio"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "nice-ng246-2022"
kind = "warn"
low = 0.5
high = 0.59
population = "Adults (NICE guidance for England, based on the committee's review of the evidence)"
evidence = "guideline"
citations = [
  { url = "https://www.nice.org.uk/guidance/ng246/chapter/rationale-and-impact", title = "Overweight and obesity management", locator = "Rationale and impact, waist-to-height ratio section" },
]
note = "Increased health risk band per NICE. Lower bound 0.5 inclusive, upper bound 0.59 inclusive as written in the quote ('0.5 to 0.59'). Applied in conjunction with BMI for adults with BMI under 35 kg/m2, per the same rationale section."

[[range]]
set = "alt-1"
kind = "warn"
low = 0.6
population = "Adults (NICE guidance for England, based on the committee's review of the evidence)"
evidence = "guideline"
citations = [
  { url = "https://www.nice.org.uk/guidance/ng246/chapter/rationale-and-impact", title = "Overweight and obesity management", locator = "Rationale and impact, waist-to-height ratio section" },
]
note = "NICE rationale: a value of 0.6 or more indicates a further increase in risk. The NICE text uses 'further increase in risk' rather than the word 'high', so this is the top band by wording. NICE also notes that WHtR may add little for people with BMI over 35 kg/m2, who are likely to have a high ratio anyway. Source kind: decision. Alternative to the default nice-ng246-2022 warn range for the same population."

[[range]]
