kind = "warn"
low = 0.5
population = "Adults of both sexes and different ethnic groups (proposed universal boundary)"
evidence = "consensus"
citations = [
  { pmid = "16236591", doi = "10.1080/09637480500195066", url = "https://pubmed.ncbi.nlm.nih.gov/16236591/", title = "Six reasons why the waist-to-height ratio is a rapid and effective global indicator for health risks of obesity and how its use could simplify the international public health message on obesity.", locator = "Abstract" },
]
note = "Proposed boundary for increased health risk in men and women. Source is a review and position paper, not a guideline. The quote gives WHtR = 0.5 as the boundary. Source kind: decision."
