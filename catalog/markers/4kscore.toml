slug = "4kscore"
name = "4Kscore"
category = "tumor-marker"
unit = "%"
loinc = "90740-2"
description = "Blood test combining four kallikreins with clinical information, reported as a percent risk of Gleason 7 or higher (significant) prostate cancer on biopsy. Used to decide whether a man needs a prostate biopsy. Expected result: a low percent risk, below the cut-offs in the ranges below."

[[range]]
set = "clinical"
kind = "warn"
high = 7.5
when = { conditions = ["prostate-cancer"] }
population = "Men considered for prostate biopsy (meta-analysis background)"
evidence = "cohort"
citations = [
  { pmid = "33685800", doi = "10.1016/j.urolonc.2020.11.001", title = "4Kscore diagnostic value in patients with high-grade prostate cancer using cutoff values of 7.5% to 10%: A meta-analysis.", locator = "Abstract (Background)" },
]
note = "Cut-off below which the source describes low risk of high-grade cancer. The same meta-analysis concludes the 7.5% to 10% cut-offs need confirmation in larger studies. Source band >= 7.5; stored as the warn high bound 7.5."

[[range]]
set = "clinical"
kind = "reference"
low = 5
high = 23
when = { conditions = ["prostate-cancer"] }
population = "Men scheduled for prostate biopsy (US prospective validation study)"
evidence = "cohort"
citations = [
  { pmid = "31378585", doi = "10.1016/j.urolonc.2019.07.010", title = "Developing an effective strategy to improve the detection of significant prostate cancer by combining the 4Kscore and multiparametric MRI.", locator = "Abstract (Results)" },
]
note = "Intermediate band 5% to 23% for high-grade prostate cancer; the source places <5% in the low band and >23% in the high band. Two-sided band stored as a reference range in its own set because it has no clinical reference range to orient it as a warn or critical cut point."
