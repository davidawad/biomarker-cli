slug = "ldl-c-sampson"
name = "LDL Cholesterol, Sampson/NIH Equation Calculated"
category = "lipid"
unit = "mg/dL"
description = "LDL cholesterol calculated from the standard lipid profile by the Sampson/NIH equation (Sampson et al., JAMA Cardiology 2020). The equation estimates very-LDL cholesterol from triglycerides and non-HDL-C, then subtracts it to give LDL-C. It was derived in NIH Clinical Center patients and is intended for normolipidemia and hypertriglyceridemia, including low LDL-C. Calculated, not measured. Used for the same ATP III LDL-C categories and goals as measured LDL-C. Expected result for a healthy adult: below 100 mg/dL (optimal)."

[[range]]
set = "optimal"
kind = "optimal"
high = 100
when = { age = [20.0, 200] }
population = "Adults aged 20 years or older"
evidence = "guideline"
citations = [
  { url = "https://www.nhlbi.nih.gov/files/docs/guidelines/atp3xsum.pdf", title = "ATP III Executive Summary (NHLBI)", locator = "Table 2" },
  { pmid = "32101259", doi = "10.1001/jamacardio.2020.0013", title = "A New Equation for Calculation of Low-Density Lipoprotein Cholesterol in Patients With Normolipidemia and/or Hypertriglyceridemia.", locator = "Abstract" },
]
note = "Optimal: strictly below 100 mg/dL (ATP III), applied to calculated LDL-C."

