description = "IgM autoantibody to cardiolipin (anticardiolipin, aCL), measured by ELISA or chemiluminescence and reported in M phospholipid units (MPL). Used with IgG aCL and anti-beta-2-glycoprotein I tests in the evaluation of antiphospholipid syndrome. Expected result in people without antiphospholipid syndrome: below the laboratory's cut-off, usually not detected. Isolated IgM positivity carries low weight in the 2023 ACR/EULAR classification criteria."

