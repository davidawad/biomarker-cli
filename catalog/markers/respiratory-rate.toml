citations = [
  { url = "https://www.rcp.ac.uk/media/a4ibkkbf/news2-final-report_0_0.pdf", locator = "Chart 1: The NEWS scoring system (Respiration rate, per minute)" },
]
note = "NEWS2 score-1 band: respiration rate 9-11 breaths/min (low-ish rate that adds one point). Boundaries inclusive as printed. Source band 9-11; stored as the warn low bound 9."

[[range]]
