note = "qSOFA criterion: respiratory rate of 22/min or greater (one of three bedside criteria; two or more positive criteria indicate higher risk of poor outcome). A screening threshold, not a diagnostic cut-off for sepsis. Source kind: decision. Source band >= 22; stored as the warn high bound 22."
