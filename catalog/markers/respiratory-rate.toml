slug = "respiratory-rate"
name = "Respiratory Rate"
category = "vitals"
unit = "breaths/min"
loinc = "9279-1"
description = "Number of breaths taken per minute at rest. A raised respiratory rate is an early sign of acute illness, sepsis or respiratory distress, and it is one of the parameters in the NEWS2 early warning score and the qSOFA sepsis screen."
aliases = ["rr", "breathing rate"]

[[range]]
set = "clinical"
kind = "reference"
low = 12
high = 20
population = "Adults, as used in the NEWS2 early warning score chart (score 0 band for respiration rate)"
evidence = "consensus"
citations = [
  { url = "https://www.rcp.ac.uk/media/a4ibkkbf/news2-final-report_0_0.pdf", locator = "Chart 1: The NEWS scoring system (Respiration rate, per minute)" },
]
note = "Respiration rate 12-20 breaths/min is the NEWS2 score-0 band, i.e. the normal range used for early-warning scoring. It is a scoring band, not a population reference interval; boundaries are inclusive as printed in the chart."

[[range]]
set = "rcp-news2-2017"
kind = "warn"
low = 9
population = "Adults, as used in the NEWS2 early warning score chart (score 1 band for respiration rate)"
