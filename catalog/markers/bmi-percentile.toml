slug = "bmi-percentile"
name = "BMI Percentile for Age and Sex"
category = "pediatric"
unit = "percentile"
loinc = "59576-9"
description = "BMI-for-age percentile for children and teens aged 2 to 19 years, compared with the sex- and age-specific CDC reference population. Interpreted as underweight, healthy weight, overweight or obesity; not applicable to adults."

[[range]]
set = "clinical"
kind = "warn"
high = 95
when = { age = [2.0, 20.0] }
population = "US children and teens aged 2 through 19 years, sex-specific BMI-for-age percentile"
evidence = "guideline"
citations = [
  { url = "https://www.cdc.gov/bmi/child-teen-calculator/index.html", locator = "BMI Category Percentile Ranges Table" },
  { pmid = "15495854", title = "Defining overweight in children using growth charts.", locator = "Abstract" },
]
note = "Overweight category (at risk for overweight in the 2004 source's terminology). Source band 85-95; stored as the warn high bound 95."

