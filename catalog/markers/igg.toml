slug = "igg"
name = "Immunoglobulin G"
category = "immune"
unit = "g/L"
loinc = "2465-3"
description = "The most abundant immunoglobulin in blood, made by plasma cells and the main antibody against systemic infections. Low levels (hypogammaglobulinaemia) raise infection risk, while very high levels can signal a monoclonal gammopathy."
aliases = ["immunoglobulin g, serum"]

