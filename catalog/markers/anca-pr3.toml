slug = "anca-pr3"
name = "ANCA, Anti-Proteinase 3 (PR3) Antibody"
category = "autoimmune"
unit = "CU"
loinc = "6968-2"
description = "IgG autoantibody against proteinase 3 (PR3-ANCA), measured by a chemiluminescence immunoassay and reported in vendor chemiluminescence units (CU), which are not interchangeable with U/mL from other assays. Tracked for diagnosis and relapse monitoring in ANCA-associated vasculitis, mainly granulomatosis with polyangiitis. Expected result: negative (below the assay positivity threshold)."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "diagnostic"
kind = "warn"
high = 20
when = { conditions = ["anca-associated-vasculitis"] }
population = "Patients newly diagnosed with ANCA-associated vasculitis or newly detected ANCA positivity, single-centre cohort, Northern Spain (BIO-FLASH chemiluminescence assay; applies to PR3-ANCA and MPO-ANCA)"
evidence = "cohort"
citations = [
  { pmid = "41728626", doi = "10.3389/fmed.2026.1766518", title = "Incidence and clinical features of ANCA-associated vasculitis before and during the COVID-19 pandemic: experience from a single-center in Northern Spain.", locator = "Methods, ANCA testing" },
]
note = "ANCA positivity cut-off stated by the source for the BIO-FLASH assay; the source states it for ANCA generally, and PR3 is one of the two reported antibody specificities. Source unit CU. Source kind: diagnostic. Source band >= 20; stored as the warn high bound 20."
