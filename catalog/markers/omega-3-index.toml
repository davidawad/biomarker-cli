slug = "omega-3-index"
name = "Omega-3 Index"
category = "fatty-acid"
unit = "%"
description = "Red blood cell EPA plus DHA expressed as a percent of total fatty acids, a long-term marker of omega-3 status. Low values (below 4%) are associated with higher risk of coronary heart disease death; values above 8% are associated with the lowest risk."

[[range]]
set = "clinical"
kind = "reference"
low = 4
high = 8
population = "Adults; risk zones proposed for erythrocyte EPA plus DHA from the omega-3 index risk-factor review (specimen: rbc)"
evidence = "consensus"
citations = [
  { pmid = "18541601", title = "The omega-3 index as a risk factor for coronary heart disease.", locator = "Abstract" },
]
note = "Proposed intermediate-risk band for the Omega-3 Index (percent of erythrocyte fatty acids). Proposed zones, not a population reference interval. Two-sided band stored as a reference range in its own set because it has no clinical reference range to orient it as a warn or critical cut point."

[[range]]
set = "harris-2008"
kind = "warn"
low = 4
population = "Adults; high-risk zone for erythrocyte EPA plus DHA from the omega-3 index risk-factor review (specimen: rbc)"
evidence = "consensus"
citations = [
  { pmid = "18541601", title = "The omega-3 index as a risk factor for coronary heart disease.", locator = "Abstract" },
]
note = "Proposed high-risk zone for the Omega-3 Index. Proposed cutoff, not a population reference interval. Source kind: deficient. Source band <= 4; stored as the warn low bound 4."

