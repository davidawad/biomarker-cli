set = "harris-2004"
kind = "optimal"
low = 8
population = "Adults in the Harris and von Schacky analysis of published primary and secondary prevention studies (CHD death and sudden cardiac death outcomes) (specimen: rbc)"
evidence = "cohort"
citations = [
  { pmid = "15208005", doi = "10.1016/j.ypmed.2004.02.030", title = "The Omega-3 Index: a new risk factor for death from coronary heart disease?", locator = "Abstract, Results" },
  { pmid = "27216485", doi = "10.1016/j.plipres.2016.05.001", title = "Global survey of the omega-3 fatty acids, docosahexaenoic acid and eicosapentaenoic acid in the blood stream of healthy adults.", locator = "Abstract" },
]
note = "Stated as the level associated with greatest cardioprotection. Stark 2016 uses the same >8% boundary as its high-level cutoff. Quote is from the abstract; the abstract gives only the >=8% and <=4% points, not the intermediate band."
