slug = "neutrophils-abs"
name = "Neutrophils (Absolute)"
category = "cbc"
unit = "10^3/µL"
description = "Absolute count of circulating neutrophils, the main circulating white cells in bacterial infection defence. Low values (neutropenia) raise infection risk, but are benign in Duffy-null / benign ethnic neutropenia; high values (neutrophilia) occur with bacterial infection, inflammation, stress, smoking, steroids or myeloid disorders."
loinc = "751-8"
aliases = ["neutrophils", "anc"]

