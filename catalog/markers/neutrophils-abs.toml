evidence = "reference-interval-study"
citations = [
  { pmid = "42345734", doi = "10.3390/hematolrep18030038", title = "Establishing Reference Intervals for White Blood Cell and Absolute Neutrophil Counts in Duffy Null Individuals.", locator = "Abstract, Results" },
]
note = "Non-parametric 95% interval per CLSI. The lower bound lies below the conventional neutropenia cutoff; the authors advocate Duffy-null-specific ranges rather than the term benign ethnic neutropenia."

