slug = "quicki"
name = "QUICKI (Quantitative Insulin Sensitivity Check Index)"
category = "glycemic"
unit = "index"
description = "Computed insulin sensitivity index from fasting insulin and fasting glucose: 1/[log(fasting insulin) + log(fasting glucose)]. Lower values indicate insulin resistance. Expected result: no single established normal range; interpret against study-specific cut-offs."
no_reference = "Computed index with no established reference interval; the only range below is a single-study cut-off for metabolic syndrome classification."

[[range]]
set = "diagnostic"
kind = "warn"
low = 0.32
when = { conditions = ["metabolic-syndrome"] }
population = "Southern Indian adults aged 18 to 65 years (75 with metabolic syndrome, 75 controls)"
evidence = "cohort"
citations = [
  { pmid = "33229629", doi = "10.7570/jomes20071", title = "Cut-off Values and Clinical Utility of Surrogate Markers for Insulin Resistance and Beta-Cell Function to Identify Metabolic Syndrome and Its Components among Southern Indian Adults.", locator = "Discussion (cut-off values)" },
]
note = "Cut-off for identifying metabolic syndrome (value at or below 0.32 flagged), derived by ROC analysis in one cross-sectional study. Single study; not a general insulin-resistance cut-off. Source kind: diagnostic. Source band <= 0.32; stored as the warn low bound 0.32."
