slug = "sweat-chloride"
name = "Sweat Chloride"
category = "pediatric"
unit = "mmol/L"
description = "Chloride concentration measured in sweat collected by pilocarpine iontophoresis; the reference test for CFTR dysfunction and the main laboratory step in diagnosing cystic fibrosis. Values are interpreted against consensus decision limits, not a population reference interval."

[[range]]
set = "australasian-sweat-chloride-2025"
kind = "warn"
low = 30
high = 59
population = "People with suspected cystic fibrosis, all age groups (specimen: sweat)"
evidence = "guideline"
citations = [
  { pmid = "40476459", doi = "10.1515/cclm-2025-0433", url = "https://pubmed.ncbi.nlm.nih.gov/40476459/", title = "Australasian guideline for the performance of sweat chloride testing 3rd edition: to support cystic fibrosis screening, diagnosis and monitoring.", locator = "Abstract" },
  { pmid = "36990700", doi = "10.3760/cma.j.cn112147-20221214-00971", url = "https://pubmed.ncbi.nlm.nih.gov/36990700/", title = "[Chinese experts consensus statement: diagnosis and treatment of cystic fibrosis (2023)].", locator = "Question 2, 1.2 Sweat chloride testing" },
]
note = "Intermediate zone: a result of 30-59 mmol/L requires review by a CF physician and genetic testing to confirm or exclude CF. The guideline states the same limits apply to all ages."

[[range]]
set = "chinese-cf-consensus-2023"
kind = "warn"
low = 60
population = "Patients with suspected cystic fibrosis, all ages (specimen: sweat)"
evidence = "consensus"
citations = [
  { pmid = "36990700", doi = "10.3760/cma.j.cn112147-20221214-00971", url = "https://pubmed.ncbi.nlm.nih.gov/36990700/", title = "[Chinese experts consensus statement: diagnosis and treatment of cystic fibrosis (2023)].", locator = "Question 2, 1.2 Sweat chloride testing" },
  { pmid = "40476459", doi = "10.1515/cclm-2025-0433", url = "https://pubmed.ncbi.nlm.nih.gov/40476459/", title = "Australasian guideline for the performance of sweat chloride testing 3rd edition: to support cystic fibrosis screening, diagnosis and monitoring.", locator = "Abstract" },
]
note = "Above 60 mmol/L is diagnostic of CF when clinical features are present (Chinese consensus wording: more than 60). The Australasian 2025 guideline describes >=60 mmol/L as supportive of a CF diagnosis. Prefer the CF Foundation 2017 consensus (Farrell et al.) for the US standard, which was not retrievable through the available tools. Source kind: diagnostic."

[[range]]
set = "clinical"
kind = "reference"
high = 30
population = "Patients with suspected cystic fibrosis in China, all ages (specimen: sweat)"
evidence = "consensus"
citations = [
  { pmid = "36990700", doi = "10.3760/cma.j.cn112147-20221214-00971", url = "https://pubmed.ncbi.nlm.nih.gov/36990700/", title = "[Chinese experts consensus statement: diagnosis and treatment of cystic fibrosis (2023)].", locator = "Question 2, 1.2 Sweat chloride testing" },
]
note = "Below 30 mmol/L is considered normal and does not support a CF diagnosis on its own. The 2023 Chinese consensus uses the same 30 and 60 mmol/L limits as the Australasian 2025 guideline."
