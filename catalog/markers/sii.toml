slug = "sii"
name = "Systemic Immune-Inflammation Index"
category = "hematology"
unit = "10^9/L"
description = "Systemic immune-inflammation index (SII) is platelet count multiplied by neutrophil count divided by lymphocyte count, a computed index from a complete blood count. It is studied as a prognostic marker of inflammation in cancer, cardiovascular disease and mortality. No established clinical cut-off exists. Expected result in healthy people: within the reference interval, which varies by study, sex and analyser."

[[range]]
set = "clinical"
kind = "reference"
low = 162
high = 811
when = { sex = "male" }
population = "Healthy adults, Jiangsu region, Eastern China (males, all ages), Sysmex platform"
evidence = "reference-interval-study"
citations = [
  { pmid = "37145057", doi = "10.7754/Clin.Lab.2022.220837", title = "Establishment of Reference Intervals for SII, NLR, PLR, and LMR in Healthy Adults in Jiangsu Region in Eastern China.", locator = "Results" },
]
note = "Non-parametric 2.5th-97.5th percentile interval, males; the study reports no significant age differences. Analyser-specific."

