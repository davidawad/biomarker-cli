[[range]]
set = "clinical"
kind = "reference"
low = 142
high = 804
population = "Healthy Han Chinese adults aged 18-79, western China, sexes pooled (CLSI method, multi-centre)"
evidence = "reference-interval-study"
citations = [
  { pmid = "30868857", doi = "10.7754/Clin.Lab.2018.180715", title = "Normal Reference Intervals of Neutrophil-To-Lymphocyte Ratio, Platelet-To-Lymphocyte Ratio, Lymphocyte-To-Monocyte Ratio, and Systemic Immune Inflammation Index in Healthy Adults: a Large Multi-Center Study from Western China.", locator = "Abstract (Results)" },
]
note = "Pooled-sex interval as reported by the study. The same study reports sex-related differences in SII, so the sex-specific range above may be preferred."

[[range]]
set = "clinical"
kind = "warn"
high = 655.56
population = "US adults free of pregnancy, cardiovascular disease and cancer, NHANES 1999-2018 (n = 42,875)"
evidence = "cohort"
citations = [
  { pmid = "36769776", doi = "10.3390/jcm12031128", title = "Systemic Immune Inflammation Index (SII), System Inflammation Response Index (SIRI) and Risk of All-Cause Mortality and Cardiovascular Mortality: A 20-Year Follow-Up Cohort Study of 42,875 US Adults.", locator = "Abstract (Results)" },
]
note = "Single observational NHANES cohort: SII above 655.56 compared with below 335.36 was associated with higher all-cause mortality (HR 1.29). Not an established clinical cut-off. Source band >= 655.56; stored as the warn high bound 655.56."
