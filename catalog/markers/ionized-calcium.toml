slug = "ionized-calcium"
name = "Calcium, Ionized"
category = "mineral"
unit = "mmol/L"
description = "Ionized (free) calcium, the physiologically active fraction of serum calcium, independent of albumin. Reference intervals are wider and shift with age in early life, so age-specific values are needed in neonates and young children."

[[range]]
set = "clinical"
kind = "reference"
low = 1.14
high = 1.46
when = { age = [0.0, 0.003] }
population = "Danish children on day 0 of life (median with 2.5th and 97.5th fractiles, non-pH-corrected data set)"
evidence = "reference-interval-study"
citations = [
  { pmid = "40785088", doi = "10.1515/cclm-2025-0353", title = "Reference ranges for ionized calcium in plasma in Danish children aged 0 days to 3 years using laboratory registry data.", locator = "Results" },
]
note = "Neonatal range on day 0. Values rise to a peak on day 8 (1.29-1.59 mmol/L in the source)."

[[range]]
set = "clinical"
kind = "reference"
low = 1.16
high = 1.36
when = { age = [1.5, 2.0] }
population = "Danish children at 18-24 months of age (non-pH-corrected data set)"
evidence = "reference-interval-study"
citations = [
  { pmid = "40785088", doi = "10.1515/cclm-2025-0353", title = "Reference ranges for ionized calcium in plasma in Danish children aged 0 days to 3 years using laboratory registry data.", locator = "Results" },
]
note = "Value at 18-24 months, after the post-neonatal decline in the source."

[[range]]
set = "clinical"
kind = "reference"
low = 0.88
high = 1.4
when = { sex = "female" }
population = "Women of reproductive age from six primary health-care facilities in Abuja, Nigeria (n = 240)"
evidence = "reference-interval-study"
citations = [
  { pmid = "33642323", doi = "10.4103/npmj.npmj_274_20", title = "Ionised serum calcium reference interval among rural women of reproductive age in Abuja, Nigeria.", locator = "Abstract" },
]
note = "Single-country, small sample (n = 240). Lower than the commonly quoted adult range; the source itself recommends a national derivation before wider use."

[[range]]
set = "clinical"
kind = "reference"
low = 1.12
high = 1.3
population = "Healthy adults aged about 18-75 years (n = 182, both sexes), Pakistan; venous blood gas analyser, 2.5-97.5 percentile (specimen: venous-blood-gas)"
evidence = "reference-interval-study"
citations = [
  { pmid = "39712818", doi = "10.7759/cureus.74223", title = "Reference Intervals for Venous Blood Gas in Healthy Adults: A One-Year Prospective Study", locator = "Table 2" },
]
note = "Venous blood gas (VBG) ionized calcium, not arterial or a serum-based method. The source's 90 % confidence limits for the lower and upper reference limits are 1.07-1.16 and 1.26-1.3 mmol/L. Single-centre, one-year prospective study. No hypocalcaemia threshold is stated in the source."
