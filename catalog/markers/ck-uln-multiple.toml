slug = "ck-uln-multiple"
name = "Creatine Kinase (multiple of upper limit of normal)"
category = "chemistry"
unit = "x ULN"
description = "Result expressed as a multiple of the reporting laboratory's upper limit of normal (ULN) rather than in absolute units. Compute it as the measured result divided by the ULN printed on the same laboratory report."

[[range]]
set = "clinical"
kind = "reference"
low = 4
high = 10
population = "Adults with asymptomatic or oligosymptomatic hyperCKemia, as grouped in large-scale statin risk studies cited by the EAN 2024 guideline"
evidence = "guideline"
citations = [
  { pmid = "41619221", doi = "10.1111/ene.70493", url = "https://pubmed.ncbi.nlm.nih.gov/41619221/", title = "EAN 2024 Guideline on the Diagnostic Approach to Oligo/Asymptomatic HyperCKemia.", locator = "Full text, statin risk discussion" },
]
note = "Statin-risk grouping of hyperCKemia by multiples of the upper limit of normal: up to 3x ULN, between 4x and 10x ULN, and higher values. The 4x to 10x band is the middle group. Multiples are relative to each laboratory's ULN, not absolute U/L values. Two-sided band stored as a reference range in its own set because it has no clinical reference range to orient it as a warn or critical cut point."

[[range]]
set = "ean-2024-hyperckemia"
kind = "warn"
low = 10
when = { conditions = ["statin-therapy"] }
population = "Adults with asymptomatic or oligosymptomatic hyperCKemia who are indicated for statin therapy"
evidence = "guideline"
citations = [
  { pmid = "41619221", doi = "10.1111/ene.70493", url = "https://pubmed.ncbi.nlm.nih.gov/41619221/", title = "EAN 2024 Guideline on the Diagnostic Approach to Oligo/Asymptomatic HyperCKemia.", locator = "Full text, statin risk discussion" },
]
note = "Guideline recommendation: statins should not be avoided when indicated in people with CK up to 10x ULN, with close follow-up. Boundary inclusive at 10x, following the wording 'up to 10x'. Source kind: decision. Source band <= 10; stored as the warn low bound 10."

[[range]]
set = "chest-2026-rhabdo-review"
kind = "critical"
high = 5
population = "Adults with suspected rhabdomyolysis (clinically oriented narrative review)"
evidence = "consensus"
citations = [
  { pmid = "41619932", doi = "10.1016/j.chest.2025.12.048", url = "https://pubmed.ncbi.nlm.nih.gov/41619932/", title = "Updates on Rhabdomyolysis: A Clinically Oriented Narrative Review.", locator = "Definition and diagnosis" },
]
note = "Commonly used rhabdomyolysis CK cut-off: above 5x the upper limit of normal, or above 1,000 U/L (the review states that no formal consensus definition exists). Boundary is strict (>5x ULN). Source band >= 5; stored as the critical high bound 5."
