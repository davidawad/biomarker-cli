slug = "gait-speed"
name = "Usual Gait Speed"
category = "body"
unit = "m/s"
description = "Walking speed over a short distance (usually 4 to 6 metres) at the person's usual pace, in metres per second. Used as the physical performance criterion for sarcopenia and as a marker of mobility and survival."
aliases = ["usual gait speed", "walking speed", "6-m walk speed"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "ewgsop2-2019"
kind = "warn"
high = 0.8
population = "Older adults (European consensus)"
evidence = "consensus"
citations = [
  { pmid = "30312372", doi = "10.1093/ageing/afy169", url = "https://pubmed.ncbi.nlm.nih.gov/30312372/", title = "Sarcopenia: revised European consensus on definition and diagnosis.", locator = "Section: Defining cut-off points for sarcopenia tests" },
]
note = "Gait speed at or below 0.8 m/s indicates severe sarcopenia (poor physical performance). Boundary is less-than-or-equal. Source kind: decision."

[[range]]
set = "awgs-2019"
kind = "warn"
high = 1.0
population = "Asian older adults (AWGS 2019 consensus); 6-m walk test"
evidence = "consensus"
citations = [
  { pmid = "32033882", doi = "10.1016/j.jamda.2019.12.012", url = "https://pubmed.ncbi.nlm.nih.gov/32033882/", title = "Asian Working Group for Sarcopenia: 2019 Consensus Update on Sarcopenia Diagnosis and Treatment.", locator = "Abstract, Results" },
]
note = "Low physical performance if 6-m walk speed is below 1.0 m/s (strict less-than boundary). Applies to the 6-m walk test. Source kind: decision."
