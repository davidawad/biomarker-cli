]
note = "Milder AAT deficiency band, as stated in the same 2026 narrative review: strictly above 0.57 g/L and strictly below 1.1 g/L. Source kind: diagnostic. Two-sided band stored as a reference range in its own set because it has no clinical reference range to orient it as a warn or critical cut point."
