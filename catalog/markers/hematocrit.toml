slug = "hematocrit"
name = "Hematocrit"
category = "cbc"
unit = "%"
description = "Percentage of whole blood volume occupied by red blood cells (packed cell volume). Low values indicate anemia; high values indicate erythrocytosis (for example polycythemia vera) or dehydration."
loinc = "4544-3"
aliases = ["hct", "haematocrit"]

[[range]]
set = "clinical"
kind = "reference"
low = 37.5
high = 51.0
when = { sex = "male" }
legacy = true

[[range]]
set = "clinical"
kind = "reference"
low = 34.0
high = 46.6
when = { sex = "female" }
legacy = true

[[range]]
set = "clinical"
kind = "reference"
low = 34.0
