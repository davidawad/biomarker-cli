description = "IgG antibody to varicella-zoster virus (VZV), measured by ELISA. Indicates prior varicella infection or vaccination. Reported against an assay cut-off as positive, borderline or negative. Expected result: positive."

[[range]]
set = "diagnostic"
kind = "warn"
high = 11
population = "Children and adults tested with EUROIMMUN anti-VZV IgG ELISA (Northern Lebanon cross-sectional study, n = 180, aged 1-18 years)"
evidence = "cohort"
citations = [
  { pmid = "41295539", doi = "10.3390/vaccines13111166", title = "Seroprevalence and Vaccination Determinants of Varicella Zoster Virus Among Pediatric and Adolescent Populations in Northern Lebanon.", locator = "2.3. Serological Testing" },
]
note = "Positive by the EUROIMMUN ELISA classification (>= 11 IU/mL). Assay-specific manufacturer criterion; not a general clinical cut-off. Source kind: diagnostic. Source band >= 11; stored as the warn high bound 11."

[[range]]
set = "clinical"
kind = "reference"
low = 8
high = 11
population = "Children and adults tested with EUROIMMUN anti-VZV IgG ELISA (Northern Lebanon cross-sectional study, n = 180, aged 1-18 years)"
evidence = "cohort"
citations = [
