[[range]]
set = "pcos-threshold-dewailly-2011"
kind = "warn"
high = 5
when = { sex = "female", conditions = ["pcos"] }
population = "Women referred for hyperandrogenism, menstrual disorders or infertility (n=240), single centre, France"
evidence = "cohort"
citations = [
  { pmid = "21926054", doi = "10.1093/humrep/der297", url = "https://pubmed.ncbi.nlm.nih.gov/21926054/", title = "Diagnosis of polycystic ovary syndrome (PCOS): revisiting the threshold values of follicle count on ultrasound and of the serum AMH level for the definition of polycystic ovaries.", locator = "Abstract, Conclusions" },
]
note = "Threshold for polycystic ovarian morphology/PCOS classification: AMH above 5 ng/mL (35 pmol/L) is the cut-off. The value is printed as a low bound because it is a 'greater than' decision threshold. The 2023 international PCOS guideline recognises AMH as an alternative to ultrasound for PCOM in adults but gives no numeric AMH cut-off, and says laboratories should use assay-specific cut-offs. Source kind: diagnostic. Source band >= 5; stored as the warn high bound 5."

