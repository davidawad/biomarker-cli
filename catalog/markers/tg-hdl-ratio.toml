slug = "tg-hdl-ratio"
name = "Triglyceride/HDL-C Ratio"
category = "lipid"
unit = "ratio"
description = "Ratio of fasting triglycerides to HDL cholesterol, used as a simple surrogate marker of insulin resistance and atherogenic dyslipidaemia. The numeric cut-off depends on the units of the two inputs (mg/dL-based or mmol/L-based ratios differ)."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "clinical"
kind = "warn"
high = 3.0
population = "Nondiabetic overweight adults (BMI 25 kg/m2 or greater) in a general clinical research center cohort (method: mg/dL-based)"
evidence = "cohort"
citations = [
  { pmid = "14623617", doi = "10.7326/0003-4819-139-10-200311180-00007", title = "Use of metabolic markers to identify overweight individuals who are insulin resistant.", locator = "Abstract (Results)" },
]
note = "Optimal cut-point for identifying insulin resistance (top tertile of insulin-mediated glucose disposal), mg/dL-based ratio. Derived from a cross-sectional ROC analysis, not an outcome study. Equivalent to 1.8 in SI units (mmol/L-based). Source band >= 3.0; stored as the warn high bound 3.0."

[[range]]
set = "clinical"
kind = "warn"
high = 0.89
when = { age = [13.0, 17.0], conditions = ["obesity"] }
population = "Adolescents aged 13-16 years with obesity (method: mmol/L-based)"
evidence = "cohort"
citations = [
  { pmid = "42650436", doi = "10.3390/children13081098", title = "Ratio That Reveals Risk: Defining TG:HDL-C Ratio Cutoff for Insulin Resistance in Adolescents with Obesity.", locator = "Abstract" },
]
note = "Youden-optimal cut-off for insulin resistance (HOMA-IR >= 4.0) in adolescents with obesity, mmol/L-based ratio. Cross-sectional ROC analysis in a single small sample (n = 215); not validated against outcomes and not a guideline threshold. Source band >= 0.89; stored as the warn high bound 0.89."

[[range]]
set = "tg-hdl-review-2024"
kind = "warn"
high = 3.5
population = "Overweight and obese adults, as cited in a 2024 review of the TG/HDL ratio"
evidence = "cohort"
citations = [
  { pmid = "39062066", doi = "10.3390/biomedicines12071493", url = "https://pubmed.ncbi.nlm.nih.gov/39062066/", title = "The Triglyceride/HDL Ratio as a Surrogate Biomarker for Insulin Resistance.", locator = "Introduction" },
]
note = "Insulin resistance cut-off of 3.5 (mg/dL units) as reported in the cited 2024 review. The review's sentence does not name the study year explicitly, so check the original McLaughlin paper before relying on the attribution. Source kind: decision. Source band >= 3.5; stored as the warn high bound 3.5."

[[range]]
set = "alt-1"
kind = "warn"
high = 2.0
population = "Non-Hispanic Black adults (ethnicity-specific cut-off)"
evidence = "cohort"
citations = [
  { pmid = "39062066", doi = "10.3390/biomedicines12071493", url = "https://pubmed.ncbi.nlm.nih.gov/39062066/", title = "The Triglyceride/HDL Ratio as a Surrogate Biomarker for Insulin Resistance.", locator = "Introduction" },
]
note = "Ethnicity-specific cut-off for non-Hispanic Black adults (2.0). Non-Hispanic White and Mexican American adults used 3.0 in the same comparison, as reported in the cited review. Applies only to: ethnicity=black. Source kind: decision. Source band >= 2.0; stored as the warn high bound 2.0. Alternative to the default tg-hdl-review-2024 warn range for the same population."

[[range]]
set = "iraqi-adults-2023"
kind = "warn"
high = 3.1
population = "Healthy Iraqi adults (single study, ROC best cut-off against insulin resistance)"
evidence = "cohort"
citations = [
  { pmid = "37520476", doi = "10.25122/jml-2022-0239", url = "https://pubmed.ncbi.nlm.nih.gov/37520476/", title = "Triglyceride/high-density lipoprotein ratio as a predictor for insulin resistance in a sample of healthy Iraqi adults.", locator = "Abstract, Results" },
]
note = "Study-derived best cut-off (Youden index) in one sample, not a guideline threshold. Sensitivity 83% and specificity 81%. Source kind: decision. Source band >= 3.1; stored as the warn high bound 3.1."
