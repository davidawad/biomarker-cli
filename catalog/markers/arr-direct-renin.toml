slug = "arr-direct-renin"
name = "Aldosterone/Renin Ratio (direct renin concentration)"
category = "adrenal"
unit = "ng/dL per mIU/L"
description = "Aldosterone (ng/dL) divided by direct renin concentration (mIU/L). Screening ratio for primary aldosteronism when renin is measured as a mass or activity-independent concentration rather than plasma renin activity."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "age-specific-arr-2026"
kind = "warn"
high = 2.4
when = { age = [0.0, 49.0] }
population = "Hypertensive patients: 281 with confirmed primary aldosteronism and 1242 with essential hypertension, screened by ARR"
evidence = "cohort"
citations = [
  { pmid = "41706428", doi = "10.1111/jch.70218", url = "https://pubmed.ncbi.nlm.nih.gov/41706428/", title = "Optimal Cut-Off Values of the Aldosterone-Renin Ratio in Different Age Groups for Primary Aldosteronism Screening.", locator = "Abstract, Results" },
]
note = "Recommended screening ARR for patients under 50 (unified cut-off, high sensitivity and specificity). Source expresses ARR as (ng/dL)/(mU/L), i.e. aldosterone in ng/dL and renin in mU/L; not converted to the canonical renin unit. Source kind: diagnostic. Source band >= 2.4; stored as the warn high bound 2.4."

[[range]]
set = "age-specific-arr-2026"
kind = "warn"
high = 3.7
when = { age = [50.0, 200] }
population = "Hypertensive patients: 281 with confirmed primary aldosteronism and 1242 with essential hypertension, screened by ARR"
evidence = "cohort"
citations = [
  { pmid = "41706428", doi = "10.1111/jch.70218", url = "https://pubmed.ncbi.nlm.nih.gov/41706428/", title = "Optimal Cut-Off Values of the Aldosterone-Renin Ratio in Different Age Groups for Primary Aldosteronism Screening.", locator = "Abstract, Results" },
]
note = "Recommended screening ARR for patients aged 50 or older. Source expresses ARR as (ng/dL)/(mU/L); not converted to the canonical renin unit. Source kind: diagnostic. Source band >= 3.7; stored as the warn high bound 3.7."

[[range]]
set = "china-sandwich-immunoassay-2026"
kind = "warn"
high = 1.1
population = "676 Chinese adults suspected of primary aldosteronism at seven centres (method: chemiluminescent sandwich immunoassay)"
evidence = "cohort"
citations = [
  { pmid = "42343549", doi = "10.1515/cclm-2026-0579", url = "https://pubmed.ncbi.nlm.nih.gov/42343549/", title = "New insights in primary aldosteronism diagnosis: a prospective multicenter study.", locator = "Abstract, Results" },
]
note = "ARR cut-off on a sandwich immunoassay (90% sensitivity, 62% specificity). Source unit ng/L per mU/L is not convertible to the canonical unit; assay-specific. Converted from the source's ng/L/mIU/L (11) to ng/dL per mIU/L using factor 0.1. Source kind: diagnostic. Source band >= 1.1; stored as the warn high bound 1.1."
