slug = "ankle-brachial-index"
name = "Ankle-Brachial Index"
category = "vitals"
unit = "ratio"
description = "Ratio of the systolic pressure at the ankle to the systolic brachial pressure, measured with a cuff and Doppler. It is the first-line physiological test for peripheral artery disease (PAD)."
aliases = ["abi", "ankle brachial pressure index", "ankle-brachial pressure index"]

[[range]]
set = "acc-aha-2024-pad"
kind = "warn"
low = 0.9
population = "Adults with suspected or known lower extremity peripheral artery disease, resting ABI in each leg"
evidence = "guideline"
citations = [
  { pmid = "38752899", doi = "10.1016/j.jacc.2024.02.013", url = "https://pubmed.ncbi.nlm.nih.gov/38752899/", title = "2024 ACC/AHA/AACVPR/APMA/ABC/SCAI/SVM/SVN/SVS/SIR/VESS Guideline for the Management of Lower Extremity Peripheral Artery Disease: A Report of the American College of Cardiology/American Heart Association Joint Committee on Clinical Practice Guidelines.", locator = "Full text, Diagnosis: resting ABI reporting statement" },
]
note = "Abnormal resting ABI (<=0.90, boundary inclusive); PAD is suspected at this level. Sensitivity is reduced in diabetes. Source kind: decision. Source band <= 0.9; stored as the warn low bound 0.9."

