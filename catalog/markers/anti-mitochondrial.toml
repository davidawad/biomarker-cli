slug = "anti-mitochondrial"
name = "Anti-Mitochondrial Antibody (AMA, M2)"
category = "autoimmune"
unit = "titer"
loinc = "49781-8"
description = "Serum autoantibody to mitochondrial antigens, mainly the M2 (E2 subunit) antigens of the 2-oxo-acid dehydrogenase complexes. Detected by indirect immunofluorescence (IIF, reported as a titer) or by M2-specific assays. Tracked as the principal serologic marker of primary biliary cholangitis (PBC). Expected result: negative. A positive result is diagnostic only together with cholestatic liver tests and liver histology."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "diagnostic"
kind = "warn"
high = 40
when = { conditions = ["primary-biliary-cholangitis"] }
population = "Adults with suspected primary biliary cholangitis (UK-PBC diagnostic criteria)"
evidence = "guideline"
citations = [
  { pmid = "29593060", doi = "10.1136/gutjnl-2017-315259", title = "The British Society of Gastroenterology/UK-PBC primary biliary cholangitis treatment and management guidelines.", locator = "Introduction (definite PBC criteria)" },
]
note = "Strictly above 1:40 (titre >1/40) is one of three criteria for definite PBC, together with cholestatic liver biochemistry and diagnostic or supportive liver histology. Source kind: diagnostic. Source band >= 40; stored as the warn high bound 40."

[[range]]
set = "diagnostic"
kind = "warn"
high = 40
when = { conditions = ["primary-biliary-cholangitis"] }
population = "Patients with PBC (n=79) and patients with other liver disease (n=108), tested by IIF on rat kidney/stomach and HEp2 substrates"
evidence = "cohort"
citations = [
  { pmid = "27864100", doi = "10.1016/j.cca.2016.11.021", title = "Clinical relevance of combined anti-mitochondrial M2 detection assays for primary biliary cirrhosis.", locator = "Abstract (Results)" },
]
note = "Single diagnostic-accuracy study: IIF-AMA cut-off titer 1:40 gave sensitivity 88.6% and specificity 87.0% for PBC. Source kind: diagnostic. Source band >= 40; stored as the warn high bound 40."

[[range]]
set = "alt-1"
kind = "warn"
high = 80
when = { conditions = ["primary-biliary-cholangitis"] }
population = "Patients with PBC (n=79) and patients with other liver disease (n=108), tested by IIF on rat kidney/stomach and HEp2 substrates"
evidence = "cohort"
citations = [
  { pmid = "27864100", doi = "10.1016/j.cca.2016.11.021", title = "Clinical relevance of combined anti-mitochondrial M2 detection assays for primary biliary cirrhosis.", locator = "Abstract (Results)" },
]
note = "Single diagnostic-accuracy study: IIF-AMA cut-off titer 1:80 improved specificity to 93.5% (sensitivity not stated in the quoted sentence). Source kind: diagnostic. Source band >= 80; stored as the warn high bound 80. Alternative to the default diagnostic warn range for the same population."
