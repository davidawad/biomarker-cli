description = "Genotype at the APOE gene (alleles e2, e3, e4) that determines apolipoprotein E isoform. The e4 allele is associated with higher LDL cholesterol and increased risk of late-onset Alzheimer disease; the e2 allele is associated with lower LDL cholesterol and dysbetalipoproteinemia risk. Tracked for cardiovascular and dementia risk assessment. Expected result: genotype reported as e3/e3 (most common), with e2 or e4 carriage as a risk modifier."
