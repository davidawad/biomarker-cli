slug = "copper"
name = "Copper, Serum"
category = "mineral"
unit = "µg/dL"
description = "Total serum copper. Most circulating copper is bound to ceruloplasmin, so serum copper tracks ceruloplasmin and is raised by acute-phase states. Reference limits depend on the laboratory assay and the population."

[[range]]
set = "clinical"
kind = "reference"
low = 30.0
high = 181.65
population = "Healthy adults, MASHAD cohort (Iran), total population; CLSI EP28 2.5-97.5 percentile limits"
evidence = "reference-interval-study"
citations = [
  { pmid = "34273186", doi = "10.1002/jcla.23897", title = "Age- and sex-specific reference intervals for superoxide dismutase enzyme and several minerals in a healthy adult cohort.", locator = "Results (reference interval table, total population)" },
  { pmid = "34273186", doi = "10.1002/jcla.23897", title = "Age- and sex-specific reference intervals for superoxide dismutase enzyme and several minerals in a healthy adult cohort.", locator = "Abstract (Results)" },
]
note = "Serum copper reference limits from a healthy Iranian adult cohort. The source found that sex partitioning was not required for copper (only magnesium was partitioned), so one interval is given. Limits are assay-specific. No pregnancy or oral-contraceptive interval was found in the sources checked."

