[[range]]
set = "adjust-pe"
kind = "reference"
high = 0.5
when = { age = [0.0, 50.0] }
population = "outpatients with suspected pulmonary embolism and non-high clinical probability in 19 centres (Belgium, France, the Netherlands, Switzerland)"
evidence = "cohort"
citations = [
  { pmid = "24643601", doi = "10.1001/jama.2014.2135", title = "Age-adjusted D-dimer cutoff levels to rule out pulmonary embolism: the ADJUST-PE study.", locator = "Abstract, Interventions" },
  { pmid = "24643601", doi = "10.1001/jama.2014.2135", title = "Age-adjusted D-dimer cutoff levels to rule out pulmonary embolism: the ADJUST-PE study.", locator = "Abstract, Objective" },
]
note = "Conventional fixed cutoff of 500 µg/L (0.5 µg/mL). The abstract does not state FEU; the FEU basis of the canonical unit is assumed. For patients 50 years or older an age-adjusted cutoff applies (age x 10 µg/L); it is a formula, not a fixed range, so it is not encoded as a range."

