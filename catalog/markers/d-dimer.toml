slug = "d-dimer"
name = "D-dimer"
category = "coagulation"
unit = "µg/mL FEU"
loinc = "48065-7"
description = "Fragment released when cross-linked fibrin is broken down by plasmin. A normal result helps exclude venous thromboembolism and pulmonary embolism in patients with low clinical probability; raised values are non-specific and increase with age, pregnancy and inflammation."

[[range]]
set = "clinical"
kind = "reference"
low = 0.169
high = 1.202
when = { pregnant = true, trimester = 1 }
population = "102 healthy pregnant women followed longitudinally through pregnancy (first trimester)"
evidence = "reference-interval-study"
citations = [
  { pmid = "29975107", doi = "10.1080/00365513.2018.1488177", title = "D-dimer during pregnancy: establishing trimester-specific reference intervals.", locator = "Abstract, Results" },
]
note = "CLSI-based 2.5th-97.5th percentiles, latex immunoturbidimetric assay on ACL 300 TOP. Quoted in ug/L and converted to ug/mL. FEU basis not stated in the abstract; the canonical unit is assumed to be FEU as for the other ranges."

