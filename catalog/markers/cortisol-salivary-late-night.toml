slug = "cortisol-salivary-late-night"
name = "Cortisol, Late-Night Salivary"
category = "adrenal"
unit = "ng/dL"
description = "Cortisol measured in saliva collected at bedtime or late evening. Loss of the normal circadian fall of cortisol makes it a sensitive screening test for Cushing's syndrome. Cut-offs differ widely by assay (immunoassay vs LC-MS/MS), so use the cut-off for your own method."

[[range]]
set = "bedtime-saliva-children-2021"
kind = "warn"
low = 8.7
when = { age = [4.0, 16.0] }
population = "320 healthy children aged 4-16 years (cut-off from the 97.5th percentile), validated in 54 children from an obesity clinic and 3 with pituitary Cushing syndrome (specimen: saliva; method: lc-ms/ms)"
evidence = "reference-interval-study"
citations = [
  { pmid = "33928203", doi = "10.1210/jendso/bvab033", url = "https://pubmed.ncbi.nlm.nih.gov/33928203/", title = "Bedtime Salivary Cortisol as a Screening Test for Cushing Syndrome in Children.", locator = "Abstract, Results" },
]
note = "Bedtime sample. Derived as 97.5th percentile in healthy children; age and sex-specific cut-offs were not needed in this study. Paediatric screening, single-centre. Converted from the source's nmol/L (2.4) to ng/dL using factor 3.625. Applies only to: time_of_day=late-night. Source kind: diagnostic."

