[[range]]
set = "ehjopen-2022-acs-0-1h"
kind = "warn"
high = 5
population = "Adults presenting to the emergency department or ambulatory emergency care with suspected acute coronary syndrome (setting: suspected-acute-mi; method: roche-cobas-8000)"
evidence = "cohort"
citations = [
  { pmid = "36032815", doi = "10.1093/ehjopen/oeac048", url = "https://pubmed.ncbi.nlm.nih.gov/36032815/", title = "Rapid risk stratification of acute coronary syndrome: adoption of an adapted European Society of Cardiology 0/1-hour troponin algorithm in a real-world setting.", locator = "Results, risk categories" },
]
note = "Adapted ESC 0/1-hour hs-cTnT algorithm, low-risk band: initial hs-cTnT below 5 ng/L (strict '<5') when chest pain onset was at least 3 h before presentation. Rule-out boundary is strict (<5 ng/L). Source kind: decision."

[[range]]
set = "alt-1"
kind = "warn"
low = 52
population = "Adults presenting to the emergency department or ambulatory emergency care with suspected acute coronary syndrome (setting: suspected-acute-mi; method: roche-cobas-8000)"
evidence = "cohort"
citations = [
  { pmid = "36032815", doi = "10.1093/ehjopen/oeac048", url = "https://pubmed.ncbi.nlm.nih.gov/36032815/", title = "Rapid risk stratification of acute coronary syndrome: adoption of an adapted European Society of Cardiology 0/1-hour troponin algorithm in a real-world setting.", locator = "Results, risk categories (Figure 1)" },
]
note = "Adapted ESC 0/1-hour hs-cTnT algorithm, high-risk ('ACS likely') band: initial hs-cTnT of 52 ng/L or more, inclusive (>=52). Concentrations between 5 and 51 ng/L require a 1-hour repeat (rule-in if delta >=5 ng/L). Source kind: decision. Alternative to the default ehjopen-2022-acs-0-1h warn range for the same population."

[[range]]
set = "ehjacc-2026-tnt-gen6-validation"
kind = "warn"
high = 3
population = "Adults presenting with suspected myocardial infarction in a single-centre cohort, with the ESC 0/1-hour algorithm logic applied to the predecessor Elecsys hs-cTnT Gen 5 assay (setting: suspected-acute-mi; method: elecsys-troponin-t-hs-gen5)"
evidence = "cohort"
citations = [
  { pmid = "42008514", doi = "10.1093/ehjacc/zuag044", url = "https://pubmed.ncbi.nlm.nih.gov/42008514/", title = "Diagnostic validation of a novel high-sensitivity cardiac troponin T assay.", locator = "Methods, Statistical analysis" },
]
note = "ESC 0/1-hour algorithm, 1-hour rule-out for Elecsys hs-cTnT Gen 5: absolute change below 3 ng/L (strict <3), with a baseline below 12 ng/L. The paper states this as the logic it applied to the Gen 5 assay for comparison; it is not the manufacturer's Gen 5 label. Source kind: decision."

[[range]]
set = "alt-2"
kind = "warn"
low = 5
population = "Adults presenting with suspected myocardial infarction in a single-centre cohort, with the ESC 0/1-hour algorithm logic applied to the predecessor Elecsys hs-cTnT Gen 5 assay (setting: suspected-acute-mi; method: elecsys-troponin-t-hs-gen5)"
evidence = "cohort"
citations = [
  { pmid = "42008514", doi = "10.1093/ehjacc/zuag044", url = "https://pubmed.ncbi.nlm.nih.gov/42008514/", title = "Diagnostic validation of a novel high-sensitivity cardiac troponin T assay.", locator = "Methods, Statistical analysis" },
]
note = "ESC 0/1-hour algorithm, 1-hour rule-in for Elecsys hs-cTnT Gen 5: absolute change of 5 ng/L or more (inclusive, >=5) at 1 hour. The paper gives this as the logic it applied to the Gen 5 assay. Source kind: decision. Alternative to the default ehjacc-2026-tnt-gen6-validation warn range for the same population."
