slug = "hs-troponin-t"
name = "High-Sensitivity Cardiac Troponin T"
category = "cardiac"
unit = "ng/L"
loinc = "67151-1"
description = "High-sensitivity cardiac troponin T, a protein released from injured heart muscle. Measured with a high-sensitivity assay it is used to rule acute myocardial infarction in or out, typically with a 0/1-hour algorithm, and to detect myocardial injury."
aliases = ["hs-ctnt", "hs-tnt", "troponin t high sensitivity"]

[[range]]
set = "clinical"
kind = "reference"
high = 14
population = "Healthy reference population used for the Roche cobas 8000 hs-cTnT assay (overall, not sex-specific)"
evidence = "reference-interval-study"
citations = [
  { pmid = "36032815", doi = "10.1093/ehjopen/oeac048", url = "https://pubmed.ncbi.nlm.nih.gov/36032815/", title = "Rapid risk stratification of acute coronary syndrome: adoption of an adapted European Society of Cardiology 0/1-hour troponin algorithm in a real-world setting.", locator = "Methods, assay description" },
]
note = "99th percentile upper reference limit (URL) for the Roche hs-cTnT assay as stated by the study. Values above the URL indicate myocardial injury; this single URL is not sex-specific."

[[range]]
set = "gen6-ref-tsix-2026"
kind = "reference"
high = 18
when = { sex = "female" }
population = "Healthy participants in the global REF-TSIX reference study, Elecsys hs-cTnT Gen 6 assay (method: elecsys-troponin-t-hs-gen6)"
evidence = "reference-interval-study"
citations = [
  { pmid = "41564003", doi = "10.1093/clinchem/hvag011", url = "https://pubmed.ncbi.nlm.nih.gov/41564003/", title = "Establishing Reference Values in Healthy Participants for the Cardiac Troponin T High-Sensitivity Gen 6 Assay: REF-TSIX Global Reference Study.", locator = "Abstract, Results" },
]
note = "Sex-specific 99th percentile upper reference limit for females on the Gen 6 assay (95% CI 16-23 ng/L). Applies only to the Gen 6 assay, not to the Roche Gen 5 URL of 14 ng/L."

[[range]]
