description = "Serum IgG antibody against mumps virus, measured by ELISA and reported as an assay-specific index or titer. Tracked to confirm immunity after mumps infection or MMR vaccination, and to check susceptibility before exposure. Expected result: positive (seropositive, immune); negative or equivocal results indicate possible lack of immunity."

