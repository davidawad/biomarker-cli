description = "Circulating oxidized low-density lipoprotein (ox-LDL), measured by immunoassay (monoclonal antibody 4E6 based) as a marker of LDL oxidation in atherosclerosis. No established reference interval was found in the sources retrieved; the cut-offs below come from single observational studies and define a 'high' group, not a normal range. Expected result: not stated by a published reference interval."
