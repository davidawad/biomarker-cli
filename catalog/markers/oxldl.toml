kind = "warn"
high = 19.0
population = "Well-functioning elderly adults in the Health, Aging, and Body Composition study (3,033 participants)"
evidence = "cohort"
citations = [
  { pmid = "15047623", doi = "10.2337/diabetes.53.4.1068", title = "The metabolic syndrome, circulating oxidized LDL, and risk of myocardial infarction in well-functioning elderly people in the health, aging, and body composition cohort.", locator = "Abstract (Results)" },
]
note = "High oxLDL group (above 1.90 mg/dL) used as an exposure group in a cohort analysis of the metabolic syndrome and CHD. Not a reference interval or guideline cut-off. Source unit mg/dl, kept as stated. Converted from the source's mg/dL (1.9) to mg/L using factor 10.0. Source band >= 19.0; stored as the warn high bound 19.0. Alternative to the default clinical warn range for the same population."
