slug = "tc-hdl-ratio"
name = "Total Cholesterol/HDL Ratio"
category = "lipid"
unit = "ratio"
description = "Total cholesterol divided by HDL cholesterol (Castelli risk index I). Higher values indicate a more atherogenic lipid profile."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "clinical"
kind = "warn"
high = 5
when = { sex = "male" }
population = "Adults; Spanish elderly workers cohort (cut-off as stated in the source)"
evidence = "consensus"
citations = [
  { pmid = "36384458", doi = "10.1186/s12877-022-03547-w", title = "Cardiometabolic profile of 15057 elderly Spanish workers: association of sociodemographic variables and tobacco consumption.", locator = "Methods (atherogenic indexes)" },
]
note = "Atherogenic ratio considered high in men when strictly above 5.0 (Castelli index), as stated by the cited study. Source band >= 5; stored as the warn high bound 5."

