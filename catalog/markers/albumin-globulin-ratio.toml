[[range]]
set = "clinical"
kind = "warn"
high = 0.8
population = "Adults admitted to a respiratory intensive care unit (critically ill)"
evidence = "cohort"
citations = [
  { pmid = "34484470", doi = "10.1155/2021/9965124", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC8413056/", title = "Albumin-Globulin Ratio Is an Independent Determinant of 28-Day Mortality in Patients with Critical Illness.", locator = "Abstract (Methods)" },
]
note = "AGR below 0.8 (low AGR group) was associated with higher 28-day mortality (HR 0.484 for medium and 0.332 for high AGR versus low). Single-centre cohort; association only."

[[range]]
set = "clinical"
kind = "warn"
high = 1.25
when = { conditions = ["peritoneal-dialysis"] }
population = "Incident patients on peritoneal dialysis (retrospective cohort, 2008-2017)"
evidence = "cohort"
citations = [
  { pmid = "32059708", doi = "10.1186/s12882-020-1707-1", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7023751/", title = "Albumin-globulin ratio and mortality in patients on peritoneal dialysis: a retrospective study.", locator = "Results" },
]
note = "AGR of 1.25 or less (lower AGR group) was associated with higher all-cause (HR 1.57) and cardiovascular mortality (HR 2.01). Association only; cut-off chosen by the authors' survival comparison."
