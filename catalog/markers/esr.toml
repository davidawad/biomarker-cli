kind = "reference"
low = 18
high = 48
when = { sex = "female", pregnant = true }
population = "1019 healthy pregnant women at routine antenatal visits, London (Westergren method), non-anaemic women; source reports the first half of pregnancy"
evidence = "reference-interval-study"
citations = [
  { pmid = "11762656", title = "Pregnancy and the erythrocyte sedimentation rate.", locator = "Abstract, Results" },
]
note = "Source gives first-half and second-half ranges without gestational weeks; the 20-week split is an approximation of half of a ~40-week pregnancy. Non-anaemic women only (anaemic women: 21-62 mm/h first half, 40-95 mm/h second half). 95% reference range. Applies only to: gestation_week_max=20."

