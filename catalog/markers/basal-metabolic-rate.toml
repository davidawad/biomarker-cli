description = "Energy the body uses at rest, in kilocalories per day. It is estimated from age, sex, height and weight with predictive equations, or measured by indirect calorimetry. Used to set energy needs for weight management. It is an individual estimate, not a population reference interval, so there is no normal range; expected result depends on the person's size, age and sex."
no_reference = "Computed or measured energy expenditure estimate with no published population reference interval; the value is individual, so no numeric normal range applies."
