population = "Asian men (ethnicity-specific central obesity cut-point for metabolic syndrome, as cited in a 2020 multi-ethnic Indonesian study)"
evidence = "consensus"
citations = [
  { pmid = "32513949", doi = "10.1038/s41387-020-0123-8", url = "https://pubmed.ncbi.nlm.nih.gov/32513949/", title = "Diagnosing metabolic syndrome in a multi-ethnic country: is an ethnic-specific cut-off point of waist circumference needed?", locator = "Introduction" },
]
note = "Ethnic-specific central obesity cut-point for men used in the metabolic syndrome definition. The number is taken from the 2020 study's description of the IDF definition, not from the IDF document itself. Boundary semantics are not stated in the quote. Applies only to: ethnicity=asian. Source kind: decision."

