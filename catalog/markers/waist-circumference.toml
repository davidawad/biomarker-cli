slug = "waist-circumference"
name = "Waist Circumference"
category = "body"
unit = "cm"
description = "Waist circumference measured at the level of the umbilicus or the midpoint between the lowest rib and the iliac crest. It is a measure of central (abdominal) adiposity and is used in metabolic syndrome criteria. Cut-offs differ by sex and ethnicity."
aliases = ["waist", "abdominal circumference", "wc"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "nhlbi-1998-obesity"
kind = "warn"
low = 102
when = { sex = "male" }
population = "Adults (NHLBI 1998 high-risk waist circumference cut-point)"
evidence = "guideline"
citations = [
  { url = "https://www.nhlbi.nih.gov/files/docs/guidelines/ob_gdlns.pdf", title = "Clinical Guidelines on the Identification, Evaluation, and Treatment of Overweight and Obesity in Adults: The Evidence Report", locator = "Risk classification by waist circumference (high-risk column)" },
]
note = "High-risk waist circumference for men: greater than 102 cm (boundary >). The NHLBI cut-point is sex-specific and was set for the guideline's risk classification. Source kind: decision."

