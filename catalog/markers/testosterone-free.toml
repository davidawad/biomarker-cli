evidence = "reference-interval-study"
citations = [
  { pmid = "36251328", doi = "10.1111/andr.13310", url = "https://pubmed.ncbi.nlm.nih.gov/36251328/", title = "Reference intervals for free testosterone in adult men measured using a standardized equilibrium dialysis procedure.", locator = "Conclusion" },
]
note = "Normative range in all men of the source population (percentile-based). Source gives both pg/ml and pmol/L; this entry uses the canonical pg/mL."

