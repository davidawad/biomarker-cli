slug = "testosterone-free"
name = "Testosterone, Free"
category = "hormone"
unit = "pg/mL"
description = "Unbound (free) testosterone in serum, measured by equilibrium dialysis or calculated from total testosterone and SHBG. Preferred when SHBG is altered or total testosterone is near the lower limit of normal."
loinc = "2991-8"
aliases = ["free testosterone", "ft"]

[[conversion]]
from = "pmol/L"
factor = 0.2884

[[range]]
set = "clinical"
kind = "reference"
low = 46.0
high = 224.0
when = { sex = "male" }
legacy = true

[[range]]
set = "clinical"
kind = "reference"
low = 0.0
high = 4.2
when = { sex = "female" }
legacy = true

[[range]]
set = "mft-age-strat-2026"
kind = "reference"
low = 53.07
high = 216.0
when = { sex = "male", age = [18.0, 39.0] }
population = "Healthy, nonobese (BMI under 30) men aged 18-39 from large community cohorts (1202 men), free testosterone by equilibrium dialysis with LC-MS/MS (method: equilibrium-dialysis)"
evidence = "reference-interval-study"
citations = [
  { pmid = "40929374", doi = "10.1210/clinem/dgaf507", url = "https://pubmed.ncbi.nlm.nih.gov/40929374/", title = "Age-Stratified Reference Ranges for Directly Measured Serum Free Testosterone in Community-Dwelling and Healthy Men.", locator = "Abstract, Results" },
]
note = "2.5th to 97.5th percentile (CLSI guidelines). Source unit is pmol/L; canonical here is pg/mL. Values are age-decline dependent (about -4.5 pmol/L per year). Converted from the source's pmol/L (184-749) to pg/mL using factor 0.2884."

