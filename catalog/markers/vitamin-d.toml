category = "vitamin"
unit = "ng/mL"
description = "Circulating 25-hydroxyvitamin D [25(OH)D], the main marker of vitamin D status from skin synthesis and diet. Low values indicate deficiency or insufficiency relative to bone health; very high values indicate risk of vitamin D toxicity with hypercalcemia."
