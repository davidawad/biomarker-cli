slug = "steps"
name = "Daily Step Count"
category = "wearable"
unit = "steps/day"
aliases = ["daily-steps"]
loinc = "55423-8"
description = "Number of steps taken per day, measured by a wearable or pedometer. Mortality risk falls as daily steps rise, with the benefit levelling off at a plateau that depends on age."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "paluch-2022-steps"
kind = "optimal"
low = 6000
high = 8000
when = { age = [60.0, 200] }
population = "Adults aged 60 years and older, pooled individual-participant data from 15 cohorts"
evidence = "cohort"
citations = [
  { pmid = "35247352", doi = "10.1016/S2468-2667(21)00302-9", url = "https://pubmed.ncbi.nlm.nih.gov/35247352/", title = "Daily steps and all-cause mortality: a meta-analysis of 15 international cohorts.", locator = "Abstract, Findings" },
]
note = "Plateau of the dose-response for all-cause mortality in adults aged 60 and older (restricted cubic splines, risk decreasing until this level). Not a sedentary cut-off."

[[range]]
set = "ding-2025-steps"
kind = "optimal"
low = 5000
high = 7000
population = "Adults (all ages pooled; the review notes no age-specific analysis)"
evidence = "cohort"
citations = [
  { pmid = "40713949", doi = "10.1016/S2468-2667(25)00164-1", url = "https://pubmed.ncbi.nlm.nih.gov/40713949/", title = "Daily steps and health outcomes in adults: a systematic review and dose-response meta-analysis.", locator = "Abstract, Findings" },
]
note = "Inflection point of the non-linear dose-response for all-cause mortality, cardiovascular disease incidence, dementia and falls ('around 5000-7000 steps per day'). Pooled across ages."
