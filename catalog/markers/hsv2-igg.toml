]
note = "Equivocal zone for the HerpeSelect HSV-2 ELISA (0.9 to 1.1), per the study's stated interpretation of the manufacturer's bands. Two-sided band stored as a reference range in its own set because it has no clinical reference range to orient it as a warn or critical cut point."

