description = "IgG antibody to herpes simplex virus type 2 (HSV-2), usually a gG2-based ELISA reported as a normalised optical density index. Tracked to establish past HSV-2 (genital herpes) infection, which is often asymptomatic. Expected result: negative (not detected) in most people without past HSV-2 infection."

