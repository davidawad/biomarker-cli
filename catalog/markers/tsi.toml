slug = "tsi"
name = "Thyroid Stimulating Immunoglobulin (TSI)"
category = "thyroid"
unit = "%"
loinc = "30567-2"
description = "Thyroid-stimulating immunoglobulin (TSI) bioassay: functional autoantibody that activates the TSH receptor, reported as a percentage of the assay reference. Tracked to diagnose Graves' disease, to predict relapse after antithyroid drug withdrawal, and to follow thyroid eye disease activity. No published healthy-population reference interval was verified; expected result in a person without Graves' disease is below the assay positivity cut-off."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "clinical"
kind = "warn"
high = 66.5
when = { conditions = ["graves-disease"] }
population = "Graves' disease patients after antithyroid drug withdrawal (single retrospective cohort, ROC analysis)"
evidence = "cohort"
citations = [
  { pmid = "35441120", doi = "10.1210/jendso/bvac023", title = "The Prediction Model Using Thyroid-stimulating Immunoglobulin Bioassay For Relapse of Graves' Disease.", locator = "Results (Clinical values of the TBII assay and the TSI bioassay)" },
]
note = "Relapse prediction cut-off from the cited study's ROC analysis (57.0% sensitivity, 60.9% specificity, AUC 0.557): weak discrimination, not recommended as a decision threshold. Source band >= 66.5; stored as the warn high bound 66.5."

[[range]]
set = "diagnostic"
kind = "warn"
high = 140
when = { conditions = ["thyroid-eye-disease"] }
population = "Patients with recent-onset symptomatic thyroid eye disease (single cohort, cited study); TSI result expressed as specimen-to-reference ratio"
evidence = "cohort"
citations = [
  { pmid = "38847819", doi = "10.1530/ETJ-23-0129", title = "Epidemiology of thyroid-stimulating immunoglobulin in recent-onset symptomatic thyroid eye disease.", locator = "Methods (TSI measurement)" },
]
note = "Positivity cut-off used by the cited study (result considered positive at or above 140%). Single-study classification, not a guideline cut-off. Source kind: diagnostic. Source band >= 140; stored as the warn high bound 140."
