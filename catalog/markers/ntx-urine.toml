slug = "ntx-urine"
name = "N-Telopeptide, Urine"
category = "bone"
unit = "nmol BCE/mmol creatinine"
description = "Fragment of type I collagen excreted in urine during bone resorption. Reported per mmol of creatinine to correct for urine concentration. Collect a second-void or fasting sample for comparability."

