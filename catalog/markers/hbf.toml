description = "Share of total haemoglobin present as fetal haemoglobin (HbF, alpha2 gamma2), measured by electrophoresis, HPLC or capillary methods. Tracked to assess hereditary persistence of fetal haemoglobin, thalassemia and other haemoglobinopathies. Expected result in healthy adults: within the reference interval, which is close to zero."

