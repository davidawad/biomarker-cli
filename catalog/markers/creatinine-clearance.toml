citations = [
  { pmid = "15149882", title = "Determination of reference intervals for serum creatinine, creatinine excretion and creatinine clearance with an enzymatic and a modified Jaffé method.", locator = "Abstract (Results)" },
]
note = "Enzymatic creatinine assay (Creatinine Plus). Reference interval for the entire group of healthy subjects, not stratified by sex (the source reports no sex difference)."

