slug = "reticulocyte-hemoglobin"
name = "Reticulocyte hemoglobin (Ret-He / CHr)"
category = "iron"
unit = "pg"
description = "Haemoglobin content of the reticulocyte population, measured on automated analysers (Ret-He on Sysmex, CHr on Siemens/Bayer). Low values indicate reduced iron supply to erythropoiesis (functional or absolute iron deficiency), and it is used to guide iron therapy, especially in CKD."

