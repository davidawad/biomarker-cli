slug = "matsuda-index"
name = "Matsuda Insulin Sensitivity Index"
category = "glycemic"
unit = "index"
description = "Whole-body insulin sensitivity index calculated from a 75 g oral glucose tolerance test: 10,000 divided by the square root of (fasting glucose x fasting insulin) x (mean glucose x mean insulin during the OGTT). Higher values mean greater insulin sensitivity. Correlated with the euglycemic clamp (r = 0.73) in the derivation study."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "diagnostic"
kind = "warn"
low = 5.0
population = "Caucasian rural adults with no previous evidence of diabetes or other dysglycemia, 75 g OGTT (n = 1156)"
evidence = "cohort"
citations = [
  { pmid = "16804799", doi = "10.1055/s-2006-924233", title = "Insulin sensitivity indices: a proposal of cut-off points for simple identification of insulin-resistant subjects.", locator = "Abstract (Results)" },
]
note = "Insulin resistance defined by the 25th percentile of ISI Matsuda in this single population (cut-off 5.0). A percentile cut-off from one study, not a reference interval. The source does not state whether a value of exactly 5.0 is included. Source kind: diagnostic. Source band <= 5.0; stored as the warn low bound 5.0."
