slug = "hepcidin"
name = "Hepcidin-25"
category = "iron"
unit = "ng/mL"
loinc = "71386-7"
description = "Iron-regulatory hormone measured in serum. No verified population reference interval was found in the sources checked; the cited values are diagnostic cut-offs for iron deficiency anemia from one Indian cohort, where a hepcidin value at or below the cut-off indicates high likelihood of iron deficiency anemia."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "diagnostic"
kind = "warn"
low = 6.8
when = { conditions = ["iron-deficiency-anemia"] }
population = "Community-dwelling Indian preschool children with and without iron deficiency anemia"
evidence = "cohort"
citations = [
  { pmid = "30093400", doi = "10.3324/haematol.2018.193243", title = "Optimizing diagnostic biomarkers of iron deficiency anemia in community-dwelling Indian women and preschool children.", locator = "Abstract (Results)" },
]
note = "Iron deficiency anemia, high diagnostic likelihood (likelihood ratio 14.3): hepcidin at or below 6.8 ng/mL. Source kind: diagnostic. Source band <= 6.8; stored as the warn low bound 6.8."

