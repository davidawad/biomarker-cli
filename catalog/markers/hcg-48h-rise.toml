set = "alt-1"
kind = "warn"
high = 40
when = { pregnant = true, trimester = 1 }
population = "Viable intrauterine pregnancies after assisted conception; minimum 48-hour hCG rise quoted from prior literature"
evidence = "consensus"
citations = [
  { pmid = "34223284", doi = "10.1016/j.xfre.2020.11.006", url = "https://pubmed.ncbi.nlm.nih.gov/34223284/", title = "Abnormal rate of human chorionic gonadotropin rise: a case series of patients with viable intrauterine pregnancies after embryo transfer.", locator = "Discussion" },
]
note = "Lowest expected 48-hour percentage rise in a viable intrauterine pregnancy when the initial hCG is 1,500 to 3,000 mIU/mL. Quoted by the source from earlier work. Applies only to: markers=[{\"slug\": \"hcg-quantitative\", \"op\": \">=\", \"value\": 1500, \"unit\": \"mIU/mL\"}, {\"slug\": \"hcg-quantitative\", \"op\": \"<=\", \"value\": 3000, \"unit\": \"mIU/mL\"}]. Source kind: diagnostic. Source band >= 40; stored as the warn high bound 40. Alternative to the default hcg-48h-rise-case-series-2021 warn range for the same population."

