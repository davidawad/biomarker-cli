slug = "leucine"
name = "Leucine"
category = "amino-acid"
unit = "µmol/L"
description = "Plasma concentration of the branched-chain amino acid leucine. In maple syrup urine disease (MSUD) it accumulates and is the main treatment target; high values can cause encephalopathy and risk metabolic crisis."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

