slug = "beta-2-microglobulin"
name = "Beta-2 Microglobulin"
category = "tumour"
unit = "mg/L"
loinc = "1952-1"
description = "Beta-2 microglobulin, a small protein on the surface of most cells that is released into blood. It is cleared by the kidneys, so it rises with reduced kidney function, and in multiple myeloma and some lymphomas it is used for prognostic staging."
aliases = ["b2m", "beta2-microglobulin", "β2-microglobulin", "beta-2 microglobulin"]

[[range]]
set = "clinical"
kind = "reference"
low = 1.02
high = 2.46
when = { age = [29.0, 50.0] }
population = "Healthy blood donors aged 29-49 years (immunonephelometry)"
evidence = "reference-interval-study"
citations = [
  { pmid = "19397485", doi = "10.1515/CCLM.2009.137", url = "https://pubmed.ncbi.nlm.nih.gov/19397485/", title = "Serum beta2-microglobulin measured by immunonephelometry: expression patterns and reference intervals in healthy adults.", locator = "Abstract, Results" },
]
note = "Non-parametric reference interval for younger adults, measured by immunonephelometry in 183 healthy blood donors aged 29-75 years. Method-specific; the upper limit rises with age (see the 50-75 year band)."

[[range]]
set = "b2m-healthy-adults-2009"
kind = "reference"
