slug = "qtc"
name = "QTc Interval"
category = "cardiac"
unit = "ms"
loinc = "8636-3"
description = "Heart-rate-corrected QT interval from a 12-lead ECG. Used to screen for QT prolongation, which raises risk of torsades de pointes with some drugs and electrolyte disturbances. Ranges are age- and sex-specific upper limits; values above the limit indicate prolonged QTc."

[[range]]
set = "clinical"
kind = "reference"
high = 430
when = { sex = "male", age = [0.0, 40.0] }
population = "Healthy adults and adolescents aged 5-89 years (study of 57,595 persons); men under 40 years"
evidence = "cohort"
citations = [
  { pmid = "24825030", doi = "10.1016/j.ijcard.2014.04.133", title = "New age- and sex-specific criteria for QT prolongation based on rate correction formulas that minimize bias at the upper normal limits.", locator = "Abstract (Results/Conclusions)" },
]
note = "Upper normal limit for QTc (criterion for prolonged QTc in men under 40). Study used rate formulas QTcMod / QTcLogLin."

