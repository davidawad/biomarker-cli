slug = "nt-probnp"
name = "NT-proBNP"
category = "cardiac"
unit = "pg/mL"
loinc = "33762-6"
description = "N-terminal pro-B-type natriuretic peptide, released by the heart in response to wall stress. It is used to help diagnose or rule out heart failure, with cut-offs that depend on age, setting and kidney function."
aliases = ["nt-pro-bnp", "n-terminal pro-bnp", "ntprobnp"]

[[range]]
set = "hf-guideline-review-2026"
kind = "warn"
low = 125
population = "Adults assessed for suspected heart failure in the community (non-acute setting) (setting: ambulatory)"
evidence = "guideline"
citations = [
  { pmid = "41778370", doi = "10.1093/ehjqcco/qcag029", url = "https://pubmed.ncbi.nlm.nih.gov/41778370/", title = "Heart failure with reduced ejection fraction: a systematic review of clinical practice guidelines and recommendations.", locator = "Full text, guideline diagnostic criteria table" },
]
note = "Community (non-acute) heart failure diagnostic criterion: NT-proBNP at or above 125 pg/mL (boundary inclusive). Values below this are used to argue against heart failure in the non-acute setting. Criteria are as tabulated in a systematic review of HF guideline recommendations. Source kind: decision."

[[range]]
set = "alt-1"
kind = "warn"
low = 300
population = "Adults presenting to the emergency department with acute dyspnoea (setting: acute-dyspnoea)"
evidence = "guideline"
citations = [
  { pmid = "41778370", doi = "10.1093/ehjqcco/qcag029", url = "https://pubmed.ncbi.nlm.nih.gov/41778370/", title = "Heart failure with reduced ejection fraction: a systematic review of clinical practice guidelines and recommendations.", locator = "Full text, guideline diagnostic criteria table" },
]
note = "Emergency-setting heart failure diagnostic criterion: NT-proBNP at or above 300 pg/mL (boundary inclusive). Below 300 pg/mL, acute heart failure is unlikely in the emergency setting (see the rule-out range). Source kind: decision. Alternative to the default hf-guideline-review-2026 warn range for the same population."

