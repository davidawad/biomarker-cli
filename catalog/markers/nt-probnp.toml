]
note = "Age- and sex-specific 97.5th percentile upper reference limit for NT-proBNP in healthy US men aged 50 to 59. Values are reported in ng/L, numerically equal to pg/mL for this marker. Converted from the source's ng/L (225) to pg/mL using factor 1."

