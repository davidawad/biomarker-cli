  { pmid = "38923835", doi = "10.1002/ehf2.14894", url = "https://pubmed.ncbi.nlm.nih.gov/38923835/", title = "Setting the optimal threshold of NT-proBNP and BNP for the diagnosis of heart failure in patients over 75 years.", locator = "Abstract, Methods" },
]
note = "Subgroup rule-in threshold for acute heart failure in older patients with severely reduced kidney function (eGFR below 30 mL/min). Threshold reported with a 90% PPV; derived in a single multicentre cohort and not a general guideline value. Applies only to: markers={\"egfr\": \"<30\"}. Source kind: decision."

