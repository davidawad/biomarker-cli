note = "Age-stratified rule-in cut-off for acute heart failure, age 75 years or older (boundary inclusive, >=1800). A 2024 APHP cohort in patients aged 75 or older reports a PPV-based threshold of 1748 pg/mL, and a higher 2235 pg/mL threshold over age 85; co-morbidities (CKD, obesity, atrial fibrillation) shift results. Source kind: decision."
