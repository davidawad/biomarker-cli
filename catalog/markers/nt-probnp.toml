  { pmid = "38923835", doi = "10.1002/ehf2.14894", url = "https://pubmed.ncbi.nlm.nih.gov/38923835/", title = "Setting the optimal threshold of NT-proBNP and BNP for the diagnosis of heart failure in patients over 75 years.", locator = "Abstract, Methods" },
