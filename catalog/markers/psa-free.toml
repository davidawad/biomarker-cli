slug = "psa-free"
name = "Free PSA"
category = "tumor-marker"
unit = "%"
loinc = "10886-0"
description = "Free PSA, reported as the percentage of free to total PSA, used with total PSA to assess prostate cancer risk and biopsy need. Expected result: a percentage where lower values carry higher risk; a percentage cut-off applies to men with total PSA in the cited range."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "clinical"
kind = "warn"
low = 25
when = { conditions = ["suspected-prostate-cancer"] }
population = "Men aged 50 to 75 years with total PSA 4.0 to 10.0 ng/mL and a palpably benign prostate gland (cohort in the cited study)"
evidence = "cohort"
citations = [
  { pmid = "9605898", doi = "10.1001/jama.279.19.1542", title = "Use of the percentage of free prostate-specific antigen to enhance differentiation of prostate cancer from benign prostatic disease: a prospective multicenter clinical trial.", locator = "Abstract, Conclusions" },
]
note = "Biopsy cut-off as recommended by the source: 25% or less free PSA (strictly at or below 25). Source band <= 25; stored as the warn low bound 25."
