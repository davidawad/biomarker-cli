evidence = "consensus"
citations = [
  { pmid = "41835114", doi = "10.2147/JIR.S546322", url = "https://pubmed.ncbi.nlm.nih.gov/41835114/", title = "Asthma and Allergic Bronchopulmonary Aspergillosis: Understanding, Insights, and State-of-the-Art.", locator = "Full text, ABPA diagnosis section" },
]
note = "Diagnostic criterion for ABPA: total IgE at or above 500 IU/mL (rule-in, together with fungal sensitisation and other features). The same review also says a level above 500 IU/mL is considered positive, and that lower levels may be acceptable with other supportive features. Cited as a summary of guideline criteria; the primary ISHAM document was not retrieved. Converted from the source's IU/mL (500) to kU/L using factor 1. Source kind: decision."

