note = "Japanese diagnostic criterion for ABPA/ABPM: elevated total serum IgE at or above 417 IU/mL, one of ten criteria (at least six needed). The number is the study's disease-specific cut-off. Converted from the source's IU/mL (417) to kU/L using factor 1. Source kind: decision."
