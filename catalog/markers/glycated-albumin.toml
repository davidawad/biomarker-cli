slug = "glycated-albumin"
name = "Glycated Albumin"
category = "glycemic"
unit = "%"
description = "Glycated albumin reflects average glycaemia over about 2-3 weeks. Reference intervals and diabetes cut-offs come from population studies and are not standardised across assays or ethnic groups."

[[range]]
set = "clinical"
kind = "reference"
low = 10.0
high = 13.3
when = { sex = "female", pregnant = false }
population = "Non-pregnant Euro-Brazilian women (adult cohort, mean age 43.5 years, n=290)"
evidence = "reference-interval-study"
citations = [
  { pmid = "39767558", doi = "10.3390/biomedicines12122651", title = "Reference Interval for Glycated Albumin, 1,5-AG/GA, and GA/HbA1c Ratios and Cut-Off Values for Type 1, Type 2, and Gestational Diabetes: A Cross-Sectional Study.", locator = "Abstract, Results" },
]
note = "Reference interval, non-pregnant (ref. 39767558 reports it for non-pregnant women)."

