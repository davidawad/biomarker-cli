slug = "rdw"
name = "Red Cell Distribution Width"
category = "cbc"
unit = "%"
description = "Coefficient of variation of red cell size (RDW-CV). A high RDW means mixed cell sizes, as in early iron, B12 or folate deficiency, recent bleeding or transfusion; it also rises with age."
