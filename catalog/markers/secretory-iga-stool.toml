slug = "secretory-iga-stool"
name = "Secretory IgA, Stool"
category = "stool"
unit = "ug/mL"
description = "Secretory immunoglobulin A in stool, a marker of mucosal immune barrier function in the gut. Measured by ELISA on a stool extract; results are assay specific and reported as concentration of the extract (ug/mL in the ImmuChrom kit used in the cited study). Reduced values are read as subnormal, high values as elevated."

