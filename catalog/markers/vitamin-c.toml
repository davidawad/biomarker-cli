slug = "vitamin-c"
name = "Vitamin C (ascorbic acid)"
category = "vitamin"
unit = "mg/dL"
description = "Ascorbic acid (vitamin C) concentration in serum or plasma, a measure of recent intake. Low values indicate deficiency (scurvy risk) or depletion; smoking markedly lowers levels."

[[range]]
set = "ajcn-2009-nhanes-2003-2004"
kind = "warn"
low = 0.2008
population = "US civilians aged 6 years and older, NHANES 2003-2004 (serum vitamin C); the 11.4 µmol/L cut-off is the NHANES III deficiency definition (specimen: serum)"
evidence = "reference-interval-study"
citations = [
  { pmid = "19675106", doi = "10.3945/ajcn.2008.27016", title = "Serum vitamin C and the prevalence of vitamin C deficiency in the United States: 2003-2004 National Health and Nutrition Examination Survey (NHANES).", locator = "Background" },
]
note = "Deficiency below 11.4 µmol/L (about 0.20 mg/dL). Overall deficiency prevalence was 7.1% in NHANES 2003-2004 and adult smokers had about one-third lower concentrations than nonsmokers. Source kind: deficient. Source band <= 0.2008; stored as the warn low bound 0.2008."

