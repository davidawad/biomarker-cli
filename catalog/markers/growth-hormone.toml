slug = "growth-hormone"
name = "Growth Hormone"
category = "pituitary"
unit = "ng/mL"
description = "Pituitary hormone secreted in pulses that drives growth and IGF-1 production. Random levels are not diagnostic: acromegaly is assessed by GH suppression during an oral glucose load, and GH deficiency by peak GH after a stimulation test, with cut-offs that depend on the assay, test, BMI and age."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "jcem-acromegaly-diagnosis-2026"
kind = "warn"
high = 0.4
when = { conditions = ["suspected-acromegaly"] }
population = "Adults with suspected acromegaly (clinical review) (test: oral glucose tolerance test, GH nadir with an ultrasensitive assay)"
evidence = "consensus"
citations = [
  { pmid = "42056759", doi = "10.1210/clinem/dgag189", url = "https://pubmed.ncbi.nlm.nih.gov/42056759/", title = "Acromegaly diagnosis.", locator = "Text, OGTT section" },
]
note = "GH nadir below this value during an OGTT is a normal response when an ultrasensitive assay is used; higher nadirs are non-suppressive. Assay-dependent. Converted from the source's µg/L (0.4) to ng/mL using factor 1. Source kind: diagnostic."

[[range]]
set = "endocrine-society-2014"
kind = "warn"
high = 1.0
when = { conditions = ["suspected-acromegaly"] }
population = "Adults with suspected acromegaly (test: oral glucose tolerance test, GH nadir)"
evidence = "consensus"
citations = [
  { pmid = "42056759", doi = "10.1210/clinem/dgag189", url = "https://pubmed.ncbi.nlm.nih.gov/42056759/", title = "Acromegaly diagnosis.", locator = "Text, OGTT section" },
]
note = "Older GH nadir threshold (1 ug/L) as quoted by the 2026 review, which describes it as superseded for ultrasensitive assays. Taken from that review's summary; the 2014 guideline text itself was not retrieved. Converted from the source's µg/L (1) to ng/mL using factor 1. Source kind: diagnostic."

[[range]]
set = "aace-2019"
kind = "warn"
high = 1.0
when = { conditions = ["obesity"] }
population = "Adults with suspected GH deficiency and obesity (BMI above 30 kg/m2) (test: glucagon stimulation test)"
evidence = "consensus"
citations = [
  { pmid = "41521526", doi = "10.1210/clinem/dgaf674", url = "https://pubmed.ncbi.nlm.nih.gov/41521526/", title = "GH Response to Glucagon in Transition: Role of Body Mass Index and Etiology in Childhood-onset GH Deficiency.", locator = "Introduction" },
]
note = "Obesity-specific glucagon peak cut-point as summarized in a 2026 childhood-onset GHD study (41521526); the primary AACE 2019 text was not retrievable, so verify against the guideline before clinical use. Converted from the source's µg/L (1) to ng/mL using factor 1. Source kind: diagnostic."

[[range]]
set = "national-ghd-criteria"
kind = "warn"
high = 8.0
when = { age = [0.0, 18.0] }
population = "Children and adolescents with suspected childhood-onset GH deficiency (test: insulin tolerance test, arginine or glucagon stimulation on two separate days)"
evidence = "consensus"
citations = [
  { pmid = "41521526", doi = "10.1210/clinem/dgaf674", url = "https://pubmed.ncbi.nlm.nih.gov/41521526/", title = "GH Response to Glucagon in Transition: Role of Body Mass Index and Etiology in Childhood-onset GH Deficiency.", locator = "Results, GHD diagnosis" },
]
note = "Current peak GH cut-off (less than 8 ug/L) used for confirming childhood GHD, from national recommendations as described in a 2026 study. Two separate stimulation tests are required. Converted from the source's µg/L (8) to ng/mL using factor 1. Source kind: diagnostic."

[[range]]
set = "alt-1"
kind = "warn"
high = 10.0
when = { age = [0.0, 18.0] }
population = "Children and adolescents with suspected childhood-onset GH deficiency (test: insulin tolerance test, arginine or glucagon stimulation on two separate days)"
evidence = "consensus"
citations = [
  { pmid = "41521526", doi = "10.1210/clinem/dgaf674", url = "https://pubmed.ncbi.nlm.nih.gov/41521526/", title = "GH Response to Glucagon in Transition: Role of Body Mass Index and Etiology in Childhood-onset GH Deficiency.", locator = "Results, GHD diagnosis" },
]
note = "Historical national cut-off (below 10 ug/L) used until 2014, superseded by 8 ug/L per the same study. Retained for reference only. Converted from the source's µg/L (10) to ng/mL using factor 1. Source kind: diagnostic. Alternative to the default national-ghd-criteria warn range for the same population."

[[range]]
set = "fda-macimorelin"
kind = "warn"
high = 2.8
population = "Adults undergoing macimorelin stimulation testing (retrospective single-centre cohort, n=37) (test: macimorelin oral stimulation test)"
evidence = "cohort"
citations = [
