population = "10,472 parturient women (women at delivery) in one laboratory, age-specific intervals pooled"
evidence = "reference-interval-study"
citations = [
  { pmid = "30934105", doi = "10.1055/s-0039-1683932", title = "Age-Specific Reference Intervals for PT, aPTT, Fibrinogen and Thrombin Time for Parturient Women.", locator = "Abstract, Results" },
]
note = "Reference interval calculated per CLSI C28-A3 on an ACL TOP 700 analyser. Pooled across age groups."

