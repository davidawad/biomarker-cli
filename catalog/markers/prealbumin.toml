set = "clinical"
kind = "warn"
high = 20.0
when = { conditions = ["al-amyloidosis"] }
population = "Outpatients with systemic immunoglobulin light-chain (AL) amyloidosis; serum prealbumin"
evidence = "cohort"
citations = [
  { pmid = "16469994", title = "Nutritional status of outpatients with systemic immunoglobulin light-chain amyloidosis 1.", locator = "Abstract (Results)" },
]
note = "Lower reference limit as stated by the authors of this single cohort study (values below it are reported as below the lower reference limit). Not a healthy-population reference interval. Converted from the source's mg/L (200) to mg/dL using factor 0.1. Source band >= 20.0; stored as the warn high bound 20.0."
