slug = "renin-activity"
name = "Plasma Renin Activity"
category = "adrenal"
unit = "ng/mL/h"
description = "Measure of the enzymatic generation of angiotensin I by renin in plasma. Low (suppressed) renin with high aldosterone points to primary aldosteronism; renin is also monitored during mineralocorticoid receptor antagonist therapy."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "endocrine-society-2025"
kind = "warn"
low = 1
population = "Adults screened for primary aldosteronism; PRA and PAC by LC-MS/MS (Endocrine Society 2025 criteria as summarised in a 2026 analysis) (method: lc-ms/ms)"
evidence = "consensus"
citations = [
  { pmid = "42751802", doi = "10.1161/HYPERTENSIONAHA.126.27634", url = "https://pubmed.ncbi.nlm.nih.gov/42751802/", title = "Evaluation of Current Screening Thresholds for the Detection of Primary Aldosteronism.", locator = "Abstract, Background" },
]
note = "Suppressed renin for screening: PRA at or below 1 ng/mL/h, applied together with PAC at or above 7.5 ng/dL and ARR above 15. Applies only to: markers=[{\"slug\": \"aldosterone\", \"op\": \">=\", \"value\": 7.5, \"unit\": \"ng/dL\"}]. Source kind: diagnostic. Source band <= 1; stored as the warn low bound 1."

[[range]]
set = "renin-status-outcomes-2025"
kind = "optimal"
high = 1.0
population = "Adults with primary aldosteronism on medical treatment with mineralocorticoid receptor antagonists (24 studies, 6621 patients)"
evidence = "cohort"
citations = [
  { pmid = "41235994", doi = "10.1016/S2213-8587(25)00263-3", url = "https://pubmed.ncbi.nlm.nih.gov/41235994/", title = "Post-treatment renin status and cardiovascular, renal, and mortality outcomes in medically treated primary aldosteronism: a systematic review and meta-analysis.", locator = "Abstract, Findings" },
]
note = "Renin cut-off used in most studies to classify post-treatment renin as suppressed (below) or unsuppressed (at or above). Unsuppressed renin was associated with fewer cardiovascular events; the authors suggest renin normalisation as a possible treatment target, which prospective trials still need to confirm. Applies only to: on_treatment=mineralocorticoid receptor antagonist. Source kind: target."
