slug = "bone-alp"
name = "Bone-Specific Alkaline Phosphatase"
category = "bone"
unit = "µg/L"
description = "Enzyme made by osteoblasts and a marker of bone formation. Used alongside other bone turnover markers, and is one of the reference markers for chronic kidney disease-associated osteoporosis."

