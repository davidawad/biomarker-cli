slug = "fib4"
name = "FIB-4 Index"
category = "liver"
unit = "ratio"
aliases = ["fib-4"]
description = "FIB-4 is a blood-based score (age, AST, ALT, platelets) used to stratify risk of advanced liver fibrosis in people with MASLD or other chronic liver disease. Low-risk and high-risk cut-offs are applied to rule out or rule in advanced fibrosis before imaging."

[[range]]
set = "aasld-2023-nafld"
kind = "warn"
high = 2.67
population = "Adults with NAFLD (MASLD) and hepatic steatosis or metabolic risk factors, in the general hepatology and primary-care setting"
evidence = "guideline"
citations = [
  { pmid = "36727674", doi = "10.1097/HEP.0000000000000323", url = "https://pubmed.ncbi.nlm.nih.gov/36727674/", title = "AASLD Practice Guidance on the clinical assessment and management of nonalcoholic fatty liver disease.", locator = "Full text, Section on secondary risk assessment and referral" },
  { pmid = "36727674", doi = "10.1097/HEP.0000000000000323", url = "https://pubmed.ncbi.nlm.nih.gov/36727674/", title = "AASLD Practice Guidance on the clinical assessment and management of nonalcoholic fatty liver disease.", locator = "Full text, Section on FIB-4 status change" },
]
note = "High-risk band: FIB-4 above 2.67 (boundary > 2.67) warrants direct referral to gastroenterology/hepatology for clinically significant fibrosis. Intermediate band is 1.3 to 2.67. Guidance notes FIB-4 cut-offs in T2DM may change with more data. Source kind: decision. Source band >= 2.67; stored as the warn high bound 2.67."

[[range]]
set = "clinical"
kind = "reference"
high = 1.3
population = "Adults with chronic liver disease or metabolic dysfunction-associated steatotic liver disease (MASLD)"
evidence = "cohort"
citations = [
  { pmid = "38188279", doi = "10.1016/j.lanepe.2023.100780", title = "Prognostic utility of Fibrosis-4 Index for risk of subsequent liver and cardiovascular events, and all-cause mortality in individuals with obesity and/or type 2 diabetes: a longitudinal cohort study.", locator = "Abstract (Results)" },
]
note = "Low risk of advanced fibrosis (FIB-4 below 1.30; 2.0 applies instead of 1.3 at age 65 and above)."

[[range]]
set = "clinical"
kind = "warn"
high = 2.67
population = "Adults with chronic liver disease or metabolic dysfunction-associated steatotic liver disease (MASLD)"
evidence = "cohort"
citations = [
  { pmid = "38188279", doi = "10.1016/j.lanepe.2023.100780", title = "Prognostic utility of Fibrosis-4 Index for risk of subsequent liver and cardiovascular events, and all-cause mortality in individuals with obesity and/or type 2 diabetes: a longitudinal cohort study.", locator = "Abstract (Results)" },
]
note = "Indeterminate risk: further assessment (elastography) is advised. Cut-offs as stated in the cohort study; age 65 and above uses 2.0 as the lower bound. Source band 1.3-2.67; stored as the warn high bound 2.67."

[[range]]
set = "clinical"
kind = "reference"
high = 2.0
when = { age = [65.0, 200] }
population = "Adults aged 65 years and older with non-alcoholic fatty liver disease"
evidence = "cohort"
citations = [
  { pmid = "27725647", doi = "10.1038/ajg.2016.453", title = "Age as a Confounding Factor for the Accurate Non-Invasive Diagnosis of Advanced NAFLD Fibrosis.", locator = "Abstract (Results)" },
]
note = "Age-adjusted lower (rule-out) cut-off for people aged 65 and over: FIB-4 below 2.0 indicates low risk of advanced fibrosis, replacing 1.3, which had unacceptably low specificity (35%) at this age; 2.0 raised specificity to 70% with 77% sensitivity."

[[range]]
set = "diagnostic"
kind = "warn"
high = 2.67
population = "Adults with chronic liver disease or metabolic dysfunction-associated steatotic liver disease (MASLD)"
evidence = "cohort"
citations = [
  { pmid = "38188279", doi = "10.1016/j.lanepe.2023.100780", title = "Prognostic utility of Fibrosis-4 Index for risk of subsequent liver and cardiovascular events, and all-cause mortality in individuals with obesity and/or type 2 diabetes: a longitudinal cohort study.", locator = "Abstract (Results)" },
]
note = "High risk of advanced fibrosis (FIB-4 above 2.67) in the cited cohort; a liver-events risk category, not a diagnosis of cirrhosis. Source kind: diagnostic. Source band >= 2.67; stored as the warn high bound 2.67."

[[range]]
set = "mcpherson-2017"
kind = "warn"
low = 1.3
population = "Adults with biopsy-proven NAFLD aged 35-65 (established cut-offs)"
evidence = "cohort"
citations = [
  { pmid = "27725647", doi = "10.1038/ajg.2016.453", url = "https://pubmed.ncbi.nlm.nih.gov/27725647/", title = "Age as a Confounding Factor for the Accurate Non-Invasive Diagnosis of Advanced NAFLD Fibrosis.", locator = "Results, established cut-offs" },
]
note = "Low risk: a score below 1.3 is used to exclude advanced fibrosis (F3-F4). The paper states the score is not suitable for patients aged under 35. Source kind: decision. Source band <= 1.3; stored as the warn low bound 1.3."

[[range]]
