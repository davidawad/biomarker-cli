]
note = "Indeterminate band between the original cut-offs 1.45 and 3.25; about 71% of the validation group could avoid biopsy outside this band. Source band 1.45-3.25; stored as the warn high bound 3.25. Alternative to the default sterling-2006 warn range for the same population."

