]
note = "Original index cut-off: below 1.45 excludes advanced fibrosis (stage 4-6) with 90% NPV in the validation set. These are not the age-adjusted guideline cut-offs. Source kind: decision. Source band <= 1.45; stored as the warn low bound 1.45."

