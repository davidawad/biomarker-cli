slug = "nocturnal-spo2"
name = "Nocturnal SpO2"
category = "wearable"
unit = "%"
description = "Nocturnal SpO2. Tracked marker with no verified reference range yet, so values can be stored and charted but are not flagged against a range."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "diagnostic"
kind = "warn"
low = 88
population = "Adults, overnight oximetry"
evidence = "consensus"
citations = [
  { pmid = "37695533", doi = "10.1007/s00415-023-11978-7", title = "Insomnia and sleep-disordered breathing in FKRP-related limb-girdle muscular dystrophy R9. The Norwegian LGMDR9 cohort study (2020).", locator = "Methods" },
]
note = "Sleep-related hypoxemia: SpO2 at or below 88% for more than 5 consecutive minutes (ICSD-3 / AASM definition as applied in the cited cohort study). Source kind: diagnostic. Source band <= 88; stored as the warn low bound 88."

[[range]]
set = "alt-1"
kind = "warn"
low = 90
population = "Adults, overnight oximetry"
evidence = "consensus"
citations = [
  { pmid = "39011358", doi = "10.3389/fneur.2024.1389949", title = "Excessive daytime sleepiness in myotonic dystrophy: a narrative review.", locator = "Diagnostic criteria" },
]
note = "Surrogate criterion for sleep hypoventilation when CO2 is unavailable: SpO2 below 90% for more than 10% of total sleep time (or <=88% for 5 consecutive minutes). Source kind: diagnostic. Source band <= 90; stored as the warn low bound 90. Alternative to the default diagnostic warn range for the same population."
