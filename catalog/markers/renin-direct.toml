slug = "renin-direct"
name = "Direct Renin Concentration"
category = "adrenal"
unit = "mIU/L"
description = "Concentration of active renin in plasma measured directly by immunoassay, without the generation step used for plasma renin activity. Used with aldosterone to calculate the aldosterone-to-renin ratio when PRA is unavailable, and to judge renin suppression in primary aldosteronism."

