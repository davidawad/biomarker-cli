slug = "cd4-count"
name = "CD4+ T-cell Count"
category = "infectious"
unit = "cells/µL"
loinc = "24467-3"
description = "Number of CD4-positive T lymphocytes per microlitre of blood. It is the main marker of immune function in HIV, used to stage disease and guide opportunistic infection prophylaxis."
aliases = ["cd4 count", "cd4+ t-lymphocyte count", "cd4 t-cell count"]

[[range]]
set = "cdc-1992-hiv-classification"
kind = "warn"
high = 200
when = { conditions = ["hiv"] }
population = "HIV-infected adults and adolescents, CDC clinical classification system"
evidence = "guideline"
citations = [
  { url = "https://www.cdc.gov/mmwr/preview/mmwrhtml/00018871.htm", locator = "Section: CD4+ T-Lymphocyte Categories" },
]
note = "CDC category 3 (AIDS threshold): CD4 count below 200 cells/µL (boundary <200). Category 3 is the threshold that also defines the AIDS case definition. Source kind: decision."

[[range]]
set = "alt-1"
kind = "warn"
low = 200
high = 499
when = { conditions = ["hiv"] }
population = "HIV-infected adults and adolescents, CDC clinical classification system"
evidence = "guideline"
citations = [
  { url = "https://www.cdc.gov/mmwr/preview/mmwrhtml/00018871.htm", locator = "Section: CD4+ T-Lymphocyte Categories" },
]
note = "CDC category 2: CD4 count 200 to 499 cells/µL. Source kind: decision. Alternative to the default cdc-1992-hiv-classification warn range for the same population."

[[range]]
set = "alt-2"
kind = "warn"
low = 500
when = { conditions = ["hiv"] }
population = "HIV-infected adults and adolescents, CDC clinical classification system"
evidence = "guideline"
citations = [
  { url = "https://www.cdc.gov/mmwr/preview/mmwrhtml/00018871.htm", locator = "Section: CD4+ T-Lymphocyte Categories" },
]
note = "CDC category 1: CD4 count of 500 cells/µL or more (boundary >=500). The source text prints the unit as cells/mL in this category label; the threshold itself is the cells/µL figure used in the category table. Source kind: decision. Alternative to the default cdc-1992-hiv-classification warn range for the same population."

