set = "clinical"
kind = "reference"
high = 8.4
when = { sex = "male" }
population = "Basal serum calcitonin reference limits as reported for a clinical laboratory, Germany (pre-June 2019 assay) (method: immunoassay (Siemens Immulite 2000))"
evidence = "reference-interval-study"
citations = [
  { pmid = "41976801", doi = "10.3390/jcm15072500", url = "https://pubmed.ncbi.nlm.nih.gov/41976801/", title = "The Pitfalls of Calcitonin as a Tumor Marker: Real-Life Data of Patients with Elevated Basal Calcitonin Levels but Without Evidence of Medullary Thyroid Carcinoma.", locator = "Methods" },
]
note = "Upper normal limit reported by the cohort laboratory; assay-specific and not an independently derived reference interval."

