description = "Antigen from the hepatitis B virus surface, detected in serum or plasma and reported as reactive or non-reactive. A reactive result indicates current hepatitis B infection (acute or chronic), and is used in screening, diagnosis and monitoring of carriers. Expected result: non-reactive (negative). Quantitative HBsAg (IU/mL) is a separate test."
