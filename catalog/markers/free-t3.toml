slug = "free-t3"
name = "Free T3"
category = "thyroid"
unit = "pg/mL"
description = "Unbound triiodothyronine, the most active thyroid hormone. Measured with TSH and FT4 to evaluate hyperthyroidism and T3 toxicosis. Most sources report pmol/L, which is kept in that unit on those ranges."
