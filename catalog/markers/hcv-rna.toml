note = "Assay requirement, not a treatment-outcome cut-off: the guidance asks for an HCV RNA assay with a detection level of 25 IU/mL or lower (boundary <=25) so that undetectable results can be reported. The guidance gives no 15 IU/mL value. SVR is undetectable HCV RNA 12 or more weeks after completing DAA therapy. Source kind: decision."
