slug = "non-hdl-c"
name = "Non-HDL Cholesterol"
category = "lipid"
unit = "mg/dL"
description = "Total cholesterol minus HDL-C, capturing all atherogenic apolipoprotein B particles. Used as a secondary target when triglycerides are elevated (ATP III: goal set 30 mg/dL above the LDL-C goal), with the NICE secondary-prevention target, pediatric NHLBI cut-points and the EAS/EFLM non-fasting and fasting flags."
loinc = "43396-1"
aliases = ["non-hdl", "non hdl cholesterol"]

[[conversion]]
from = "mmol/L"
factor = 38.67

