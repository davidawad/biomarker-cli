slug = "waist-to-hip-ratio"
name = "Waist-to-Hip Ratio"
category = "body"
unit = "ratio"
description = "Waist circumference divided by hip circumference. A measure of abdominal fat distribution, used with waist circumference and BMI to flag increased metabolic risk. Cut-offs differ by sex."
aliases = ["whr", "waist-hip ratio", "waist/hip ratio"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

