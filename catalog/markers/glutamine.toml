evidence = "guideline"
citations = [
  { pmid = "22642880", doi = "10.1186/1750-1172-7-32", title = "Suggested guidelines for the diagnosis and management of urea cycle disorders.", locator = "Full text, Statement #38" },
]
note = "Stated as an arbitrary tolerable ceiling for plasma glutamine in long-term management, not a reference interval. Source kind: therapeutic."
