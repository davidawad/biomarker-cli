slug = "glutamine"
name = "Glutamine"
category = "amino-acid"
unit = "µmol/L"
description = "Plasma concentration of glutamine, which carries nitrogen and rises when ammonia is not cleared by the urea cycle. Persistently high values in a urea cycle disorder indicate rising hyperammonaemia risk."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

