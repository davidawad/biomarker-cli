kind = "warn"
high = 264
when = { sex = "female", age = [65.0, 200] }
population = "Women aged 65 and over with new lower urinary tract symptoms, UTI versus asymptomatic bacteriuria and controls (164 participants)"
evidence = "cohort"
citations = [
  { pmid = "36806580", doi = "10.1093/cid/ciad099", url = "https://pubmed.ncbi.nlm.nih.gov/36806580/", title = "Current Pyuria Cutoffs Promote Inappropriate Urinary Tract Infection Diagnosis in Older Women.", locator = "Abstract, Results" },
  { pmid = "36806580", doi = "10.1093/cid/ciad099", url = "https://pubmed.ncbi.nlm.nih.gov/36806580/", title = "Current Pyuria Cutoffs Promote Inappropriate Urinary Tract Infection Diagnosis in Older Women.", locator = "Abstract, Methods" },
]
note = "Microscopy cut-off derived for UTI in older women (sensitivity 88%, positive likelihood ratio 7.2). It is a single-study result in a selected population, not a general adult pyuria threshold. Source kind: decision. Source band >= 264; stored as the warn high bound 264."
