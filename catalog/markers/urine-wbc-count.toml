slug = "urine-wbc-count"
name = "Urine White Blood Cells (per microlitre)"
category = "urinalysis"
unit = "/µL"
description = "Urine leukocyte concentration per microlitre from automated urinalysis or flow cytometry, as opposed to the per high-power-field count from manual microscopy."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "pyuria-cutoffs-older-women-2023"
kind = "warn"
high = 10
population = "Adults: commonly used pyuria cut-off (urine leukocytes by automated microscopy or flow cytometry)"
evidence = "consensus"
citations = [
  { pmid = "36806580", doi = "10.1093/cid/ciad099", url = "https://pubmed.ncbi.nlm.nih.gov/36806580/", title = "Current Pyuria Cutoffs Promote Inappropriate Urinary Tract Infection Diagnosis in Older Women.", locator = "Abstract, Results" },
]
note = "Commonly used pyuria cut-off of 10 leukocytes/µL. In women aged 65 and over with lower urinary tract symptoms, this cut-off had sensitivity 100% but specificity only 36% for UTI, which the authors use to argue for higher thresholds. Source kind: decision. Source band >= 10; stored as the warn high bound 10."

