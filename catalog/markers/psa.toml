evidence = "consensus"
citations = [
  { pmid = "39038964", doi = "10.3399/BJGP.2023.0586", url = "https://pubmed.ncbi.nlm.nih.gov/39038964/", title = "Optimising the use of the prostate-specific antigen blood test in asymptomatic men for early prostate cancer detection in primary care: report from a UK clinical consensus.", locator = "Full text, Results" },
]
note = "PCRMP referral threshold of 3.0 ng/mL for asymptomatic men aged 50-69 (boundary >= 3.0 as stated). Cited here from a 2024 UK consensus that questions its rationale; the PCRMP document itself was not retrieved. A 2023 review notes the PCRMP threshold is 3 ng/mL regardless of age, which is not separately quoted as a range. Source kind: decision."
