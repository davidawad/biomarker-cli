]
note = "Biopsy-decision cut-off: PSA at or above 4.0 ng/mL is one of the commonly used thresholds (>2.5, 3.0 or 4.0 ng/mL were all considered reasonable). Age-specific thresholds may be preferable in older men; 5-alpha-reductase inhibitor users need PSA interpreted with caution. Source kind: decision. Alternative to the default psa-biopsy-thresholds-2009 warn range for the same population."

