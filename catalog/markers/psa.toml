slug = "psa"
name = "Prostate Specific Antigen"
category = "hormone"
unit = "ng/mL"
description = "Total prostate-specific antigen, a protein made by the prostate and measured in serum. Levels rise with age, benign prostate enlargement and prostate cancer, so it is used for prostate cancer screening and monitoring with age-specific interpretation."
loinc = "2857-1"
aliases = ["psa, total"]

[[range]]
set = "clinical"
kind = "reference"
low = 0.0
high = 4.0
when = { sex = "male" }
legacy = true

[[range]]
set = "nice-ng12-2021"
kind = "warn"
low = 2.5
when = { sex = "male", age = [40.0, 50.0] }
population = "Men with possible symptoms of prostate cancer (lower urinary tract symptoms, erectile dysfunction or visible haematuria), aged 40-49, in primary care (setting: possible-prostate-cancer-symptoms)"
evidence = "guideline"
citations = [
  { url = "https://www.nice.org.uk/guidance/ng12/chapter/Recommendations", title = "Suspected cancer: recognition and referral", locator = "Recommendation 1.6.3, Table 2 Age-specific PSA thresholds" },
]
note = "Age-specific referral threshold (NICE NG12, recommendation 1.6.3, Table 2): consider a suspected cancer pathway referral if PSA is more than 2.5 ng/mL (micrograms/litre). Boundary is > (strictly more than). Trans women and non-binary people with male reproductive organs are covered by the same recommendation. Source kind: decision."

