note = "Positivity cut-off used in the study (0.35 kUA/L; 0.10 and 3.5 kUA/L were also used). In this cohort, 66 of 106 symptomatic participants and 76 of 348 non-symptomatic participants were positive at 0.35 kUA/L (Table 3); the paper does not derive this as an optimal clinical threshold. Source band >= 0.35; stored as the warn high bound 0.35."
