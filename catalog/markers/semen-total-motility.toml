description = "Percentage of spermatozoa showing any motility (progressive plus non-progressive) in a semen sample. Tracked with sperm concentration and morphology to assess male fertility potential and to classify asthenozoospermia. Expected result: at or above the WHO lower reference limit (42% in the WHO 2021 manual; 40% in WHO 2010)."

