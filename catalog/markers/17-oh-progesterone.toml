note = "Newborn screening recall cut-off in ng/mL as used by the authors' programme, not a guideline threshold. Values below it can still represent non-classic CAH (the source reports mildly elevated values below recall in most cases). Basal and ACTH-stimulated cut-offs from the 2018 Endocrine Society CAH guideline could not be verified with the available tools. Converted from the source's ng/mL (12) to ng/dL using factor 100. Source kind: diagnostic. Source band >= 1200.0; stored as the warn high bound 1200.0."

