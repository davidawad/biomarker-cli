note = "Borderline zone for basal 17OHP: 6 to 30 nmol/L prompts a 250 mcg ACTH stimulation test. Restates CAH guideline values; the sentence does not name the guideline (the paywalled Endocrine Society 2018 CAH guideline is the presumed source, not verified here). Values below 6 nmol/L are said to exclude CAH. Converted from the source's nmol/L (6-30) to ng/dL using factor 33.05. Source band 198.3-991.5; stored as the warn high bound 991.5."

