]
note = "Post-stimulation 17OHP at 60 minutes: values above 30 nmol/L are diagnostic of nonclassic CAH. Restates guideline values (guideline not named in the sentence). Nonclassic CAH values in ng/dL are not restated here. Converted from the source's nmol/L (30) to ng/dL using factor 33.05. Source kind: diagnostic. Source band >= 991.5; stored as the warn high bound 991.5."

