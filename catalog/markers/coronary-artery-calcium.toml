slug = "coronary-artery-calcium"
name = "Coronary Artery Calcium Score (Agatston)"
category = "composite"
unit = "Agatston units"
description = "Coronary artery calcium score measured by non-contrast cardiac CT and quantified with the Agatston method. It reflects the burden of coronary atherosclerotic calcium and refines ASCVD risk, especially when the 10-year risk estimate is uncertain."
aliases = ["cac score", "agatston score", "coronary calcium score"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

