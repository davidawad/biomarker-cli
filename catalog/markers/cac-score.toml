]
note = "CAC-DRS category A2, moderately increased (100-299 Agatston units). The primary SCCT CAC-DRS 2018 document (PMID 29793848) is not retrievable with numbers; the category wording is taken from the review cited here, which summarises the CAC-DRS categories. Boundary semantics: >=100 and <=299. Source kind: decision. Two-sided band stored as a reference range in its own set because it has no clinical reference range to orient it as a warn or critical cut point."

