slug = "cac-score"
name = "Coronary Artery Calcium Score (Agatston)"
category = "composite"
unit = "Agatston units"
description = "Coronary artery calcium score measured by non-contrast cardiac CT and quantified with the Agatston method. It reflects the burden of coronary atherosclerotic calcium and refines ASCVD risk, especially when the 10-year risk estimate is uncertain."
aliases = ["cac score", "agatston score", "coronary calcium score", "coronary-artery-calcium"]

[[range]]
set = "clinical"
kind = "reference"
low = 1
high = 99
when = { age = [55.0, 200] }
population = "Adults with a coronary artery calcium score measured for a statin decision, primary prevention"
evidence = "guideline"
citations = [
  { pmid = "30894319", doi = "10.1016/j.jacc.2019.03.009", url = "https://pubmed.ncbi.nlm.nih.gov/30894319/", title = "2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease: Executive Summary: A Report of the American College of Cardiology/American Heart Association Task Force on Clinical Practice Guidelines.", locator = "Full text, Recommendations on coronary artery calcium" },
]
note = "Some coronary calcium (1-99). Reasonable to initiate statin therapy for patients aged 55 years or older. Boundary semantics: >=1 and <=99. Units are not stated in the quote; the calcium score is the Agatston score. Two-sided band stored as a reference range in its own set because it has no clinical reference range to orient it as a warn or critical cut point."

[[range]]
set = "acc-aha-2018-cholesterol"
kind = "warn"
high = 100
population = "Adults with a coronary artery calcium score measured for a statin decision"
evidence = "guideline"
citations = [
  { pmid = "30586774", doi = "10.1161/CIR.0000000000000625", url = "https://pubmed.ncbi.nlm.nih.gov/30586774/", title = "2018 AHA/ACC/AACVPR/AAPA/ABC/ACPM/ADA/AGS/APhA/ASPC/NLA/PCNA Guideline on the Management of Blood Cholesterol: A Report of the American College of Cardiology/American Heart Association Task Force on Clinical Practice Guidelines.", locator = "Full text, Recommendations on coronary artery calcium" },
]
note = "CAC of 100 Agatston units or higher: statin therapy is indicated unless deferred after clinician-patient risk discussion. The same recommendation also accepts a score at or above the 75th percentile as an equivalent cut-off; that percentile is not a numeric Agatston range and is not encoded here. Lower bound only (open above). Source kind: decision. Source band >= 100; stored as the warn high bound 100."

