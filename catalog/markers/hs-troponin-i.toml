high = 6
population = "Adults with suspected myocardial infarction in a multicentre prospective Chinese cohort applying the ESC 0/1-hour algorithm (Architect STAT hs-cTnI) (setting: suspected-acute-mi; method: abbott-architect-stat)"
evidence = "cohort"
citations = [
  { pmid = "39262795", doi = "10.1016/j.isci.2024.110643", url = "https://pubmed.ncbi.nlm.nih.gov/39262795/", title = "A multicenter prospective study on the ESC algorithm for the early diagnosis of non-ST-elevation myocardial infarction.", locator = "Results" },
]
note = "ESC 0/1-hour algorithm, 1-hour rule-in: hs-cTnI change of 6 ng/L or more (inclusive, >=6) from baseline to 1 hour. Source kind: decision. Source band >= 6; stored as the warn high bound 6. Alternative to the default iscience-2024-esc-algorithm warn range for the same population."
