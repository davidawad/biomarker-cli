slug = "mean-arterial-pressure"
name = "Mean Arterial Pressure"
category = "vitals"
unit = "mmHg"
description = "Average arterial pressure over one cardiac cycle, calculated from systolic and diastolic blood pressure. Used to judge organ perfusion, mainly in critical care. Expected result in septic shock: at least 65 mmHg on vasopressors."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "target"
kind = "optimal"
low = 65
when = { conditions = ["septic-shock"] }
population = "Adults with septic shock on vasopressors"
evidence = "guideline"
citations = [
  { pmid = "34599691", doi = "10.1007/s00134-021-06506-y", title = "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021.", locator = "Recommendation 9 (Mean arterial pressure)" },
]
note = "Initial MAP target of 65 mm Hg over higher targets. Strong recommendation, moderate-quality evidence (Surviving Sepsis Campaign 2021, Recommendation 9). Source kind: target."
