description = "IgG autoantibodies against insulin (IAA), measured by radiobinding or immunoassay. Tracked as one of the islet autoantibodies (with GADA, IA-2A, ZnT8A) to screen for and classify type 1 diabetes; IAA testing in children and in people on exogenous insulin needs care because insulin treatment can induce IAA. Expected result: negative (below the assay positivity cut-off)."
