note = "Moderate aCL positivity band (40-79 units) as the cited paper describes the 2023 ACR/EULAR criteria. The source gives units only (arbitrary units, not MPL); the number is copied as stated. Isolated IgM positivity is scored low-weight in those criteria. Source kind: diagnostic. Two-sided band stored as a reference range in its own set because it has no clinical reference range to orient it as a warn or critical cut point."

