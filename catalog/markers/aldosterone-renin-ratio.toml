slug = "aldosterone-renin-ratio"
name = "Aldosterone-to-Renin Ratio"
category = "adrenal"
unit = "ng/dL per ng/mL/h"
description = "Ratio of plasma aldosterone to renin, the primary screening index for primary aldosteronism in hypertensive patients. A high ratio suggests renin-independent aldosterone excess; cut-offs depend on the renin assay, aldosterone method and age."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "endocrine-society-2025"
kind = "warn"
high = 15
population = "Adults screened for primary aldosteronism; ARR with PAC and PRA by LC-MS/MS (Endocrine Society 2025 criteria as summarised in a 2026 analysis) (method: lc-ms/ms)"
evidence = "consensus"
citations = [
  { pmid = "42751802", doi = "10.1161/HYPERTENSIONAHA.126.27634", url = "https://pubmed.ncbi.nlm.nih.gov/42751802/", title = "Evaluation of Current Screening Thresholds for the Detection of Primary Aldosteronism.", locator = "Abstract, Background" },
]
note = "Endocrine Society 2025 screening criterion: ARR above 15, applied together with PAC at or above 7.5 ng/dL and PRA at or below 1 ng/mL/h. Cited via the Hypertension 2026 analysis, not the guideline full text. Applies only to: markers=[{\"slug\": \"aldosterone\", \"op\": \">=\", \"value\": 7.5, \"unit\": \"ng/dL\"}, {\"slug\": \"renin-activity\", \"op\": \"<=\", \"value\": 1, \"unit\": \"ng/mL/h\"}]. Source kind: diagnostic. Source band >= 15; stored as the warn high bound 15."

