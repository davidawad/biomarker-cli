note = "Elevated LDL-P at or above 1300 nmol/L. This is the company-recommended NMR cut-point the MESA analysis used as a clinical cut-point; the paper did not derive it from a population percentile. Not a reference interval. Source band >= 1300; stored as the warn high bound 1300."
