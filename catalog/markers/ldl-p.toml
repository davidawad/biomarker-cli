evidence = "consensus"
citations = [
  { pmid = "36545388", doi = "10.1016/j.ajpc.2022.100436", title = "Small dense low-density lipoprotein cholesterol compared to other lipoprotein biomarkers for predicting coronary heart disease among individuals with normal fasting glucose: The Multi-Ethnic Study of Atherosclerosis.", locator = "Methods (statistical analysis, cut-points)" },
