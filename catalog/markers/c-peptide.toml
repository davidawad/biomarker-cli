slug = "c-peptide"
name = "C-Peptide"
category = "glycemic"
unit = "ng/mL"
description = "C-peptide is secreted in equimolar amounts with insulin and measures endogenous insulin secretion. Used to classify diabetes and guide treatment, interpreted differently for fasting, stimulated and urine tests."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "diagnostic"
kind = "warn"
high = 0.604
when = { fasting = false, conditions = ["diabetes"] }
population = "People with insulin-treated diabetes; stimulated (non-fasting random, post-glucagon or mixed-meal) C-peptide"
evidence = "consensus"
citations = [
  { pmid = "23413806", doi = "10.1111/dme.12159", title = "The clinical utility of C-peptide measurement in the care of patients with diabetes.", locator = "Table 1" },
]
note = "Absolute insulin deficiency / absolute insulin requirement (strictly below). Source unit nmol/L (1 nmol/L = 3 ng/mL); numbers not converted. Converted from the source's nmol/L (0.2) to ng/mL using factor 3.02. Source kind: diagnostic."

