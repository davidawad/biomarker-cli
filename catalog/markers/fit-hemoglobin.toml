slug = "fit-hemoglobin"
name = "Faecal Immunochemical Test (Haemoglobin)"
category = "stool"
unit = "µg Hb/g"
loinc = "29771-3"
description = "Faecal immunochemical test (FIT) detects human haemoglobin in stool. Quantitative results in µg haemoglobin per gram of faeces are compared with programme or laboratory cut-offs to decide on referral or colonoscopy for possible colorectal neoplasia. The threshold is method- and programme-specific."
aliases = ["fit", "faecal haemoglobin", "f-hb", "fhb", "quantitative fit", "qfit", "fecal immunochemical test"]
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "florence-fit-screening-2026"
kind = "warn"
low = 20
population = "Participants in the Florence colorectal cancer screening programme with a negative FIT"
evidence = "cohort"
citations = [
  { pmid = "42742245", doi = "10.4415/ANN_26_03_10", url = "https://pubmed.ncbi.nlm.nih.gov/42742245/", title = "Three-year risk of colorectal cancer by faecal haemoglobin concentration in subjects with a negative FIT.", locator = "Abstract, Methods" },
]
note = "Programme positivity cut-off. Results at or above 20 µg Hb/g are positive and referred for colonoscopy, per the study's description of the programme. Source kind: decision."

[[range]]
set = "alt-1"
kind = "warn"
low = 15
high = 20
population = "Participants in the Florence colorectal cancer screening programme with a negative FIT"
evidence = "cohort"
citations = [
  { pmid = "42742245", doi = "10.4415/ANN_26_03_10", url = "https://pubmed.ncbi.nlm.nih.gov/42742245/", title = "Three-year risk of colorectal cancer by faecal haemoglobin concentration in subjects with a negative FIT.", locator = "Abstract, Results" },
]
note = "Borderline band just below the 20 µg Hb/g positivity cut-off. The study found an increased 3-year colorectal cancer risk in this band even though these results were FIT-negative. Lower bound inclusive, upper bound exclusive. Alternative to the default florence-fit-screening-2026 warn range for the same population."

