slug = "thyroglobulin"
name = "Thyroglobulin"
category = "thyroid"
unit = "ng/mL"
description = "Protein made only by thyroid follicular cells; a tumour marker after thyroid cancer treatment. Healthy values depend on the assay, and post-thyroidectomy thresholds depend on whether radioiodine ablation was given and whether TSH was suppressed or stimulated."

[[range]]
set = "kta-2026-dtc-followup"
kind = "warn"
low = 0.2
when = { conditions = ["total-thyroidectomy-with-rai"] }
population = "Adults with differentiated thyroid cancer after total thyroidectomy and radioiodine (RAI) therapy (test: TSH-unstimulated serum Tg)"
evidence = "guideline"
citations = [
  { pmid = "42705671", doi = "10.3803/EnM.2026.3149", url = "https://pubmed.ncbi.nlm.nih.gov/42705671/", title = "Korean Thyroid Association Guidelines on the Management of Differentiated Thyroid Cancers, Part II: Follow-up Surveillance after Initial Treatment 2026.", locator = "Table II.1 / Recommendations" },
]
note = "Excellent response threshold (unstimulated, on TSH suppression) as stated by the Korean Thyroid Association 2026 guideline; requires negative TgAb and no structural disease. Source kind: diagnostic. Source band <= 0.2; stored as the warn low bound 0.2."

