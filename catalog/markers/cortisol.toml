kind = "reference"
low = 5.438
high = 29.07
when = { age = [20.0, 69.0] }
population = "50 healthy subjects from the general population aged 20-69 years, equally distributed by sex and age (specimen: plasma)"
evidence = "reference-interval-study"
citations = [
  { pmid = "16397312", url = "https://pubmed.ncbi.nlm.nih.gov/16397312/", title = "Establishment of reference values for endocrine tests. Part IV: Adrenal insufficiency.", locator = "Abstract, Results" },
]
note = "09:00 plasma cortisol reference interval (mean +/- 2 SD after log transformation, i.e. approximately the central 95%). Plasma, 2005 study, older assay; use local lab reference range where available. Converted from the source's nmol/L (150-802) to µg/dL using factor 0.03625. Applies only to: time_of_day=morning."

