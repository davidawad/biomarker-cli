slug = "six-minute-walk-distance"
name = "Six-Minute Walk Distance"
category = "fitness"
unit = "m"
loinc = "64098-7"
description = "Distance walked in six minutes on the standardized six-minute walk test, a measure of functional exercise capacity. Tracked in cardiopulmonary, neuromuscular and cognitive disease. Healthy-adult values depend on age, sex, height and weight (published reference equations, not fixed intervals). No single expected result."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "diagnostic"
kind = "warn"
low = 389
when = { sex = "male", conditions = ["alzheimers-disease"] }
population = "Community-dwelling men attending a neurology department, classified as MCI (MMSE >= 26) or moderate AD dementia (MMSE 10-19) by IWG-2 criteria"
evidence = "cohort"
citations = [
  { pmid = "42513287", doi = "10.3390/jcm15145374", title = "Criterion-Referenced Sex-Specific Six-Minute Walk Distance Cut-Offs for Staging Alzheimer's Disease.", locator = "Abstract (Results)" },
]
note = "Single-study ROC threshold (Youden index) separating MCI from moderate AD dementia, n = 233; not externally validated. Values strictly below 389 m were in the moderate AD dementia direction. Not a reference interval. Source kind: diagnostic. Source band <= 389; stored as the warn low bound 389."

[[range]]
set = "diagnostic"
kind = "warn"
low = 367
when = { sex = "female", conditions = ["alzheimers-disease"] }
population = "Community-dwelling women attending a neurology department, classified as MCI (MMSE >= 26) or moderate AD dementia (MMSE 10-19) by IWG-2 criteria"
evidence = "cohort"
citations = [
  { pmid = "42513287", doi = "10.3390/jcm15145374", title = "Criterion-Referenced Sex-Specific Six-Minute Walk Distance Cut-Offs for Staging Alzheimer's Disease.", locator = "Abstract (Results)" },
]
note = "Single-study ROC threshold (Youden index) separating MCI from moderate AD dementia, n = 233 (128 women); not externally validated. Values strictly below 367 m were in the moderate AD dementia direction. Not a reference interval. Source kind: diagnostic. Source band <= 367; stored as the warn low bound 367."
