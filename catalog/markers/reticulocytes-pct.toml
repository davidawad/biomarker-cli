slug = "reticulocytes-pct"
name = "Reticulocytes (%)"
category = "cbc"
unit = "%"
description = "Percentage of circulating red cells that are reticulocytes, the young RNA-containing red cells released from the marrow, as counted by automated analysers. Low values suggest reduced marrow output (aplasia, nutrient deficiency, CKD); high values indicate increased erythropoiesis, as after blood loss or haemolysis."

[[range]]
set = "clinical"
kind = "reference"
low = 1.12
high = 2.48
when = { sex = "female", age = [20.0, 30.0] }
population = "China National Health Survey adults (females aged 20-29, n=189), Sysmex XN-B3 analyser"
evidence = "reference-interval-study"
citations = [
  { pmid = "42374229", doi = "10.1186/s12872-026-06185-x", title = "Age- and sex-specific normative values for reticulocyte indices and their relation to early-stage CKM syndrome.", locator = "Table 1, RET% rows" },
]
note = "LMS-smoothed 5th-95th centiles; analyser-specific."

