note = "Biopsy-free diagnosis may be applied if TGA-IgA is >=10x ULN, endomysial antibodies (EMA-IgA) are positive in a second blood sample and the family agrees. Total serum IgA should be measured with TGA-IgA; an IgG-based test is needed only if total IgA is low or undetectable. No numeric total-IgA cut-off was retrieved. Source kind: decision. Source band >= 10; stored as the warn high bound 10."

