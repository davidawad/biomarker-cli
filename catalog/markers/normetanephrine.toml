]
note = "Age-adjusted upper reference limit for plasma normetanephrine in children, nmol/L. The age cut-off for 'children' is not restated in the quote (under 18 assumed). Supine sampling; not converted to pg/mL. Converted from the source's nmol/L (0.47) to pg/mL using factor 183.2."

