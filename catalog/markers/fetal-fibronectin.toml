slug = "fetal-fibronectin"
name = "Fetal Fibronectin, Cervicovaginal"
category = "pregnancy"
unit = "ng/mL"
description = "Glycoprotein that acts as glue between decidua and fetal membranes; detected in cervicovaginal secretions. A positive test in women with symptoms or a high-risk history signals increased short-term risk of preterm birth or impending labour."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "fibronectin-meta-2020"
kind = "warn"
high = 50
when = { pregnant = true }
population = "Pregnant women tested for impending labour or preterm birth (systematic review and meta-analysis) (specimen: cervicovaginal)"
evidence = "cohort"
citations = [
  { pmid = "29914277", doi = "10.1080/14767058.2018.1491031", url = "https://pubmed.ncbi.nlm.nih.gov/29914277/", title = "The fetal fibronectin test: 25 years after its development, what is the evidence regarding its clinical utility? A systematic review and meta-analysis.", locator = "Abstract" },
]
note = "Qualitative positive test at 50 ng/mL or more between 22 and 36 weeks. Source window is 22 to 36 weeks, not 22 to 35. Applies only to: gestational_week_min=22; gestational_week_max=36. Source kind: diagnostic. Source band >= 50; stored as the warn high bound 50."

[[range]]
set = "fibronectin-symptomatic-2013"
kind = "warn"
low = 10
when = { pregnant = true, conditions = ["symptomatic-preterm-labour"] }
population = "Symptomatic women with threatened preterm labour (quantitative fFN test) (specimen: cervicovaginal)"
evidence = "cohort"
citations = [
  { pmid = "23164760", doi = "10.1016/j.ajog.2012.10.890", url = "https://pubmed.ncbi.nlm.nih.gov/23164760/", title = "Evaluation of a quantitative fetal fibronectin test for spontaneous preterm birth in symptomatic women.", locator = "Abstract, Conclusion" },
]
note = "Below 10 ng/mL: very low risk of spontaneous preterm birth (negative predictive threshold). Source kind: diagnostic. Source band <= 10; stored as the warn low bound 10."

[[range]]
set = "fibronectin-symptomatic-2013"
kind = "critical"
high = 200
when = { pregnant = true, conditions = ["symptomatic-preterm-labour"] }
population = "Symptomatic women with threatened preterm labour (quantitative fFN test) (specimen: cervicovaginal)"
evidence = "cohort"
citations = [
  { pmid = "23164760", doi = "10.1016/j.ajog.2012.10.890", url = "https://pubmed.ncbi.nlm.nih.gov/23164760/", title = "Evaluation of a quantitative fetal fibronectin test for spontaneous preterm birth in symptomatic women.", locator = "Abstract, Conclusion" },
]
note = "200 ng/mL or more: high-risk threshold for spontaneous preterm birth, with high specificity and lower sensitivity. Source band >= 200; stored as the critical high bound 200."

[[range]]
set = "fibronectin-asymptomatic-2016"
kind = "warn"
low = 10
when = { pregnant = true, conditions = ["asymptomatic-high-risk"] }
population = "Asymptomatic high-risk pregnant women tested at 18 and 22 weeks (quantitative fFN) (specimen: cervicovaginal)"
evidence = "cohort"
citations = [
  { pmid = "26942351", doi = "10.1097/AOG.0000000000001240", url = "https://pubmed.ncbi.nlm.nih.gov/26942351/", title = "Quantitative Fetal Fibronectin at 18 Weeks of Gestation to Predict Preterm Birth in Asymptomatic High-Risk Women.", locator = "Results" },
]
note = "Below 10 ng/mL: high negative predictive value for delivery before 34 weeks. Applies only to: gestational_week_min=18; gestational_week_max=22. Source kind: diagnostic. Source band <= 10; stored as the warn low bound 10."

[[range]]
set = "fibronectin-asymptomatic-2016"
kind = "critical"
high = 200
when = { pregnant = true, conditions = ["asymptomatic-high-risk"] }
population = "Asymptomatic high-risk pregnant women tested at 18 and 22 weeks (quantitative fFN) (specimen: cervicovaginal)"
evidence = "cohort"
citations = [
  { pmid = "26942351", doi = "10.1097/AOG.0000000000001240", url = "https://pubmed.ncbi.nlm.nih.gov/26942351/", title = "Quantitative Fetal Fibronectin at 18 Weeks of Gestation to Predict Preterm Birth in Asymptomatic High-Risk Women.", locator = "Results" },
]
note = "200 ng/mL or more: high specificity but lower sensitivity for delivery before 34 weeks. Applies only to: gestational_week_min=18; gestational_week_max=22. Source band >= 200; stored as the critical high bound 200."
