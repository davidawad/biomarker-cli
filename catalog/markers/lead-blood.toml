slug = "lead-blood"
name = "Blood lead"
category = "toxic-metal"
unit = "µg/dL"
description = "Lead concentration in whole blood, the standard marker of recent or ongoing lead exposure. Higher values indicate exposure and, in children, risk of neurodevelopmental harm; no level is considered safe."

[[range]]
set = "clinical"
kind = "reference"
high = 3.5
when = { age = [1.0, 6.0] }
population = "US children aged 1-5 years (NHANES 2015-2016 and 2017-2018 cycles)"
evidence = "guideline"
citations = [
  { pmid = "34710078", doi = "10.15585/mmwr.mm7043a4", title = "Update of the Blood Lead Reference Value - United States, 2021.", locator = "Policy Update" },
]
note = "Blood lead reference value (BLRV) set at the 97.5th percentile of the child distribution. It is a population benchmark, not a health-based standard or toxicity threshold. Previously 5 µg/dL (2012)."

[[range]]
set = "cdc-blood-lead-clinical-guidance"
kind = "warn"
low = 3.5
high = 19
when = { age = [0.0, 18.0] }
population = "Children with a venous blood lead level reported to clinicians (CDC clinical guidance for healthcare providers)"
evidence = "guideline"
citations = [
  { url = "https://www.cdc.gov/lead-prevention/hcp/clinical-guidance/index.html", title = "CDC Clinical Guidance for Healthcare Providers: Lead Exposure in Children (web page)", locator = "Clinical guidance table, BLL tiers" },
]
note = "Management tier: environmental history, nutrition counseling, follow-up testing and public health reporting. Age limit is an assumption of the pediatric guidance scope."

[[range]]
set = "cdc-blood-lead-clinical-guidance"
kind = "critical"
low = 45
when = { age = [0.0, 18.0] }
population = "Children with a venous blood lead level, CDC clinical guidance for healthcare providers"
evidence = "guideline"
citations = [
  { url = "https://www.cdc.gov/lead-prevention/hcp/clinical-guidance/index.html", title = "CDC Clinical Guidance for Healthcare Providers: Lead Exposure in Children (web page)", locator = "Clinical guidance table, BLL tiers" },
]
note = "Highest management tier; CDC calls for urgent medical management of very high levels."
