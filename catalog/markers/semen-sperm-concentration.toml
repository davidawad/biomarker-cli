description = "Number of spermatozoa per millilitre of semen, from a semen analysis. Tracked to assess male fertility potential and to classify oligozoospermia. Expected result: at or above the WHO lower reference limit (16 x 10^6/mL in the WHO 2021 manual; 15 x 10^6/mL in WHO 2010)."

