]
note = "Clinical decision limit from ROC analysis: values below this favour polycythemia vera (sensitivity 80.5%, specificity 87.8%). Single study. Converted from the source's IU/L (3.1) to mIU/mL using factor 1.0. Source kind: diagnostic. Source band <= 3.1; stored as the warn low bound 3.1."
