evidence = "reference-interval-study"
citations = [
  { pmid = "39272689", doi = "10.3390/diagnostics14171902", title = "Diagnostic Performance of Serum Erythropoietin to Discriminate Polycythemia Vera from Secondary Erythrocytosis through Established Subnormal Limits.", locator = "Abstract (Results)" },
]
note = "2.5th-97.5th percentile of healthy donors. IU/L is numerically equal to mIU/mL. Converted from the source's IU/L (5.3-26.3) to mIU/mL using factor 1.0."

