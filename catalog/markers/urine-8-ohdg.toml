slug = "urine-8-ohdg"
name = "8-Hydroxy-2'-Deoxyguanosine (8-OHdG), Urine"
category = "organic-acid"
unit = "ng/mg creatinine"
loinc = "59265-9"
description = "Urinary 8-hydroxy-2'-deoxyguanosine (8-OHdG; also reported as 8-oxo-7,8-dihydro-2'-deoxyguanosine, 8-oxodG), a marker of oxidative damage to DNA. People track it as a non-invasive marker of oxidative stress. Spot urine results are normalized to creatinine. The expected result is a numeric level; the cited sources give population reference intervals only."

[[range]]
set = "clinical"
kind = "reference"
low = 1.127
high = 5.559
when = { sex = "male" }
population = "Healthy Serbian adults, males (n=130), spot urine 8-oxodG/creatinine by LC-MS/MS, 2.5th-97.5th percentiles"
evidence = "cohort"
citations = [
  { pmid = "23261837", doi = "10.1016/j.clinbiochem.2012.12.008", title = "Gender-related reference intervals of urinary 8-oxo-7,8-dihydro-2'-deoxyguanosine determined by liquid chromatography-tandem mass spectrometry in Serbian population.", locator = "Abstract, Results" },
]
note = "Gender-specific reference interval, males. Values are the source's own units (nmol/mmol creatinine), not converted. Converted from the source's nmol/mmol (0.45-2.22) to ng/mg creatinine using factor 2.504."

