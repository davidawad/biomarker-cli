slug = "inhibin-a"
name = "Inhibin A, Maternal Serum"
category = "pregnancy"
unit = "MoM"
description = "Placental and ovarian peptide measured in maternal serum in the second trimester, expressed as a multiple of the median (MoM). It is part of the quadruple Down syndrome screen. Raised values are associated with pre-eclampsia and with small-for-gestational-age infants."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "inhibin-a-second-trimester-preeclampsia-1999"
kind = "warn"
high = 2.0
when = { pregnant = true, trimester = 2 }
population = "Second-trimester maternal serum inhibin A in a pregnancy cohort, with pre-eclampsia and small-for-gestational-age infants as outcomes"
evidence = "cohort"
citations = [
  { pmid = "10411808", doi = "10.1016/s0002-9378(99)70448-5", url = "https://pubmed.ncbi.nlm.nih.gov/10411808/", title = "Second-trimester maternal serum inhibin A concentration as an early marker for preeclampsia.", locator = "Abstract, Results" },
  { pmid = "33059628", doi = "10.1186/s12884-020-03298-9", url = "https://pubmed.ncbi.nlm.nih.gov/33059628/", title = "Quad test for fetal aneuploidy screening as a predictor of small-for-gestational-age fetuses: a population-based study.", locator = "Methods" },
]
note = "Women above 2.0 MoM were significantly more likely to develop pre-eclampsia and to deliver a small-for-gestational-age infant. The 1999 study is older; the 2020 cut-off below uses the same threshold. Source kind: diagnostic. Source band >= 2.0; stored as the warn high bound 2.0."
