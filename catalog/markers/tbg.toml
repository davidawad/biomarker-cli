slug = "tbg"
name = "Thyroxine-Binding Globulin"
category = "thyroid"
unit = "mg/L"
description = "Main carrier protein for thyroxine in blood. Its level changes with oestrogen, pregnancy, liver disease and inherited deficiency or excess, and it affects how free thyroid hormone immunoassays read."

