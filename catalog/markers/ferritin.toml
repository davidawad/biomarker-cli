slug = "ferritin"
name = "Ferritin"
category = "iron"
unit = "ng/mL"
description = "Storage protein that reflects body iron stores; low values indicate iron deficiency, high values indicate iron overload, but ferritin is also an acute-phase reactant, so inflammation, liver disease and heart failure raise it independently of iron stores."
loinc = "2276-4"
aliases = ["ferr"]

