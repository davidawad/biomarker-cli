kind = "warn"
high = 4.4
when = { sex = "male", conditions = ["beta-thalassemia-carrier"] }
population = "Males of reproductive age, Guizhou population (China), with HbA2 and beta-globin gene analysis"
evidence = "cohort"
citations = [
  { pmid = "30503531", doi = "10.1016/j.clinbiochem.2018.11.007", title = "Reference intervals for HbA2 and HbF and cut-off value of HbA2 for β-thalassemia carrier screening in a Guizhou population of reproductive age.", locator = "Abstract, Results" },
]
note = "ROC-derived HbA2 cut-off for beta-thalassemia carrier screening in males. Single-study classification, not a guideline cut-off. Source kind: diagnostic. Source band >= 4.4; stored as the warn high bound 4.4."

