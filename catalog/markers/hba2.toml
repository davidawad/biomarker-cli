slug = "hba2"
name = "Hemoglobin A2"
category = "hematology"
unit = "%"
loinc = "4551-8"
description = "Share of total haemoglobin present as HbA2 (alpha2 delta2 globin), measured by electrophoresis, HPLC or capillary methods. Tracked mainly for beta-thalassemia carrier screening, where a raised HbA2 is the key finding. Expected result: within the reference interval for the population and method."

[[range]]
set = "clinical"
kind = "reference"
low = 2.3
high = 3.1
population = "832 individuals of reproductive age without hypochromic microcytic anaemia, Guizhou population (China); overall normal individuals, sex and pregnancy status reported to have no obvious influence"
evidence = "reference-interval-study"
citations = [
  { pmid = "30503531", doi = "10.1016/j.clinbiochem.2018.11.007", title = "Reference intervals for HbA2 and HbF and cut-off value of HbA2 for β-thalassemia carrier screening in a Guizhou population of reproductive age.", locator = "Abstract, Results" },
]
note = "Single-centre reference interval study."

[[range]]
set = "alt-1"
kind = "reference"
low = 2.3
high = 3.4
population = "3306 individuals aged 3 to 92 years included in the reference interval calculation, Northern Alberta (retrospective laboratory data, Alberta)"
evidence = "reference-interval-study"
citations = [
  { pmid = "25869492", doi = "10.1016/j.clinbiochem.2015.04.001", title = "Incidence of hemoglobinopathies and thalassemias in Northern Alberta. Establishment of reference intervals for HbF and HbA2.", locator = "Abstract, Results" },
]
note = "Retrospective laboratory-based reference interval study. Alternative to the default clinical reference range for the same population."

[[range]]
