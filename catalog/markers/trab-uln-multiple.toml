slug = "trab-uln-multiple"
name = "TSH Receptor Antibodies (multiple of upper limit of normal)"
category = "thyroid"
unit = "x ULN"
description = "Result expressed as a multiple of the reporting laboratory's upper limit of normal (ULN) rather than in absolute units. Compute it as the measured result divided by the ULN printed on the same laboratory report."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "clinical"
kind = "warn"
high = 25
when = { pregnant = true, trimester = 1, conditions = ["history-of-graves-disease"] }
population = "Pregnant women with a history of Graves disease (n = 500); BRAHMS TRAK human assay on Kryptor Compact Plus (method: brahms-kryptor-trak)"
evidence = "cohort"
citations = [
  { pmid = "41846542", doi = "10.1210/clinem/dgag118", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC13467015/", title = "Maternal TSH-receptor antibodies predict fetal/neonatal hyperthyroidism in pregnancies with a history of Graves disease.", locator = "Abstract" },
]
note = "Trimester 1 TRAb cut-off (multiple of the assay ULN) for risk stratification of fetal/neonatal hyperthyroidism, NPV 100%; assay-specific and may not transfer to other TRAb platforms. Source band >= 25; stored as the warn high bound 25."

