slug = "cgm-time-below-70"
name = "CGM time below range (<70 mg/dL)"
category = "glycemic"
unit = "%"
description = "Percentage of CGM glucose readings (or hours per day) below 70 mg/dL (3.9 mmol/L). The International Consensus on Time in Range sets maximum targets for people with diabetes; the pregnancy threshold is 63 mg/dL."
no_reference = "No general clinical reference interval is cited; see the diagnostic, target and alternative ranges."

[[range]]
set = "target"
kind = "optimal"
high = 4
when = { conditions = ["diabetes"] }
population = "Adults and children with type 1 or type 2 diabetes (non-pregnant, not older/high-risk)"
evidence = "consensus"
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table 3" },
]
note = "Time below range 54-69 and below 54 mg/dL is separate; this target is for time below 70 mg/dL (3.9 mmol/L), less than 4 percent (less than 1 h per day). Source kind: target."

[[range]]
set = "alt-1"
kind = "optimal"
high = 1
when = { conditions = ["diabetes"] }
population = "Older and/or high-risk adults with type 1 or type 2 diabetes"
evidence = "consensus"
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table 3" },
]
note = "Time below 70 mg/dL (3.9 mmol/L) for older and/or high-risk individuals, less than 1 percent (less than 15 min per day); the consensus stresses reducing time below 70 mg/dL in this group. Applies only to: risk=older-or-high-risk. Source kind: target. Alternative to the default target optimal range for the same population."

[[range]]
set = "target"
kind = "optimal"
high = 4
when = { pregnant = true, conditions = ["type-1-diabetes"] }
population = "Pregnant women with type 1 diabetes"
evidence = "consensus"
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table 4" },
]
note = "Pregnancy threshold is below 63 mg/dL (3.5 mmol/L), not 70 mg/dL; target is less than 4 percent (less than 1 h per day). Source kind: target."
