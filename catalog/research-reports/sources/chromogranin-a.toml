slug = "chromogranin-a"
name = "Chromogranin A"
loinc = "9811-1"
category = "tumor-marker"
unit = "ng/mL"
description = "Neuroendocrine secretory granule protein measured in serum or plasma by immunoassay. Used to screen, diagnose and monitor neuroendocrine neoplasms. Expected result in healthy people: within the reference interval, at or below the upper limit. Levels vary between individuals and assays."

[[range]]
set = "reference"
kind = "reference"
high = 95
when = { specimen = "serum", method = "chromoa-elisa" }
population = "Healthy volunteers, Chromoa ELISA (serum); age and sex not stated in the abstract"
evidence = "reference-interval-study"
note = "Upper reference interval limit stated by the source for the Chromoa ELISA."
citations = [
  { pmid = "26554519", doi = "10.1016/j.cca.2015.11.007", title = "A chromogranin A ELISA absent of an apparent high-dose hook effect observed in other chromogranin A ELISAs.", locator = "Abstract, Methods and Results", quote = "The reference interval was established utilizing healthy volunteers. ... An upper reference interval limit of 95ng/ml was established." },
]

[[range]]
set = "reference"
kind = "reference"
low = 32
high = 118
unit = "ug/L"
when = { specimen = "plasma", age_min = 0, age_max = 4 }
population = "Healthy children aged 0-3 years (familial cancer and allergy screening cohorts; 268 children and adolescents in total), Brahms Kryptor assay, plasma"
evidence = "reference-interval-study"
note = "Paediatric plasma CgA reference interval, age 0-3 years. Analysed with the R referenceInterval package per the source Methods. Source unit ug/L."
citations = [
  { pmid = "37678836", doi = "10.1177/00045632231202652", title = "Paediatric reference ranges for plasma chromogranin A.", locator = "Abstract, Results", quote = "The plasma CgA concentration decreased with age and was 32-118 ug/L for children aged 0-3 years, 18-85 ug/L for children aged 4-13 years, and 6-79 ug/L for adolescents aged 14-19 years." },
]

