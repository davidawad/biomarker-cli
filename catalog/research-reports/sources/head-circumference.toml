slug = "head-circumference"
name = "Head Circumference"
category = "growth"
unit = "cm"
description = "Occipital-frontal head circumference, a growth measurement. Microcephaly is defined from age- and sex-specific growth standards (WHO Child Growth Standards z-scores); the ranges below give the term-newborn centimetre equivalents of the WHO -2 SD and -3 SD cut-offs as listed in Pan American Health Organization and WHO case definitions."

[[range]]
set = "clinical"
kind = "diagnostic"
high = 31.9
when = { sex = "male", age_max = 0.02 }
population = "Term male newborns aged 0-6 days; PAHO case definition based on the WHO Child Growth Standards (-2 SD)"
evidence = "guideline"
note = "Microcephaly: head circumference strictly below -2 SD WHO standard (below 31.9 cm in term males). Cut-off as reported in the PAHO case definition table of the cited paper."
citations = [
  { pmid = "29284702", doi = "10.9745/GHSP-D-17-00116", title = "High Background Congenital Microcephaly in Rural Guatemala: Implications for Neonatal Congenital Zika Virus Infection Screening.", url = "https://pubmed.ncbi.nlm.nih.gov/29284702/", locator = "Table 1", quote = "Term: OFC <-2 SD WHO GC for males (<31.9 cm) and females (<31.5 cm)" },
]

