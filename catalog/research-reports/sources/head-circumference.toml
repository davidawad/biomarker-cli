]

[[range]]
set = "clinical"
kind = "diagnostic"
high = 30.7
when = { sex = "male", age_max = 0.02, conditions = ["severe-microcephaly"] }
population = "Newborn males aged 0-6 days, suspected term, unknown gestational age; WHO case definition (-3 SD)"
evidence = "guideline"
note = "Severe microcephaly: head circumference strictly below -3 SD WHO standard (below 30.7 cm in males aged 0-6 days)."
citations = [
