slug = "choline"
name = "Choline"
category = "methylation"
unit = "umol/L"
description = "Free choline in serum or plasma, a dietary methyl-group precursor that feeds betaine and phosphatidylcholine synthesis; measured by NMR or mass spectrometry. Reference intervals are specimen-specific (serum and EDTA plasma differ). Expected result in healthy adults: within the reference interval."

[[range]]
set = "reference"
kind = "reference"
high = 20.0
when = { specimen = "serum" }
population = "Apparently healthy adults; serum; NMR assay (cohort size and age range not stated in the abstract)"
evidence = "reference-interval-study"
note = "Serum choline reference interval, upper limit. The lower limit is reported only as below the serum LOQ of 7.1 umol/L, so no lower bound is recorded."
citations = [
  { pmid = "34871562", doi = "10.1016/j.cca.2021.11.031", title = "Quantification of choline in serum and plasma using a clinical nuclear magnetic resonance analyzer.", locator = "Abstract (Results)", quote = "In a population of apparently healthy adults, the reference interval was <7.1-20.0 umol/L (serum) and <5.9-13.1 umol/L (plasma)." },
]

