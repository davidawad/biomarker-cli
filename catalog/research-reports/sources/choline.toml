set = "reference"
kind = "reference"
high = 13.1
when = { specimen = "plasma" }
population = "Apparently healthy adults; plasma; NMR assay (cohort size and age range not stated in the abstract)"
evidence = "reference-interval-study"
note = "Plasma choline reference interval, upper limit. The lower limit is reported only as below the plasma LOQ of 5.9 umol/L, so no lower bound is recorded."
citations = [
