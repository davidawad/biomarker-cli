slug = "reticulocytes-abs"
name = "Reticulocytes (absolute)"
category = "cbc"
unit = "10^9/L"
description = "Absolute number of reticulocytes per litre of blood, the young red cells released from the marrow, as counted by automated analysers. Low counts suggest reduced marrow output; high counts indicate increased erythropoiesis, as after blood loss or haemolysis."

