slug = "dhea"
name = "DHEA (Dehydroepiandrosterone, unconjugated)"
category = "adrenal"
unit = "ng/dL"
description = "Unconjugated adrenal androgen precursor, measured by LC-MS/MS. Levels fall steeply with age, and the sulfated form DHEA-S is a separate marker. Interpret against age- and sex-matched intervals."

[[range]]
set = "adrenal-steroids-lcms-2017"
kind = "reference"
low = 1.9
high = 40.5
unit = "nmol/L"
when = { specimen = "plasma", method = "lc-ms/ms" }
population = "Volunteers aged 18-81 years (median 42), 525 people with (n=227) and without (n=298) hypertension, both sexes pooled"
evidence = "reference-interval"
note = "Median with 2.5th-97.5th percentile for both sexes together (Table 3). Source unit is nmol/L; numbers are not converted. Pooled across ages, so use the sex- and age-specific ranges where they apply."
citations = [
  { pmid = "28479316", doi = "10.1016/j.cca.2017.05.002", title = "Reference intervals for plasma concentrations of adrenal steroids measured by LC-MS/MS: Impact of gender, age, oral contraceptives, body mass index and blood pressure status.", url = "https://pubmed.ncbi.nlm.nih.gov/28479316/", locator = "Table 3", quote = "DHEA | 10.3 | [1.9–40.5] | 11.1 | [2.5–46.7]§ | 10.1 | [1.7–38.3]" },
]

