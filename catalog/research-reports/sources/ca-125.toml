slug = "ca-125"
name = "Cancer Antigen 125"
loinc = "10334-1"
category = "tumour"
unit = "U/mL"
description = "Cancer antigen 125, a glycoprotein marker used mainly in the evaluation of ovarian cancer. It is also raised by many benign conditions (including menstruation, endometriosis, pregnancy and other pelvic or peritoneal disease), so it is interpreted with clinical context."
aliases = ["CA125", "CA-125"]

[[range]]
set = "ca125-validation-2015"
kind = "decision"
low = 35
population = "Women with benign gynaecological disease, ovarian cancer and healthy controls (Turkish cohort, 2015)"
evidence = "validation-study"
note = "Diagnostic cut-off of 35 U/mL used in this study to separate ovarian cancer from benign disease. Boundary as quoted (>= 35 taken as elevated). Pre- versus post-menopausal cut-offs differ in other sources and were not verified here, so no menopause condition is set."
citations = [
  { pmid = "26390703", title = "Diagnostic performances of CA125, HE4, and ROMA index in ovarian cancer.", url = "https://pubmed.ncbi.nlm.nih.gov/26390703/", locator = "Abstract, Results", quote = "CA125 and HE4 cut-offs were 35 U/ml and 70 pmol/L, respectively." },
]

