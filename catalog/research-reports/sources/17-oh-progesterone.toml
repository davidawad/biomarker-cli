slug = "17-oh-progesterone"
name = "17-Hydroxyprogesterone"
category = "adrenal"
unit = "ng/dL"
description = "Steroid intermediate of cortisol synthesis, raised by 21-hydroxylase deficiency. Used in newborn screening for congenital adrenal hyperplasia and, with an ACTH-stimulated test, to diagnose non-classic CAH."

[[range]]
set = "newborn-screening-2026"
kind = "diagnostic"
low = 12
unit = "ng/mL"
when = { conditions = ["newborn-screening"], age_unit = "days" }
population = "Neonates in a CAH newborn-screening programme (tertiary referral centre); the authors' referral cut-off that triggered neonatal recall"
evidence = "outcome"
note = "Newborn screening recall cut-off in ng/mL as used by the authors' programme, not a guideline threshold. Values below it can still represent non-classic CAH (the source reports mildly elevated values below recall in most cases). Basal and ACTH-stimulated cut-offs from the 2018 Endocrine Society CAH guideline could not be verified with the available tools."
citations = [
  { pmid = "41976932", doi = "10.3390/jcm15072631", title = "Early Risk Stratification in Non-Classical Congenital Adrenal Hyperplasia Based on Newborn 17-OHP Screening Values, Hormonal Findings, and Genotype.", url = "https://pubmed.ncbi.nlm.nih.gov/41976932/", locator = "Results", quote = "only two patients (5.7%) exceeded the referral cut-off value of 12 ng/mL, thus triggering neonatal recall." },
]

[[range]]
set = "lcms-17ohp-ncah-2020"
kind = "diagnostic"
low = 6
unit = "nmol/L"
when = { method = "lc-ms/ms" }
population = "Retrospective single-centre chart review (n=188) of patients tested for 17OHP; LC-MS/MS measurement, basal (baseline) 17OHP"
evidence = "outcome"
note = "Baseline (basal) 17OHP screening cut-off in nmol/L by LC-MS/MS; the authors report it as the most accurate screening value for nonclassic CAH and state it supports current guidelines. Values at or above it warrant ACTH stimulation testing. Not an ng/dL value (ng/dL not stated in source)."
citations = [
  { pmid = "32110745", doi = "10.1210/jendso/bvz030", title = "Screening for Nonclassic Congenital Adrenal Hyperplasia in the Era of Liquid Chromatography-Tandem Mass Spectrometry.", url = "https://pubmed.ncbi.nlm.nih.gov/32110745/", locator = "Abstract, Conclusions", quote = "a baseline 17OHP ≥ 6 nmol/L most accurately screened for NCCAH; this supports current practice guidelines." },
]

[[range]]
set = "cah-practice-guideline-restated"
kind = "warn"
low = 6
high = 30
unit = "nmol/L"
when = {}
population = "Patients evaluated for nonclassic CAH (basal 17OHP before ACTH stimulation), as restated from CAH practice guidelines"
evidence = "review"
note = "Borderline zone for basal 17OHP: 6 to 30 nmol/L prompts a 250 mcg ACTH stimulation test. Restates CAH guideline values; the sentence does not name the guideline (the paywalled Endocrine Society 2018 CAH guideline is the presumed source, not verified here). Values below 6 nmol/L are said to exclude CAH."
citations = [
  { pmid = "32110745", doi = "10.1210/jendso/bvz030", title = "Screening for Nonclassic Congenital Adrenal Hyperplasia in the Era of Liquid Chromatography-Tandem Mass Spectrometry.", url = "https://pubmed.ncbi.nlm.nih.gov/32110745/", locator = "Introduction (full text)", quote = "Clinical practice guidelines recommend that a result less than 6 nmol/L excludes CAH and greater than 30 nmol/L is diagnostic; 6–30 nmol/L prompts a 250 mcg ACTH stimulation test where a 60-minute peak above 30 nmol/L is diagnostic [2]." },
]

[[range]]
