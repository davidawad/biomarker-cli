[[range]]
set = "psa-biopsy-thresholds-2009"
kind = "warn"
low = 2.0
high = 3.0
when = { sex = "male" }
population = "Men undergoing PSA-based prostate cancer detection (review of European screening data)"
evidence = "consensus"
note = "Borderline band: PSA 2.0-3.0 ng/mL warrants more frequent re-testing rather than immediate biopsy. Boundaries as quoted; not a guideline threshold."
citations = [
  { pmid = "19357513", doi = "10.1097/MOU.0b013e328329a2d0", title = "Defining the optimal prostate-specific antigen threshold for the diagnosis of prostate cancer.", url = "https://pubmed.ncbi.nlm.nih.gov/19357513/", locator = "Abstract, Summary", quote = "Men presenting with PSA values of 2.0-3.0 ng/ml should be reexamined more frequently." },
]

[[range]]
set = "psa-biopsy-thresholds-2009"
kind = "decision"
low = 4.0
when = { sex = "male" }
population = "Men undergoing PSA-based prostate cancer detection (review of European screening data)"
evidence = "consensus"
note = "Biopsy-decision cut-off: PSA at or above 4.0 ng/mL is one of the commonly used thresholds (>2.5, 3.0 or 4.0 ng/mL were all considered reasonable). Age-specific thresholds may be preferable in older men; 5-alpha-reductase inhibitor users need PSA interpreted with caution."
citations = [
  { pmid = "19357513", doi = "10.1097/MOU.0b013e328329a2d0", title = "Defining the optimal prostate-specific antigen threshold for the diagnosis of prostate cancer.", url = "https://pubmed.ncbi.nlm.nih.gov/19357513/", locator = "Abstract, Summary", quote = "At this time, PSA cutoff values (>2.5, 3.0 or 4.0 ng/ml) provide a reasonable balance between excessive detection rates and the risk of missing relevant prostate cancer." },
]

[[range]]
set = "nice-ng12-2021"
kind = "decision"
low = 2.5
when = { sex = "male", age_min = 40, age_max = 50, setting = "possible-prostate-cancer-symptoms" }
population = "Men with possible symptoms of prostate cancer (lower urinary tract symptoms, erectile dysfunction or visible haematuria), aged 40-49, in primary care"
evidence = "guideline"
note = "Age-specific referral threshold (NICE NG12, recommendation 1.6.3, Table 2): consider a suspected cancer pathway referral if PSA is more than 2.5 ng/mL (micrograms/litre). Boundary is > (strictly more than). Trans women and non-binary people with male reproductive organs are covered by the same recommendation."
citations = [
  { url = "https://www.nice.org.uk/guidance/ng12/chapter/Recommendations", title = "Suspected cancer: recognition and referral", locator = "Recommendation 1.6.3, Table 2 Age-specific PSA thresholds", quote = "40 to 49 More than 2.5 50 to 59 More than 3.5 60 to 69 More than 4.5 70 to 79 More than 6.5" },
]

