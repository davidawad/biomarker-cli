[[range]]
set = "pcrmp-as-cited-2024"
kind = "decision"
low = 3.0
when = { sex = "male", age_min = 50, age_max = 70, setting = "asymptomatic-screening" }
population = "Asymptomatic men aged 50-69 undergoing opportunistic PSA testing in UK primary care (PCRMP threshold, as described in a 2024 UK clinical consensus)"
evidence = "consensus"
note = "PCRMP referral threshold of 3.0 ng/mL for asymptomatic men aged 50-69 (boundary >= 3.0 as stated). Cited here from a 2024 UK consensus that questions its rationale; the PCRMP document itself was not retrieved. A 2023 review notes the PCRMP threshold is 3 ng/mL regardless of age, which is not separately quoted as a range."
citations = [
  { pmid = "39038964", doi = "10.3399/BJGP.2023.0586", title = "Optimising the use of the prostate-specific antigen blood test in asymptomatic men for early prostate cancer detection in primary care: report from a UK clinical consensus.", url = "https://pubmed.ncbi.nlm.nih.gov/39038964/", locator = "Full text, Results", quote = "the current threshold of ≥3.0 ng/mL for asymptomatic patients aged 50–69 years" },
]
