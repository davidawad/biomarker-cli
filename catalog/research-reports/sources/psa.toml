slug = "psa"
name = "Prostate Specific Antigen"
loinc = "2857-1"
category = "tumour"
unit = "ng/mL"
description = "Total prostate-specific antigen, a protein made by the prostate and measured in serum. Levels rise with age, benign prostate enlargement and prostate cancer, so it is used for prostate cancer screening and monitoring with age-specific interpretation."
aliases = ["PSA", "total PSA", "tPSA"]

[[range]]
set = "oesterling-1993"
kind = "reference"
high = 2.5
when = { sex = "male", age_min = 40, age_max = 50 }
population = "Community-based population of healthy men (Oesterling 1993 age-specific reference ranges)"
evidence = "reference-interval-study"
note = "Age-specific 95th percentile of total PSA for men aged 40-49 years. Values above this range are abnormal for the age band; the lower limit is 0 and is omitted."
citations = [
  { pmid = "7688054", title = "Serum prostate-specific antigen in a community-based population of healthy men. Establishment of age-specific reference ranges.", url = "https://pubmed.ncbi.nlm.nih.gov/7688054/", locator = "Abstract, Results", quote = "The recommended reference range for serum PSA (95th percentile) for men aged 40 to 49 years is 0.0 to 2.5 ng/mL; for 50 to 59 years, 0.0 to 3.5 ng/mL; 60 to 69 years, 0.0 to 4.5 ng/mL; and 70 to 79 years, 0.0 to 6.5 ng/mL." },
]

