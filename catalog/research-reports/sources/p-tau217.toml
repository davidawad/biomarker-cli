population = "Subjective cognitive decline, MCI and AD-dementia patients (Lumipulse G600II)"
evidence = "outcome-study"
note = "Above the upper cut-off (specificity 96%): predicts Core 1 positivity (amyloid PET / CSF). Assay- and cohort-specific."
