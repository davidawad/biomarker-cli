slug = "c-peptide"
name = "C-Peptide"
category = "glycemic"
unit = "ng/mL"
description = "C-peptide is secreted in equimolar amounts with insulin and measures endogenous insulin secretion. Used to classify diabetes and guide treatment, interpreted differently for fasting, stimulated and urine tests."

[[range]]
set = "clinical"
kind = "diagnostic"
high = 0.2
unit = "nmol/L"
when = { conditions = ["diabetes"], fasting = false }
population = "People with insulin-treated diabetes; stimulated (non-fasting random, post-glucagon or mixed-meal) C-peptide"
evidence = "consensus"
note = "Absolute insulin deficiency / absolute insulin requirement (strictly below). Source unit nmol/L (1 nmol/L = 3 ng/mL); numbers not converted."
citations = [
  { pmid = "23413806", doi = "10.1111/dme.12159", title = "The clinical utility of C-peptide measurement in the care of patients with diabetes.", locator = "Table 1", quote = "| Absolute insulin deficiency/absolute insulin requirement [76] | < 0.2 | < 0.08 | < 0.2" },
]

