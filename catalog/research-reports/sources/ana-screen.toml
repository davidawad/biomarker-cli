slug = "ana-screen"
name = "Antinuclear Antibody (ANA) Screen"
loinc = "8061-4"
category = "autoimmune"
unit = "titer"
description = "Screen for antinuclear antibodies by indirect immunofluorescence on HEp-2 cells (or an immunoassay), reported as positive or negative and, when positive, as a serum titer (dilution). Tracked as an autoimmune screening test; a positive result is non-specific and must be interpreted with clinical findings. Expected result: negative. Low-titer positives occur in a minority of healthy people."

[[range]]
set = "clinical"
kind = "diagnostic"
low = 160
population = "Serum from healthy individuals and patients with SLE, systemic sclerosis, Sjogren's syndrome, RA or soft tissue rheumatism, tested by indirect immunofluorescence on HEp-2 cells at dilutions 1:40 to 1:320"
evidence = "outcome-study"
note = "Titer at or above which the multi-laboratory study proposed a high-specificity positive cut-off to confirm disease (excludes about 95% of healthy individuals). Not a guideline cut-off."
citations = [
  { pmid = "9324014", title = 'Range of antinuclear antibodies in "healthy" individuals.', locator = "Abstract (Results and Conclusion)", quote = "a high positive cutoff at 1:160 serum dilution (high specificity, low sensitivity)" },
]
