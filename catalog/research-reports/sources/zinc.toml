slug = "zinc"
name = "Zinc, Serum"
category = "mineral"
unit = "µg/dL"
description = "Serum or plasma zinc, the usual laboratory measure of zinc status. Low values indicate zinc deficiency at the population level, and the IZiNCG cut-offs depend on age, sex and fasting status of the blood sample. Cut-offs are population-level tools and are not diagnostic for an individual."

[[range]]
set = "clinical"
kind = "diagnostic"
high = 65
when = { age_max = 10, fasting = false }
population = "Children under 10 years, morning non-fasting serum samples (IZiNCG cut-off as applied in the cited study)"
evidence = "consensus"
note = "Low serum zinc: strictly below 65 ug/dL (IZiNCG cut-off, morning non-fasting sample). Applies to any sex. Population-level cut-off, not an individual diagnosis. The cited source gives no afternoon cut-off."
citations = [
  { pmid = "40461893", doi = "10.1007/s00277-025-06429-4", title = "Zinc level and its impact on the phenotype of sickle cell disease.", locator = "Methods (Zinc determination)", quote = "at a cut-off value of 65 ug/dl for children < 10 years old (whatever their gender)" },
