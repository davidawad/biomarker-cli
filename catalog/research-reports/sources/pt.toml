slug = "pt"
name = "Prothrombin time"
loinc = "5902-2"
category = "coagulation"
unit = "s"
description = "Clotting time of citrated plasma after tissue factor and calcium are added, reflecting the extrinsic and common pathways. Prolonged values suggest factor VII, X, V, II or fibrinogen deficiency, vitamin K antagonist effect or liver disease; it is standardised as INR for anticoagulation monitoring."

[[range]]
set = "parturient-coag-ri"
kind = "reference"
low = 8.7
high = 12.1
when = { pregnant = true }
population = "10,472 parturient women (women at delivery) in one laboratory, age-specific intervals pooled"
evidence = "reference-interval"
note = "Reference interval calculated per CLSI C28-A3 on an ACL TOP 700 analyser. The study also reports age-specific intervals; the pooled interval is given here. Seconds, not INR."
citations = [
  { pmid = "30934105", doi = "10.1055/s-0039-1683932", title = "Age-Specific Reference Intervals for PT, aPTT, Fibrinogen and Thrombin Time for Parturient Women.", locator = "Abstract, Results", quote = "The RIs of PT, aPTT, FIB and TT were 8.7 to 12.1 seconds" },
]

[[range]]
set = "debre-berhan-2025"
kind = "reference"
low = 8.5
high = 13.0
when = { sex = "male", age_min = 18, age_max = 51 }
population = "120 healthy male adults aged 18-50 in Debre Berhan town, Ethiopia (240 healthy adults in total)"
evidence = "reference-interval"
note = "Non-parametric 2.5th-97.5th percentiles, Sysmex CA-104 semi-automated analyser (reagent not named). Seconds. Combined sexes 8.5-13.0 s."
citations = [
  { pmid = "41275213", doi = "10.1186/s12959-025-00808-7", title = "Coagulation parameters reference interval for adult population of Debre Berhan town, Northeast Ethiopia.", locator = "Table 3", quote = "PT (Second) | M | 10.4(9.7–11.2) | 8.5–13 | 0.0006* | F | 9.8(9.3–10.6) | 8.5–12.8" },
]

