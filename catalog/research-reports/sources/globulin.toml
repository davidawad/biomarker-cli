slug = "globulin"
name = "Globulin (calculated)"
category = "liver"
unit = "g/dL"
description = "Calculated globulin (total protein minus albumin). Raised globulin reflects immunoglobulin and acute-phase protein levels and is associated with higher mortality in dialysis patients."

