[[range]]
set = "clinical"
kind = "warn"
low = 3.8
when = { conditions = ["hemodialysis"] }
population = "Incident hemodialysis patients (retrospective cohort, 2007-2011)"
evidence = "outcome-study"
note = "Globulin above 3.8 g/dL was associated with higher all-cause and infection-related mortality (fully adjusted HR 1.11 for all-cause) versus the 3.0 to <3.2 g/dL reference group. Association only; not a treatment target."
citations = [
  { pmid = "34617572", doi = "10.1093/ndt/gfab292", title = "Association of serum globulin with all-cause mortality in incident hemodialysis patients.", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9494081/", locator = "Abstract (Results)", quote = "Patients with a globulin concentration >3.8 g/dL had a higher all-cause and infection-related mortality risk" },
]

