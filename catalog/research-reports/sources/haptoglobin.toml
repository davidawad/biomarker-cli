slug = "haptoglobin"
name = "Haptoglobin"
loinc = "4542-7"
category = "cbc"
unit = "g/L"
description = "Plasma glycoprotein that binds free haemoglobin released from red-cell destruction and clears it via CD163 macrophages. Low values indicate ongoing intravascular or extravascular haemolysis (or reduced hepatic synthesis); it is an acute-phase protein, so it can rise with inflammation."

