description = "IgG antibody to Epstein-Barr virus nuclear antigen 1 (EBNA-1). Usually appears after recovery from primary EBV infection and so indicates past infection; it is interpreted together with VCA IgM and VCA IgG to tell acute from past infection. Expected result: negative in people without past EBV infection; positive in people with past infection."
