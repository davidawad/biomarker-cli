slug = "visceral-adipose-tissue"
name = "Visceral Adipose Tissue"
loinc = "73707-2"
category = "body-composition"
unit = "g"
description = "Visceral adipose tissue (VAT) mass, the fat stored in the abdominal cavity around organs, estimated by whole-body DXA. People track it as a cardiometabolic risk marker; VAT is associated with blood pressure, triglycerides, LDL-cholesterol, glucose and insulin resistance. Expected result: sex-specific; roughly twice as high in men as in women in young adults. Reference values below come from one healthy 20-30 year-old sample; no clinical cut-off for DXA-derived VAT is established here."

[[range]]
set = "reference"
kind = "reference"
low = 103.4
high = 1259.4
when = { sex = "male", age_min = 20, age_max = 31, method = "dxa-ge-prodigy-corescan" }
population = "Healthy European men aged 20-30 years (n=207), GE Healthcare Prodigy DXA with CoreScan"
evidence = "reference-interval-study"
note = "Source Table 2 gives the 10th and 90th percentiles (central 80%, not 2.5th-97.5th). The source calls its percentile tables reference values."
citations = [
