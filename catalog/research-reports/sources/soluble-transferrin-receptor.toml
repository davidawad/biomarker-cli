slug = "soluble-transferrin-receptor"
name = "Soluble transferrin receptor"
loinc = "30248-9"
category = "iron"
unit = "mg/L"
description = "Circulating fragment of the transferrin receptor that rises as tissue iron supply falls and erythropoietic activity increases. It is less affected by inflammation than ferritin, but values depend on the assay and are not standardised between manufacturers."

[[range]]
set = "roche-tina-quant-multicentre"
kind = "reference"
low = 2.2
high = 5.0
source_unit = "mg/l"
source_factor = 1
when = { sex = "male" }
population = "Healthy adults, multicentre evaluation of the Roche Tina-quant sTfR immunoturbidimetric assay (Hitachi and cobas integra analysers)"
evidence = "reference-interval"
note = "Assay-specific 95% range from the manufacturer-linked multicentre study; the authors note results differed up to 2.5-fold between methods, so verify locally."
