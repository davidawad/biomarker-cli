slug = "psa-density"
name = "PSA Density"
category = "tumour"
unit = "ng/mL/cm3"
description = "Serum PSA divided by prostate volume (cm3) measured by imaging. It helps judge whether a raised PSA is explained by a large prostate or suggests clinically significant cancer."

[[range]]
set = "psa-density-2026"
kind = "decision"
low = 0.15
when = { sex = "male" }
population = "Men with suspected prostate cancer who had MRI-derived prostate volume (single-centre retrospective cohort)"
evidence = "cohort-study"
note = "PSA density (PSA divided by prostate volume) threshold of 0.15 ng/mL/cm3 used in current practice for clinically significant cancer. The study evaluated its performance across volumes and ages; boundary not stated in the quoted sentence. Not a PSA mass-concentration threshold; the unit is ng/mL per cm3."
citations = [
  { pmid = "42599322", doi = "10.1007/s00345-026-06613-9", title = "PSA density for clinically significant prostate cancer detection: a retrospective cohort study on the influence of age and prostate volume.", url = "https://pubmed.ncbi.nlm.nih.gov/42599322/", locator = "Abstract, Purpose", quote = "Current practice applies a uniform PSAD threshold of 0.15 ng/ml/cm³" },
]
