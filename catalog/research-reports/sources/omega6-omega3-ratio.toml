slug = "omega6-omega3-ratio"
name = "Omega-6/Omega-3 Ratio"
category = "fatty-acid"
unit = "ratio"
description = "Ratio of omega-6 to omega-3 polyunsaturated fatty acids in plasma or red cells, computed from the measured fatty-acid totals. Tracked as an index of dietary fatty-acid balance. Expected result: a number with no single target; lower values are generally considered more favourable. Higher ratios were associated with higher all-cause and cardiovascular mortality in one UK Biobank cohort (PMID 38578269), and a 2008 review states the optimal ratio varies by disease (PMID 18408140)."
no_reference = "Computed ratio with no established numeric reference interval or target; sources state the optimal ratio depends on the disease, so no range is encoded."
