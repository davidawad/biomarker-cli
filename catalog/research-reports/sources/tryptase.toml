slug = "tryptase"
name = "Tryptase"
loinc = "21582-2"
category = "allergy"
unit = "ng/mL"
description = "Mast cell protease measured in serum. Basal (resting) tryptase screens for mastocytosis, hereditary alpha-tryptasemia (HaT) and other causes of elevation; acute tryptase during suspected anaphylaxis is compared with baseline. Expected result in healthy people: basal tryptase within the normal range of 1 to 15 ng/mL."

[[range]]
set = "reference"
kind = "reference"
low = 1
high = 15
population = "Asymptomatic controls, including HaT-positive persons (literature screen, consensus proposal)"
evidence = "consensus"
note = "Basal serum tryptase normal range proposed by an expert consensus (ECNM and AIM). Based on 2 SD covering the 95% confidence interval across a literature screen."
citations = [
  { pmid = "37572755", doi = "10.1016/j.jaip.2023.08.008", title = "The Normal Range of Baseline Tryptase Should Be 1 to 15 ng/mL and Covers Healthy Individuals With HαT.", locator = "Abstract", quote = "the normal basal tryptase in asymptomatic controls (HαT-positive persons included) ranges between 1 and 15 ng/mL" },
]

[[range]]
set = "clinical"
kind = "warn"
high = 8
population = "General population for basal serum tryptase (genetic context: HaT)"
evidence = "consensus"
note = "Genetically determined normal upper tryptase limit proposed by the consensus; below it the likelihood of HaT is rather low."
citations = [
  { pmid = "37572755", doi = "10.1016/j.jaip.2023.08.008", title = "The Normal Range of Baseline Tryptase Should Be 1 to 15 ng/mL and Covers Healthy Individuals With HαT.", locator = "Consensus proposal paragraph", quote = "This proposal includes a genetically determined normal upper tryptase limit of 8 ng/mL below which the likelihood of HαT is rather low." },
]

