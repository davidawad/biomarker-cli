slug = "ldl-c-direct"
name = "LDL Cholesterol (direct)"
loinc = "18262-6"
category = "lipid"
unit = "mg/dL"
description = "Cholesterol carried in low-density lipoprotein particles, measured directly by laboratory assay rather than calculated from the lipid profile. The primary lipid target of cholesterol-lowering therapy. Used to classify ATP III LDL-C categories and to set LDL-lowering goals by cardiovascular risk. Expected result for a healthy adult: below 100 mg/dL (optimal)."

[[range]]
set = "clinical"
kind = "optimal"
high = 100
when = { age_min = 20 }
population = "Adults aged 20 years or older"
evidence = "guideline"
note = "Optimal: strictly below 100 mg/dL (ATP III)."
citations = [
  { url = "https://www.nhlbi.nih.gov/files/docs/guidelines/atp3xsum.pdf", title = "ATP III Executive Summary (NHLBI)", locator = "Table 2", quote = "LDL Cholesterol <100 Optimal 100-129 Near optimal/above optimal 130-159 Borderline high 160-189 High >=190 Very high" },
]

