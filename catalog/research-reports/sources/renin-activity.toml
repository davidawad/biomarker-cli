slug = "renin-activity"
name = "Plasma Renin Activity"
category = "adrenal"
unit = "ng/mL/h"
description = "Measure of the enzymatic generation of angiotensin I by renin in plasma. Low (suppressed) renin with high aldosterone points to primary aldosteronism; renin is also monitored during mineralocorticoid receptor antagonist therapy."

[[range]]
set = "endocrine-society-2025"
kind = "diagnostic"
high = 1
when = { method = "lc-ms/ms", markers = [ { slug = "aldosterone", op = ">=", value = 7.5, unit = "ng/dL" } ] }
population = "Adults screened for primary aldosteronism; PRA and PAC by LC-MS/MS (Endocrine Society 2025 criteria as summarised in a 2026 analysis)"
evidence = "review"
note = "Suppressed renin for screening: PRA at or below 1 ng/mL/h, applied together with PAC at or above 7.5 ng/dL and ARR above 15."
citations = [
  { pmid = "42751802", doi = "10.1161/HYPERTENSIONAHA.126.27634", title = "Evaluation of Current Screening Thresholds for the Detection of Primary Aldosteronism.", url = "https://pubmed.ncbi.nlm.nih.gov/42751802/", locator = "Abstract, Background", quote = "plasma renin activity (PRA) ≤1 ng/mL per hour, plasma aldosterone concentration (PAC) ≥7.5 ng/dL by liquid chromatography-tandem mass spectrometry, and aldosterone-to-renin ratio >15" },
]

[[range]]
set = "renin-status-outcomes-2025"
kind = "target"
high = 1.0
when = { on_treatment = "mineralocorticoid receptor antagonist" }
population = "Adults with primary aldosteronism on medical treatment with mineralocorticoid receptor antagonists (24 studies, 6621 patients)"
evidence = "meta-analysis"
note = "Renin cut-off used in most studies to classify post-treatment renin as suppressed (below) or unsuppressed (at or above). Unsuppressed renin was associated with fewer cardiovascular events; the authors suggest renin normalisation as a possible treatment target, which prospective trials still need to confirm."
citations = [
  { pmid = "41235994", doi = "10.1016/S2213-8587(25)00263-3", title = "Post-treatment renin status and cardiovascular, renal, and mortality outcomes in medically treated primary aldosteronism: a systematic review and meta-analysis.", url = "https://pubmed.ncbi.nlm.nih.gov/41235994/", locator = "Abstract, Findings", quote = "Most studies used plasma renin activity with a cut-off of 1·0 ng/mL per h to classify post-treatment renin as suppressed or unsuppressed." },
]
