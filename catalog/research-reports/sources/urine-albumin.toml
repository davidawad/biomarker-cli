slug = "urine-albumin"
name = "Urine Albumin"
loinc = "1754-1"
category = "kidney"
unit = "mg/g"
description = "Albumin excreted in urine, measured as the spot urine albumin-to-creatinine ratio (ACR) in mg/g for CKD staging and diabetic kidney disease screening. Albuminuria is the marker of kidney damage used with GFR to define CKD (KDIGO albuminuria categories A1-A3). Expected result for a healthy adult: below 30 mg/g (A1). Ranges below apply to the ACR, not to the raw urine albumin concentration (mg/L)."

[[range]]
set = "clinical"
kind = "reference"
high = 30
when = {}
population = "Adults; spot urine albumin-to-creatinine ratio"
evidence = "guideline"
note = "Albuminuria category A1 (normal to mildly increased), strictly below 30 mg/g. Category A1 does not by itself define CKD."
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", title = "KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD", locator = "Table 2 (albuminuria categories in CKD)", quote = "A1 <30 <3 <30 Normal to mildly increased" },
]

[[range]]
set = "clinical"
kind = "warn"
low = 30
high = 300
when = {}
population = "Adults; spot urine albumin-to-creatinine ratio"
evidence = "guideline"
note = "Albuminuria category A2 (moderately increased), 30 to 300 mg/g. Relative to the young adult level, per KDIGO footnote."
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", title = "KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD", locator = "Table 2 (albuminuria categories in CKD)", quote = "A2 30-300 3-30 30-300 Moderately increaseda" },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 300
when = {}
population = "Adults; spot urine albumin-to-creatinine ratio"
evidence = "guideline"
note = "Albuminuria category A3 (severely increased), strictly above 300 mg/g."
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", title = "KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD", locator = "Table 2 (albuminuria categories in CKD)", quote = "A3 >300 >30 >300 Severely increased" },
]
