slug = "ast-alt-ratio"
name = "AST/ALT Ratio (De Ritis)"
loinc = "1916-6"
category = "liver"
unit = "ratio"
description = "Ratio of aspartate aminotransferase to alanine aminotransferase (AST/ALT), the De Ritis ratio. Used to help separate alcohol-related liver injury from nonalcoholic steatohepatitis and to flag possible cirrhosis. Expected result in a healthy adult is about 0.7 to 2.1; values below 1 suggest NASH and values of 2 or above suggest alcoholic liver disease."

[[range]]
set = "reference"
kind = "reference"
low = 0.7
high = 2.1
population = "Healthy adults, Gandaki Province, Nepal (combined sexes)"
evidence = "reference-interval-study"
note = "Combined 95% reference interval for AST/ALT ratio in healthy adults."
citations = [
  { pmid = "38722987", doi = "10.1371/journal.pgph.0001865", title = "Establishment of dry-chemistry-based reference intervals of routine liver function tests for the adult population of Gandaki Province, Nepal.", locator = "Abstract", quote = "AST/ALT ratio: 0.7-2.1" },
]

[[range]]
set = "clinical"
kind = "diagnostic"
high = 1
population = "Adults with NASH or alcoholic liver disease (matched case-control study)"
evidence = "outcome-study"
note = "Below 1: pattern suggesting NASH rather than alcoholic liver disease. Discriminates between the two; not a standalone diagnosis."
citations = [
  { pmid = "10201476", doi = "10.1111/j.1572-0241.1999.01006.x", title = "The ratio of aspartate aminotransferase to alanine aminotransferase: potential value in differentiating nonalcoholic steatohepatitis from alcoholic liver disease.", locator = "Abstract (Conclusions)", quote = "Although values < 1 suggest NASH, a ratio of > or = 2 is strongly suggestive of alcoholic liver disease." },
]

