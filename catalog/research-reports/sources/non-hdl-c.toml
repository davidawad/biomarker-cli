[[range]]
set = "clinical"
kind = "target"
unit = "mmol/L"
high = 2.6
when = { conditions = ["established-cvd"] }
population = "Adults with established cardiovascular disease (secondary prevention)"
evidence = "guideline"
note = "NICE NG238 secondary-prevention non-HDL-C target, stated in mmol/L; numbers kept as the source states them."
citations = [
  { url = "https://www.nice.org.uk/guidance/ng238/chapter/recommendations", locator = "Recommendation 1.7.1", quote = "For secondary prevention of CVD, aim for LDL cholesterol levels of 2.0 mmol per litre or less, or non-HDL cholesterol levels of 2.6 mmol per litre or less." },
]

