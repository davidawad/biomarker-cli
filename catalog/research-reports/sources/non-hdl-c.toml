kind = "warn"
low = 145
when = { fasting = true }
population = "Fasting samples (lab flagging, EAS/EFLM consensus)"
evidence = "consensus"
note = "Laboratory flag for abnormal fasting non-HDL-C."
citations = [
  { pmid = "27122601", doi = "10.1093/eurheartj/ehw152", title = "Fasting is not routinely required for determination of a lipid profile: clinical and laboratory implications including flagging at desirable concentration cut-points-a joint consensus statement from the European Atherosclerosis Society and European Federation of Clinical Chemistry and Laboratory Medicine.", locator = "Results / flagging section (full text)", quote = "non-HDL cholesterol >=3.8 mmol/L (145 mg/dL)" },
]

