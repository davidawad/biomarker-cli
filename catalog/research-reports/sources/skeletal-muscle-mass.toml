slug = "skeletal-muscle-mass"
name = "Skeletal Muscle Mass"
category = "body-composition"
unit = "kg"
description = "Skeletal muscle mass in kilograms. The sourced cut-offs below are for DXA appendicular lean mass (lean mass of the arms and legs), the proxy used to define low lean mass in sarcopenia."

[[range]]
set = "clinical"
kind = "diagnostic"
high = 19.75
when = { sex = "male", conditions = ["sarcopenia-screening"] }
population = "Older adults, pooled FNIH Sarcopenia Project cohorts (7,582 men), DXA appendicular lean mass"
evidence = "guideline"
note = "Low lean mass: DXA appendicular lean mass (ALM) strictly below this value in men. Cutpoint discriminating weakness (grip strength <26 kg). ALM, not total skeletal muscle mass."
citations = [
  { pmid = "24737559", doi = "10.1093/gerona/glu023", title = "Cutpoints for low appendicular lean mass that identify older adults with clinically significant weakness.", url = "https://pubmed.ncbi.nlm.nih.gov/24737559/", locator = "Abstract, Results", quote = "CART models identified cutpoints for low lean mass (ALM <19.75kg in men and <15.02kg in women)" },
]

[[range]]
set = "clinical"
kind = "diagnostic"
high = 15.02
when = { sex = "female", conditions = ["sarcopenia-screening"] }
population = "Older adults, pooled FNIH Sarcopenia Project cohorts (3,688 women), DXA appendicular lean mass"
evidence = "guideline"
note = "Low lean mass: DXA appendicular lean mass (ALM) strictly below this value in women. Cutpoint discriminating weakness (grip strength <16 kg). ALM, not total skeletal muscle mass."
citations = [
  { pmid = "24737559", doi = "10.1093/gerona/glu023", title = "Cutpoints for low appendicular lean mass that identify older adults with clinically significant weakness.", url = "https://pubmed.ncbi.nlm.nih.gov/24737559/", locator = "Abstract, Results", quote = "CART models identified cutpoints for low lean mass (ALM <19.75kg in men and <15.02kg in women)" },
]
