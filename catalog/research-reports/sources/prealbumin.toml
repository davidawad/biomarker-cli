slug = "prealbumin"
name = "Prealbumin (Transthyretin)"
loinc = "14338-8"
category = "protein"
unit = "mg/dL"
description = "Prealbumin, also called transthyretin, a serum transport protein measured to assess nutritional status. In systemic AL amyloidosis, serum prealbumin was an independent predictor of survival in one cohort. Expected result in a healthy adult: a value within the laboratory's reference interval; no numeric healthy-population reference interval was verified for this marker."

[[range]]
set = "clinical"
kind = "warn"
low = 200
unit = "mg/L"
when = { conditions = ["al-amyloidosis"] }
population = "Outpatients with systemic immunoglobulin light-chain (AL) amyloidosis; serum prealbumin"
evidence = "outcome-study"
note = "Lower reference limit as stated by the authors of this single cohort study (values below it are reported as below the lower reference limit). Not a healthy-population reference interval."
citations = [
  { pmid = "16469994", title = "Nutritional status of outpatients with systemic immunoglobulin light-chain amyloidosis 1.", locator = "Abstract (Results)", quote = "Serum prealbumin was <200 mg/L (lower reference limit) in 26 patients (24.5%)." },
]
