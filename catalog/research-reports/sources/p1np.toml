slug = "p1np"
name = "Procollagen Type 1 N-Terminal Propeptide"
category = "bone"
unit = "ng/mL"
description = "Propeptide released when type I procollagen is cleaved during bone formation. A bone formation marker used with serum CTX to monitor osteoporosis treatment. Results depend strongly on the assay used."

