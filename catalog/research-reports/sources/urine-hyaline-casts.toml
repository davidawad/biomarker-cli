population = "Healthy newborns and infants in the second month of life (75 subjects); bright-field microscopy"
evidence = "reference-interval-study"
note = "Upper reference value for hyaline casts by bright-field microscopy in newborns and infants in the second month of life. Source unit is x10(6)/L, numerically identical to /uL (1 x10(6)/L = 1 /uL), so 0 is unchanged. The age cap of 1 year is the nearest year bound, not a bound stated by the source. No verified adult interval was found."
