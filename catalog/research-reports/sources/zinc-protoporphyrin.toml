when = { conditions = ["iron-deficiency-anemia"] }
population = "Community-dwelling Indian preschool children with and without iron deficiency anemia"
evidence = "outcome-study"
note = "Iron deficiency anemia, high diagnostic likelihood (likelihood ratio 20.2): ZPP/heme strictly above 90 umol/mol heme in children."
citations = [
  { pmid = "30093400", doi = "10.3324/haematol.2018.193243", title = "Optimizing diagnostic biomarkers of iron deficiency anemia in community-dwelling Indian women and preschool children.", locator = "Abstract (Results)", quote = "A zinc-protoporphyrin/heme ratio cut-off >90 umole/mole heme in children and >107 umole/mole heme in women was associated with a high diagnostic likelihood for iron deficiency anemia" },
]

