slug = "transferrin"
name = "Transferrin"
category = "iron"
unit = "mg/dL"
description = "Iron-transport protein made in the liver; its serum concentration is the basis of total iron-binding capacity. It is a negative acute-phase protein, so it falls in inflammation, malnutrition and liver disease, and rises in iron deficiency and pregnancy."

