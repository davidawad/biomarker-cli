slug = "ia-2-antibodies"
name = "IA-2 Autoantibodies (ICA512)"
loinc = "31209-0"
category = "autoimmune"
unit = "U/mL"
description = "IgG autoantibodies against insulinoma-associated antigen-2 (IA-2, ICA512), a beta-cell antigen, measured by immunoassay (radiobinding, ELISA or chemiluminescence). Tracked to screen for and classify islet autoimmunity and type 1 diabetes, alongside GADA, IAA and ZnT8A. Expected result: negative (below the assay positivity cut-off)."
no_reference = "Qualitative result (positive or negative against an assay-specific cut-off); no numeric reference interval applies to the population. The ranges below are assay positivity cut-offs stated by individual studies."

