slug = "ldl-c-martin-hopkins"
name = "LDL Cholesterol, Martin-Hopkins Calculated"
loinc = "96259-7"
category = "lipid"
unit = "mg/dL"
description = "LDL cholesterol calculated from the standard lipid profile (total cholesterol, HDL-C, triglycerides, non-HDL-C) by the Martin-Hopkins method. It replaces the Friedewald fixed triglyceride-to-VLDL-C factor of 5 with an adjustable factor taken from a 180-cell table of triglyceride and non-HDL-C strata (Martin et al., JAMA 2013). Calculated, not measured. Used for the same ATP III LDL-C categories and goals as measured LDL-C. Expected result for a healthy adult: below 100 mg/dL (optimal)."

[[range]]
set = "clinical"
kind = "optimal"
high = 100
when = { age_min = 20 }
population = "Adults aged 20 years or older"
evidence = "guideline"
note = "Optimal: strictly below 100 mg/dL (ATP III), applied to calculated LDL-C."
citations = [
  { url = "https://www.nhlbi.nih.gov/files/docs/guidelines/atp3xsum.pdf", title = "ATP III Executive Summary (NHLBI)", locator = "Table 2", quote = "LDL Cholesterol <100 Optimal 100-129 Near optimal/above optimal 130-159 Borderline high 160-189 High >=190 Very high" },
