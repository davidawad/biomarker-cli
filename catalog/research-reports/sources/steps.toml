slug = "steps"
name = "Daily Step Count"
loinc = "55423-8"
category = "wearable"
unit = "steps/day"
description = "Number of steps taken per day, measured by a wearable or pedometer. Mortality risk falls as daily steps rise, with the benefit levelling off at a plateau that depends on age."

[[range]]
set = "paluch-2022-steps"
kind = "optimal"
low = 6000
high = 8000
when = { age_min = 60 }
population = "Adults aged 60 years and older, pooled individual-participant data from 15 cohorts"
evidence = "meta-analysis"
note = "Plateau of the dose-response for all-cause mortality in adults aged 60 and older (restricted cubic splines, risk decreasing until this level). Not a sedentary cut-off."
citations = [
  { pmid = "35247352", doi = "10.1016/S2468-2667(21)00302-9", title = "Daily steps and all-cause mortality: a meta-analysis of 15 international cohorts.", url = "https://pubmed.ncbi.nlm.nih.gov/35247352/", locator = "Abstract, Findings", quote = "among adults aged 60 years and older with increasing number of steps per day until 6000-8000 steps per day" },
]

[[range]]
set = "ding-2025-steps"
kind = "optimal"
low = 5000
high = 7000
population = "Adults (all ages pooled; the review notes no age-specific analysis)"
evidence = "meta-analysis"
note = "Inflection point of the non-linear dose-response for all-cause mortality, cardiovascular disease incidence, dementia and falls ('around 5000-7000 steps per day'). Pooled across ages."
citations = [
  { pmid = "40713949", doi = "10.1016/S2468-2667(25)00164-1", title = "Daily steps and health outcomes in adults: a systematic review and dose-response meta-analysis.", url = "https://pubmed.ncbi.nlm.nih.gov/40713949/", locator = "Abstract, Findings", quote = "with inflection points at around 5000-7000 steps per day" },
]
