slug = "he4"
name = "HE4 (Human Epididymis Protein 4)"
loinc = "96044-3"
category = "tumor-marker"
unit = "pmol/L"
description = "Human epididymis protein 4, a serum glycoprotein measured by immunoassay. Used with CA125 and the ROMA index in evaluating ovarian tumours and monitoring ovarian cancer. Expected result in healthy women: at or below the reference upper limit, which is higher after menopause."

[[range]]
set = "reference"
kind = "reference"
low = 29.30
high = 68.79
when = { sex = "female", menopause = "pre" }
population = "Healthy premenopausal Chinese women, multicentre study (n = 618 healthy women), ECLIA"
evidence = "reference-interval-study"
note = "Premenopausal healthy reference range (2.5-97.5 % central interval)."
citations = [
  { pmid = "26552478", doi = "10.1186/s13048-015-0201-z", title = "Determination of reference intervals of serum levels of human epididymis protein 4 (HE4) in Chinese women.", locator = "Abstract, Methods and Results", quote = "Confidence intervals (2.5-97.5 %) were determined in different populations. ... In pre-menopause stage, the reference ranges of HE4 level were 29.30-68.79, 28.12-1284.83 and 34.75-981.91 pmol/L in healthy, benign and malignant populations, respectively." },
]

