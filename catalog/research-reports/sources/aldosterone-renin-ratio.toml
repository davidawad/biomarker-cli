slug = "aldosterone-renin-ratio"
name = "Aldosterone-to-Renin Ratio"
category = "adrenal"
unit = "ng/dL per ng/mL/h"
description = "Ratio of plasma aldosterone to renin, the primary screening index for primary aldosteronism in hypertensive patients. A high ratio suggests renin-independent aldosterone excess; cut-offs depend on the renin assay, aldosterone method and age."

[[range]]
set = "endocrine-society-2025"
kind = "diagnostic"
low = 15
when = { method = "lc-ms/ms", markers = [ { slug = "aldosterone", op = ">=", value = 7.5, unit = "ng/dL" }, { slug = "plasma-renin-activity", op = "<=", value = 1, unit = "ng/mL/h" } ] }
population = "Adults screened for primary aldosteronism; ARR with PAC and PRA by LC-MS/MS (Endocrine Society 2025 criteria as summarised in a 2026 analysis)"
evidence = "review"
note = "Endocrine Society 2025 screening criterion: ARR above 15, applied together with PAC at or above 7.5 ng/dL and PRA at or below 1 ng/mL/h. Cited via the Hypertension 2026 analysis, not the guideline full text."
citations = [
  { pmid = "42751802", doi = "10.1161/HYPERTENSIONAHA.126.27634", title = "Evaluation of Current Screening Thresholds for the Detection of Primary Aldosteronism.", url = "https://pubmed.ncbi.nlm.nih.gov/42751802/", locator = "Abstract, Background", quote = "plasma renin activity (PRA) ≤1 ng/mL per hour, plasma aldosterone concentration (PAC) ≥7.5 ng/dL by liquid chromatography-tandem mass spectrometry, and aldosterone-to-renin ratio >15" },
]

[[range]]
set = "china-multicenter-pa-2026"
kind = "diagnostic"
low = 9.3
when = { method = "lc-ms/ms", test = "captopril challenge test, 2 h post-dose" }
population = "Chinese adults at high risk of primary aldosteronism at seven tertiary centres (117 PA, 354 essential hypertension)"
evidence = "outcome"
note = "ARR two hours after the captopril challenge, LC-MS/MS (sensitivity 61%, specificity 85%). Study-derived threshold; the 19.0 seated-saline cut-off is a separate range."
citations = [
  { pmid = "41633645", doi = "10.3760/cma.j.cn112138-20250721-00423", title = "[Establishing LC-MS/MS-based cutoffs for the confirmatory testing for primary aldosteronism: a prospective multi-center study].", url = "https://pubmed.ncbi.nlm.nih.gov/41633645/", locator = "Abstract, Results", quote = "At a diagnostic cutoff of PAC ≥5.7 ng/dl (158.1 pmol/L) or ARR ≥9.3 (ng/dl)/(ng·ml⁻¹·h⁻¹), sensitivity was 61% and specificity was 85%." },
]

[[range]]
set = "china-multicenter-pa-2026"
kind = "diagnostic"
low = 19.0
when = { method = "lc-ms/ms", test = "seated saline infusion test" }
population = "Chinese adults at high risk of primary aldosteronism at seven tertiary centres (117 PA, 354 essential hypertension)"
evidence = "outcome"
note = "ARR after the seated saline infusion test, LC-MS/MS (sensitivity 64%, specificity 85%). Study-derived threshold."
citations = [
  { pmid = "41633645", doi = "10.3760/cma.j.cn112138-20250721-00423", title = "[Establishing LC-MS/MS-based cutoffs for the confirmatory testing for primary aldosteronism: a prospective multi-center study].", url = "https://pubmed.ncbi.nlm.nih.gov/41633645/", locator = "Abstract, Results", quote = "At a PAC cutoff of ≥5.0 ng/dl (138.7 pmol/L), sensitivity was 68% and specificity was 85%, while an ARR cutoff of ≥ 19.0 (ng/dl)/(ng·ml⁻¹·h⁻¹) yielded a sensitivity of 64% and a specificity of 85%." },
]
