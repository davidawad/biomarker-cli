slug = "coronary-artery-calcium"
name = "Coronary Artery Calcium Score (Agatston)"
category = "composite"
unit = "Agatston units"
description = "Coronary artery calcium score measured by non-contrast cardiac CT and quantified with the Agatston method. It reflects the burden of coronary atherosclerotic calcium and refines ASCVD risk, especially when the 10-year risk estimate is uncertain."
aliases = ["CAC score", "Agatston score", "coronary calcium score"]

[[range]]
set = "acc-aha-2019-primary-prevention"
kind = "warn"
low = 1
high = 99
when = { age_min = 55 }
population = "Adults with a coronary artery calcium score measured for a statin decision, primary prevention"
evidence = "guideline"
note = "Some coronary calcium (1-99). Reasonable to initiate statin therapy for patients aged 55 years or older. Boundary semantics: >=1 and <=99. Units are not stated in the quote; the calcium score is the Agatston score."
citations = [
  { pmid = "30894319", doi = "10.1016/j.jacc.2019.03.009", title = "2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease: Executive Summary: A Report of the American College of Cardiology/American Heart Association Task Force on Clinical Practice Guidelines.", url = "https://pubmed.ncbi.nlm.nih.gov/30894319/", locator = "Full text, Recommendations on coronary artery calcium", quote = "If coronary artery calcium score is 1 to 99, it is reasonable to initiate statin therapy for patients ≥55 years of age;" },
]

[[range]]
set = "acc-aha-2018-cholesterol"
kind = "decision"
low = 100
population = "Adults with a coronary artery calcium score measured for a statin decision"
evidence = "guideline"
note = "CAC of 100 Agatston units or higher: statin therapy is indicated unless deferred after clinician-patient risk discussion. The same recommendation also accepts a score at or above the 75th percentile as an equivalent cut-off; that percentile is not a numeric Agatston range and is not encoded here. Lower bound only (open above)."
citations = [
  { pmid = "30586774", doi = "10.1161/CIR.0000000000000625", title = "2018 AHA/ACC/AACVPR/AAPA/ABC/ACPM/ADA/AGS/APhA/ASPC/NLA/PCNA Guideline on the Management of Blood Cholesterol: A Report of the American College of Cardiology/American Heart Association Task Force on Clinical Practice Guidelines.", url = "https://pubmed.ncbi.nlm.nih.gov/30586774/", locator = "Full text, Recommendations on coronary artery calcium", quote = "For any patient, if the CAC score is ≥100 Agatston units or ≥75th percentile, statin therapy is indicated" },
]

[[range]]
set = "scct-cac-drs-2018"
kind = "decision"
low = 100
high = 299
population = "Adults undergoing coronary artery calcium scoring (CAC-DRS reporting categories)"
evidence = "consensus"
note = "CAC-DRS category A2, moderately increased (100-299 Agatston units). The primary SCCT CAC-DRS 2018 document (PMID 29793848) is not retrievable with numbers; the category wording is taken from the review cited here, which summarises the CAC-DRS categories. Boundary semantics: >=100 and <=299."
citations = [
  { pmid = "39445716", doi = "10.1097/HCO.0000000000001185", title = "Beyond the Agatston calcium score: role of calcium density and other calcified plaque markers for cardiovascular disease prediction.", url = "https://pubmed.ncbi.nlm.nih.gov/39445716/", locator = "Full text, CAC-DRS description", quote = "A1: 1–99 AU, A2: 100–299 AU, A3: ≥300 AU" },
]

