  { pmid = "6349344", doi = "10.1016/0002-9343(83)90072-4", title = "Quantitative definition of bacteriuria.", url = "https://pubmed.ncbi.nlm.nih.gov/6349344/", locator = "Abstract", quote = "a criterion of 1 X 10(5) cfu/ml provides optimal separation of infection from contamination of voided urine" },
