population = "Healthy Han Chinese adults (328 individuals) used for reference intervals"
evidence = "reference-interval"
note = "Central 95% reference interval for plasma aldosterone in males on a fully automated DiaSorin CLIA. Posture, sodium intake and age bands are not stated in the abstract."
citations = [
  { pmid = "29684370", doi = "10.1016/j.clinbiochem.2018.04.016", title = "Analytical validation and investigation on reference intervals of aldosterone and renin in Chinese Han population by using fully automated chemiluminescence immunoassays.", url = "https://pubmed.ncbi.nlm.nih.gov/29684370/", locator = "Abstract, Results", quote = "The central 95% reference intervals for males: PAC: 76-722 pmol/L, PRC: 3.3-92.7 mIU/L, ARR: 2.2-46.0 pmol/mIU; for females: PAC: 85-1010 pmol/L, PRC: 3.7-99.8 mIU/L, ARR: 3.6-68.4 pmol/mIU." },
]

