description = "Cardiac troponin I, a myocardial injury marker measured in serum or plasma and used to diagnose myocardial infarction and injury. Expected result for a healthy adult: at or below the 99th percentile upper reference limit. Cut-offs are assay-specific and do not transfer between troponin I methods. Ranges below are the 99th percentile upper reference limits of the Beckman Coulter AccuTnI+3 assay."

