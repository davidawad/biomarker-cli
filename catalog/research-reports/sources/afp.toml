slug = "afp"
name = "Alpha-Fetoprotein"
loinc = "1834-1"
category = "tumour"
unit = "ng/mL"
description = "Alpha-fetoprotein, a fetal serum protein that is normally low in adults. Raised levels are used in hepatocellular carcinoma surveillance and diagnosis, and it can also rise in pregnancy and in germ cell tumours."
aliases = ["AFP", "alpha fetoprotein"]

[[range]]
set = "afp-uln-hbv-2021"
kind = "reference"
high = 13.4
population = "Patients on antiviral treatment for HBV-related liver disease, across several centres"
evidence = "cohort-study"
note = "Upper limit of normal for AFP varied between centres (8.1 to 13.4 ng/mL); 13.4 is the most permissive quoted limit. Assay-dependent. Values above the local ULN are abnormal."
citations = [
  { pmid = "32852885", doi = "10.1111/jvh.13388", title = "Reappraisal of the diagnostic value of alpha-fetoprotein for surveillance of HBV-related hepatocellular carcinoma in the era of antiviral therapy.", url = "https://pubmed.ncbi.nlm.nih.gov/32852885/", locator = "Full text, Results", quote = "The upper limit of normal (ULN) ranges for AFP values among these centres varied between 8.1 and 13.4 ng/mL." },
]

[[range]]
set = "afp-screening-thresholds-2026"
kind = "decision"
low = 20
when = { setting = "screening" }
population = "Patients with liver disease under HCC screening (Veterans Health Administration cohort and UNOS cohort, 2001-2021)"
evidence = "cohort-study"
note = "Surveillance threshold: AFP >= 20 ng/mL flags HCC screening positivity (low sensitivity, high specificity in this cohort). Boundary is >= 20."
citations = [
  { pmid = "41236449", doi = "10.1053/j.gastro.2025.08.021", title = "Changes in Liver Disease Etiology Support a Lower Alpha-Fetoprotein Threshold for Hepatocellular Carcinoma Screening.", url = "https://pubmed.ncbi.nlm.nih.gov/41236449/", locator = "Abstract, Results", quote = "At AFP thresholds ≥20 and ≥10 ng/mL, the overall sensitivity/specificity for HCC screening was 31.7%/98.5% and 41.9%/94.1%, respectively." },
]

[[range]]
set = "afp-screening-thresholds-2026"
kind = "warn"
low = 10
when = { setting = "screening" }
population = "Patients with MASLD, alcohol-related liver disease or cured HCV cirrhosis under HCC screening"
evidence = "cohort-study"
note = "Proposed lower screening threshold: AFP >= 10 ng/mL in MASLD, ALD and cured-HCV cirrhosis raised sensitivity with little loss of specificity. A borderline/early-warning band rather than a diagnostic cut-off."
citations = [
  { pmid = "41236449", doi = "10.1053/j.gastro.2025.08.021", title = "Changes in Liver Disease Etiology Support a Lower Alpha-Fetoprotein Threshold for Hepatocellular Carcinoma Screening.", url = "https://pubmed.ncbi.nlm.nih.gov/41236449/", locator = "Abstract, Conclusions", quote = "reducing the AFP threshold to ≥10 ng/mL would substantially increase sensitivity while maintaining very high specificity" },
]

[[range]]
set = "afp-hcc-cutoffs-2021"
kind = "decision"
low = 100
population = "Patients receiving antiviral treatment for HBV-related HCC surveillance"
evidence = "validation-study"
note = "Confirmatory threshold: AFP >= 100 ng/mL proposed as the confirmatory test, paired with 20 ng/mL for surveillance. Boundary is >= 100."
citations = [
  { pmid = "32852885", doi = "10.1111/jvh.13388", title = "Reappraisal of the diagnostic value of alpha-fetoprotein for surveillance of HBV-related hepatocellular carcinoma in the era of antiviral therapy.", url = "https://pubmed.ncbi.nlm.nih.gov/32852885/", locator = "Abstract, Results", quote = "When setting the cut-off values at 20 ng/mL and 100 ng/mL as surveillance and confirmatory tests respectively for HCC among patients receiving antiviral treatment" },
]

[[range]]
set = "afp-hcc-cutoffs-2021"
kind = "decision"
low = 400
population = "Patients with HBV-related liver disease; cut-off as cited from guidelines"
evidence = "validation-study"
note = "Diagnostic-level threshold: AFP >= 400 ng/mL is a cut-off recommended by some guidelines (the cited study showed 200 and 400 ng/mL had lower sensitivity than 20 and 100 ng/mL). Boundary is >= 400. The primary AASLD/EASL text was not retrieved; the value is taken from this cited study's description."
citations = [
  { pmid = "32852885", doi = "10.1111/jvh.13388", title = "Reappraisal of the diagnostic value of alpha-fetoprotein for surveillance of HBV-related hepatocellular carcinoma in the era of antiviral therapy.", url = "https://pubmed.ncbi.nlm.nih.gov/32852885/", locator = "Abstract, Results", quote = "AFP exhibited a significantly higher sensitivity than those of 200 ng/mL and 400 ng/mL, which are currently recommended by some guidelines" },
]

