slug = "phase-angle"
name = "Phase Angle (BIA)"
loinc = "107160-4"
category = "body-composition"
unit = "°"
description = "Phase angle (PhA, degrees) calculated from body resistance and reactance measured by bioelectrical impedance analysis (BIA). An indicator of cellular integrity and body cell mass, tracked as a body-composition and nutrition marker. Expected result: sex- and age-specific; higher in men than women, peaking in midlife and declining with age. No single cut-off applies across populations."

[[range]]
set = "reference"
kind = "reference"
low = 5.8
high = 8.7
when = { sex = "male", age_min = 10, age_max = 20 }
population = "Healthy Colombian males aged 10-19 years (n=533 in the 10-19 y band)"
evidence = "reference-interval-study"
note = "Source Table 2 gives P3 to P97 (central 94%, not 2.5th-97.5th), tabulated as normative reference values."
citations = [
  { pmid = "42000911", doi = "10.1038/s41430-026-01744-z", title = "Reference values for bioelectrical impedance-derived phase angle: a cross-sectional study of 5,049 healthy individuals from Colombia.", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC13341315/", locator = "Table 2", quote = "| 10-19 y | 533 | 1.3 | 0.1 | 5.8 | 6.3 | 6.8 | 7.3 | 7.8 | 8.2 | 8.7" },
]

