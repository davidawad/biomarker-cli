slug = "anticardiolipin-igm"
name = "Anticardiolipin IgM Antibody"
loinc = "3182-3"
category = "autoimmune"
unit = "MPL"
description = "IgM autoantibody to cardiolipin (anticardiolipin, aCL), measured by ELISA or chemiluminescence and reported in M phospholipid units (MPL). Used with IgG aCL and anti-beta-2-glycoprotein I tests in the evaluation of antiphospholipid syndrome. Expected result in people without antiphospholipid syndrome: below the laboratory's cut-off, usually not detected. Isolated IgM positivity carries low weight in the 2023 ACR/EULAR classification criteria."

[[range]]
set = "clinical"
kind = "diagnostic"
low = 40
high = 79
unit = "units"
when = { conditions = ["antiphospholipid-syndrome"] }
population = "Patients evaluated for primary antiphospholipid syndrome under the 2023 ACR/EULAR classification criteria"
evidence = "outcome-study"
note = "Moderate aCL positivity band (40-79 units) as the cited paper describes the 2023 ACR/EULAR criteria. The source gives units only (arbitrary units, not MPL); the number is copied as stated. Isolated IgM positivity is scored low-weight in those criteria."
citations = [
  { pmid = "39689033", doi = "10.1093/rheumatology/keae665", title = "Insights into the 2023 ACR/EULAR antiphospholipid syndrome classification criteria: findings from a cohort of 205 patients with primary APS.", locator = "Introduction", quote = "moderate (40-79 units) and high positivity (>80 units)" },
]

