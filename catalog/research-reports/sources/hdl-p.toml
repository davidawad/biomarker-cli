slug = "hdl-p"
name = "HDL Particle Number"
loinc = "49748-7"
category = "lipid"
unit = "umol/L"
description = "Total HDL particle concentration (HDL-P) measured by NMR spectroscopy, reported in umol/L. Tracked because NMR-measured HDL-P has been reported as more strongly associated with coronary artery disease and incident cardiovascular events than HDL cholesterol. Expected result: within the laboratory reference interval."

[[range]]
set = "reference"
kind = "reference"
low = 22.0
high = 46.0
when = { sex = "male", method = "nmr" }
population = "Men in a clinical NMR HDL-P method study (Vantera analyzer); population description not in the abstract"
evidence = "reference-interval-study"
note = "Male reference interval stated by the source for HDL-P on the Vantera NMR analyzer. Derivation method and sample size are not in the abstract."
citations = [
  { pmid = "25438074", doi = "10.1016/j.clinbiochem.2014.11.017", title = "HDL particle number measured on the Vantera®, the first clinical NMR analyzer.", locator = "Abstract, Results", quote = "The reference intervals were different between men (22.0 to 46.0 umol/L) and women (26.7 to 52.9 umol/L)." },
]

