name = "Nocturnal SpO2"
category = "wearable"
unit = "%"
description = "Overnight pulse-oximetry oxygen saturation. Sustained low nocturnal SpO2 defines sleep-related hypoxemia (ICSD-3) and is used as a surrogate for sleep hypoventilation."

