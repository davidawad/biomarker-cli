slug = "appendicular-lean-mass-index"
name = "Appendicular Lean Mass Index (ALM/height2)"
category = "body"
unit = "kg/m2"
description = "Appendicular lean mass (muscle mass of the arms and legs, usually from DXA or bioimpedance) divided by height squared. Used as the muscle-quantity criterion for sarcopenia; low values indicate low muscle quantity."
aliases = ["ALM/height2", "appendicular skeletal muscle index", "ASM/height2", "SMI"]

[[range]]
set = "ewgsop2-2019"
kind = "decision"
high = 7.0
when = { sex = "male" }
population = "Older adults (European consensus); cut-offs for low muscle quantity in men"
evidence = "consensus"
note = "Low muscle quantity if below 7.0 kg/m2 in men (strict less-than boundary). Confirms sarcopenia when combined with low strength. Measurement method not specified in the quoted text."
citations = [
  { pmid = "30312372", doi = "10.1093/ageing/afy169", title = "Sarcopenia: revised European consensus on definition and diagnosis.", url = "https://pubmed.ncbi.nlm.nih.gov/30312372/", locator = "Table 3, EWGSOP2 cut-off points for low muscle quantity", quote = "<7.0 kg/m 2" },
]

