[[range]]
set = "gestational-sac-discriminatory-2013"
kind = "diagnostic"
low = 3510
when = { pregnancy = true, trimester = 1 }
population = "Women with first-trimester bleeding or pain, 651 pregnancies (366 viable) with serum beta-hCG and transvaginal ultrasound within 6 hours"
evidence = "outcome"
note = "Discriminatory level at which a gestational sac is predicted to be seen on transvaginal ultrasound 99% of the time. Below this level an empty uterus does not exclude a viable pregnancy. Yolk sac and fetal pole levels are substantially higher."
citations = [
  { pmid = "23262929", doi = "10.1097/aog.0b013e318278f421", title = "Reevaluation of discriminatory and threshold levels for serum β-hCG in early pregnancy.", url = "https://pubmed.ncbi.nlm.nih.gov/23262929/", locator = "Abstract, Results", quote = "Discriminatory β-hCG levels at which structures would be predicted to be seen 99% of the time were 3,510 milli-international units/mL" },
]
