slug = "hcg-quantitative"
name = "Human Chorionic Gonadotropin, Quantitative (beta-hCG)"
category = "pregnancy"
unit = "mIU/mL"
description = "Quantitative beta subunit of human chorionic gonadotropin in serum. Used to confirm and date pregnancy, to judge whether an early pregnancy is viable and intrauterine, and to monitor pregnancy of unknown location. Pituitary secretion raises values modestly in perimenopausal and postmenopausal women."

[[range]]
set = "reference-interval-hcg-ct-2026"
kind = "reference"
high = 5
unit = "IU/L"
when = { pregnancy = false }
population = "Conventional adult non-pregnant reference interval, as cited by the authors of a 2026 age-specific hCG study"
evidence = "reference-interval"
note = "Conventional upper reference limit for non-pregnant adults. The source authors cite it as the conventional value and show it may be inappropriate for women aged 45 and over."
citations = [
  { pmid = "41253215", doi = "10.1016/j.cca.2025.120729", title = "Establishing age-specific reference intervals for serum beta-human chorionic gonadotropin using Hoffmann and nonparametric methods: A big data study based on laboratory databases.", url = "https://pubmed.ncbi.nlm.nih.gov/41253215/", locator = "Abstract, Background", quote = "the conventional reference interval (RI) of <5 IU/L" },
]

[[range]]
set = "hcg-postmenopausal-clia-2026"
kind = "reference"
high = 7.1
unit = "IU/L"
when = { menopause = "post", method = "chemiluminescence immunoassay, Beckman UniCel DxI 800 (System A)" }
population = "Healthy postmenopausal women (n=355 analysed), 460 enrolled, four CLIA systems"
evidence = "reference-interval"
note = "Non-parametric 97.5th percentile upper reference limit for System A. Assay-specific; values from other platforms differ."
citations = [
  { pmid = "42607919", doi = "10.1016/j.cca.2026.121282", title = "Redefining \"Normal\" for hCG in postmenopausal women: 97.5th percentile reference intervals and 99th percentile thresholds across four chemiluminescence immunoassay systems.", url = "https://pubmed.ncbi.nlm.nih.gov/42607919/", locator = "Abstract, Results", quote = "The 97.5th percentile RIs were < 7.1, < 8.2, < 5.7, and < 5.9 IU/L for Systems A-D, respectively" },
]

