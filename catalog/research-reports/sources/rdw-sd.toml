population = "280 healthy Korean adults (male and female pooled) aged 20-40 years, Sysmex XN-2000"
evidence = "reference-interval"
note = "Age-specific reference range from the study table; the RDW-SD difference between age groups was significant, sexes were pooled (no sex effect listed for this item). Analyser-specific."
