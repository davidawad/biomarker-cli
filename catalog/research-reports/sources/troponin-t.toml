slug = "troponin-t"
name = "Troponin T"
category = "cardiac"
unit = "ng/L"
description = "Cardiac troponin T, a myocardial injury marker measured in blood. The ranges below are age- and sex-specific cut-offs for the 99th percentile upper reference limit of the Roche high-sensitivity cardiac troponin T (hs-cTnT) assay, as proposed from three population cohorts; limits are assay-specific and do not transfer to other troponin methods."
aliases = ["cTnT", "troponin T"]

[[range]]
set = "reference"
kind = "reference"
high = 14
when = { sex = "male", age_max = 50 }
population = "Men younger than 50 years; hs-cTnT (Roche) assay; cohorts Dallas Heart Study, ARIC, CHS excluding overt and subclinical cardiovascular and kidney disease"
evidence = "reference-interval-study"
note = "Authors state the 14 ng/L hs-cTnT cutoff should remain only for men younger than 50 years and women younger than 65 years. Upper limit (99th percentile)."
citations = [
  { pmid = "24530665", doi = "10.1016/j.jacc.2013.12.032", title = "Age- and sex-dependent upper reference limits for the high-sensitivity cardiac troponin T assay.", url = "https://pubmed.ncbi.nlm.nih.gov/24530665/", locator = "Discussion", quote = "the cutoff value for the hs-cTnT assay should remain 14 ng/L only for men younger than 50 years and for women younger than 65 years" },
  { pmid = "24530665", doi = "10.1016/j.jacc.2013.12.032", title = "Age- and sex-dependent upper reference limits for the high-sensitivity cardiac troponin T assay.", url = "https://pubmed.ncbi.nlm.nih.gov/24530665/", locator = "Abstract, Objectives", quote = "The study sought to determine the 99th percentile upper reference limit for the high-sensitivity cardiac troponin T assay (hs-cTnT) in 3 large independent cohorts." },
]

[[range]]
set = "reference"
kind = "reference"
high = 14
when = { sex = "female", age_max = 65 }
population = "Women younger than 65 years; hs-cTnT (Roche) assay; cohorts Dallas Heart Study, ARIC, CHS excluding overt and subclinical cardiovascular and kidney disease"
evidence = "reference-interval-study"
note = "Authors state the 14 ng/L hs-cTnT cutoff should remain only for men younger than 50 years and women younger than 65 years. The true 99th percentile for women younger than 50 may be lower than 14 ng/L per the authors."
citations = [
  { pmid = "24530665", doi = "10.1016/j.jacc.2013.12.032", title = "Age- and sex-dependent upper reference limits for the high-sensitivity cardiac troponin T assay.", url = "https://pubmed.ncbi.nlm.nih.gov/24530665/", locator = "Discussion", quote = "the cutoff value for the hs-cTnT assay should remain 14 ng/L only for men younger than 50 years and for women younger than 65 years" },
  { pmid = "24530665", doi = "10.1016/j.jacc.2013.12.032", title = "Age- and sex-dependent upper reference limits for the high-sensitivity cardiac troponin T assay.", url = "https://pubmed.ncbi.nlm.nih.gov/24530665/", locator = "Abstract, Objectives", quote = "The study sought to determine the 99th percentile upper reference limit for the high-sensitivity cardiac troponin T assay (hs-cTnT) in 3 large independent cohorts." },
]

[[range]]
set = "reference"
kind = "reference"
high = 17
when = { sex = "male", age_min = 50, age_max = 65 }
population = "Men aged 50-64 years; hs-cTnT (Roche) assay; proposed cutoff from the lowest 99th percentile across three cohorts' reference subcohort 2"
evidence = "reference-interval-study"
note = "Proposed upper cutoff (needs clinical validation per the authors)."
citations = [
  { pmid = "24530665", doi = "10.1016/j.jacc.2013.12.032", title = "Age- and sex-dependent upper reference limits for the high-sensitivity cardiac troponin T assay.", url = "https://pubmed.ncbi.nlm.nih.gov/24530665/", locator = "Discussion", quote = "we propose that cutoff values for the hs-cTnT assay be increased to 17 ng/L for men aged 50-64 and for women aged 65 or older, and to 31 ng/L for men aged 65 or older" },
  { pmid = "24530665", doi = "10.1016/j.jacc.2013.12.032", title = "Age- and sex-dependent upper reference limits for the high-sensitivity cardiac troponin T assay.", url = "https://pubmed.ncbi.nlm.nih.gov/24530665/", locator = "Abstract, Objectives", quote = "The study sought to determine the 99th percentile upper reference limit for the high-sensitivity cardiac troponin T assay (hs-cTnT) in 3 large independent cohorts." },
]

