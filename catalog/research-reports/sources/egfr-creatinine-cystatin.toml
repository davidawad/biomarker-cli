slug = "egfr-creatinine-cystatin"
name = "eGFR (Creatinine + Cystatin C, CKD-EPI 2021)"
loinc = "98980-6"
category = "kidney"
unit = "mL/min/1.73m²"
description = "Estimated glomerular filtration rate from the race-free CKD-EPI 2021 creatinine-cystatin C equation (Inker et al., NEJM 2021), reported in mL/min/1.73 m2. Combining creatinine and cystatin C is more accurate than creatinine alone and is used to confirm GFR when creatinine-based estimates are unreliable. Used to classify GFR categories G1-G5 and, with albuminuria, to define chronic kidney disease. Expected result for a healthy adult: 90 or higher (G1)."

