slug = "estrone"
name = "Estrone"
category = "hormone"
unit = "pg/mL"
description = "Weak estrogen, the main circulating estrogen after menopause (made mostly by aromatization of androstenedione in fat and other tissues). Measured by LC-MS/MS, since immunoassays are unreliable at low concentrations. Interpret by sex, puberty stage and menopausal status."

[[range]]
set = "copenhagen-estrogens-2020"
kind = "reference"
high = 20
unit = "pmol/L"
when = { sex = "male", age_min = 4, age_max = 8, tanner_max = 1, method = "lc-ms/ms" }
population = "Healthy boys aged 4-8 years (prepubertal), Copenhagen and Aarhus cohorts, LC-MS/MS (n=1838 across all ages)"
evidence = "reference-interval"
note = "Descriptive upper bound from the results text, not a formal percentile: in the youngest prepubertal boys, both E1 and E2 were below 20 pmol/L in all individuals. Source unit pmol/L (20 pmol/L is about 5.4 pg/mL). Treat as approximate."
citations = [
