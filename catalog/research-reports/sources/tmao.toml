citations = [
  { pmid = "32084001", doi = "10.1515/cclm-2019-1146", title = "Trimethylamine-N-oxide (TMAO) determined by LC-MS/MS: distribution and correlates in the population-based PopGen cohort.", locator = "Abstract, Results", quote = "The median TMAO plasma concentration in men was 3.91 (Q1-Q3: 2.87-6.10) umol/L and the reference interval 1.28-19.67 umol/L (2.5th-97.5th percentile)." },
]

