slug = "metanephrine-free"
name = "Metanephrine, Plasma Free"
category = "adrenal"
unit = "pg/mL"
description = "Free metanephrine, the O-methylated metabolite of epinephrine, measured in plasma. Elevated values support a diagnosis of pheochromocytoma or paraganglioma; plasma free metanephrines are a recommended first-line test."

[[range]]
set = "ankara-bilkent-2026"
kind = "reference"
high = 90
when = {}
population = "Adults (>=18 y) tested for catecholamine metabolites at Ankara Bilkent City Hospital, Feb 2019 to May 2023; local laboratory reference limit"
evidence = "reference-interval"
note = "Upper reference limit as stated by the reporting laboratory (LC-MS/MS). Single-centre limit, not an age-specific or external reference interval; verify against the local assay."
citations = [
  { pmid = "41750736", doi = "10.3390/diagnostics16040588", title = "Seasonal and Climatic Influences on Catecholamine Metabolite Levels in Patients With and Without Pheochromocytoma-Paraganglioma.", url = "https://pubmed.ncbi.nlm.nih.gov/41750736/", locator = "Results (reference limits)", quote = "The reference limit for plasma metanephrine was <90 pg/mL, plasma normetanephrine between February 2019 and February 2022 was <200 pg/mL, and after February 2022 was <180 pg/mL." },
]

[[range]]
set = "age-adjusted-plasma-mn-2013"
kind = "reference"
high = 0.45
unit = "nmol/L"
when = { method = "lc-ms/ms" }
population = "Supine-sampled adults and children (n=1226, age 5-84 y) and a separate validation group of 3888 patients tested for pheochromocytoma, in a 2013 study"
evidence = "reference-interval"
note = "Optimised upper cut-off for plasma metanephrine (nmol/L) chosen for diagnostic specificity in the source; the fixed reference limit in that study was 0.32 nmol/L. Source unit nmol/L; not converted."
citations = [
  { pmid = "23065528", doi = "10.1258/acb.2012.012066", title = "Reference intervals for plasma free metanephrines with an age adjustment for normetanephrine for optimized laboratory testing of phaeochromocytoma.", url = "https://pubmed.ncbi.nlm.nih.gov/23065528/", locator = "Abstract, Results", quote = "together with a higher cut-off for metanephrine (0.45 versus 0.32 nmol/L), resulted in a substantial gain in diagnostic specificity" },
]

[[range]]
set = "seated-lcms-urls-2016"
kind = "reference"
high = 510
unit = "pmol/L"
when = { method = "lc-ms/ms", specimen = "plasma" }
population = "Subjects (n=113) sampled in the seated position in whom pheochromocytoma/paraganglioma had been excluded, as restated from the laboratory's earlier method publication"
evidence = "reference-interval"
note = "Seated-sampling upper reference limit for plasma metanephrine by LC-MS/MS as stated by the authors. Seated values differ from supine intervals; the limit is from a single laboratory."
citations = [
  { pmid = "28856203", doi = "10.1016/j.plabm.2016.05.001", title = "Evaluating the optimum rest period prior to blood collection for fractionated plasma free metanephrines analysis.", url = "https://pubmed.ncbi.nlm.nih.gov/28856203/", locator = "Introduction (full text)", quote = "The method has been published in detail with the upper reference limits (URLs) established in subjects (n=113) in the seated position in whom the diagnosis of PPGL had been excluded (NMN set at 1180 pmol/L and MN set at 510 pmol/L)" },
]
