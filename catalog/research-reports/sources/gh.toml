slug = "gh"
name = "Growth Hormone"
category = "pituitary"
unit = "ng/mL"
description = "Pituitary hormone secreted in pulses that drives growth and IGF-1 production. Random levels are not diagnostic: acromegaly is assessed by GH suppression during an oral glucose load, and GH deficiency by peak GH after a stimulation test, with cut-offs that depend on the assay, test, BMI and age."

[[range]]
set = "jcem-acromegaly-diagnosis-2026"
kind = "diagnostic"
high = 0.4
unit = "µg/L"
when = { test = "oral glucose tolerance test, GH nadir with an ultrasensitive assay", conditions = ["suspected-acromegaly"] }
population = "Adults with suspected acromegaly (clinical review)"
evidence = "review"
note = "GH nadir below this value during an OGTT is a normal response when an ultrasensitive assay is used; higher nadirs are non-suppressive. Assay-dependent."
citations = [
  { pmid = "42056759", doi = "10.1210/clinem/dgag189", title = "Acromegaly diagnosis.", url = "https://pubmed.ncbi.nlm.nih.gov/42056759/", locator = "Text, OGTT section", quote = "Rather than the 1-µg/L threshold recommended by the Endocrine Society clinical practice guideline >10 years ago (30), a nadir serum GH level less than 0.4 µg/L should be used as a normal response to glucose load when an ultrasensitive assay is used (38, 39)." },
]

[[range]]
set = "endocrine-society-2014"
kind = "diagnostic"
high = 1
unit = "µg/L"
when = { test = "oral glucose tolerance test, GH nadir" , conditions = ["suspected-acromegaly"] }
population = "Adults with suspected acromegaly"
evidence = "review"
note = "Older GH nadir threshold (1 ug/L) as quoted by the 2026 review, which describes it as superseded for ultrasensitive assays. Taken from that review's summary; the 2014 guideline text itself was not retrieved."
citations = [
  { pmid = "42056759", doi = "10.1210/clinem/dgag189", title = "Acromegaly diagnosis.", url = "https://pubmed.ncbi.nlm.nih.gov/42056759/", locator = "Text, OGTT section", quote = "Rather than the 1-µg/L threshold recommended by the Endocrine Society clinical practice guideline >10 years ago (30), a nadir serum GH level less than 0.4 µg/L should be used as a normal response to glucose load when an ultrasensitive assay is used (38, 39)." },
]

[[range]]
set = "fda-macimorelin"
kind = "diagnostic"
high = 2.8
when = { test = "macimorelin oral stimulation test" }
population = "Adults undergoing macimorelin stimulation testing (retrospective single-centre cohort, n=37)"
evidence = "outcome"
note = "FDA-approved peak GH cut-off for adult GH deficiency: a peak below this value is consistent with GHD. Real-world yield compared with the 5.1 ng/mL post-hoc cut-off."
citations = [
  { pmid = "41793495", doi = "10.1007/s11102-026-01654-0", title = "Real-world diagnostic performance of the macimorelin stimulation test in the diagnosis of adult growth hormone deficiency.", url = "https://pubmed.ncbi.nlm.nih.gov/41793495/", locator = "Abstract, Purpose", quote = "The FDA-approved GH cut-off is 2.8 ng/mL, whereas post-hoc analyses proposed a cut-off of 5.1 ng/mL." },
]

[[range]]
set = "macimorelin-post-hoc"
kind = "diagnostic"
high = 5.1
when = { test = "macimorelin oral stimulation test" }
population = "Adults undergoing macimorelin stimulation testing (retrospective single-centre cohort, n=37)"
evidence = "outcome"
note = "Post-hoc peak GH cut-off for adult GH deficiency proposed in analyses of the macimorelin test; not the FDA-approved value. Classifies more patients as deficient than 2.8 ng/mL."
citations = [
  { pmid = "41793495", doi = "10.1007/s11102-026-01654-0", title = "Real-world diagnostic performance of the macimorelin stimulation test in the diagnosis of adult growth hormone deficiency.", url = "https://pubmed.ncbi.nlm.nih.gov/41793495/", locator = "Abstract, Purpose", quote = "The FDA-approved GH cut-off is 2.8 ng/mL, whereas post-hoc analyses proposed a cut-off of 5.1 ng/mL." },
]

[[range]]
set = "itt-bmi-cutoffs-2026"
kind = "diagnostic"
high = 2.8
when = { test = "insulin tolerance test", conditions = ["bmi-below-30"] }
population = "Adults with suspected adult GH deficiency; exploratory study using a clinical reference standard"
evidence = "outcome"
note = "Optimal peak GH cut-off on the insulin tolerance test for normal-weight and overweight patients (BMI below 30 kg/m2 per the study's grouping). Exploratory single-study estimate."
citations = [
  { pmid = "42792742", doi = "10.3390/biomedicines14092001", title = "Insulin Tolerance Test in Adult GH Deficiency: An Exploratory Study Deriving BMI-Dependent Cut-Offs Using a Clinical Reference Standard.", url = "https://pubmed.ncbi.nlm.nih.gov/42792742/", locator = "Abstract, Results", quote = "The optimal GH cut-off was 2.8 μg/L for patients with normal weight (SE 84.6%, SP 97.4%) and those with overweight (SE 100%, SP 92.3%), and 2.1 μg/L for patients with obesity (SE 88.2%, SP 87.5%)." },
]

[[range]]
