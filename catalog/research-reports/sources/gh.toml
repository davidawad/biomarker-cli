]

[[range]]
set = "pituitary-glucagon-gst-2015"
kind = "diagnostic"
high = 1.07
unit = "µg/L"
when = { test = "4 h glucagon stimulation test" }
population = "Adults with pituitary disease (n=216) and healthy controls (n=26), single centre, retrospective"
evidence = "outcome"
note = "Lower GST peak GH cut-off proposed for adult GH deficiency; a 2015 single-centre study, not a guideline value. Compare with the 3.00 ug/L cut-off, which 46% of healthy controls failed."
citations = [
  { pmid = "26129876", doi = "10.1007/s11102-015-0666-1", title = "Can a glucagon stimulation test characterized by lower GH cut-off value be used for the diagnosis of growth hormone deficiency in adults?", url = "https://pubmed.ncbi.nlm.nih.gov/26129876/", locator = "Abstract, Conclusions", quote = "A 4 h GST with a diagnostic GH threshold of 1.07 µg/L seems to be a good diagnostic method for GHD." },
]

[[range]]
set = "aace-2019"
kind = "diagnostic"
high = 1
unit = "µg/L"
when = { test = "glucagon stimulation test", conditions = ["obesity"] }
population = "Adults with suspected GH deficiency and obesity (BMI above 30 kg/m2)"
evidence = "review"
note = "Obesity-specific glucagon peak cut-point as summarized in a 2026 childhood-onset GHD study (41521526); the primary AACE 2019 text was not retrievable, so verify against the guideline before clinical use."
citations = [
  { pmid = "41521526", doi = "10.1210/clinem/dgaf674", title = "GH Response to Glucagon in Transition: Role of Body Mass Index and Etiology in Childhood-onset GH Deficiency.", url = "https://pubmed.ncbi.nlm.nih.gov/41521526/", locator = "Introduction", quote = "the AACE guidelines suggest a lower peak GH cut-point of 1 μg/L for patients with obesity (BMI > 30 kg/m2)" },
]

[[range]]
set = "national-ghd-criteria"
kind = "diagnostic"
high = 8
unit = "µg/L"
when = { age_max = 18, test = "insulin tolerance test, arginine or glucagon stimulation on two separate days" }
population = "Children and adolescents with suspected childhood-onset GH deficiency"
evidence = "review"
note = "Current peak GH cut-off (less than 8 ug/L) used for confirming childhood GHD, from national recommendations as described in a 2026 study. Two separate stimulation tests are required."
citations = [
  { pmid = "41521526", doi = "10.1210/clinem/dgaf674", title = "GH Response to Glucagon in Transition: Role of Body Mass Index and Etiology in Childhood-onset GH Deficiency.", url = "https://pubmed.ncbi.nlm.nih.gov/41521526/", locator = "Results, GHD diagnosis", quote = "The diagnosis of GHD in childhood or adolescence was established following confirmation of inadequate GH secretion through 2 separate stimulation tests performed on 2 different days (peak GH concentration after ITT, arginine, GST below 10 µg/L until 2014 and less than 8 µg/L thereafter), according to national recommendations (22)." },
]

