slug = "t4-total"
name = "Total T4 (Thyroxine)"
loinc = "3026-2"
category = "thyroid"
unit = "µg/dL"
description = "Total serum thyroxine, bound plus free. Levels follow binding protein concentrations, so it rises in pregnancy and with oestrogen exposure; free T4 is usually preferred for diagnosis."

[[range]]
set = "second-trimester-ethnicity-2007"
kind = "reference"
low = 6.90
high = 13.67
when = { pregnancy = true, trimester = 2 }
population = "Pregnant women in the US (Asian, Black, Hispanic and White), antibody-negative with normal TSH, ARCHITECT immunoassay"
evidence = "reference-interval"
note = "Nonparametric 2.5th-97.5th percentile for all participants, in ug/dL as printed. Source also gives 89.0-176.3 nmol/L."
citations = [
  { pmid = "17712003", doi = "10.1373/clinchem.2007.089680", title = "Second-trimester reference intervals for thyroid tests: the role of ethnicity.", url = "https://pubmed.ncbi.nlm.nih.gov/17712003/", locator = "Abstract, Results", quote = "89.0-176.3 nmol/L (6.90-13.67 mug/dL; TT4)" },
]

[[range]]
