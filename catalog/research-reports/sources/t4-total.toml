kind = "reference"
low = 59.31
high = 150.72
unit = "nmol/L"
when = { sex = "male", age_min = 9, age_max = 12 }
population = "Healthy Chinese children aged 1 day to 12 years (n=1,279), Mindray CL-6000i immunoassay"
evidence = "reference-interval"
note = "Age 9 to under 12 years, male. The results sentence prints pmol/L, but the same paper's abstract reports total T4 in nmol/L (72.33-171.60 nmol/L); the magnitude matches nmol/L, so the range is read as nmol/L and converted to µg/dL."
citations = [
