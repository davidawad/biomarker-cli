slug = "remnant-cholesterol"
name = "Remnant Cholesterol"
category = "lipid"
unit = "mg/dL"
description = "Cholesterol carried in triglyceride-rich remnant lipoproteins (IDL and VLDL remnants). Calculated as non-HDL cholesterol minus LDL cholesterol, or measured directly. Associated with ischemic heart disease and mortality."

[[range]]
set = "clinical"
kind = "warn"
low = 0.9
unit = "mmol/L"
when = { fasting = false }
population = "Adults, non-fasting samples"
evidence = "consensus"
note = "EAS/EFLM 2016 laboratory flag for calculated remnant cholesterol (35 mg/dL). The same consensus gives no remnant-cholesterol flag for fasting samples."
citations = [
  { pmid = "27122601", doi = "10.1093/eurheartj/ehw152", title = "Fasting is not routinely required for determination of a lipid profile: clinical and laboratory implications including flagging at desirable concentration cut-points-a joint consensus statement from the European Atherosclerosis Society and European Federation of Clinical Chemistry and Laboratory Medicine.", locator = "Abstract (laboratory flagging recommendation)", quote = "calculated remnant cholesterol >=0.9 mmol/L (35 mg/dL)" },
]

