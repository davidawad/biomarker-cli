slug = "arr-direct-renin"
name = "Aldosterone/Renin Ratio (direct renin concentration)"
category = "adrenal"
unit = "ng/dL per mIU/L"
description = "Aldosterone (ng/dL) divided by direct renin concentration (mIU/L). Screening ratio for primary aldosteronism when renin is measured as a mass or activity-independent concentration rather than plasma renin activity."

[[range]]
set = "age-specific-arr-2026"
kind = "diagnostic"
low = 2.4
when = { age_max = 49 }
population = "Hypertensive patients: 281 with confirmed primary aldosteronism and 1242 with essential hypertension, screened by ARR"
evidence = "outcome"
note = "Recommended screening ARR for patients under 50 (unified cut-off, high sensitivity and specificity). Source expresses ARR as (ng/dL)/(mU/L), i.e. aldosterone in ng/dL and renin in mU/L; not converted to the canonical renin unit."
citations = [
  { pmid = "41706428", doi = "10.1111/jch.70218", title = "Optimal Cut-Off Values of the Aldosterone-Renin Ratio in Different Age Groups for Primary Aldosteronism Screening.", url = "https://pubmed.ncbi.nlm.nih.gov/41706428/", locator = "Abstract, Results", quote = "Further evaluation revealed that for patients under 50-years-old, a unified ARR cut-off of 2.4 provided high sensitivity and specificity, while for patients aged 50 or older, a cut-off of 3.7 was more appropriate." },
]

