slug = "t3-total"
name = "Total T3 (Triiodothyronine)"
loinc = "3053-6"
category = "thyroid"
unit = "ng/dL"
description = "Total serum triiodothyronine, bound plus free. Less sensitive than free T3 for thyrotoxicosis and lower in non-thyroidal illness, but useful for T3 toxicosis. Pediatric ranges are reported in nmol/L and kept in that unit."

[[range]]
set = "second-trimester-ethnicity-2007"
kind = "reference"
low = 118
high = 239
when = { pregnancy = true, trimester = 2 }
population = "Pregnant women in the US (Asian, Black, Hispanic and White), antibody-negative with normal TSH, ARCHITECT immunoassay"
evidence = "reference-interval"
note = "Nonparametric 2.5th-97.5th percentile for all participants, ng/dL as printed. Lower and upper TT3 limits were significantly lower in Asian women."
citations = [
  { pmid = "17712003", doi = "10.1373/clinchem.2007.089680", title = "Second-trimester reference intervals for thyroid tests: the role of ethnicity.", url = "https://pubmed.ncbi.nlm.nih.gov/17712003/", locator = "Abstract, Results", quote = "1.82-3.68 nmol/L (118-239 ng/dL; TT3)" },
]

