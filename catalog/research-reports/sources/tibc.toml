slug = "tibc"
name = "Total iron-binding capacity"
loinc = "2500-7"
category = "iron"
unit = "µg/dL"
description = "Capacity of serum transferrin to bind iron, reported as total iron-binding capacity (TIBC). It rises when transferrin is high, as in iron deficiency and pregnancy, and falls with low transferrin, as in inflammation, malnutrition and liver disease. TIBC is used with serum iron to calculate transferrin saturation."

