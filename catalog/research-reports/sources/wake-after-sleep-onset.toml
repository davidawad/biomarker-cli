description = "Total time spent awake between sleep onset and final morning awakening, in minutes (WASO). Tracked to measure sleep continuity and as one of the criteria for insomnia. Expected result for most adults is a short total; a middle-of-the-night wake time of 20 minutes or longer is the research cut-off used to classify primary insomnia, so values under that are below it."

