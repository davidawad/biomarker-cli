slug = "esr"
name = "Erythrocyte sedimentation rate (ESR)"
loinc = "4537-7"
category = "inflammation"
unit = "mm/h"
description = "Rate at which red cells settle in an anticoagulated tube over one hour (Westergren method), a non-specific marker of acute-phase response and chronic inflammation. Raised values reflect inflammation, infection, malignancy or high fibrinogen/immunoglobulin levels; it rises with age, is higher in women, and is raised in pregnancy."

[[range]]
set = "arezzo-clsi-2025"
kind = "reference"
low = 1
high = 22
when = { sex = "female", age_min = 18 }
population = "989 presumed healthy adults from Arezzo Hospital, Italy, aged 18 and over; CLSI-based reference interval for the Westergren reference method"
evidence = "reference-interval"
note = "Single range for all adult women (no age split). Lower limit reported as 1 mm/h. Westergren reference method."
citations = [
  { pmid = "40361919", doi = "10.3390/diagnostics15091101", title = "Erythrocyte Sedimentation Rate Reference Intervals Determined via VES-MATIC 5 and CUBE 30 Touch with Respect to the Westergren Method.", locator = "Abstract, Results", quote = "we identified only one range for females ≥ 18 years (Westergren: 1-22 mm/h" },
]

