slug = "fit-hemoglobin"
name = "Faecal Immunochemical Test (Haemoglobin)"
loinc = "29771-3"
category = "stool"
unit = "µg Hb/g"
description = "Faecal immunochemical test (FIT) detects human haemoglobin in stool. Quantitative results in µg haemoglobin per gram of faeces are compared with programme or laboratory cut-offs to decide on referral or colonoscopy for possible colorectal neoplasia. The threshold is method- and programme-specific."
aliases = ["FIT", "faecal haemoglobin", "f-Hb", "FHb", "quantitative FIT", "qFIT", "fecal immunochemical test"]

[[range]]
set = "florence-fit-screening-2026"
kind = "decision"
low = 20
population = "Participants in the Florence colorectal cancer screening programme with a negative FIT"
evidence = "cohort-study"
note = "Programme positivity cut-off. Results at or above 20 µg Hb/g are positive and referred for colonoscopy, per the study's description of the programme."
citations = [
  { pmid = "42742245", doi = "10.4415/ANN_26_03_10", title = "Three-year risk of colorectal cancer by faecal haemoglobin concentration in subjects with a negative FIT.", url = "https://pubmed.ncbi.nlm.nih.gov/42742245/", locator = "Abstract, Methods", quote = "positivity cut-off: 20 µg faecal haemoglobin, f-Hb/g" },
]

[[range]]
set = "florence-fit-screening-2026"
kind = "warn"
low = 15
high = 20
population = "Participants in the Florence colorectal cancer screening programme with a negative FIT"
evidence = "cohort-study"
note = "Borderline band just below the 20 µg Hb/g positivity cut-off. The study found an increased 3-year colorectal cancer risk in this band even though these results were FIT-negative. Lower bound inclusive, upper bound exclusive."
citations = [
  { pmid = "42742245", doi = "10.4415/ANN_26_03_10", title = "Three-year risk of colorectal cancer by faecal haemoglobin concentration in subjects with a negative FIT.", url = "https://pubmed.ncbi.nlm.nih.gov/42742245/", locator = "Abstract, Results", quote = "The 3-year CRC risk was 15.9‰ in individuals with 15-20 µg/g on a single test" },
]

