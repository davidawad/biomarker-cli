slug = "dha"
name = "Docosahexaenoic acid (DHA)"
category = "fatty-acid"
unit = "%"
description = "Reported plasma fatty acid 95% reference intervals for healthy North Indian women, separated by pregnancy status."

[[range]]
set = "reference"
kind = "reference"
low = 3.38
high = 4.23
when = { pregnant = false }
population = "Healthy non-pregnant North Indian women (n=56)"
evidence = "reference-interval-study"
note = "Study-reported 95% reference interval; the source used separate non-pregnant and pregnant reference groups."
citations = [
  { pmid = "37746532", doi = "10.1007/s12291-022-01071-7", title = "Reference Range of Plasma Fatty Acids in North Indian Pregnant Population.", locator = "Abstract", quote = "The present multi-centric, and cross-sectional study determines the 95% reference interval for FAs ... The 95th and 97.5th percentile reference limits were used to estimate the 95 percentile of the reference distribution ... The reference ranges observed for ... Docosahexaenoic-acid (3.38-4.23%; 3.8-4.55%) ... respectively for non-pregnant and pregnant women." },
]

[[range]]
set = "reference"
kind = "reference"
low = 3.8
high = 4.55
when = { pregnant = true }
population = "Healthy pregnant North Indian women (n=108)"
evidence = "reference-interval-study"
note = "Study-reported 95% reference interval; the source used separate non-pregnant and pregnant reference groups."
citations = [
