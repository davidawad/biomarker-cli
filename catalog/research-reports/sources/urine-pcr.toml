slug = "urine-pcr"
name = "Urine Protein-to-Creatinine Ratio"
category = "urinalysis"
unit = "mg/g"
description = "Total protein excreted in urine relative to creatinine, measured on a spot sample. It estimates 24-hour proteinuria and is used to diagnose and monitor pre-eclampsia and other proteinuric kidney disease."
aliases = ["uPCR", "spot urine protein-creatinine ratio", "urine P/C ratio"]

[[range]]
set = "pregnancy-proteinuria-0.3"
kind = "decision"
low = 0.3
unit = "mg/mg"
when = { pregnancy = true }
population = "Pregnant women"
evidence = "consensus"
note = "Classic cut-off for significant proteinuria in pregnancy: a urine protein-to-creatinine ratio of at least 0.3 (mg/mg, i.e. 300 mg/g). The source is a narrative review citing this cut-off, not a guideline."
citations = [
  { pmid = "32882208", doi = "10.1016/j.ajog.2020.08.108", title = "Proteinuria during pregnancy: definition, pathophysiology, methodology, and clinical significance.", url = "https://pubmed.ncbi.nlm.nih.gov/32882208/", locator = "Abstract", quote = "a urine protein-to-creatinine ratio of at least 0.3" },
]

[[range]]
set = "uPCR-0.3-preeclampsia-validation"
kind = "decision"
low = 0.3
unit = "mg/mg"
when = { pregnancy = true, setting = "suspected-pre-eclampsia" }
population = "Women with suspected pre-eclampsia"
evidence = "validation-study"
note = "UPCR of 0.3 (mg/mg) as the threshold for predicting proteinuria >=300 mg/day in suspected pre-eclampsia, with sensitivity 90.1% and specificity 63.3%. The cited text also reports a UPCR >0.30 predictive accuracy."
citations = [
  { pmid = "33386413", doi = "10.1007/s00404-020-05937-0", title = "Diagnostic accuracy of random urinary protein-to-creatinine ratio for proteinuria in patients with suspected pre-eclampsia.", url = "https://pubmed.ncbi.nlm.nih.gov/33386413/", locator = "Abstract, Results", quote = "Sensitivity and specificity of UPCR of 0.3 for predicting proteinuria ≥ 300 mg/day were 90.1% and 63.3%, respectively." },
]

[[range]]
set = "kdigo-2024"
kind = "decision"
low = 500
population = "Adults with chronic kidney disease: heavy proteinuria threshold for CKD diagnosis and specialist referral"
evidence = "guideline"
note = "KDIGO 2024 states a PCR of 500 mg/g (50 mg/mmol) is approximately equivalent to an ACR of 300 mg/g (A3, heavily increased albuminuria). Boundary >=500 as printed."
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", locator = "Figure 48 (referral circumstances), CKD diagnosis box", quote = "approximately equivalent to PCR ≥500 mg/g [≥50 mg/mmol]" },
]

[[range]]
set = "kdigo-2024"
kind = "decision"
low = 200
unit = "mg/g"
population = "Children and adolescents: threshold for referral to specialist kidney care"
evidence = "guideline"
note = "KDIGO 2024 Practice Point 5.1.2 (pediatric considerations): refer when an ACR of 30 mg/g or a PCR of 200 mg/g or more is confirmed on a repeat first-morning sample. The 200 mg/g (20 mg/mmol) PCR is the PCR criterion. Boundary >=200."
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", locator = "Practice Point 5.1.2 (pediatric referral criteria)", quote = "an ACR of 30 mg/g (3 mg/mmol) or a PCR of 200 mg/g (20 mg/mmol) or more, confirmed on a" },
]

[[range]]
set = "upcr-reference-dalian-2021"
kind = "reference"
high = 141.7
population = "Healthy adults in Dalian, China (random morning spot urine), all adults combined"
evidence = "reference-interval-study"
note = "Upper reference limit, taken as the 95th percentile of UPCR in healthy adults. The overall value is 141.7 mg/g; sex-specific values are given in the next two ranges. Single-centre Chinese cohort, so not a universal limit."
citations = [
  { pmid = "34617627", doi = "10.1002/jcla.24043", title = "Reference values of urine protein/creatinine ratio in healthy Dalian adults.", url = "https://pubmed.ncbi.nlm.nih.gov/34617627/", locator = "Abstract, Results", quote = "The UPCR reference value was 141.7 mg/g for the entire cohort, 128.7 mg/g for men, and 150.8 mg/g for women." },
]

