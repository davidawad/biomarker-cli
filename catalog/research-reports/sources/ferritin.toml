  { pmid = "32053933", doi = "10.3390/nu12020447", title = "Iron Deficiency and Iron Deficiency Anemia: Implications and Impact in Pregnancy, Fetal Development, and Early Childhood Parameters.", locator = "Section on diagnostic criteria in pregnancy", quote = "defining ID by either low serum ferritin (<30 µg/L) or low transferrin saturation (<19%)" },
]

[[range]]
