  { pmid = "34497146", doi = "10.1136/gutjnl-2021-325210", title = "British Society of Gastroenterology guidelines for the management of iron deficiency anaemia in adults.", locator = "Chronic heart failure section", quote = "as defined by an SF <100 µg/L and/or a transferrin saturation of <20%" },
]

