slug = "ferritin"
name = "Ferritin"
loinc = "2276-4"
category = "iron"
unit = "ng/mL"
description = "Storage protein that reflects body iron stores; low values indicate iron deficiency, high values indicate iron overload, but ferritin is also an acute-phase reactant, so inflammation, liver disease and heart failure raise it independently of iron stores."

[[range]]
set = "who-2020"
kind = "deficient"
high = 15
source_unit = "µg/L"
source_factor = 1
when = { age_min = 5 }
population = "Children older than 5 years, adolescents and adults, in the absence of inflammation (WHO ferritin guideline thresholds as reported in a 2024 review)"
evidence = "guideline"
note = "Secondary citation: the WHO 2020 guideline text could not be retrieved, so the threshold is taken from Hemasphere 2024 and BRINDA 2017 which both report it. Not valid when inflammation is present; see the inflammation ranges. The review cites WHO as 2022 in one sentence; the guideline itself is WHO 2020."
citations = [
  { pmid = "39011129", doi = "10.1002/hem3.108", title = "Recommendations for diagnosis, treatment, and prevention of iron deficiency and iron deficiency anemia.", locator = "Diagnosis section, para on WHO definition", quote = "The WHO defines ID as serum or plasma ferritin levels <15 ug/L in children older than 5 years, adolescents, and adults" },
  { pmid = "28615259", doi = "10.3945/ajcn.116.141762", title = "Adjusting ferritin concentrations for inflammation: Biomarkers Reflecting Inflammation and Nutritional Determinants of Anemia (BRINDA) project.", locator = "Abstract, Design", quote = "depleted iron stores (ferritin concentration <12 μg/L in PSC and <15 μg/L in WRA)" },
]

