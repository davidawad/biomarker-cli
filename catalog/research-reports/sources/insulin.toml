slug = "insulin"
name = "Insulin (fasting)"
loinc = "20448-7"
category = "glycemic"
unit = "µIU/mL"
description = "Fasting serum insulin. Reference intervals from healthy adult populations; elevated fasting insulin is a surrogate marker of insulin resistance."

[[range]]
set = "reference"
kind = "reference"
low = 1.61
high = 11.37
when = { sex = "male", fasting = true }
population = "Healthy non-obese Iranian men aged 24-83 years (Tehran Lipid and Glucose Study, n=309 men and women)"
evidence = "reference-interval-study"
note = "Central 95% reference interval for fasting insulin in men (source unit uU/mL, identical to uIU/mL)."
citations = [
  { pmid = "24530467", doi = "10.1016/j.clinbiochem.2014.02.007", title = "Age- and sex-specific reference values for fasting serum insulin levels and insulin resistance/sensitivity indices in healthy Iranian adults: Tehran Lipid and Glucose Study.", locator = "Abstract, Results", quote = "Overall 95% reference values for fasting insulin were 1.61-11.37, 2.34-11.98, and 2.11-12.49 uU/mL in men, women, and total population respectively." },
]

