slug = "dhea-s"
name = "DHEA-Sulfate"
loinc = "2191-5"
category = "adrenal"
unit = "µg/dL"
description = "Sulfated adrenal androgen produced mainly by the zona reticularis; it reflects adrenal androgen output and rises at adrenarche. Used to assess adrenal androgen excess, hyperandrogenism in women, and adrenal disorders."

