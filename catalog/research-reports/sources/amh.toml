slug = "amh"
name = "Anti-Müllerian Hormone"
category = "hormone"
unit = "ng/mL"
description = "Glycoprotein secreted by granulosa cells of small antral follicles in women and by Sertoli cells in men. Used as a marker of ovarian reserve and in the assessment of PCOS and infertility."

