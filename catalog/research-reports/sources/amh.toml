[[range]]
set = "pcos-threshold-dewailly-2011"
kind = "diagnostic"
low = 5
when = { sex = "female", conditions = ["pcos"] }
population = "Women referred for hyperandrogenism, menstrual disorders or infertility (n=240), single centre, France"
evidence = "outcome"
note = "Threshold for polycystic ovarian morphology/PCOS classification: AMH above 5 ng/mL (35 pmol/L) is the cut-off. The value is printed as a low bound because it is a 'greater than' decision threshold. The 2023 international PCOS guideline recognises AMH as an alternative to ultrasound for PCOM in adults but gives no numeric AMH cut-off, and says laboratories should use assay-specific cut-offs."
citations = [
  { pmid = "21926054", doi = "10.1093/humrep/der297", title = "Diagnosis of polycystic ovary syndrome (PCOS): revisiting the threshold values of follicle count on ultrasound and of the serum AMH level for the definition of polycystic ovaries.", url = "https://pubmed.ncbi.nlm.nih.gov/21926054/", locator = "Abstract, Conclusions", quote = "A serum AMH >35 pmol/l (or >5 ng/ml) appears to be more sensitive and specific than a FN >19 and should be therefore included in the current diagnostic classifications for PCOS." },
]

[[range]]
set = "diminished-ovarian-reserve-definition-2025"
kind = "diagnostic"
high = 1.2
when = { sex = "female", age_min = 18, age_max = 45 }
population = "Women aged 18-45 with AMH results in a tertiary university hospital database, 2015-2024 (n=22,920 results)"
evidence = "outcome"
note = "Study definition of diminished ovarian reserve (AMH below 1.2 ng/mL). Retrospective; not a guideline cut-off. Prevalence rose from 15.9% at age 18 to 96% at age 45."
citations = [
  { pmid = "40620793", doi = "10.3389/fendo.2025.1612194", title = "Age-stratified anti-Müllerian hormone (AMH) nomogram: a comprehensive cohort study including 22.920 women.", url = "https://pubmed.ncbi.nlm.nih.gov/40620793/", locator = "Abstract, Methods", quote = "The prevalence of diminished ovarian reserve (DOR), defined as AMH <1.2 ng/mL, was determined." },
]

[[range]]
set = "menopause-ultrasensitive-amh-chinese-cohort-2026"
kind = "diagnostic"
high = 0.0055
when = { sex = "female", menopause = "post", method = "ultrasensitive assay" }
population = "Nationally representative cohort of Chinese women aged 34-56 years (n=10,543), ultrasensitive assay with limit of detection 0.003 ng/mL"
evidence = "outcome"
note = "ROC cut-off for menopause status using an ultrasensitive assay. AUC was only 0.72, so this is a weak discriminator and should not be used alone. Assay-specific."
citations = [
  { pmid = "42608648", doi = "10.1097/CM9.0000000000004161", title = "Age-specific anti-Müllerian hormone reference values using an ultrasensitive assay: Associations with ovarian aging and menopausal transition symptoms.", url = "https://pubmed.ncbi.nlm.nih.gov/42608648/", locator = "Abstract, Results", quote = "Area under the curve for menopause diagnosis was 0.72 (cutoff = 0.0055 ng/mL)." },
]

