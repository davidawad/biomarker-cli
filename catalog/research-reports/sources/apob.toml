slug = "apob"
name = "Apolipoprotein B"
loinc = "1884-6"
category = "lipid"
unit = "mg/dL"
description = "Apolipoprotein B, one protein per atherogenic lipoprotein particle (LDL, VLDL, IDL, Lp(a)). Used as a secondary treatment target and as a risk marker alongside LDL cholesterol."

[[range]]
set = "clinical"
kind = "target"
high = 65
when = { risk = "very-high-cardiovascular-risk" }
population = "Adults with very high cardiovascular risk"
evidence = "guideline"
note = "ESC/EAS 2019 secondary target: apoB strictly below 65 mg/dL (as summarised in the cited review). Lower bound not stated."
citations = [
  { pmid = "42876934", doi = "10.3389/fcvm.2026.1857230", title = "Apolipoprotein B in cardiovascular risk assessment: beyond traditional lipid markers.", locator = "Introduction / lipid guideline paragraph", quote = "identified ApoB as a secondary treatment target, with recommended levels of <65 mg/dL, <80 mg/dL, and <100 mg/dL for patients at very high, high, and moderate cardiovascular risk, respectively" },
]

