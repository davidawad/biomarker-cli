high = 196.03
source_unit = "µmol/L"
source_factor = 5.585
when = { sex = "male" }
population = "Healthy Russian adults aged 18-80 (506 participants, 46% male), IFCC C-RIDL protocol, Beckman Coulter AU 5800"
evidence = "reference-interval"
note = "2.5-97.5 percentile limits from the paper's Table 4 (IFCC C-RIDL protocol, single country, Beckman AU 5800; method-specific). The paper labels rows LAVE(+) or LAVE(-), defined in its text as one or more vs no abnormal reference-test values; that does not clearly describe the exclusion applied to this row, so check the supplementary source data before relying on it."
