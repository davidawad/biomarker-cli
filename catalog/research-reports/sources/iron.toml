slug = "iron"
name = "Serum iron"
loinc = "2498-4"
category = "iron"
unit = "µg/dL"
description = "Iron circulating bound to transferrin, measured as serum iron. It varies widely through the day and with recent intake, so a single value is weak evidence on its own; low values with low transferrin saturation and ferritin point to iron deficiency, while high values with high transferrin saturation point to iron overload."

