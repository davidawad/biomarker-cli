slug = "testosterone-free-calculated"
name = "Testosterone, Free (Calculated)"
loinc = "103227-5"
category = "sex-hormone"
unit = "pg/mL"
description = "Estimated free (unbound) testosterone, calculated from measured total testosterone and SHBG (and albumin in some equations) with an equation such as Vermeulen's. Used when direct free testosterone measurement is unavailable or when SHBG is altered. Results depend strongly on the equation used."

[[range]]
set = "reference"
kind = "reference"
