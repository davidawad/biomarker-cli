high = 0.785
unit = "nmol/L"
when = { sex = "male", age_min = 20, age_max = 46, method = "vermeulen-equation" }
population = "Healthy men aged 20-45 years with normal semen analysis (n=126), calculated free testosterone by the Vermeulen equation"
evidence = "reference-interval-study"
note = "2.5th to 97.5th percentile. Source unit is nmol/L (molar, not converted here). Values differ by equation (the same abstract reports mean biases of 5.8 to 56.0 percent between four equations)."
citations = [
