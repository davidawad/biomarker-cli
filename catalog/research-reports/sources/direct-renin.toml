population = "Healthy Han Chinese adults (328 individuals) used for reference intervals"
evidence = "reference-interval"
note = "Central 95% reference interval for direct renin concentration (PRC) in males on a fully automated DiaSorin CLIA. Posture and age bands are not stated in the abstract."
citations = [
