slug = "urine-citrate"
name = "Citrate, Urine"
loinc = "2128-7"
category = "organic-acid"
unit = "mg/24h"
description = "Citrate excreted in urine, usually collected over 24 hours. Low excretion (hypocitraturia) is a major, treatable risk factor for calcium kidney stones. Expected result: at or above the cut-offs in the ranges below; values below the adult definition indicate hypocitraturia. Pediatric cut-offs are normalised to body surface area and are a companion unit."

[[range]]
set = "clinical"
kind = "diagnostic"
high = 320
when = {}
population = "Not stated in the quote (official definition as reported in the source review)"
evidence = "consensus"
note = "Hypocitraturia: 24-hour urinary citrate strictly below 320 mg/day, as officially defined and reported in the source."
citations = [
  { pmid = "33232062", title = "Hypocitraturia and Renal Calculi", locator = "Abstract", quote = "Hypocitraturia is officially defined as urinary citrate excretion of less than 320 mg per day" },
]

[[range]]
set = "reference"
kind = "reference"
low = 180
unit = "mg/1.73m2/24h"
when = { sex = "male", age_min = 2, age_max = 19 }
population = "Healthy boys aged 2 to 18 years (24-hour urine)"
evidence = "reference-interval-study"
note = "Lower cut-off for boys, citrate normalised to 1.73 m2 body surface area per 24 hours. Age_max 19 is 18 years inclusive."
citations = [
  { pmid = "24696006", doi = "10.1007/s00467-014-2806-7", title = "Urinary citrate excretion in healthy children depends on age and gender.", locator = "Abstract (Results)", quote = "Thus, the assumption of 180 mg/1.73 m2/24 h for males and 250 mg/1.73 m2/24 h for females as lower cut-off values appeared to be reliable from a practical perspective" },
]

[[range]]
set = "reference"
kind = "reference"
low = 250
unit = "mg/1.73m2/24h"
when = { sex = "female", age_min = 2, age_max = 19 }
population = "Healthy girls aged 2 to 18 years (24-hour urine)"
evidence = "reference-interval-study"
note = "Lower cut-off for girls, citrate normalised to 1.73 m2 body surface area per 24 hours. Age_max 19 is 18 years inclusive."
citations = [
  { pmid = "24696006", doi = "10.1007/s00467-014-2806-7", title = "Urinary citrate excretion in healthy children depends on age and gender.", locator = "Abstract (Results)", quote = "Thus, the assumption of 180 mg/1.73 m2/24 h for males and 250 mg/1.73 m2/24 h for females as lower cut-off values appeared to be reliable from a practical perspective" },
]
