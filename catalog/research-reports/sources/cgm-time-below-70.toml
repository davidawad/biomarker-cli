slug = "cgm-time-below-70"
name = "CGM time below range (<70 mg/dL)"
category = "glycemic"
unit = "%"
description = "Percentage of CGM glucose readings (or hours per day) below 70 mg/dL (3.9 mmol/L). The International Consensus on Time in Range sets maximum targets for people with diabetes; the pregnancy threshold is 63 mg/dL."

[[range]]
set = "clinical"
kind = "target"
high = 4
when = { conditions = ["diabetes"] }
population = "Adults and children with type 1 or type 2 diabetes (non-pregnant, not older/high-risk)"
evidence = "consensus"
note = "Time below range 54-69 and below 54 mg/dL is separate; this target is for time below 70 mg/dL (3.9 mmol/L), less than 4 percent (less than 1 h per day)."
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table 3", quote = "Type 1*/type 2 | >70%; >16 h, 48 min | 70-180 mg/dL (3.9-10.0 mmol/L) | <4%; <1 h | <70 mg/dL (<3.9 mmol/L)" },
]

[[range]]
set = "clinical"
kind = "target"
high = 1
when = { conditions = ["diabetes"], risk = "older-or-high-risk" }
population = "Older and/or high-risk adults with type 1 or type 2 diabetes"
evidence = "consensus"
note = "Time below 70 mg/dL (3.9 mmol/L) for older and/or high-risk individuals, less than 1 percent (less than 15 min per day); the consensus stresses reducing time below 70 mg/dL in this group."
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table 3", quote = "Older/high-risk# type 1/type 2 | >50%; >12 h | 70-180 mg/dL (3.9-10 mmol/L) | <1%; <15 min | <70 mg/dL (<3.9 mmol/L)" },
]

[[range]]
set = "clinical"
kind = "target"
high = 4
when = { conditions = ["type-1-diabetes"], pregnant = true }
population = "Pregnant women with type 1 diabetes"
evidence = "consensus"
note = "Pregnancy threshold is below 63 mg/dL (3.5 mmol/L), not 70 mg/dL; target is less than 4 percent (less than 1 h per day)."
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table 4", quote = "Pregnancy, type 1§ | >70%; >16 h, 48 min | 63-140 mg/dL† (3.5-7.8 mmol/L†) | <4%; <1 h | <63 mg/dL† (<3.5 mmol/L†)" },
]
