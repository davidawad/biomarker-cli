slug = "urine-orotic-acid"
name = "Orotic Acid, Urine"
loinc = "2686-4"
category = "organic-acid"
unit = "mmol/mol creatinine"
description = "Urinary orotic acid, an intermediate of pyrimidine synthesis. Measured to screen for and differentiate hereditary orotic aciduria and urea cycle or basic amino acid transporter defects that cause hyperammonemia. Expected result: at or below the age-specific upper reference limit; values above it prompt further workup. Excretion is higher in infants and falls with age."

[[range]]
set = "reference"
kind = "reference"
high = 3.44
unit = "mmol/mol creatinine"
when = { age_min = 0, age_max = 1 }
population = "Apparently healthy subjects aged three days to 1 year"
evidence = "reference-interval-study"
note = "Upper reference limit (99th percentile) only; the study reports no lower limit. Group 1 of the source."
citations = [
  { pmid = "22019295", doi = "10.1016/j.jchromb.2011.09.054", title = "Reference intervals for orotic acid in urine, plasma and dried blood spot using hydrophilic interaction liquid chromatography-tandem mass spectrometry.", locator = "Abstract", quote = "The upper limits (as 99th %ile) were of 3.44 and 1.30 in groups aged from three days to 1 year (group 1) and from 1 year to 12 years (group 2), respectively" },
]

