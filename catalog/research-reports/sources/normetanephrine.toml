slug = "normetanephrine"
name = "Normetanephrine, Plasma Free"
category = "adrenal"
unit = "pg/mL"
description = "Free normetanephrine, the O-methylated metabolite of norepinephrine, measured in plasma. Elevated values support a diagnosis of pheochromocytoma or paraganglioma; it is also the most sensitive plasma marker for many of these tumours."

[[range]]
set = "ankara-bilkent-2026"
kind = "reference"
high = 180
when = {}
population = "Adults (>=18 y) tested for catecholamine metabolites at Ankara Bilkent City Hospital, Feb 2019 to May 2023; local laboratory reference limit in force after Feb 2022"
evidence = "reference-interval"
note = "Upper limit in force after February 2022 as stated by the reporting laboratory (the limit before then was <200 pg/mL). Single-centre limit, not age-specific; age-specific paediatric and adult intervals exist in the literature but were not verifiable here."
citations = [
  { pmid = "41750736", doi = "10.3390/diagnostics16040588", title = "Seasonal and Climatic Influences on Catecholamine Metabolite Levels in Patients With and Without Pheochromocytoma-Paraganglioma.", url = "https://pubmed.ncbi.nlm.nih.gov/41750736/", locator = "Results (reference limits)", quote = "The reference limit for plasma metanephrine was <90 pg/mL, plasma normetanephrine between February 2019 and February 2022 was <200 pg/mL, and after February 2022 was <180 pg/mL." },
]

[[range]]
set = "age-adjusted-plasma-nmn-2013"
kind = "reference"
high = 0.47
unit = "nmol/L"
when = { age_max = 17, age_unit = "years" }
population = "Children in a 2013 supine plasma free metanephrine reference study (1226 subjects aged 5-84 y, including 116 children)"
evidence = "reference-interval"
note = "Age-adjusted upper reference limit for plasma normetanephrine in children, nmol/L. The age cut-off for 'children' is not restated in the quote (under 18 assumed). Supine sampling; not converted to pg/mL."
citations = [
  { pmid = "23065528", doi = "10.1258/acb.2012.012066", title = "Reference intervals for plasma free metanephrines with an age adjustment for normetanephrine for optimized laboratory testing of phaeochromocytoma.", url = "https://pubmed.ncbi.nlm.nih.gov/23065528/", locator = "Abstract, Results", quote = "Upper cut-offs of reference intervals for normetanephrine increased from 0.47 nmol/L in children to 1.05 nmol/L in subjects over 60 y." },
]

