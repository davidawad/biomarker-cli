slug = "acth"
name = "Adrenocorticotropic Hormone"
category = "pituitary"
unit = "pg/mL"
description = "Pituitary hormone that stimulates cortisol production by the adrenal cortex. Measured in the morning (plasma, cold-collected) to help separate primary from secondary or tertiary adrenal insufficiency and ACTH-dependent from ACTH-independent Cushing's syndrome."

[[range]]
set = "netherlands-reference-2005"
kind = "reference"
low = 8
high = 93
unit = "ng/L"
when = { time_of_day = "morning", specimen = "plasma", age_min = 20, age_max = 69 }
population = "50 healthy subjects from the general population aged 20-69 years, equally distributed by sex and age"
evidence = "reference-interval"
note = "09:00 plasma ACTH reference interval (mean +/- 2 SD after log transformation). ng/L is numerically equal to pg/mL. 2005 study, older assay; use the local lab range where available."
citations = [
  { pmid = "16397312", title = "Establishment of reference values for endocrine tests. Part IV: Adrenal insufficiency.", url = "https://pubmed.ncbi.nlm.nih.gov/16397312/", locator = "Abstract, Results", quote = "09.00 hr plasma ACTH 8 to 93 ng/l" },
]

[[range]]
set = "cushing-acth-review-2023"
kind = "diagnostic"
high = 10
when = { conditions = ["cushing-syndrome"] }
population = "Patients with suspected hypercortisolism (Cushing syndrome), as restated in a laboratory-medicine review"
evidence = "review"
note = "ACTH below about 10 pg/mL suggests an adrenal (ACTH-independent) cortisol source once exogenous glucocorticoids are excluded. The source notes that the level varies between assays. Restates a review's threshold; not verified against the primary guideline."
citations = [
  { pmid = "37189516", doi = "10.3390/diagnostics13081415", title = "Pitfalls in the Diagnosis and Management of Hypercortisolism (Cushing Syndrome) in Humans; A Review of the Laboratory Medicine Perspective.", url = "https://pubmed.ncbi.nlm.nih.gov/37189516/", locator = "Full text (Cushing diagnosis section)", quote = "If ACTH secretion is suppressed, e.g., <10 pg/mL (ng/L) (levels vary between assays), an adrenal source (if exogenous excluded) of cortisol is indicated." },
]

[[range]]
set = "cushing-acth-review-2023"
kind = "diagnostic"
low = 20
when = { conditions = ["cushing-syndrome"] }
population = "Patients with suspected hypercortisolism (Cushing syndrome), as restated in a laboratory-medicine review"
evidence = "review"
note = "ACTH above about 20 pg/mL (or an intermediate value) indicates an ACTH-dependent cause of hypercortisolism. Restates a review's threshold; not verified against the primary guideline."
citations = [
  { pmid = "37189516", doi = "10.3390/diagnostics13081415", title = "Pitfalls in the Diagnosis and Management of Hypercortisolism (Cushing Syndrome) in Humans; A Review of the Laboratory Medicine Perspective.", url = "https://pubmed.ncbi.nlm.nih.gov/37189516/", locator = "Full text (Cushing diagnosis section)", quote = "If ACTH concentration is inappropriately high, e.g., above 20 pg/mL, or an intermediate concentration, then an ACTH-dependent cause is indicated [62]." },
]
