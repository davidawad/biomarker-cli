slug = "toxoplasma-igg"
name = "Toxoplasma IgG"
loinc = "22580-5"
category = "infectious"
unit = "IU/mL"
description = "Serum IgG antibody against Toxoplasma gondii, reported in IU/mL by immunoassay as negative, equivocal or positive. Tracked to establish past or latent infection, and during pregnancy or immunosuppression to assess risk. Expected result: negative (no prior exposure) or, if previously infected, positive; a positive IgG alone does not date infection, so IgM and IgG avidity testing are used with it."

[[range]]
set = "clinical"
kind = "diagnostic"
low = 4.4
unit = "IU/mL"
when = { method = "platelia-toxo-igg" }
population = "384 routine-screening sera, Pitie-Salpetriere Hospital, Paris, tested with Platelia Toxo IgG and Western blot"
evidence = "outcome-study"
note = "Seropositive (IgG positivity) on Platelia Toxo IgG; cut-off chosen in one study against Western blot, and lower than the manufacturer's cut-off."
citations = [
  { pmid = "26187780", doi = "10.1051/parasite/2015022", title = "The impact of lowering the cut-off value on the sensitivity of the Platelia Elisa IgG (Bio-Rad) test for toxoplasmosis diagnosis.", locator = "Abstract", quote = "Our results indicated that an IgG titer cut-off value of >=4.4 IU/mL for the Platelia Toxo IgG met the definition of positivity, a value significantly lower than that indicated by the manufacturers." },
]

