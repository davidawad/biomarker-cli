population = "757 pregnant women (843 sera), MEIA classified against Sabin-Feldman dye test and specific IgM"
evidence = "outcome-study"
note = "Group 1, no infection, by MEIA IgG band with dye test and IgM. The source states these threshold values need confirmation in a larger prospective study."
citations = [
