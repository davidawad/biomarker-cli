description = "Serum autoantibody to histidyl-tRNA synthetase (Jo-1), the most common antisynthetase antibody. Associated with antisynthetase syndrome, myositis and interstitial lung disease. Reported as positive or negative by immunoassay; some assays also report a numeric level. Expected result: negative."

