slug = "b2gp1-igm"
name = "Beta-2 Glycoprotein I IgM Antibody"
loinc = "16136-4"
category = "autoimmune"
unit = "AU/mL"
description = "IgM autoantibody against beta-2 glycoprotein I, measured by solid-phase immunoassay (ELISA, chemiluminescence, or fluorescence enzyme immunoassay). Used as a laboratory criterion for antiphospholipid syndrome, alongside anticardiolipin and lupus anticoagulant testing. Results are assay-specific and reported as units against an assay cut-off. Expected result: negative (below the assay cut-off)."

[[range]]
set = "reference"
kind = "reference"
high = 12
population = "Blood donors (n = 266), in-house 99th percentile cut-off for the Phadia/EliA assay"
evidence = "reference-interval-study"
note = "Upper reference limit (99th percentile) for beta-2 glycoprotein I IgM on the Phadia/EliA assay. The study advises each laboratory to determine its own cut-offs."
when = { method = "phadia-elia" }
citations = [
  { pmid = "29848159", doi = "10.1177/0961203318776105", title = "Revisiting the Phadia/EliA cut-off values for anticardiolipin and anti-β2-glycoprotein I antibodies: a systematic evaluation according to the guidelines.", locator = "Abstract (Results)", quote = "The in-house 99th (97.5th) percentile cut-off values were 11 (8.7), 12 (6.9) 8.5 (5.0) AU/mL for aβ2GPI IgG, IgM and IgA" },
]

