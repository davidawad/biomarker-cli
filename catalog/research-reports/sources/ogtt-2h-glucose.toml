slug = "ogtt-2h-glucose"
name = "Glucose, 2-hour OGTT (75 g)"
category = "glycemic"
unit = "mg/dL"
description = "Plasma glucose 2 hours after a 75 g oral glucose load. Used to classify impaired glucose tolerance and diabetes in adults, and gestational diabetes in pregnancy (IADPSG thresholds)."

[[range]]
set = "clinical"
kind = "reference"
high = 140
when = { }
population = "Adults without a previous diabetes diagnosis"
evidence = "guideline"
note = "Normal glucose tolerance: 2-hour glucose strictly below 140 mg/dL."
citations = [
  { pmid = "41928882", doi = "10.3389/fendo.2026.1789777", title = "The impact of glucose and metabolic disturbances on white matter hyperintensity volume in apparently healthy adults.", locator = "Table 1", quote = "fasting glucose between 100 and 125 mg/dL and 2 h post glucose load < 140 mg/dL" },
]

[[range]]
set = "clinical"
kind = "warn"
low = 140
high = 200
when = { }
population = "Adults without a previous diabetes diagnosis"
evidence = "guideline"
note = "Impaired glucose tolerance (prediabetes) by ADA criteria."
