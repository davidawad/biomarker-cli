category = "cbc"
unit = "10^3/µL"
description = "Absolute count of circulating lymphocytes (T, B and NK cells). Low values (lymphopenia) occur with viral infection, steroids, chemotherapy, HIV or autoimmune disease; high values (lymphocytosis) with viral infection, pertussis or lymphoproliferative disorders."

