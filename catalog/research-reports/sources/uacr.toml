population = "Adults and children with or at risk of CKD (persistent albuminuria categories)"
evidence = "guideline"
note = "KDIGO albuminuria category A2 (moderately increased), 30 to 300 mg/g inclusive. A3 starts strictly above 300 mg/g."
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", title = "KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD", locator = "Table 3 | Albuminuria categories in chronic kidney disease", quote = "A2 30-300 3-30 30-300 Moderately increased" },
]

