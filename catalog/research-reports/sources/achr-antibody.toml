slug = "achr-antibody"
name = "Acetylcholine Receptor Binding Antibody"
loinc = "11560-0"
category = "autoimmune"
unit = "nmol/L"
description = "Serum autoantibody to the acetylcholine receptor (AChR-Bi, binding assay), used to support the diagnosis of myasthenia gravis. Expected result in people without myasthenia gravis: negative (not detected). A positive result supports, but does not alone confirm, myasthenia gravis; interpret with clinical and electrodiagnostic findings."

[[range]]
set = "clinical"
kind = "diagnostic"
low = 0.02
unit = "nmol/L"
when = { conditions = ["myasthenia-gravis"] }
population = "Patients tested for myasthenia gravis (confirmed or refuted by clinical-electrodiagnostic testing)"
evidence = "outcome-study"
note = "Positive (above) cut-off for AChR-Bi giving the best sensitivity (90%) in this single observational study; strictly above 0.02 nmol/L. Not a guideline threshold."
citations = [
  { pmid = "32938782", doi = "10.1212/WNL.0000000000010910", title = "Improving accuracy of myasthenia gravis autoantibody testing by reflex algorithm.", url = "https://pubmed.ncbi.nlm.nih.gov/32938782/", locator = "Abstract, Results", quote = "Best sensitivity (90%) occurred at AChR-Bi >0.02 nmol/L" },
]
