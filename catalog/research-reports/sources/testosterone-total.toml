slug = "testosterone-total"
name = "Testosterone, Total"
loinc = "2986-8"
category = "hormone"
unit = "ng/dL"
description = "Total testosterone in serum, the first-line test for male androgen deficiency and for androgen status in women. Interpret against sex- and age-specific ranges, and measure in the morning with an accurate (LC-MS/MS) assay."

