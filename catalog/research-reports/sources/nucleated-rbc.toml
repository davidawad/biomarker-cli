name = "Nucleated red blood cells (NRBC)"
loinc = "58413-6"
category = "cbc"
unit = "/100 WBC"
description = "Immature red cells with a nucleus that normally stay in bone marrow; they appear in blood with severe hypoxia, marrow stress, haemolysis, infiltration or sepsis. Any count above zero is abnormal in adults."

