[[range]]
set = "ehjacc-2026-tnt-gen6-validation"
kind = "decision"
high = 3
unit = "ng/L"
when = { setting = "suspected-acute-mi", method = "elecsys-troponin-t-hs-gen5" }
population = "Adults presenting with suspected myocardial infarction in a single-centre cohort, with the ESC 0/1-hour algorithm logic applied to the predecessor Elecsys hs-cTnT Gen 5 assay"
evidence = "validation-study"
note = "ESC 0/1-hour algorithm, 1-hour rule-out for Elecsys hs-cTnT Gen 5: absolute change below 3 ng/L (strict <3), with a baseline below 12 ng/L. The paper states this as the logic it applied to the Gen 5 assay for comparison; it is not the manufacturer's Gen 5 label."
citations = [
  { pmid = "42008514", doi = "10.1093/ehjacc/zuag044", title = "Diagnostic validation of a novel high-sensitivity cardiac troponin T assay.", url = "https://pubmed.ncbi.nlm.nih.gov/42008514/", locator = "Methods, Statistical analysis", quote = "For rule-out of MI, a 0 h cut-off of <5 ng/L or a 0/1 h algorithm with a 0 h < 12 ng/L and a Δ 0/1 h change of <3 ng/L was used." },
]

[[range]]
set = "ehjacc-2026-tnt-gen6-validation"
kind = "decision"
low = 5
unit = "ng/L"
when = { setting = "suspected-acute-mi", method = "elecsys-troponin-t-hs-gen5" }
population = "Adults presenting with suspected myocardial infarction in a single-centre cohort, with the ESC 0/1-hour algorithm logic applied to the predecessor Elecsys hs-cTnT Gen 5 assay"
evidence = "validation-study"
note = "ESC 0/1-hour algorithm, 1-hour rule-in for Elecsys hs-cTnT Gen 5: absolute change of 5 ng/L or more (inclusive, >=5) at 1 hour. The paper gives this as the logic it applied to the Gen 5 assay."
citations = [
  { pmid = "42008514", doi = "10.1093/ehjacc/zuag044", title = "Diagnostic validation of a novel high-sensitivity cardiac troponin T assay.", url = "https://pubmed.ncbi.nlm.nih.gov/42008514/", locator = "Methods, Statistical analysis", quote = "For rule-in of MI, a 0 h cut-off ≥52 ng/L or a Δ 0/1 h change of ≥5 ng/L was used." },
