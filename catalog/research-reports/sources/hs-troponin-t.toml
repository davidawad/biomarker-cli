slug = "hs-troponin-t"
name = "High-Sensitivity Cardiac Troponin T"
loinc = "67151-1"
category = "cardiac"
unit = "ng/L"
description = "High-sensitivity cardiac troponin T, a protein released from injured heart muscle. Measured with a high-sensitivity assay it is used to rule acute myocardial infarction in or out, typically with a 0/1-hour algorithm, and to detect myocardial injury."
aliases = ["hs-cTnT", "hs-TnT", "troponin T high sensitivity"]

[[range]]
set = "ehjopen-2022-acs-0-1h"
kind = "reference"
high = 14
unit = "ng/L"
population = "Healthy reference population used for the Roche cobas 8000 hs-cTnT assay (overall, not sex-specific)"
evidence = "reference-interval-study"
note = "99th percentile upper reference limit (URL) for the Roche hs-cTnT assay as stated by the study. Values above the URL indicate myocardial injury; this single URL is not sex-specific."
citations = [
  { pmid = "36032815", doi = "10.1093/ehjopen/oeac048", title = "Rapid risk stratification of acute coronary syndrome: adoption of an adapted European Society of Cardiology 0/1-hour troponin algorithm in a real-world setting.", url = "https://pubmed.ncbi.nlm.nih.gov/36032815/", locator = "Methods, assay description", quote = "99th percentile of a healthy reference population 14 ng/L" },
]

[[range]]
set = "ehjopen-2022-acs-0-1h"
kind = "decision"
high = 5
when = { setting = "suspected-acute-mi", method = "roche-cobas-8000" }
population = "Adults presenting to the emergency department or ambulatory emergency care with suspected acute coronary syndrome"
evidence = "validation-study"
note = "Adapted ESC 0/1-hour hs-cTnT algorithm, low-risk band: initial hs-cTnT below 5 ng/L (strict '<5') when chest pain onset was at least 3 h before presentation. Rule-out boundary is strict (<5 ng/L)."
citations = [
  { pmid = "36032815", doi = "10.1093/ehjopen/oeac048", title = "Rapid risk stratification of acute coronary syndrome: adoption of an adapted European Society of Cardiology 0/1-hour troponin algorithm in a real-world setting.", url = "https://pubmed.ncbi.nlm.nih.gov/36032815/", locator = "Results, risk categories", quote = "a hs-cTnT on presentation of <5 ng/L if chest pain onset was at least 3 h prior" },
]

[[range]]
set = "ehjopen-2022-acs-0-1h"
kind = "decision"
low = 52
when = { setting = "suspected-acute-mi", method = "roche-cobas-8000" }
population = "Adults presenting to the emergency department or ambulatory emergency care with suspected acute coronary syndrome"
evidence = "validation-study"
note = "Adapted ESC 0/1-hour hs-cTnT algorithm, high-risk ('ACS likely') band: initial hs-cTnT of 52 ng/L or more, inclusive (>=52). Concentrations between 5 and 51 ng/L require a 1-hour repeat (rule-in if delta >=5 ng/L)."
citations = [
  { pmid = "36032815", doi = "10.1093/ehjopen/oeac048", title = "Rapid risk stratification of acute coronary syndrome: adoption of an adapted European Society of Cardiology 0/1-hour troponin algorithm in a real-world setting.", url = "https://pubmed.ncbi.nlm.nih.gov/36032815/", locator = "Results, risk categories (Figure 1)", quote = "initial hs-cTnT ≥52 ng/L" },
]

