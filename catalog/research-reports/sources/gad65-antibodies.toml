slug = "gad65-antibodies"
name = "GAD65 Autoantibodies"
loinc = "13926-1"
category = "autoimmune"
unit = "IU/mL"
description = "Autoantibodies against glutamic acid decarboxylase 65 (GAD65), measured by radioimmunoassay, ELISA or chemiluminescence immunoassay. Used to support a diagnosis of type 1 diabetes (including latent autoimmune diabetes in adults) and to evaluate GAD antibody-spectrum neurological syndromes. Results are assay-specific. Expected result: negative (below the upper reference limit)."

[[range]]
set = "reference"
kind = "reference"
high = 5.1
population = "Healthy Danish children (0-18 years) and adults (18-70 years)"
evidence = "reference-interval-study"
note = "Upper reference limit for GAD65 antibodies on the MAGLUMI 800 chemiluminescence assay, established per CLSI guidance. The study found a substantial discrepancy from the manufacturer's limit."
when = { method = "maglumi" }
citations = [
  { pmid = "30727763", doi = "10.1080/00365513.2019.1566566", title = "Reference limits for GAD65 and IA-2 autoantibodies by chemiluminescence immunoassay in Northern European adults and children.", locator = "Abstract", quote = "An upper reference limit of 5.1 IU/mL was defined for GAD65Ab" },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 6778
unit = "IU/mL"
population = "Patients with suspected autoimmune diabetes or GAD antibody-spectrum neurological syndromes (n = 90), tested on Maglumi and RIA"
evidence = "outcome-study"
note = "Maglumi-specific cut-off (ROC analysis, single study) separating neurological from diabetic patients; values at or above this cut-off indicate the neurological group."
when = { conditions = ["gad-antibody-neurological-disorder"], method = "maglumi" }
citations = [
  { pmid = "41076178", doi = "10.1016/j.clinbiochem.2025.111024", title = "Clinical relevance of the Maglumi immunoassay for anti-GAD65 in diabetes and neurological disorders: Analytical challenges and diagnostic insights.", locator = "Abstract (Results)", quote = "A cutoff of 6778 IU/mL discriminated neurological patients from diabetic patients (AUC = 0.96)" },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 10000
unit = "IU/mL"
population = "Patients with suspected GAD antibody-spectrum neurological disease, serum, tested on GAD65 ELISA"
evidence = "outcome-study"
note = "Neurological serum cut-off for the GAD65 ELISA (single validation study, correlated with RIA neurological cut-off). The study states this value is informative but requires clinical context."
when = { conditions = ["gad-antibody-neurological-disorder"], method = "elisa", specimen = "serum" }
citations = [
  { pmid = "41902651", doi = "10.1002/acn3.70378", title ="GAD65 Antibody ELISA With Extended Reportable Range: Validation and Guidance for Neurological Practice.", locator = "Results", quote = "Neurological ELISA cut-offs were established at 10,000 IU/mL (serum)" },
]
