slug = "oxygen-desaturation-index"
name = "Oxygen Desaturation Index"
loinc = "90567-9"
category = "sleep"
unit = "events/h"
description = "Number of oxygen desaturations of 4 percent or more per hour of recording, from pulse oximetry. Used as a screening and diagnostic index for obstructive sleep apnea (OSA); it is compared against the apnea-hypopnea index (AHI). Cut-offs below are from diagnostic-accuracy studies, not population reference intervals."
aliases = ["ODI", "ODI-4"]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 15
unit = "events/h"
when = { conditions = ["obstructive-sleep-apnea"] }
population = "Adults with suspected obstructive sleep apnea (8 studies, 1,924 patients)"
evidence = "meta-analysis"
note = "Systematic review (no pooled estimate) of 4 percent ODI against AHI. The review states that consideration should be given to diagnosing adult OSA at this value, and that further study is needed before a definitive recommendation."
citations = [
  { pmid = "32333683", doi = "10.1002/lary.28663", title = "The Value of Oxygen Desaturation Index for Diagnosing Obstructive Sleep Apnea: A Systematic Review.", url = "https://pubmed.ncbi.nlm.nih.gov/32333683/", locator = "Abstract, Conclusion", quote = "consideration should be given for diagnosing adult OSA with a 4% ODI of >= 15 events/hour" },
]

[[range]]
set = "clinical"
kind = "warn"
low = 10
unit = "events/h"
when = { conditions = ["obstructive-sleep-apnea"] }
population = "Adults with suspected obstructive sleep apnea (8 studies, 1,924 patients)"
evidence = "meta-analysis"
note = "Value at which the systematic review recommends further evaluation for OSA (4 percent ODI). Upper bound not stated in the source, so none is given here."
citations = [
  { pmid = "32333683", doi = "10.1002/lary.28663", title = "The Value of Oxygen Desaturation Index for Diagnosing Obstructive Sleep Apnea: A Systematic Review.", url = "https://pubmed.ncbi.nlm.nih.gov/32333683/", locator = "Abstract, Conclusion", quote = "for recommending further evaluation for diagnosing OSA with a 4% ODI >= 10 events/hour" },
]

[[range]]
set = "clinical"
kind = "reference"
high = 5
unit = "events/h"
when = { conditions = ["obstructive-sleep-apnea"] }
population = "Portable monitoring recordings for suspected obstructive sleep apnea (3,413 recordings; 2,281 training, 1,132 test)"
evidence = "outcome-study"
note = "Rule-out threshold: ODI strictly below 5 predicts AHI strictly below 5 (AHI under 5 events/h). It is a validated cut-off for excluding AHI of 5 or more, not a population reference interval."
citations = [
  { pmid = "29564732", doi = "10.1007/s11325-018-1654-2", title = "Validation of the oxygen desaturation index in the diagnostic workup of obstructive sleep apnea.", url = "https://pubmed.ncbi.nlm.nih.gov/29564732/", locator = "Abstract, Conclusion", quote = "An ODI < 5 predicts an AHI < 5 with high sensitivity and specificity" },
]
