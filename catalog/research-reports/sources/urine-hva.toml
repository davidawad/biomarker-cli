set = "reference"
kind = "reference"
high = 23.1
unit = "mmol/mol creatinine"
when = { age_min = 0, age_max = 1 }
population = "Children under 1 year, creatinine-normalised urine"
evidence = "reference-interval-study"
note = "Upper reference limit, Davidson 2011 HPLC-ECD rows as tabulated in the source review."
citations = [
  { pmid = "42299350", doi = "10.11613/BM.2026.020505", title = "Homovanillic acid and vanillylmandelic acid as neuroblastoma biomarkers in children.", locator = "Table 2 (Davidson 2011 rows)", quote = "1658 | Under 1 yr | < 23.1 | < 12.9" },
]

