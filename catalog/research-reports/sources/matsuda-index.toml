slug = "matsuda-index"
name = "Matsuda Insulin Sensitivity Index"
category = "glycemic"
unit = "index"
description = "Whole-body insulin sensitivity index calculated from a 75 g oral glucose tolerance test: 10,000 divided by the square root of (fasting glucose x fasting insulin) x (mean glucose x mean insulin during the OGTT). Higher values mean greater insulin sensitivity. Correlated with the euglycemic clamp (r = 0.73) in the derivation study."

[[range]]
set = "clinical"
kind = "diagnostic"
high = 5.0
population = "Caucasian rural adults with no previous evidence of diabetes or other dysglycemia, 75 g OGTT (n = 1156)"
evidence = "outcome-study"
note = "Insulin resistance defined by the 25th percentile of ISI Matsuda in this single population (cut-off 5.0). A percentile cut-off from one study, not a reference interval. The source does not state whether a value of exactly 5.0 is included."
citations = [
  { pmid = "16804799", doi = "10.1055/s-2006-924233", title = "Insulin sensitivity indices: a proposal of cut-off points for simple identification of insulin-resistant subjects.", locator = "Abstract (Results)", quote = "The 75th percentile value as the cut-off point to define IR corresponded with a HOMA-IR of 2.29, a HOMA-IR2 of 1.21, a 25th percentile for ISI Cederholm, and ISI Matsuda of 57 and 5.0, respectively." },
]
