slug = "dxa-t-score"
name = "Bone Mineral Density T-score"
loinc = "38263-0"
category = "body"
unit = "SD"
description = "Bone mineral density expressed as standard deviations from the mean of a young adult reference population, measured by DXA. Used to diagnose osteoporosis; a T-score of -2.5 or lower defines osteoporosis in postmenopausal women and men aged 50 and older."
aliases = ["DXA T-score", "BMD T-score", "bone density T-score"]

[[range]]
set = "iscd-adult-positions"
kind = "decision"
high = -2.5
when = { menopause = "post" }
population = "Postmenopausal women (DXA; lumbar spine, total hip or femoral neck)"
evidence = "guideline"
note = "Osteoporosis if T-score is -2.5 or less (boundary is less-than-or-equal). Site is the lumbar spine, total hip or femoral neck."
citations = [
  { url = "https://iscd.org/learn/official-positions/adult-positions/", title = "ISCD Official Positions: Adult Positions", locator = "Diagnosis", quote = "Osteoporosis may be diagnosed in postmenopausal women and in men age 50 and older if the T-score of the lumbar spine, total hip, or femoral neck is -2.5 or less" },
]

[[range]]
set = "iscd-adult-positions"
kind = "decision"
high = -2.5
when = { sex = "male", age_min = 50 }
population = "Men aged 50 and older (DXA; lumbar spine, total hip or femoral neck)"
evidence = "guideline"
note = "Osteoporosis if T-score is -2.5 or less (boundary is less-than-or-equal)."
citations = [
  { url = "https://iscd.org/learn/official-positions/adult-positions/", title = "ISCD Official Positions: Adult Positions", locator = "Diagnosis", quote = "Osteoporosis may be diagnosed in postmenopausal women and in men age 50 and older if the T-score of the lumbar spine, total hip, or femoral neck is -2.5 or less" },
]

[[range]]
set = "iscd-adult-positions"
kind = "decision"
high = -2.0
population = "Premenopausal women and men under 50 (Z-score, not T-score); the quoted sentence does not state the age or menopausal status restriction"
evidence = "guideline"
note = "Z-score of -2.0 or lower is defined as 'below the expected range for age' (Z-score, not T-score). The ISCD text retrieved does not state the population for this band, so the premenopausal/under-50 applicability is not confirmed by the quote."
citations = [
