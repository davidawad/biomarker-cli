slug = "cardio-recovery"
name = "Heart Rate Recovery (1 min)"
category = "wearable"
unit = "bpm"
description = "Fall in heart rate during the first minute after stopping exercise, computed as peak exercise heart rate minus the heart rate one minute after exercise ends. Tracked as a marker of vagal reactivation and cardiovascular prognosis. Expected result: a fall greater than 12 bpm; a fall of 12 bpm or less is classed as abnormal in the cited cohort."

[[range]]
set = "clinical"
kind = "warn"
high = 12
population = "Adults without a history of heart failure or coronary revascularization and without pacemakers, undergoing symptom-limited exercise testing (mean age 57 years, 63 percent men)"
evidence = "outcome-study"
note = "Abnormal (prognostic) heart rate recovery at one minute after exercise, cut-off 12 bpm or less (inclusive). Cohort measured on exercise-test ECG, not wearable data. Not a diagnostic threshold."
citations = [
  { pmid = "10536127", doi = "10.1056/NEJM199910283411804", title = "Heart-rate recovery immediately after exercise as a predictor of mortality.", locator = "Abstract (Methods)", quote = "An abnormal value for the recovery of heart rate was defined as a reduction of 12 beats per minute or less from the heart rate at peak exercise." },
]
