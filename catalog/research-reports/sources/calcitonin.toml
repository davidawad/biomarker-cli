slug = "calcitonin"
name = "Calcitonin"
category = "thyroid"
unit = "pg/mL"
description = "Hormone secreted by thyroid C-cells; the tumour marker for medullary thyroid carcinoma (MTC). Basal levels are sex-dependent and assay-dependent, and values in the 10-100 pg/mL range need follow-up rather than a diagnosis of MTC."

[[range]]
set = "calcitonin-lab-ranges-2019"
kind = "reference"
high = 8.4
when = { sex = "male", method = "immunoassay (Siemens Immulite 2000)" }
population = "Basal serum calcitonin reference limits as reported for a clinical laboratory, Germany (pre-June 2019 assay)"
evidence = "reference-interval"
note = "Upper normal limit reported by the cohort laboratory; assay-specific and not an independently derived reference interval."
citations = [
  { pmid = "41976801", doi = "10.3390/jcm15072500", title = "The Pitfalls of Calcitonin as a Tumor Marker: Real-Life Data of Patients with Elevated Basal Calcitonin Levels but Without Evidence of Medullary Thyroid Carcinoma.", url = "https://pubmed.ncbi.nlm.nih.gov/41976801/", locator = "Methods", quote = "Until 12 June 2019, measurements were performed using the Immulite 2000 system (Siemens, Forchheim, Germany) with Siemens calcitonin reagents, controls, and calibrators (normal range males: <8.4 pg/mL, females: <5 pg/mL)." },
]

