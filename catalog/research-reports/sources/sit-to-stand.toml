slug = "sit-to-stand"
name = "Sit-to-Stand Test (30 seconds)"
loinc = "66247-8"
category = "fitness"
unit = "reps"
description = "Sit-to-Stand Test (30 seconds). Number of full chair stands in 30 seconds (CDC STEADI protocol). Lower counts indicate lower leg strength and endurance."

[[range]]
set = "clinical"
kind = "warn"
high = 14
when = { sex = "male", age_min = 60, age_max = 65 }
population = "Community-dwelling males aged 60-64"
evidence = "guideline"
note = "CDC STEADI 30-second chair stand: a below average score (strictly fewer than 14 stands) indicates a risk for falls."
citations = [
  { url = "https://www.cdc.gov/steadi/media/pdfs/STEADI-Assessment-30Sec-508.pdf", locator = "Scoring table (Below Average Scores), age 60-64", quote = "60-64 < 14 < 12...A below average score indicates a risk for falls" },
]

