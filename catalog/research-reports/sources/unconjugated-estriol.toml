slug = "unconjugated-estriol"
name = "Unconjugated Estriol, Maternal Serum"
category = "pregnancy"
unit = "MoM"
description = "Fetoplacental estrogen measured in maternal serum in the second trimester, expressed as a multiple of the median (MoM). It is part of the quadruple Down syndrome screen. Low values are associated with Down syndrome and with adverse pregnancy outcomes such as small-for-gestational-age infants and preterm birth."

[[range]]
set = "ue3-second-trimester-outcome-2020"
kind = "diagnostic"
high = 0.5
when = { pregnancy = true, trimester = 2 }
population = "Second-trimester quadruple-screen samples in a population-based cohort, with small-for-gestational-age infants as the outcome"
evidence = "outcome"
note = "Unconjugated estriol below 0.5 MoM is treated as abnormal in the cited outcome studies. Values below the bound are flagged. Assay-dependent; the cited studies used conventional cut-offs from earlier literature."
citations = [
  { pmid = "33059628", doi = "10.1186/s12884-020-03298-9", title = "Quad test for fetal aneuploidy screening as a predictor of small-for-gestational-age fetuses: a population-based study.", url = "https://pubmed.ncbi.nlm.nih.gov/33059628/", locator = "Methods", quote = "Abnormal levels of the biomarkers were defined as the levels of greater than 2 MoM for AFP, b-hCG and IHA and less than 0.5 MoM for uE3" },
  { pmid = "41639641", doi = "10.1186/s12884-026-08758-2", title = "The association of first and second-trimester serum biomarkers with adverse perinatal outcomes in late-preterm and term deliveries: a retrospective cohort study.", url = "https://pubmed.ncbi.nlm.nih.gov/41639641/", locator = "Methods", quote = "MoM values were categorized as follows: >2.0 was considered high, < 0.5 was considered low, and values between 0.5 and 2.0 were classified as normal." },
]
