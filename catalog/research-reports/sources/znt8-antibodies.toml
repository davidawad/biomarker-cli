slug = "znt8-antibodies"
name = "ZnT8 Autoantibodies"
loinc = "76651-9"
category = "autoimmune"
unit = "WHO U/mL"
description = "IgG autoantibodies against zinc transporter 8 (ZnT8), a beta-cell antigen, measured by immunoassay (ELISA or radiobinding). Tracked as one of the islet autoantibodies (with GADA, IA-2A, IAA) to screen for and classify type 1 diabetes, and to tell autoimmune diabetes from type 2 diabetes in young people. Expected result: negative (below the age-specific cut-off)."

[[range]]
set = "reference"
kind = "reference"
high = 18
unit = "WHO U/mL"
when = { age_max = 30 }
population = "Control sera from people without diabetes and with HbA1c below 6.0% (<42 mmol/mol), aged 0-83 years; participants tested under 30 years"
evidence = "reference-interval-study"
note = "97.5th centile of control sera for people tested under 30 years, as stated by the source."
citations = [
  { pmid = "34348918", doi = "10.1136/bmjdrc-2021-002296", title = "Zinc transporter 8 autoantibody testing requires age-related cut-offs.", locator = "Abstract, Results", quote = "The 97.5th and 99th centile thresholds were substantially higher in younger participants: 18 and 127 WHO U/mL (tested under 30 years) in comparison with 9 and 21 WHO U/mL (tested 30 years and over)." },
]

