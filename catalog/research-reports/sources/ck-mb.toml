slug = "ck-mb"
name = "Creatine Kinase-MB"
loinc = "13969-1"
category = "cardiac"
unit = "ng/mL"
description = "Mass concentration of the MB isoenzyme of creatine kinase, a heart-enriched enzyme measured to detect myocardial injury. Expected result in healthy people: at or below the age- and sex-specific upper reference limit. Infant limits (under 1 year) from the same study are not stored because whole-year age keys cannot express them."

[[range]]
set = "reference"
kind = "reference"
high = 6.29
when = { age_min = 1, age_max = 4, method = "roche-cobas-e411" }
population = "Healthy Chinese children aged 1 to under 4 years (both sexes, prospective study, n=247)"
evidence = "reference-interval-study"
note = "Upper reference limit (97.5th percentile, CLSI C28-A3 approach, Roche cobas e411). One-sided: no lower limit."
citations = [
  { pmid = "39550417", doi = "10.1038/s41598-024-77153-8", title = "Age- and sex-specific upper reference limits for cardiac biomarkers in Chinese children and adolescents: a prospective study.", locator = "Table 2", quote = "1y-<4y | F + M | 247 | 2.94 | 6.29" },
]

