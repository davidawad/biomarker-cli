slug = "reticulocyte-hemoglobin"
name = "Reticulocyte hemoglobin (Ret-He / CHr)"
category = "iron"
unit = "pg"
description = "Haemoglobin content of the reticulocyte population, measured on automated analysers (Ret-He on Sysmex, CHr on Siemens/Bayer). Low values indicate reduced iron supply to erythropoiesis (functional or absolute iron deficiency), and it is used to guide iron therapy, especially in CKD."

[[range]]
set = "ret-he-dialysis-2006"
kind = "deficient"
high = 27.2
population = "1500 blood samples from patients on chronic haemodialysis, compared with serum iron, transferrin saturation, ferritin and haemoglobin criteria (Sysmex XE-2100)"
evidence = "outcome"
note = "ROC-derived cut-off: sensitivity 93.3%, specificity 83.2% for iron deficiency in dialysis patients. Reference standard was the traditional iron indices."
citations = [
  { pmid = "16999719", doi = "10.1111/j.1365-2257.2006.00812.x", title = "Reticulocyte hemoglobin equivalent (Ret He) and assessment of iron-deficient states.", locator = "Abstract", quote = "With a Ret He cutoff level of 27.2 pg, iron deficiency could be diagnosed with a sensitivity of 93.3%, and a specificity of 83.2%." },
]

[[range]]
set = "ret-he-ida-2020"
kind = "deficient"
high = 30
population = "953 retrospective clinical records: healthy controls, iron-deficiency anaemia and non-iron-deficiency anaemia; iron deficiency defined by serum ferritin; patients on iron therapy excluded"
evidence = "outcome"
note = "ROC optimal cut-off: a value <=30 pg identified iron-deficiency anaemia with 96% sensitivity, 97.4% specificity; >30 pg was taken to exclude IDA. Single-centre retrospective study."
citations = [
  { pmid = "32043622", doi = "10.1002/jcla.23225", title = "Diagnostic performance of reticulocyte hemoglobin equivalent in assessing the iron status.", locator = "Abstract", quote = "Applying cutoff ≤30 pg, IDA can be diagnosed with 96% sensitivity, 97.4% specificity, 80% PPV, and 99.6% NPV." },
]

[[range]]
set = "ckd-iron-review-2021"
kind = "therapeutic"
low = 29
when = { condition = ["ckd"] }
population = "adults with chronic kidney disease (including dialysis) with iron deficiency, as tabulated for iron-therapy targets"
evidence = "review"
note = "Therapy target (RET-He > 29 pg) listed alongside hypochromic cells < 6%, ferritin > 100 ug/L and TSAT > 20%; a target for tracking response to IV iron, not a diagnostic cut-off. The review does not give a primary source for the 29 pg figure in this table."
citations = [
  { pmid = "34575361", doi = "10.3390/jcm10184250", title = "Reticulocyte and Erythrocyte Hemoglobin Parameters for Iron Deficiency and Anemia Diagnostics in Patient Blood Management. A Narrative Review.", locator = "Table 2", quote = "Reticulocyte Hb (RET-He) > 29 pg Ferritin > 100 µg/L TSAT > 20%" },
]

