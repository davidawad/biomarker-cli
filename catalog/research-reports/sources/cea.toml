slug = "cea"
name = "Carcinoembryonic Antigen"
loinc = "2039-6"
category = "tumour"
unit = "ng/mL"
description = "Carcinoembryonic antigen, a glycoprotein marker of some gastrointestinal and other cancers. It is used mainly to monitor colorectal cancer after treatment; many non-cancer factors, including smoking, can raise it."
aliases = ["CEA"]

[[range]]
set = "cea-review-2026"
kind = "decision"
high = 5
population = "Adults; colorectal cancer context (narrative review)"
evidence = "consensus"
note = "Commonly used cut-off for CEA elevation. Values are not diagnostic on their own; smoking and other benign conditions can raise CEA. Boundary as quoted (5 ng/mL is the usual upper limit; the review does not state > versus >=)."
citations = [
  { pmid = "42214175", doi = "10.1016/j.tranon.2026.102835", title = "Current opinions on CEA in the diagnosis and prognosis of colorectal cancer.", url = "https://pubmed.ncbi.nlm.nih.gov/42214175/", locator = "Full text, CEA levels section", quote = "Commonly, 5 ng/mL as the cutoff level is used to define CEA elevation" },
]

[[range]]
set = "cea-review-2026"
kind = "warn"
low = 5
high = 10
population = "Adults; colorectal cancer context (narrative review)"
evidence = "consensus"
note = "Borderline band: CEA 5-10 ng/mL can be produced by benign factors, so a value in this band needs context and repeat measurement."
citations = [
  { pmid = "42214175", doi = "10.1016/j.tranon.2026.102835", title = "Current opinions on CEA in the diagnosis and prognosis of colorectal cancer.", url = "https://pubmed.ncbi.nlm.nih.gov/42214175/", locator = "Full text, CEA levels section", quote = "which has limitations in predicting recurrence, as benign factors can elevate CEA in 5-10 ng/ml." },
]

[[range]]
set = "wjgs-cea-2024"
kind = "reference"
high = 5
population = "Adult non-smokers (narrative review of CEA in focal liver lesions)"
evidence = "consensus"
note = "Normal serum CEA in adult non-smokers taken as below 5 ng/mL (boundary < 5 as quoted). Smoking status is not a schema condition here, so the smoker band is a separate range."
citations = [
  { pmid = "38690060", doi = "10.4240/wjgs.v16.i4.999", title = "Carcinoembryonic antigen in the diagnosis, treatment, and follow-up of focal liver lesions.", url = "https://pubmed.ncbi.nlm.nih.gov/38690060/", locator = "Full text, Introduction", quote = "Normal serum CEA value is considered to be < 5 ng/mL in normal adult non-smokers and < 10 ng/mL in smokers." },
]

[[range]]
set = "wjgs-cea-2024"
kind = "reference"
high = 10
population = "Adult smokers (narrative review of CEA in focal liver lesions)"
evidence = "consensus"
note = "Normal serum CEA in smokers taken as below 10 ng/mL (boundary < 10 as quoted). Smoking raises CEA, so the non-smoker limit of 5 ng/mL does not apply to smokers. Smoking status is not a schema condition, so this is described here and in population."
citations = [
  { pmid = "38690060", doi = "10.4240/wjgs.v16.i4.999", title = "Carcinoembryonic antigen in the diagnosis, treatment, and follow-up of focal liver lesions.", url = "https://pubmed.ncbi.nlm.nih.gov/38690060/", locator = "Full text, Introduction", quote = "Normal serum CEA value is considered to be < 5 ng/mL in normal adult non-smokers and < 10 ng/mL in smokers." },
]

