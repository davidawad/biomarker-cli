slug = "fib4"
name = "FIB-4 Index"
category = "liver"
unit = "ratio"
description = "FIB-4 is a blood-based score (age, AST, ALT, platelets) used to stratify risk of advanced liver fibrosis in people with MASLD or other chronic liver disease. Low-risk and high-risk cut-offs are applied to rule out or rule in advanced fibrosis before imaging."

[[range]]
set = "clinical"
kind = "reference"
high = 1.3
population = "Adults with chronic liver disease or metabolic dysfunction-associated steatotic liver disease (MASLD)"
evidence = "outcome-study"
note = "Low risk of advanced fibrosis (FIB-4 below 1.30; 2.0 applies instead of 1.3 at age 65 and above)."
citations = [
  { pmid = "38188279", doi = "10.1016/j.lanepe.2023.100780", title = "Prognostic utility of Fibrosis-4 Index for risk of subsequent liver and cardiovascular events, and all-cause mortality in individuals with obesity and/or type 2 diabetes: a longitudinal cohort study.", locator = "Abstract (Results)", quote = "At 10 years, the cumulative incidence of liver events in the high (>2.67), indeterminate (1.30-2.67), and low (<1.30) baseline FIB-4 risk groups were 15%, 3%, and 1%, respectively." },
]

