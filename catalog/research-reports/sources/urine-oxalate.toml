slug = "urine-oxalate"
name = "Oxalate, Urine"
loinc = "2700-3"
category = "organic-acid"
unit = "mmol/mol creatinine"
description = "Urinary oxalate, the end product of endogenous oxalate metabolism and dietary absorption. Measured to screen for hyperoxaluria, which raises the risk of calcium oxalate kidney stones and oxalate nephropathy, and to diagnose primary hyperoxaluria. Spot results are reported per creatinine; 24-hour results in mmol/d. Expected result: within the age- and sex-specific reference interval; values above the upper limit indicate hyperoxaluria."

[[range]]
set = "reference"
kind = "reference"
low = 8.499
high = 54.39
when = { sex = "male", age_min = 19, age_max = 30 }
population = "Healthy adults aged 19 to 29 years undergoing routine physical examination (male)"
evidence = "reference-interval-study"
note = "Spot urine oxalate to creatinine (UOA/UCr) reference interval, male 19-29 years, as stated in the source. Units are the source's mmol/mol."
citations = [
  { pmid = "40410837", doi = "10.1186/s40001-025-02657-6", title = "Establishment of adult reference interval of oxalate in spot urine using real-world data.", locator = "Results", quote = "For males, three age-specific partitions were identified: 19-29 years (8.499-54.39 mmol/mol), 30-39 years (10.25-61.29 mmol/mol), and >= 40 years (12.13-68.69 mmol/mol)." },
]

