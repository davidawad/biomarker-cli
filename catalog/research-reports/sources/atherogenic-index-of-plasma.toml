slug = "atherogenic-index-of-plasma"
name = "Atherogenic Index of Plasma"
category = "derived"
unit = "index"
description = "Atherogenic Index of Plasma (AIP) is the base-10 logarithm of the triglyceride to HDL cholesterol ratio, with both lipids in mmol/L. It is used as a marker of atherogenic dyslipidaemia and cardiovascular risk."
aliases = ["AIP", "log(TG/HDL-C)", "log TG/HDL ratio"]

[[range]]
set = "dobiasova-frohlich-aip-bands"
kind = "decision"
high = 0.11
population = "Adults in cardiovascular and metabolic risk studies; zones attributed to Dobiasova and Frohlich"
evidence = "consensus"
note = "Low atherogenic risk: AIP below 0.11 (boundary < 0.11). Band is reported as a risk zone, not a diagnostic cut-off. Original Dobiasova and Frohlich paper not retrievable; band taken from a 2026 Metabolites paper."
citations = [
  { pmid = "42187998", doi = "10.3390/metabo16050289", title = "Atherogenic Index of Plasma Relationship with Cardiovascular Risk Factors and Frailty and Value as Determinant of Mortality in Elderly Patients with Severe Aortic Stenosis.", url = "https://pubmed.ncbi.nlm.nih.gov/42187998/", locator = "Full text, Results (AIP categories)", quote = "values < 0.11 indicate low risk, 0.11–0.21 moderate risk, and >0.21 indicate high risk for atherosclerosis" },
]

