[[range]]
set = "clinical"
kind = "diagnostic"
low = 20.5
when = { conditions = ["non-small-cell-lung-cancer"] }
population = "Patients with NSCLC in a serum NSE study of 417 lung cancer patients (ROC analysis for SCLC vs NSCLC)"
evidence = "outcome-study"
note = "Strictly above 20.5 ng/mL in NSCLC: source says pathological features must be examined for neuroendocrine differentiation."
citations = [
  { pmid = "11956631", title = "Cut-off levels of NSE to differentiate SCLC from NSCLC.", locator = "Abstract", quote = "If an NSCLC patient presents with a NSE level >20.5 ng/ml, pathological features must be examined with regard to the neuroendocrine differentiation." },
]
