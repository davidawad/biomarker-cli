slug = "nse"
name = "Neuron-Specific Enolase (NSE)"
loinc = "15060-7"
category = "tumor-marker"
unit = "ng/mL"
description = "Neuron-specific enolase, a glycolytic enzyme measured in serum by immunoassay. Tracked as a tumour marker for small cell lung cancer and neuroendocrine tumours and as a marker of neuronal damage. Expected result in healthy people: at or below the reference upper limit."

[[range]]
set = "reference"
kind = "reference"
high = 25.4
when = { age_min = 20, age_max = 80 }
population = "Healthy Chinese adults aged 20-79 years (n = 10,575), Cobas e602 NSE assay; no difference by sex or age"
evidence = "reference-interval-study"
note = "Population upper reference limit (unilateral 95th percentile) stated by the source."
citations = [
  { pmid = "30779465", doi = "10.1002/jcla.22863", title = "Distribution of serum neuron-specific enolase and the establishment of a population reference interval in healthy adults.", locator = "Methods and Results", quote = "healthy Chinese adults aged 20-79 years ... the population reference interval for serum NSE was established as upper limit 25.4 ng/mL (90% confidence interval: 24.5-26.2 ng/mL)." },
]

[[range]]
set = "reference"
kind = "reference"
high = 17.26
when = { sex = "male" }
population = "Healthy persons from routine health check-up, Chengdu, China (n = 3,293 for NSE); indirect method; no correlation with age"
evidence = "reference-interval-study"
note = "Indirect 95th percentile interval, males. Source states the lower limit as 0."
citations = [
  { pmid = "31414742", doi = "10.7754/Clin.Lab.2019.190113", title = "Establishment of Reference Intervals for Serum Cytokeratin-19 Fragment and Neuron Specific Enolase by Indirect Method Using Data Obtained from Healthy Chinese Population in Chengdu.", locator = "Results", quote = "After statistical analysis the indirect RIs were 0.0 - 3.70 ng/mL (Cyfra211) and 0 - 17.26 ng/mL (NSE) in males and 0.0 - 3.35 ng/mL (Cyfra211) and 0.0 - 16.29 ng/mL (NSE) in females." },
]

