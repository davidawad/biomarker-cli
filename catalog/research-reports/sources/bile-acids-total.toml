slug = "bile-acids-total"
name = "Bile Acids, Total (serum)"
category = "pregnancy"
unit = "µmol/L"
description = "Sum of serum bile acids. In pregnancy, raised levels with pruritus define intrahepatic cholestasis of pregnancy (ICP), and higher concentrations track with adverse perinatal outcome, especially stillbirth. Postprandial samples read higher than fasting samples."

[[range]]
set = "bjog-2021-icp-thresholds"
kind = "reference"
high = 18.3
when = { pregnancy = true, trimester = 3, fasting = false, specimen = "serum" }
population = "Third-trimester non-fasting reference range from 561 women of black, south Asian and white ethnicity (BJOG 2021 case-control and cohort study)"
evidence = "reference-interval"
note = "Upper reference limit for non-fasting total serum bile acids in the third trimester (highest upper limit across the ethnic groups analysed). Non-fasting values rise after meals."
citations = [
  { pmid = "33586324", doi = "10.1111/1471-0528.16669", title = "Re-evaluating diagnostic thresholds for intrahepatic cholestasis of pregnancy: case-control and cohort study.", url = "https://pubmed.ncbi.nlm.nih.gov/33586324/", locator = "Abstract, Results", quote = "The highest upper limit of the non-fasting TSBA reference range was 18.3 µmol/l" },
  { pmid = "33586324", doi = "10.1111/1471-0528.16669", title = "Re-evaluating diagnostic thresholds for intrahepatic cholestasis of pregnancy: case-control and cohort study.", url = "https://pubmed.ncbi.nlm.nih.gov/33586324/", locator = "Abstract, Methods", quote = "Third-trimester non-fasting TSBA reference ranges were calculated from 561 women of black, south Asian and white ethnicity." },
]

[[range]]
set = "bjog-2021-icp-thresholds"
kind = "diagnostic"
low = 19
when = { pregnancy = true, conditions = ["intrahepatic-cholestasis-of-pregnancy"], fasting = false, specimen = "serum" }
population = "Women with suspected intrahepatic cholestasis of pregnancy, non-fasting sampling (BJOG 2021)"
evidence = "outcome"
note = "Proposed non-fasting threshold (19 µmol/L or more) that improves diagnostic accuracy because postprandial rise in normal pregnancy is accounted for. Compare with fasting thresholds."
citations = [
  { pmid = "33586324", doi = "10.1111/1471-0528.16669", title = "Re-evaluating diagnostic thresholds for intrahepatic cholestasis of pregnancy: case-control and cohort study.", url = "https://pubmed.ncbi.nlm.nih.gov/33586324/", locator = "Abstract, Conclusions", quote = "The postprandial rise in TSBA in normal pregnancy indicates that a non-fasting threshold of ≥19 µmol/l would improve diagnostic accuracy." },
]

[[range]]
set = "bjog-2021-icp-thresholds"
kind = "diagnostic"
low = 40
when = { pregnancy = true, conditions = ["intrahepatic-cholestasis-of-pregnancy"], fasting = false, specimen = "serum" }
population = "Women with intrahepatic cholestasis of pregnancy, non-fasting sampling (BJOG 2021)"
evidence = "outcome"
note = "Severe ICP cut-off (40 µmol/L or more). Non-fasting sampling detected over 91% of severe cases in this study; fasting sampling detected 9%."
citations = [
  { pmid = "33586324", doi = "10.1111/1471-0528.16669", title = "Re-evaluating diagnostic thresholds for intrahepatic cholestasis of pregnancy: case-control and cohort study.", url = "https://pubmed.ncbi.nlm.nih.gov/33586324/", locator = "Abstract, Conclusions", quote = "Postprandial TSBA levels are required to identify high-risk ICP pregnancies (TSBA ≥40 μmol/l)." },
]

[[range]]
set = "ovadia-2019-lancet"
kind = "critical"
low = 100
when = { pregnancy = true, conditions = ["intrahepatic-cholestasis-of-pregnancy"], specimen = "serum" }
population = "Women with intrahepatic cholestasis of pregnancy, aggregate and individual patient data from 27 studies (singleton pregnancies)"
evidence = "meta-analysis"
note = "Stillbirth risk is increased at 100 µmol/L or more in singleton pregnancies (stillbirth 3.44% vs 0.13% and 0.28% below 100 µmol/L). Most women with ICP are below this level; repeat testing is advised."
citations = [
  { pmid = "30773280", doi = "10.1016/S0140-6736(18)31877-4", title = "Association of adverse perinatal outcomes of intrahepatic cholestasis of pregnancy with biochemical markers: results of aggregate and individual patient data meta-analyses.", url = "https://pubmed.ncbi.nlm.nih.gov/30773280/", locator = "Interpretation", quote = "The risk of stillbirth is increased in women with intrahepatic cholestasis of pregnancy and singleton pregnancies when serum bile acids concentrations are of 100 μmol/L or more." },
]
