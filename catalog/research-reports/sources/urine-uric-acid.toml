  { pmid = "40080792", doi = "10.1590/2175-8239-JBN-2024-0189en", title = "Brazilian Guidelines on evaluation and clinical management of Nephrolithiasis: Brazilian Society of Nephrology.", locator = "Section on urinary laboratory parameters (text preceding Table 4)", quote = "Therapeutic decisions could be applied from the attention level and are recommended from the action level." },
]

