[[range]]
set = "reference"
kind = "reference"
low = 280
high = 827
unit = "mg/day/1.73 m2"
when = { sex = "male", age_min = 20, age_max = 66 }
population = "Healthy Japanese men aged 20-65 years, 24-hour collection, BSA-standardized urinary uric acid excretion (Eua)"
evidence = "reference-interval-study"
note = "Central 95% reference interval (2.5th-97.5th percentiles) for the BSA-standardized 24-hour uric acid excretion index Eua. Vendor-style BSA-indexed unit, so it is a companion marker."
citations = [
  { pmid = "42841992", doi = "10.1007/s00394-026-04110-8", title = "Reference intervals of urinary clearance and excretion of uric acid (RICE-U) in Japan.", locator = "Abstract, Results", quote = "BSA-standardized Eua reference intervals were 280-827 mg/day/1.73 m2 in men and 263-812 mg/day/1.73 m2 in women for 24-h collection" },
  { pmid = "42841992", doi = "10.1007/s00394-026-04110-8", title = "Reference intervals of urinary clearance and excretion of uric acid (RICE-U) in Japan.", locator = "Abstract, Methods", quote = "This multicenter prospective observational study included 445 reference individuals (214 men and 231 women; age, 20-65 years)" },
  { pmid = "42841992", doi = "10.1007/s00394-026-04110-8", title = "Reference intervals of urinary clearance and excretion of uric acid (RICE-U) in Japan.", locator = "Abstract, Methods", quote = "Reference intervals were estimated separately by sex using the non-parametric central 95% range (2.5th-97.5th percentiles)" },
]

