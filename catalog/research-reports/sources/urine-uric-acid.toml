slug = "urine-uric-acid"
name = "Urine Uric Acid"
loinc = "3086-6"
category = "urinalysis"
unit = "mg/day"
description = "24-hour urinary uric acid excretion. Tracked to assess uric acid kidney stone risk (uric acid stones) and urinary uric acid handling, interpreted together with urinary pH. Expected result: within the reference range; values above the action level prompt evaluation."

[[range]]
set = "reference"
kind = "reference"
low = 250
high = 750
when = { }
population = "Adults, 24-hour urine collection (Brazilian Society of Nephrology guideline, Table 4)"
evidence = "guideline"
note = "Guideline reference range for 24-hour urinary uric acid. The guideline states reference values are a suggestion that varies by laboratory standardization."
citations = [
  { pmid = "40080792", doi = "10.1590/2175-8239-JBN-2024-0189en", title = "Brazilian Guidelines on evaluation and clinical management of Nephrolithiasis: Brazilian Society of Nephrology.", locator = "Table 4, Urinary laboratory parameters in adults (Uric Acid row)", quote = "| Uric Acid | 250-750 mg/day | - | >750 mg (F) >800 mg (M) | Evaluate along with urinary pH" },
]

