slug = "ana-titer"
name = "Antinuclear Antibody Titer (HEp-2 IFA)"
loinc = "5048-4"
category = "autoimmune"
unit = "titer (reciprocal of dilution)"
description = "Antinuclear antibodies measured by indirect immunofluorescence on HEp-2 cells, reported as the reciprocal of the highest positive serum dilution (1:80 = 80). Low titres are common in healthy people, so the titre and the staining pattern both matter."
aliases = ["ANA", "ANA IFA", "HEp-2 ANA"]

[[range]]
set = "eular-acr-2019-sle"
kind = "decision"
low = 80
population = "Adults and children assessed for systemic lupus erythematosus classification"
evidence = "consensus"
note = "Positive ANA at a titre >=1:80 on HEp-2 cells (or an equivalent positive test) at least once is the obligatory entry criterion of the 2019 EULAR/ACR SLE classification criteria. Titres below 1:80 do not satisfy this entry criterion."
citations = [
  { pmid = "31385462", doi = "10.1002/art.40930", title = "2019 European League Against Rheumatism/American College of Rheumatology Classification Criteria for Systemic Lupus Erythematosus.", url = "https://pubmed.ncbi.nlm.nih.gov/31385462/", locator = "Full text, ANA entry criterion", quote = "Antinuclear antibodies (ANA) at a titer of ≥1:80 on HEp-2 cells or an equivalent positive test at least once." },
  { pmid = "22237992", doi = "10.1002/art.34380", title = "Prevalence and sociodemographic correlates of antinuclear antibodies in the United States.", url = "https://pubmed.ncbi.nlm.nih.gov/22237992/", locator = "Full text, Discussion", quote = "Our finding of an overall ANA prevalence of 13.8% at a 1:80 serum dilution-level" },
]

[[range]]
set = "tan-1997-healthy-ana"
kind = "decision"
low = 160
population = "Healthy individuals aged 20-60 years compared with patients with SLE, systemic sclerosis, Sjogren's syndrome, RA and soft tissue rheumatism (HEp-2 IFA across 15 laboratories)"
evidence = "reference-interval-study"
note = "High-positive cut-off: a titre >=1:160 is specific but insensitive and would be likely to exclude about 95% of healthy individuals. The authors recommend reporting results at both 1:40 and 1:160."
citations = [
  { pmid = "9324014", doi = "10.1002/art.1780400909", title = "Range of antinuclear antibodies in \"healthy\" individuals.", url = "https://pubmed.ncbi.nlm.nih.gov/9324014/", locator = "Abstract, Results", quote = "a high positive cutoff at 1:160 serum dilution (high specificity, low sensitivity) would be useful to confirm the presence of disease in only a portion of cases, but would be likely to exclude 95% of normal individuals." },
]
