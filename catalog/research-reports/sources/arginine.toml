description = "Plasma concentration of the amino acid L-arginine, the substrate for nitric oxide synthesis. Low values are considered in the context of impaired nitric oxide pathways and cardiovascular risk; interpretation is usually paired with asymmetric dimethylarginine (ADMA)."

