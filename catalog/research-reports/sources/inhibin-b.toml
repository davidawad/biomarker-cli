slug = "inhibin-b"
name = "Inhibin B"
category = "hormone"
unit = "pg/mL"
description = "Glycoprotein secreted by Sertoli cells in men and by granulosa cells of growing follicles in women. Suppresses pituitary FSH. In men it is a marker of spermatogenesis; in women it reflects early follicular activity and ovarian reserve."

[[range]]
set = "inhibin-b-normozoospermic-controls-2019"
kind = "reference"
low = 62.75
when = { sex = "male" }
population = "Control men with normal total sperm number (WHO 2010), Rome, retrospective study; the 5th percentile was taken as the lower limit"
evidence = "reference-interval"
note = "Lower limit (5th percentile) of inhibin B in normozoospermic control men. Value was derived in one centre, so treat as local rather than universal."
citations = [
  { pmid = "30531061", doi = "10.4103/aja.aja_93_18", title = "Inhibin B: are modified ranges needed for orchiectomised testicular cancer patients?", url = "https://pubmed.ncbi.nlm.nih.gov/30531061/", locator = "Results, Table 4", quote = "The 5th percentile of the CTR group was taken as the cutoff (62.75 pg ml−1)." },
]

[[range]]
set = "inhibin-b-normozoospermic-controls-2019"
kind = "reference"
low = 80
high = 350
when = { sex = "male" }
population = "Men with normal spermatogenesis, as cited by the authors for postpubertal men"
evidence = "reference-interval"
note = "Normal postpubertal range as stated by the authors. The source gives no percentile or sample size for this range, so it is a secondary citation."
citations = [
  { pmid = "30531061", doi = "10.4103/aja.aja_93_18", title = "Inhibin B: are modified ranges needed for orchiectomised testicular cancer patients?", url = "https://pubmed.ncbi.nlm.nih.gov/30531061/", locator = "Methods, Assay performance", quote = "The normal postpubertal range was 80–350 pg ml−1." },
]

[[range]]
set = "male-infertility-inhibin-b-cutoffs-2021"
kind = "diagnostic"
high = 58.25
when = { sex = "male", conditions = ["severe-oligozoospermia"] }
population = "Subfertile Chinese men, 324 patients with different spermatogenesis status"
evidence = "outcome"
note = "Upper cut-off for severe oligozoospermia (ISO) in the source. Values at or below this favour impaired spermatogenesis. Single-centre, derived from the same cohort it was tested in."
citations = [
  { pmid = "34181290", doi = "10.1002/jcla.23882", title = "Clinical application value of Inhibin B alone or in combination with other hormone indicators in subfertile men with different spermatogenesis status: A study of 324 Chinese men.", url = "https://pubmed.ncbi.nlm.nih.gov/34181290/", locator = "Abstract, Results", quote = "The upper cutoff value of Inhibin B to diagnose ISO is 58.25 pg/ml with a predictive accuracy of 80.65%." },
]

[[range]]
set = "male-infertility-inhibin-b-cutoffs-2021"
kind = "diagnostic"
