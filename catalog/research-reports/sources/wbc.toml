slug = "wbc"
name = "White blood cell count"
loinc = "6690-2"
category = "cbc"
unit = "10^3/µL"
description = "Total leukocyte count in blood, the sum of neutrophils, lymphocytes, monocytes, eosinophils and basophils. Low values (leukopenia) occur with marrow failure, drugs, infection, or benign ethnic / Duffy-null neutropenia; high values (leukocytosis) occur with infection, inflammation, stress, steroids or leukaemia."

[[range]]
set = "norip"
kind = "reference"
low = 3.5
high = 8.8
source_unit = "10^9/L"
source_factor = 1
when = { age_min = 18, age_max = 90 }
population = "1826 healthy Nordic adults aged 18-90 (NORIP), EDTA venous blood, 12 analyser types"
evidence = "reference-interval"
note = "B-Lkc, non-parametric 2.5th-97.5th percentiles; no sex-specific interval was derived."
citations = [
  { pmid = "15223702", doi = "10.1080/00365510410002797", title = "A multicentre study of reference intervals for haemoglobin, basic blood cell counts and erythrocyte indices in the adult population of the Nordic countries.", locator = "Abstract", quote = "B-Lkc (3.5-8.8 x 10(9)/L)" },
]

