slug = "nafld-fibrosis-score"
name = "NAFLD Fibrosis Score"
category = "derived"
unit = "score"
description = "Composite score from age, BMI, impaired glucose status, platelet count, albumin and AST/ALT ratio that estimates advanced fibrosis in NAFLD. Scores below the low cut-off exclude advanced fibrosis and scores above the high cut-off suggest it."
aliases = ["NFS", "NAFLD-FS"]

[[range]]
set = "angulo-2007"
kind = "decision"
high = -1.455
population = "Adults with biopsy-proven NAFLD (derivation and validation cohorts)"
evidence = "validation-study"
note = "Low cut-off: scores below -1.455 exclude advanced fibrosis with high accuracy (NPV 93% and 88%). Not validated for under 35 and for 65 and over, where age-adjusted cut-offs apply."
citations = [
  { pmid = "17393509", doi = "10.1002/hep.21496", title = "The NAFLD fibrosis score: a noninvasive system that identifies liver fibrosis in patients with NAFLD.", url = "https://pubmed.ncbi.nlm.nih.gov/17393509/", locator = "Abstract, Results", quote = "By applying the low cutoff score (-1.455), advanced fibrosis could be excluded with high accuracy" },
]

[[range]]
set = "angulo-2007"
kind = "warn"
low = -1.455
high = 0.676
population = "Adults with biopsy-proven NAFLD (derivation and validation cohorts)"
evidence = "validation-study"
note = "Indeterminate band between the low cut-off -1.455 and the high cut-off 0.676."
citations = [
  { pmid = "17393509", doi = "10.1002/hep.21496", title = "The NAFLD fibrosis score: a noninvasive system that identifies liver fibrosis in patients with NAFLD.", url = "https://pubmed.ncbi.nlm.nih.gov/17393509/", locator = "Abstract, Results", quote = "By applying the low cutoff score (-1.455), advanced fibrosis could be excluded with high accuracy" },
  { pmid = "17393509", doi = "10.1002/hep.21496", title = "The NAFLD fibrosis score: a noninvasive system that identifies liver fibrosis in patients with NAFLD.", url = "https://pubmed.ncbi.nlm.nih.gov/17393509/", locator = "Abstract, Results", quote = "By applying the high cutoff score (0.676), the presence of advanced fibrosis could be diagnosed with high accuracy" },
]

