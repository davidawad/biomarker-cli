slug = "monocytes-abs"
name = "Absolute monocyte count"
loinc = "742-7"
category = "cbc"
unit = "10^3/µL"
description = "Absolute count of circulating monocytes, precursors of tissue macrophages and dendritic cells. High values (monocytosis) occur with chronic infection such as tuberculosis, inflammation, and myeloid disorders; low values are uncommon and usually drug- or marrow-related."

