slug = "cortisol"
name = "Cortisol (AM)"
loinc = "2143-6"
category = "adrenal"
unit = "µg/dL"
description = "Serum cortisol, mainly measured in the morning. Used to screen for adrenal insufficiency (basal and after ACTH stimulation) and, after a dexamethasone suppression test, for Cushing's syndrome. Results depend strongly on the assay (immunoassay vs LC-MS/MS)."

[[range]]
set = "netherlands-reference-2005"
kind = "reference"
low = 150
high = 802
unit = "nmol/L"
when = { time_of_day = "morning", specimen = "plasma", age_min = 20, age_max = 69 }
population = "50 healthy subjects from the general population aged 20-69 years, equally distributed by sex and age"
