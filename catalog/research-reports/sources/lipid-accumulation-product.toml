slug = "lipid-accumulation-product"
name = "Lipid Accumulation Product"
category = "body-composition"
unit = "cm mmol/L"
description = "Computed index of visceral adiposity from waist circumference (cm) and fasting triglycerides (mmol/L): LAP = (WC - 58) x TG for women; LAP = (WC - 65) x TG for men (formula as stated in PMID 34045594, Methods). Tracked as a simple marker of visceral obesity and cardiometabolic risk. Expected result: below the cut-off for the person's sex and age band."
no_reference = "Computed score with no established reference interval; the source states that reference and cut-off values for LAP have not been defined. The ranges below are ROC-derived hypertension cut-offs from one cross-sectional study."

[[range]]
set = "clinical"
kind = "diagnostic"
low = 27.0
unit = "cm mmol/L"
when = { sex = "female", conditions = ["hypertension"] }
population = "Adults aged 20-64 years, hypertensive cases and normotensive controls, cross-sectional case-control study (1960 subjects, 1052 women)"
evidence = "outcome-study"
note = "ROC cut-off point for predicting hypertension in the whole female group (20-64 years), with sensitivity 70.6% and specificity 75.8% per the source."
citations = [
  { pmid = "34045594", doi = "10.1038/s41598-021-90648-y", title = "Age-adjusted cut-off values of lipid accumulation product (LAP) for predicting hypertension.", locator = "Table 3, Women", quote = "20-64 | 0.785 (0.754-0.816) | 27.0 | 70.6 | 75.8 | < 0.001" },
]

