slug = "corrected-calcium"
name = "Albumin-Corrected Calcium"
loinc = "46099-8"
category = "electrolyte"
unit = "mg/dL"
description = "Total serum calcium adjusted for serum albumin with a correction formula. Correction formulas are less accurate than ionized calcium, particularly in hypoalbuminaemia and hypercalcaemia, so ionized calcium is the reference measure where available."

