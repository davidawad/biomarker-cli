slug = "ca-15-3"
name = "Cancer Antigen 15-3"
loinc = "6875-9"
category = "tumour"
unit = "U/mL"
description = "Cancer antigen 15-3, a mucin-type glycoprotein marker used mainly to monitor metastatic or recurrent breast cancer. It is raised in other cancers and in some benign conditions, so it is not used alone for diagnosis."
aliases = ["CA15-3", "CA 15-3", "CA 15.3"]

[[range]]
