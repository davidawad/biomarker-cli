kind = "decision"
low = 30
population = "Patients with suspected recurrent breast carcinoma (Bangladesh diagnostic accuracy study)"
evidence = "cohort-study"
note = "Diagnostic cut-off of 30 U/mL used in this study for recurrent breast carcinoma (sensitivity 95.7%, specificity 69.4%). Boundary taken as >= 30. Single-centre study; other cut-offs (roughly 30-35 U/mL) are used in practice and were not verified here."
citations = [
  { pmid = "39360039", doi = "10.7759/cureus.68448", title = "Diagnostic Accuracy of Cancer Antigen 15-3 as a Seromarker Among Recurrent Breast Carcinoma in Bangladesh.", url = "https://pubmed.ncbi.nlm.nih.gov/39360039/", locator = "Abstract, Results", quote = "At the cut-off level of 30 U/mL, the ROC curve demonstrated sensitivity, specificity, positive predictive value, and negative predictive value of 95.7%, 69.4%, 84.1%, and 72.8%, respectively, to diagnose recurrent breast carcinoma." },
