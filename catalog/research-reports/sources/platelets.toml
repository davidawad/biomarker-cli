slug = "platelets"
name = "Platelet count"
loinc = "777-3"
category = "cbc"
unit = "10^3/µL"
description = "Number of circulating platelets, needed for primary haemostasis. Low values (thrombocytopenia) raise bleeding risk and have many causes including marrow failure, drugs, consumption and immune destruction; high values (thrombocytosis) occur with inflammation, iron deficiency, infection or myeloproliferative neoplasms."

[[range]]
set = "norip"
kind = "reference"
low = 165
high = 387
source_unit = "10^9/L"
source_factor = 1
when = { sex = "female", age_min = 18, age_max = 90 }
population = "Healthy female Nordic adults aged 18-90 (NORIP), EDTA venous blood, 12 analyser types"
evidence = "reference-interval"
note = "B-Trc, non-parametric 2.5th-97.5th percentiles, sex-specific."
citations = [
  { pmid = "15223702", doi = "10.1080/00365510410002797", title = "A multicentre study of reference intervals for haemoglobin, basic blood cell counts and erythrocyte indices in the adult population of the Nordic countries.", locator = "Abstract", quote = "B-Trc (females 165-387 x 10(9)/L, males 145 x 348 x 10(9)/L)" },
]

[[range]]
set = "norip"
kind = "reference"
low = 145
high = 348
source_unit = "10^9/L"
source_factor = 1
when = { sex = "male", age_min = 18, age_max = 90 }
population = "Healthy male Nordic adults aged 18-90 (NORIP), EDTA venous blood, 12 analyser types"
evidence = "reference-interval"
note = "B-Trc, non-parametric 2.5th-97.5th percentiles, sex-specific. The abstract prints the male upper limit as '145 x 348', which is read here as 145-348."
citations = [
