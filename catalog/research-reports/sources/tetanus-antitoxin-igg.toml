slug = "tetanus-antitoxin-igg"
name = "Tetanus Antitoxin IgG"
category = "infectious"
unit = "IU/mL"
description = "Serum IgG antibody to tetanus toxin (tetanus antitoxin), measured against WHO international standards. It indicates protection against tetanus; levels fall with time after vaccination, so adults often have low or undetectable titres."
aliases = ["tetanus IgG", "anti-tetanus toxoid IgG", "tetanus toxin antibody", "tetanus antibody"]

[[range]]
set = "zhejiang-2026-tetanus-waning"
kind = "decision"
low = 0.01
population = "Healthy individuals in Zhejiang, China (cross-sectional study of 3,659 people in 2024)"
evidence = "cohort-study"
when = { method = "elisa" }
note = "Seropositivity: IgG at or above 0.01 IU/mL by ELISA (boundary >= 0.01). Indicates detectable antibody only; the WHO position paper threshold could not be retrieved as text, so this is taken from the population study that adopted it."
citations = [
  { pmid = "42266706", doi = "10.3389/fimmu.2026.1824381", title = "Population waning trajectories of vaccine-induced tetanus immunity in Zhejiang, China.", url = "https://pubmed.ncbi.nlm.nih.gov/42266706/", locator = "Abstract, Methods", quote = "seropositivity (≥0.01 IU/mL) and seroprotection (≥0.1 IU/mL)" },
]

