  { pmid = "40336441", doi = "10.4102/safp.v67i1.6058", title = "Mastering blood gas interpretation: A practical guide for primary care providers.", locator = "Step 3, metabolic alkalosis", quote = "Urinary chloride < 20 mmol/L. These patients respond to administered sodium chloride (NaCl) infusion." },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 20
when = { specimen = "spot-urine", conditions = ["metabolic-alkalosis"] }
population = "Adults with metabolic alkalosis"
evidence = "textbook"
note = "Chloride-resistant metabolic alkalosis (e.g. mineralocorticoid excess); does not respond to NaCl."
citations = [
  { pmid = "40336441", doi = "10.4102/safp.v67i1.6058", title = "Mastering blood gas interpretation: A practical guide for primary care providers.", locator = "Step 3, metabolic alkalosis", quote = "Chloride resistant: Urinary chloride > 20 mmol/L; typically seen in euvolemic or fluid overload states." },
]
