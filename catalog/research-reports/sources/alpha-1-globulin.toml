slug = "alpha-1-globulin"
name = "Alpha-1 Globulin (SPEP)"
loinc = "13978-2"
category = "protein"
unit = "g/dL"
description = "Alpha-1 globulin fraction of serum protein electrophoresis (SPEP), reported as g/dL of serum. It contains alpha-1 antitrypsin and other acute-phase proteins, so it rises in inflammation and falls in some liver and protein-losing states. People track it when SPEP is ordered for protein abnormalities or inflammation. Expected result: within the reference interval for the patient's sex (about 0.30-0.50 g/dL combined in the cited adult study)."

[[range]]
set = "reference"
kind = "reference"
low = 0.30
high = 0.50
population = "Apparently healthy adults aged 18-65 years, Addis Ababa, Ethiopia (N=297; male 124, female 173); sexes combined"
evidence = "reference-interval-study"
note = "Combined-sex 2.5th-97.5th percentile reference interval (CLSI EP28-A3c, non-parametric) as printed in Table 3 of the source. Source bounds are inclusive. Reference-interval study; single centre."
citations = [
  { pmid = "36039308", doi = "10.2147/IJGM.S376450", title = "Establishment of Reference Intervals for Serum Protein Electrophoresis of Apparently Healthy Adults in Addis Ababa, Ethiopia.", locator = "Table 3, Alpha-1 rows, Combined sex, g/dL line", quote = "| 0.2-0.5 | 0.30-0.50 | 0.2-0.3 | 0.5-0.5" },
]

