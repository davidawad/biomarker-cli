slug = "cgm-time-above-180"
name = "CGM time above range (>180 mg/dL)"
category = "glycemic"
unit = "%"
description = "Percentage of CGM glucose readings (or hours per day) above 180 mg/dL (10.0 mmol/L). Maximum targets from the International Consensus on Time in Range; the pregnancy threshold is 140 mg/dL."

[[range]]
set = "clinical"
kind = "target"
high = 25
when = { conditions = ["diabetes"] }
population = "Adults and children with type 1 or type 2 diabetes (non-pregnant, not older/high-risk)"
evidence = "consensus"
note = "Time above 180 mg/dL (10.0 mmol/L), less than 25 percent (less than 6 h per day). Older and/or high-risk individuals have a separate target (not included here)."
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table 3", quote = "Type 1*/type 2 | >70%; >16 h, 48 min | 70-180 mg/dL (3.9-10.0 mmol/L) | <4%; <1 h | <70 mg/dL (<3.9 mmol/L) | <25%; <6 h | >180 mg/dL (>10.0 mmol/L)" },
]

[[range]]
set = "clinical"
kind = "target"
high = 25
when = { conditions = ["type-1-diabetes"], pregnant = true }
population = "Pregnant women with type 1 diabetes"
evidence = "consensus"
note = "Pregnancy threshold is above 140 mg/dL (7.8 mmol/L), not 180; target is less than 25 percent (less than 6 h per day)."
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table 4", quote = "<25%; <6 h | >140 mg/dL (>7.8 mmol/L)" },
]
