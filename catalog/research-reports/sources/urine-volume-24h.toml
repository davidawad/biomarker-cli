slug = "urine-volume-24h"
name = "24-Hour Urine Volume"
loinc = "3167-4"
category = "urinalysis"
unit = "L/day"
description = "Total urine volume collected over 24 hours. Tracked to judge adequacy of fluid intake and to assess kidney stone risk, since low urine volume raises urinary supersaturation. Expected result: within the reference range; low volume prompts a fluid-intake target."

