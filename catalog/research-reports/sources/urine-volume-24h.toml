set = "reference"
kind = "reference"
low = 2.0
high = 2.5
when = { }
population = "Adults, 24-hour urine collection (Brazilian Society of Nephrology guideline, Table 4)"
evidence = "guideline"
note = "Guideline reference range for 24-hour urine volume, written in the source as '>2.0-2.5 L/day (25-30 mL/kg/day)'. The guideline states reference values are a suggestion that varies by laboratory standardization."
