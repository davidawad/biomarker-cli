description = "Lipoprotein-associated phospholipase A2, an enzyme carried on LDL particles that is linked to vascular inflammation. Its activity is measured as a cardiovascular risk marker, with cut-offs that depend on the assay and are less well established than for troponin or natriuretic peptides."
