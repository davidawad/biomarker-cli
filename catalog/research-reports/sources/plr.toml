[[range]]
set = "reference"
kind = "reference"
low = 49
high = 198
when = { age_min = 18, age_max = 65 }
population = "Healthy Han Chinese adults aged 18-64, western China (CLSI method, multi-centre)"
evidence = "reference-interval-study"
note = "Central reference interval for young adults (18-64) as reported by the study. The study reports lower values in adults 65-79 (see separate range)."
citations = [
  { pmid = "30868857", doi = "10.7754/Clin.Lab.2018.180715", title = "Normal Reference Intervals of Neutrophil-To-Lymphocyte Ratio, Platelet-To-Lymphocyte Ratio, Lymphocyte-To-Monocyte Ratio, and Systemic Immune Inflammation Index in Healthy Adults: a Large Multi-Center Study from Western China.", locator = "Abstract (Results)", quote = "PLR, LMR, and SII values were significantly higher in the young adults (18 - 64 years) than in old adults (65 - 79 years) (p < 0.001). ... The RIs of NLR, PLR (adults), PLR (old adults), LMR and SII were 0.88 - 4.0, 49 - 198, 42 - 187, 2.63 - 9.9, 142 x 109/L - 804 x 109/L, respectively." },
]

