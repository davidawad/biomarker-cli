slug = "telomere-length"
name = "Telomere Length, Leukocyte"
category = "aging"
unit = "T/S ratio"
description = "Average leukocyte telomere length, measured as a relative T/S ratio (telomere signal divided by a single-copy gene signal, by quantitative PCR). Tracked as a marker of cellular aging. Very short telomeres are associated with telomere biology disorders. The expected result is a value within the age-specific reference range for the assay; the source defines extremely short telomeres as below the first percentile for age."

[[range]]
set = "reference"
kind = "reference"
low = 0.824
high = 1.936
when = { age_min = 1, age_max = 2, specimen = "blood-leukocytes", method = "mmqpcr" }
population = "Healthy individuals aged 0-50 years, Argentina (n=159), leukocyte telomere length by MMQPCR as T/S ratio; single-age row 1 of Table 2"
evidence = "reference-interval-study"
note = "5th and 95th percentile point estimates from Table 2 at age 1 years (lower and upper columns omitted). Age-specific percentile curve generated for the Argentine population; method-specific."
