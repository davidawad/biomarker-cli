kind = "deficient"
high = 4.0
when = {}
population = "987 adults and children with Plasmodium vivax in the Peruvian Amazon, semi-quantitative G6PD activity assay in a radical-cure programme"
evidence = "outcome"
note = "Programme cut-off for deficiency (about the 30% activity threshold per the same paper's discussion). Semi-quantitative point-of-care device, not a reference laboratory assay."
citations = [
  { pmid = "42500357", doi = "10.1016/j.lana.2026.101568", title = "Health-care provider compliance with a revised <i>Plasmodium vivax</i> radical cure algorithm incorporating tafenoquine and quantitative G6PD testing in the Peruvian Amazon: a prospective observational study.", locator = "Table 2", quote = "Deficient ≤4.0 U/g Hb" },
]

