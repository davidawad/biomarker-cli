slug = "g6pd"
name = "G6PD activity"
loinc = "2357-2"
category = "cbc"
unit = "U/g Hb"
description = "Activity of the red-cell enzyme glucose-6-phosphate dehydrogenase, expressed per gram of haemoglobin. Low activity (G6PD deficiency) predisposes to oxidant-induced haemolysis, for example after primaquine or tafenoquine, so the result decides whether these 8-aminoquinoline drugs can be given."

[[range]]
set = "g6pd-thailand-2025"
kind = "diagnostic"
low = 6.1
when = {}
population = "patients with Plasmodium vivax in Thailand receiving radical cure after quantitative G6PD testing (pilot implementation)"
evidence = "outcome"
note = "Eligibility for tafenoquine 300 mg single dose (G6PD normal). Intermediate patients were allocated primaquine in this protocol. The sources do not convert U/g Hb values to percent of normal; the 2026 Peru paper refers to 30% and 70% activity thresholds without stating the U/g Hb equivalents."
citations = [
  { pmid = "40274286", doi = "10.1136/bmjgh-2024-016720", title = "Prospective observational study to assess the feasibility and safety of appropriate Plasmodium vivax radical cure with tafenoquine or primaquine after quantitative G6PD testing during pilot implementation in Thailand.", locator = "Methods, treatment allocation", quote = "G6PD normal (≥6.1 U/g Hb) tafenoquine 300 mg single dose" },
]

