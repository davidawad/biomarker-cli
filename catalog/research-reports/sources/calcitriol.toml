description = "Circulating 1,25-dihydroxyvitamin D [1,25(OH)2D], the active hormonal form of vitamin D made mainly by the kidney. It has a short half-life and does not reflect vitamin D stores; it is mainly used in calcium, PTH and kidney disorders, and low values in advanced CKD are associated with worse outcomes."

