citations = [
  { pmid = "15149882", title = "Determination of reference intervals for serum creatinine, creatinine excretion and creatinine clearance with an enzymatic and a modified Jaffé method.", locator = "Abstract (Results)", quote = "The reference interval for the entire group was found to be 66-143 ml/min with the enzymatic assay and 71-151 ml/min with the chemical one." },
