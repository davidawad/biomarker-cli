evidence = "reference-interval-study"
note = "Predicted (Cockcroft-Gault) creatinine clearance indexed to 1.73 m2, not a measured clearance. 95% reference interval."
citations = [
  { pmid = "10672373", title = "Adult reference ranges for serum cystatin C, creatinine and predicted creatinine clearance.", locator = "Abstract (Results)", quote = "For women, the intervals were 68-98 mumol/L, 60-119 ml/min/1.73 m2 and 0.49-0.94 mg/L; for men, they were 78-123 mumol/L, 57-122 ml/min/1.73 m2 and 0.56-0.98 mg/L." },
]

