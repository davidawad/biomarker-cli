slug = "neutrophils-abs"
name = "Absolute neutrophil count"
loinc = "751-8"
category = "cbc"
unit = "10^3/µL"
description = "Absolute count of circulating neutrophils, the main circulating white cells in bacterial infection defence. Low values (neutropenia) raise infection risk, but are benign in Duffy-null / benign ethnic neutropenia; high values (neutrophilia) occur with bacterial infection, inflammation, stress, smoking, steroids or myeloid disorders."

[[range]]
set = "duffy-null-ri"
kind = "reference"
low = 1.01
high = 4.34
when = { condition = ["duffy-null"] }
population = "122 healthy adults with Duffy-null phenotype Fy(a-b-), identified from 1695 adults with CBC and RBC phenotyping (2020-2026)"
evidence = "reference-interval"
note = "Non-parametric 95% interval per CLSI. The lower bound lies below the conventional neutropenia cutoff; the authors advocate Duffy-null-specific ranges rather than the term benign ethnic neutropenia."
citations = [
  { pmid = "42345734", doi = "10.3390/hematolrep18030038", title = "Establishing Reference Intervals for White Blood Cell and Absolute Neutrophil Counts in Duffy Null Individuals.", locator = "Abstract, Results", quote = "The derived 95% reference intervals (WBC: 2.43-7.05 × 103/µL; ANC: 1.01-4.34 × 103/µL)" },
]

