slug = "insulin-autoantibodies"
name = "Insulin Autoantibodies"
loinc = "8072-1"
category = "autoimmune"
unit = "U/mL"
description = "IgG autoantibodies against insulin (IAA), measured by radiobinding or immunoassay. Tracked as one of the islet autoantibodies (with GADA, IA-2A, ZnT8A) to screen for and classify type 1 diabetes; IAA testing in children and in people on exogenous insulin needs care because insulin treatment can induce IAA. Expected result: negative (below the assay positivity cut-off)."
no_reference = "Qualitative result (positive or negative against an assay-specific cut-off); no numeric reference interval applies to the population. The ranges below are assay positivity cut-offs stated by individual studies."

[[range]]
set = "clinical"
kind = "diagnostic"
low = 10
unit = "U/mL"
when = { conditions = ["type-1-diabetes"] }
population = "Siblings aged 2-17 years of children with type 1 diabetes, Latvia, two-stage screening (Sebia ELISA kit)"
evidence = "outcome-study"
note = "Positive IAA cut-off for the Sebia kit as stated by the source."
citations = [
  { pmid = "42533171", doi = "10.1007/s00431-026-07278-7", title = "Screening of pre-type 1 diabetes in high-risk paediatric population: a pilot study in Latvia.", locator = "Methods, first screening stage (IAA)", quote = "Cut-off value of positive IAA test was >= 10 U/ml." },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 20
unit = "AU/mL"
when = { conditions = ["type-1-diabetes"] }
population = "Pediatric population screened for type 1 diabetes autoantibodies, Bulgaria (MAGLUMI chemiluminescence IAA assay)"
evidence = "outcome-study"
note = "Manufacturer cut-off for the MAGLUMI IAA assay as reported in the source's assay table (Table 1, first assay column). Column order taken from the table header."
citations = [
  { pmid = "42074878", doi = "10.3390/jcm15083075", title = "The First Selective Screening for Type 1 Diabetes in a Pediatric Population in Bulgaria.", locator = "Table 1, Result interpretation", quote = "Negative: <20 AU/mL Positive: >=20 AU/mL" },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 0.010
unit = "index"
when = { conditions = ["type-1-diabetes"] }
population = "Individuals newly diagnosed with type 1 diabetes, children and adults, retrospective cohort tested within 1 year of diagnosis (fluid-phase radiobinding assay)"
evidence = "outcome-study"
note = "Positive IAA cut-off stated by the source as an RBA index. The source does not state whether the boundary is >= or >, so low = 0.010 is recorded without a direction. Index-to-U/mL conversion is not stated, so this range stays in index units."
citations = [
  { pmid = "41925716", doi = "10.2337/dc25-2660", title = "Differences in Clinical Manifestations and Islet Autoantibodies by Age in Adult-Onset Type 1 Diabetes.", locator = "Methods, islet autoantibody analysis", quote = "The positive cutoff values were defined as an index of 0.010 for IAA, 20 DK units for GADA, 5 DK units for IA-2A, and an index of 0.020 for ZnT8A." },
]
