slug = "mumps-igg"
name = "Mumps IgG"
loinc = "22415-4"
category = "infectious"
unit = "RU/mL"
description = "Serum IgG antibody against mumps virus, measured by ELISA and reported as an assay-specific index or titer. Tracked to confirm immunity after mumps infection or MMR vaccination, and to check susceptibility before exposure. Expected result: positive (seropositive, immune); negative or equivocal results indicate possible lack of immunity."

[[range]]
set = "clinical"
kind = "diagnostic"
low = 22
unit = "RU/mL"
when = { method = "euroimmun-elisa" }
population = "Community-based cross-sectional sample, Vellore, South India, mumps IgG by EUROIMMUN ELISA"
evidence = "outcome-study"
note = "Seropositive (immune) on EUROIMMUN ELISA, per manufacturer's guidelines as applied in the cited study."
citations = [
  { pmid = "40795852", doi = "10.4269/ajtmh.25-0069", title = "Mumps Seroprevalence in Vellore, South India: A Community-Based Cross-Sectional Study.", locator = "Methods", quote = "Mumps IgG serostatus was defined according to the manufacturer's guidelines: >=22 relative units (RU)/mL indicates seropositivity, <16 RU/mL indicates seronegativity, and 16 to <22 RU/mL indicates an equivocal result." },
]

