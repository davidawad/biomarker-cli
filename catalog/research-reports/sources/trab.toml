slug = "trab"
name = "TSH Receptor Antibodies (TRAb/TSI)"
category = "thyroid"
unit = "IU/L"
description = "Antibodies that stimulate or block the TSH receptor; the main cause of Graves disease and a predictor of fetal and neonatal thyroid dysfunction in pregnancy. Cut-offs are assay-specific and not interchangeable across platforms."

[[range]]
set = "nl-trab-trimester-cohort-2026"
kind = "diagnostic"
low = 27
when = { pregnancy = true, trimester = 1, conditions = ["graves-disease-history"], method = "immunoassay (TRAK human, BRAHMS Kryptor)" }
population = "Pregnant women with a history of Graves disease, Netherlands multicentre prospective cohort (2010-2023)"
evidence = "outcome"
note = "Threshold titre with 100% sensitivity for fetal/neonatal hyperthyroidism in trimester 1 (Kryptor assay, ULN 1.1 IU/L); assay-specific, not transferable to other platforms."
citations = [
  { pmid = "41846542", doi = "10.1210/clinem/dgag118", title = "Maternal TSH-receptor antibodies predict fetal/neonatal hyperthyroidism in pregnancies with a history of Graves disease.", url = "https://pubmed.ncbi.nlm.nih.gov/41846542/", locator = "Results, Thyroid receptor antibody threshold titers", quote = "In the respective trimesters, a TRAb threshold titer of 27 IU/L, 21 IU/L, and 7 IU/L, respectively, corresponded with a maximal sensitivity of 100%, with a corresponding specificity ranging from 96% to 99%." },
]

