slug = "urine-wbc"
name = "Urine White Blood Cells (microscopy)"
loinc = "5821-4"
category = "urinalysis"
unit = "/HPF"
description = "White blood cells counted on microscopy of a urine sediment, per high-power field. Pyuria (raised WBC) suggests urinary tract infection or inflammation, but its predictive value depends on how concentrated the urine is."
aliases = ["pyuria", "urine leukocytes", "urine WBC"]

[[range]]
set = "pediatric-pyuria-sg-2021"
kind = "decision"
low = 3
when = { markers = { "urine-specific-gravity" = "<1.011" } }
population = "Children under 24 months evaluated in the emergency department for suspected UTI, with paired urinalysis and urine culture"
evidence = "validation-study"
note = "Optimal microscopic WBC cut-off per HPF at low urine concentration (USG <1.011), against a positive urine culture (AAP culture thresholds). Cut-off applies to low-concentration urine only. Retrospective study in young children, not adults."
citations = [
  { pmid = "33514634", doi = "10.1542/peds.2020-014068", title = "Pyuria and Urine Concentration for Identifying Urinary Tract Infection in Young Children.", url = "https://pubmed.ncbi.nlm.nih.gov/33514634/", locator = "Abstract, Results", quote = "Optimal WBC cutoffs per high-power field (HPF) were 3 (positive likelihood ratio [LR+] 10.5; negative likelihood ratio [LR-] 0.12) at low, 6 (LR+ 12; LR- 0.14) at moderate, and 8 (LR+ 11.1; LR- 0.35) at high urine concentrations." },
  { pmid = "33514634", doi = "10.1542/peds.2020-014068", title = "Pyuria and Urine Concentration for Identifying Urinary Tract Infection in Young Children.", url = "https://pubmed.ncbi.nlm.nih.gov/33514634/", locator = "Abstract, Methods", quote = "low <1.011, moderate 1.011 to 1.020, and high >1.020" },
]

