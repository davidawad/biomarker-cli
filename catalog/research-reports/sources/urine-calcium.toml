when = { sex = "male" }
population = "Not stated in the quote (traditional definition as reported in the source)"
evidence = "consensus"
note = "Traditional hypercalciuria definition in men: daily urinary calcium strictly above 275 mg."
citations = [
  { pmid = "28846247", title = "Hypercalciuria.", locator = "Abstract", quote = "Traditionally, it has been defined as daily urinary calcium excretion of greater than 275 mg in men and greater than 250 mg in women" },
]

