slug = "urine-calcium"
name = "Urine Calcium"
loinc = "2004-0"
category = "mineral"
unit = "mg/24h"
description = "Calcium excreted in urine, usually collected over 24 hours to assess calcium stone risk (hypercalciuria), calcium balance and bone metabolism. Expected result: below the sex-specific hypercalciuria cut-offs in the ranges below. Ranges are copied in the units the sources state; the mmol/24h cut-offs are a companion unit."

[[range]]
set = "clinical"
kind = "diagnostic"
low = 7.5
unit = "mmol/24h"
when = { sex = "male" }
population = "Adults in a Chinese multicenter cohort (24-hour urinary calcium excretion)"
evidence = "reference-interval-study"
note = "Hypercalciuria in men: 24-hour urinary calcium strictly above 7.5 mmol, as defined in the source."
citations = [
  { pmid = "40036793", doi = "10.1210/clinem/dgae805", title = "Reference Intervals for 24-Hour Urinary Calcium Excretion and Its Association With Bone Metabolism: A Multicenter Study.", locator = "Methods (urine measurements)", quote = "Hypercalciuria was defined as 24-hour UCaE > 7.5 mmol in men and > 6.25 mmol in women" },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 6.25
unit = "mmol/24h"
when = { sex = "female" }
population = "Adults in a Chinese multicenter cohort (24-hour urinary calcium excretion)"
evidence = "reference-interval-study"
note = "Hypercalciuria in women: 24-hour urinary calcium strictly above 6.25 mmol, as defined in the source."
citations = [
  { pmid = "40036793", doi = "10.1210/clinem/dgae805", title = "Reference Intervals for 24-Hour Urinary Calcium Excretion and Its Association With Bone Metabolism: A Multicenter Study.", locator = "Methods (urine measurements)", quote = "Hypercalciuria was defined as 24-hour UCaE > 7.5 mmol in men and > 6.25 mmol in women" },
]

[[range]]
