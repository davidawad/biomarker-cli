slug = "sleep-latency"
name = "Sleep Latency"
category = "sleep"
unit = "min"
description = "Time from lights-out or going to bed until the onset of sleep, in minutes. Tracked to assess how quickly a person falls asleep and as one of the criteria for insomnia. Expected result for most adults is a short latency; a usual or average latency of 20 minutes or longer is the research cut-off used to classify primary insomnia, so values under that are below it."

