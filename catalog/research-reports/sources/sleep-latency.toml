set = "clinical"
kind = "diagnostic"
low = 20
unit = "min"
population = "Adults; average sleep-onset latency over 2 weeks of sleep-log data, primary insomnia vs normal sleepers"
evidence = "outcome-study"
note = "Research classification cut-off for primary insomnia (sensitivity 94.4%, specificity 79.6% in that study); 20 min or longer is the flagged value. Not a population reference interval."
citations = [
