slug = "sars-cov-2-spike-igg"
name = "SARS-CoV-2 Spike IgG Antibody"
loinc = "99597-7"
category = "infectious"
unit = "BAU/mL"
description = "Serum IgG antibody against the SARS-CoV-2 spike protein, quantified by immunoassay in BAU/mL (WHO international standard) or vendor units. Tracked after infection or vaccination to gauge humoral response; a higher level is associated with neutralizing antibody activity. Expected result: positive after infection or vaccination; negative means no detectable spike antibody by that assay."

[[range]]
set = "clinical"
kind = "diagnostic"
low = 57.9
unit = "BAU/mL"
when = { method = "euroimmun-quantivac-elisa" }
population = "Egyptian community sera (n = 650), cross-sectional, January-June 2021"
evidence = "outcome-study"
note = "Anti-spike level above which neutralizing antibodies were positive in one study (sensitivity 90.0%, specificity 91%). Not an infection diagnosis."
citations = [
  { pmid = "36423048", doi = "10.3390/vaccines10111952", title = "Determining the SARS-CoV-2 Anti-Spike Cutoff Level Denoting Neutralizing Activity Using Two Commercial Kits.", locator = "Abstract, Results", quote = "When the anti-S titer was greater than 18.1 RU/mL (57.9 BAU/mL), nAbs were positive, with a sensitivity of 90.0% and specificity of 91%." },
]

