slug = "shbg"
name = "Sex Hormone Binding Globulin"
loinc = "13967-5"
category = "hormone"
unit = "nmol/L"
description = "Liver-made carrier protein that binds testosterone and estradiol and sets how much of each is free and active. Interpret with total testosterone and estradiol; levels vary with sex, age, puberty and oral contraceptive use."

[[range]]
set = "premenopausal-women-2011"
kind = "reference"
low = 18
high = 86
when = { sex = "female", age_min = 30, age_max = 30, menopause = "pre", method = "immunoassay" }
population = "Normally cycling healthy premenopausal women aged 18-49 (n=161); percentiles estimated for a typical 30-year-old woman"
evidence = "reference-interval"
note = "5th to 95th percentile for a 30-year-old premenopausal woman. The source reports SHBG stable across age in this group, but the 30-year estimate is the only one quoted. Immunoassay-based."
citations = [
  { pmid = "21771278", doi = "10.1111/j.1743-6109.2011.02380.x", title = "Testosterone reference ranges in normally cycling healthy premenopausal women.", url = "https://pubmed.ncbi.nlm.nih.gov/21771278/", locator = "Abstract, Results", quote = "The estimated 5th and 95th percentiles for a 30-year-old woman were: testosterone, 15-46 ng/dL (520-1595 pmol/L); free testosterone, 1.2-6.4 pg/mL (4.16-22.2 pmol/L); calculated free testosterone, 1.3-5.6 pg/mL (4.5-19.4 pmol/L); bioavailable testosterone, 1.12-7.62 ng/dL (38.8-264.21 pmol/L); and SHBG 18-86 nmol/L." },
]

[[range]]
set = "chinese-adult-men-2018"
kind = "reference"
low = 11.5
high = 66.3
when = { sex = "male", ethnicity = "Chinese", method = "immunoassay" }
population = "Apparently healthy adult men (n=1043) from five Chinese cities, 2013; reference interval derived without partition by age"
evidence = "reference-interval"
note = "Reference interval as reported (median 29.4 nmol/L). The abstract does not state the percentile limits; the parametric method is usually 2.5th-97.5th. Automated immunoassay. Age was a source of variation for SHBG (rises with age), so the interval is not age-specific."
citations = [
  { pmid = "29729137", doi = "10.1515/cclm-2017-0749", title = "Establishing reference intervals for sex hormones and SHBG in apparently healthy Chinese adult men based on a multicenter study.", url = "https://pubmed.ncbi.nlm.nih.gov/29729137/", locator = "Abstract, Results", quote = "SHBG, 29.4 (11.5-66.3) nmol/L;" },
]
