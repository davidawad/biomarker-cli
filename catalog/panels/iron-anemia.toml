[[member]]
marker = "crp"
role = "extended"
reason = "Inflammatory marker used to interpret ferritin and decide on further GI investigation."
citations = [
  { pmid = "34497146", title = "British Society of Gastroenterology guidelines for the management of iron deficiency anaemia in adults.", doi = "10.1136/gutjnl-2021-325210", locator = "Diagnosis section", quote = "inflammatory markers (eg C-reactive protein (CRP)), transferrin saturation, red cell hypochromia and response to oral IRT can all be helpful" },
]

[[member]]
marker = "tissue-transglutaminase-iga"
role = "extended"
reason = "Coeliac disease causes 3-5% of IDA; routine serological screening recommended."
term = "serologically"
citations = [
  { pmid = "34497146", title = "British Society of Gastroenterology guidelines for the management of iron deficiency anaemia in adults.", doi = "10.1136/gutjnl-2021-325210", locator = "Recommendation 8", quote = "we recommend that it should be routinely screened for serologically, or on small bowel biopsy at the time of gastroscopy" },
]

[[member]]
