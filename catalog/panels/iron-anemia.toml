citations = [
  { pmid = "34497146", title = "British Society of Gastroenterology guidelines for the management of iron deficiency anaemia in adults.", doi = "10.1136/gutjnl-2021-325210", locator = "Diagnosis section", quote = "raised red cell zinc protoporphyrin, increased serum transferrin receptor (sTfR), low reticulocyte Hb (Retic-Hb)" },
