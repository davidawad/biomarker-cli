slug = "alzheimers"
name = "Alzheimer's disease and dementia workup"
description = "Reversible-cause laboratory screening in the evaluation of dementia (AAN practice parameter), supporting metabolic add-ons, and the plasma Alzheimer's blood biomarkers named by the Alzheimer's Association clinical practice guideline (PMID 40729527) and revised diagnostic criteria (PMID 38934362)."
aliases = ["dementia", "cognitive-impairment"]

[[member]]
marker = "vitamin-b12"
term = "B(12)"
role = "core"
reason = "AAN guideline: screen for B12 deficiency in the initial dementia evaluation."
citations = [
  { pmid = "11342678", title = "Practice parameter: diagnosis of dementia (an evidence-based review). Report of the Quality Standards Subcommittee of the American Academy of Neurology.", doi = "10.1212/wnl.56.9.1143", locator = "Abstract, Recommendation 4", quote = "Screening for depression, B(12) deficiency, and hypothyroidism should be performed (Guideline)." },
]

[[member]]
marker = "tsh"
term = "hypothyroidism"
role = "core"
reason = "AAN guideline: screen for hypothyroidism in the initial dementia evaluation; TSH is the screening test (thyroid profile named in the treatable-dementia guideline)."
citations = [
  { pmid = "11342678", title = "Practice parameter: diagnosis of dementia (an evidence-based review). Report of the Quality Standards Subcommittee of the American Academy of Neurology.", doi = "10.1212/wnl.56.9.1143", locator = "Abstract, Recommendation 4", quote = "Screening for depression, B(12) deficiency, and hypothyroidism should be performed (Guideline)." },
  { pmid = "40046486", title = "Clinical practice guidelines on addressing cognitive impairment in treatable dementias.", doi = "10.4103/indianjpsychiatry.indianjpsychiatry_684_24", locator = "Table 6c", quote = "Blood thyroid profile (free T3, T4 and TSH)" },
]

[[member]]
marker = "folate"
role = "extended"
reason = "Folate deficiency causes cognitive impairment and raises homocysteine; listed in the treatable-dementia work-up."
citations = [
  { pmid = "40046486", title = "Clinical practice guidelines on addressing cognitive impairment in treatable dementias.", doi = "10.4103/indianjpsychiatry.indianjpsychiatry_684_24", locator = "Metabolic dementias", quote = "Severe deficiencies in vitamin B12 and folate are linked to anaemia and cognitive impairment" },
]

[[member]]
marker = "homocysteine"
role = "extended"
reason = "Elevated homocysteine linked to Alzheimer's and vascular disease pathophysiology."
citations = [
  { pmid = "40046486", title = "Clinical practice guidelines on addressing cognitive impairment in treatable dementias.", doi = "10.4103/indianjpsychiatry.indianjpsychiatry_684_24", locator = "Metabolic dementias", quote = "a folate shortage can result in elevated homocysteine levels, which are linked to the pathophysiology of Alzheimer's disease and vascular disease" },
]

[[member]]
marker = "calcium"
role = "extended"
reason = "Parathyroid/calcium disorders are metabolic causes of cognitive impairment; blood calcium is the investigation."
citations = [
