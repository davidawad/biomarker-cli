slug = "diabetes"
name = "Diabetes and glycemic control"
description = "Diagnosis, classification, monitoring and complication screening (kidney, lipids, liver, thyroid, B12) per the ADA Standards of Care in Diabetes-2025."
aliases = ["glycemic", "diabetes-mellitus"]

[[member]]
marker = "hba1c"
role = "core"
reason = "Diagnostic criterion (A1C >=6.5%), prediabetes criterion (5.7-6.4%) and baseline glycemic test at the initial evaluation."
term = "A1C"
citations = [
  { doi = "10.2337/dc25-S002", url = "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11635041/", title = "2. Diagnosis and Classification of Diabetes: Standards of Care in Diabetes-2025.", locator = "Table 2.1", quote = "A1C >=6.5% (>=48 mmol/mol). The test should be performed in a laboratory using a method that is NGSP certified and standardized to the DCCT assay." },
  { doi = "10.2337/dc25-S004", url = "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11635044/", title = "4. Comprehensive Medical Evaluation and Assessment of Comorbidities: Standards of Care in Diabetes-2025.", locator = "Table 4.1", quote = "A1C, if the results are not available within the past 3 months" },
]

[[member]]
marker = "glucose"
role = "core"
reason = "Fasting plasma glucose >=126 mg/dL is a diagnostic criterion; also used for screening."
term = "FPG"
citations = [
  { doi = "10.2337/dc25-S002", url = "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11635041/", title = "2. Diagnosis and Classification of Diabetes: Standards of Care in Diabetes-2025.", locator = "Table 2.1", quote = "FPG >=126 mg/dL (>=7.0 mmol/L). Fasting is defined as no caloric intake for at least 8 h." },
]

[[member]]
marker = "ogtt-2h-glucose"
role = "core"
reason = "2-h plasma glucose >=200 mg/dL during a 75-g OGTT is a diagnostic criterion."
term = "2-h PG"
citations = [
  { doi = "10.2337/dc25-S002", url = "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11635041/", title = "2. Diagnosis and Classification of Diabetes: Standards of Care in Diabetes-2025.", locator = "Table 2.1", quote = "2-h PG >=200 mg/dL (>=11.1 mmol/L) during OGTT. The test should be performed as described by the WHO, using a glucose load containing the equivalent of 75 g anhydrous glucose dissolved in water." },
]

[[member]]
marker = "uacr"
role = "core"
reason = "Annual albuminuria screening for diabetic kidney disease in type 2 diabetes and type 1 diabetes of >=5 years."
term = "UACR"
citations = [
  { doi = "10.2337/dc25-S011", url = "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11635029/", title = "11. Chronic Kidney Disease and Risk Management: Standards of Care in Diabetes-2025.", locator = "Recommendation 11.1a", quote = "spot urine albumin-to-creatinine ratio [UACR]) and estimated glomerular filtration rate [eGFR] in people with type 1 diabetes with duration of >=5 years and in all people with type 2 diabetes regardless of treatment." },
  { doi = "10.2337/dc25-S004", url = "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11635044/", title = "4. Comprehensive Medical Evaluation and Assessment of Comorbidities: Standards of Care in Diabetes-2025.", locator = "Table 4.1", quote = "Spot urinary albumin-to-creatinine ratio" },
]

[[member]]
marker = "egfr"
role = "core"
reason = "Annual kidney function screening with UACR; staging and monitoring of CKD."
citations = [
  { doi = "10.2337/dc25-S011", url = "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11635029/", title = "11. Chronic Kidney Disease and Risk Management: Standards of Care in Diabetes-2025.", locator = "Recommendation 11.1b", quote = "In people with established chronic kidney disease (CKD), monitor urinary albumin (e.g., spot UACR) and eGFR 1-4 times per year depending on the stage of the kidney disease" },
]

[[member]]
marker = "creatinine"
role = "core"
reason = "Serum creatinine (basis of eGFR) at the initial evaluation and monitored when ACE inhibitors, ARBs or MRAs are used."
citations = [
  { doi = "10.2337/dc25-S004", url = "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11635044/", title = "4. Comprehensive Medical Evaluation and Assessment of Comorbidities: Standards of Care in Diabetes-2025.", locator = "Table 4.1", quote = "Serum creatinine and estimated glomerular filtration rate" },
  { doi = "10.2337/dc25-S011", url = "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11635029/", title = "11. Chronic Kidney Disease and Risk Management: Standards of Care in Diabetes-2025.", locator = "Recommendation 11.4b", quote = "Monitor for increased serum creatinine and for increased serum potassium levels when ACE inhibitors, ARBs, and mineralocorticoid receptor antagonists (MRAs) are used" },
]

[[member]]
marker = "potassium"
role = "core"
reason = "Serum potassium monitored in people on ACE inhibitors, ARBs, MRAs or diuretics."
citations = [
  { doi = "10.2337/dc25-S004", url = "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11635044/", title = "4. Comprehensive Medical Evaluation and Assessment of Comorbidities: Standards of Care in Diabetes-2025.", locator = "Table 4.1", quote = "Serum potassium levels in people with diabetes on ACE inhibitors, ARBs, or diuretics" },
]

