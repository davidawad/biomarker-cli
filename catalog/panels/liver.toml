[[member]]
marker = "fib4"
role = "core"
reason = "First-line noninvasive score to exclude advanced fibrosis in MASLD (low risk < 1.3)."
term = "FIB-4"
citations = [
  { pmid = "36727674", title = "AASLD Practice Guidance on the clinical assessment and management of nonalcoholic fatty liver disease.", url = "https://doi.org/10.1097/HEP.0000000000000323", locator = "Clinical and laboratory-based fibrosis biomarkers", quote = "FIB-4 is the most validated. FIB-4 is calculated using a simple algorithm based upon age, ALT, AST, and platelet count" },
  { pmid = "38851997", title = "EASL-EASD-EASO Clinical Practice Guidelines on the management of metabolic dysfunction-associated steatotic liver disease (MASLD).", url = "https://doi.org/10.1016/j.jhep.2024.04.031", locator = "Abstract", quote = "A stepwise approach using blood-based scores (such as FIB-4) and, sequentially, imaging techniques (such as transient elastography) is suitable to rule-out/in advanced fibrosis, which is predictive of liver-related outcomes." },
]

