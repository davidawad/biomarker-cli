slug = "liver"
name = "Liver health and MASLD"
description = "Liver chemistries, synthetic function and noninvasive fibrosis assessment for liver disease and MASLD."
aliases = ["masld", "liver-function"]

[[member]]
marker = "alt"
role = "core"
reason = "Primary marker of hepatocellular injury; elevated ALT predicts liver-related mortality and is an input to FIB-4."
citations = [
  { pmid = "29122851", title = "Guidelines on the management of abnormal liver blood tests.", url = "https://doi.org/10.1136/gutjnl-2017-314924", locator = "Recommendation 1", quote = "Recommendation 1: Initial investigation for potential liver disease should include bilirubin, albumin, alanine aminotransferase (ALT), alkaline phosphatase (ALP) and γ-glutamyltransferase (GGT), together with a full blood count if not already performed within the previous 12 months." },
  { pmid = "27995906", title = "ACG Clinical Guideline: Evaluation of Abnormal Liver Chemistries.", url = "https://doi.org/10.1038/ajg.2016.517", locator = "Abstract", quote = "The most common liver chemistries ordered are serum alanine aminotransferase (ALT), aspartate aminotransferase (AST), alkaline phosphatase and bilirubin." },
]

[[member]]
marker = "ast"
role = "core"
reason = "Hepatocellular injury marker, part of the first-line liver chemistries and an input to FIB-4 and APRI."
citations = [
  { pmid = "27995906", title = "ACG Clinical Guideline: Evaluation of Abnormal Liver Chemistries.", url = "https://doi.org/10.1038/ajg.2016.517", locator = "Abstract", quote = "The most common liver chemistries ordered are serum alanine aminotransferase (ALT), aspartate aminotransferase (AST), alkaline phosphatase and bilirubin." },
  { pmid = "36727674", title = "AASLD Practice Guidance on the clinical assessment and management of nonalcoholic fatty liver disease.", url = "https://doi.org/10.1097/HEP.0000000000000323", locator = "Clinical and laboratory-based fibrosis biomarkers", quote = "FIB-4 is calculated using a simple algorithm based upon age, ALT, AST, and platelet count" },
]

[[member]]
marker = "alp"
role = "core"
reason = "Defines cholestatic injury when disproportionately elevated relative to AST and ALT."
term = "ALP"
citations = [
  { pmid = "29122851", title = "Guidelines on the management of abnormal liver blood tests.", url = "https://doi.org/10.1136/gutjnl-2017-314924", locator = "Recommendation 1", quote = "Recommendation 1: Initial investigation for potential liver disease should include bilirubin, albumin, alanine aminotransferase (ALT), alkaline phosphatase (ALP) and γ-glutamyltransferase (GGT), together with a full blood count if not already performed within the previous 12 months." },
  { pmid = "27995906", title = "ACG Clinical Guideline: Evaluation of Abnormal Liver Chemistries.", url = "https://doi.org/10.1038/ajg.2016.517", locator = "Abstract", quote = "Cholestatic injury is defined as disproportionate elevation of alkaline phosphatase level as compared with AST and ALT levels." },
]

[[member]]
marker = "ggt"
role = "core"
reason = "Part of the initial investigation of potential liver disease; confirms hepatic origin of ALP elevation."
term = "GGT"
citations = [
  { pmid = "29122851", title = "Guidelines on the management of abnormal liver blood tests.", url = "https://doi.org/10.1136/gutjnl-2017-314924", locator = "Recommendation 1", quote = "Recommendation 1: Initial investigation for potential liver disease should include bilirubin, albumin, alanine aminotransferase (ALT), alkaline phosphatase (ALP) and γ-glutamyltransferase (GGT), together with a full blood count if not already performed within the previous 12 months." },
]

[[member]]
marker = "bilirubin-total"
role = "core"
reason = "Liver function and cholestasis marker; an elevated total level should be fractionated."
term = "bilirubin"
citations = [
  { pmid = "29122851", title = "Guidelines on the management of abnormal liver blood tests.", url = "https://doi.org/10.1136/gutjnl-2017-314924", locator = "Recommendation 1", quote = "Recommendation 1: Initial investigation for potential liver disease should include bilirubin, albumin, alanine aminotransferase (ALT), alkaline phosphatase (ALP) and γ-glutamyltransferase (GGT), together with a full blood count if not already performed within the previous 12 months." },
  { pmid = "27995906", title = "ACG Clinical Guideline: Evaluation of Abnormal Liver Chemistries.", url = "https://doi.org/10.1038/ajg.2016.517", locator = "Abstract", quote = "Total bilirubin elevation can occur in either cholestatic or hepatocellular diseases." },
]

[[member]]
marker = "bilirubin-direct"
role = "extended"
reason = "Elevated conjugated bilirubin implies hepatocellular disease or biliary obstruction."
term = "conjugated bilirubin"
citations = [
  { pmid = "27995906", title = "ACG Clinical Guideline: Evaluation of Abnormal Liver Chemistries.", url = "https://doi.org/10.1038/ajg.2016.517", locator = "Abstract", quote = "Elevated total serum bilirubin levels should be fractionated to direct and indirect bilirubin fractions and an elevated serum conjugated bilirubin implies hepatocellular disease or biliary obstruction in most settings." },
]

[[member]]
marker = "albumin"
role = "core"
reason = "Synthetic liver function marker included in initial investigation of liver disease."
citations = [
  { pmid = "29122851", title = "Guidelines on the management of abnormal liver blood tests.", url = "https://doi.org/10.1136/gutjnl-2017-314924", locator = "Recommendation 1", quote = "Recommendation 1: Initial investigation for potential liver disease should include bilirubin, albumin, alanine aminotransferase (ALT), alkaline phosphatase (ALP) and γ-glutamyltransferase (GGT), together with a full blood count if not already performed within the previous 12 months." },
  { pmid = "29122851", title = "Guidelines on the management of abnormal liver blood tests.", url = "https://doi.org/10.1136/gutjnl-2017-314924", locator = "Introduction", quote = "Hepatobiliary enzymes, when interpreted in isolation convey information on the level of ongoing injury, whereas bilirubin, albumin and INR convey information on liver function, with platelets conveying information on the level of fibrosis." },
]

[[member]]
marker = "inr"
