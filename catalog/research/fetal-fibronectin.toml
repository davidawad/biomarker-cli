slug = "fetal-fibronectin"
name = "Fetal Fibronectin, Cervicovaginal"
category = "pregnancy"
unit = "ng/mL"
description = "Glycoprotein that acts as glue between decidua and fetal membranes; detected in cervicovaginal secretions. A positive test in women with symptoms or a high-risk history signals increased short-term risk of preterm birth or impending labour."

[[range]]
set = "fibronectin-meta-2020"
kind = "diagnostic"
low = 50
when = { pregnancy = true, gestational_week_min = 22, gestational_week_max = 36, specimen = "cervicovaginal" }
population = "Pregnant women tested for impending labour or preterm birth (systematic review and meta-analysis)"
evidence = "meta-analysis"
note = "Qualitative positive test at 50 ng/mL or more between 22 and 36 weeks. Source window is 22 to 36 weeks, not 22 to 35."
citations = [
  { pmid = "29914277", doi = "10.1080/14767058.2018.1491031", title = "The fetal fibronectin test: 25 years after its development, what is the evidence regarding its clinical utility? A systematic review and meta-analysis.", url = "https://pubmed.ncbi.nlm.nih.gov/29914277/", locator = "Abstract", quote = "could be a good marker of impending labour when its concentration in cervicovaginal secretions between 22 and 36 weeks of gestation is ≥50 ng/mL." },
]

[[range]]
set = "fibronectin-symptomatic-2013"
kind = "diagnostic"
high = 10
when = { pregnancy = true, conditions = ["symptomatic-preterm-labour"], specimen = "cervicovaginal" }
population = "Symptomatic women with threatened preterm labour (quantitative fFN test)"
evidence = "outcome"
note = "Below 10 ng/mL: very low risk of spontaneous preterm birth (negative predictive threshold)."
citations = [
  { pmid = "23164760", doi = "10.1016/j.ajog.2012.10.890", title = "Evaluation of a quantitative fetal fibronectin test for spontaneous preterm birth in symptomatic women.", url = "https://pubmed.ncbi.nlm.nih.gov/23164760/", locator = "Abstract, Conclusion", quote = "Quantitative fFN provides thresholds (10 and 200 ng/mL) in addition to the qualitative method (50 ng/mL) to discriminate the risk of sPTB in symptomatic women." },
]

