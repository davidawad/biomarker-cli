[[range]]
set = "eurheartj-2023-troponin-early"
kind = "decision"
high = 5
when = { setting = "suspected-acute-mi", method = "abbott-architect-stat" }
population = "Patients presenting with suspected myocardial infarction, including those presenting within 3 hours of symptom onset"
evidence = "validation-study"
note = "Optimised single-sample rule-out threshold for hs-cTnI at presentation. Boundary is strict (<5 ng/L). The same study reports a 2 ng/L limit of detection threshold with higher sensitivity."
citations = [
  { pmid = "37350492", doi = "10.1093/eurheartj/ehad376", title = "Troponin in early presenters to rule out myocardial infarction.", url = "https://pubmed.ncbi.nlm.nih.gov/37350492/", locator = "Abstract, Results", quote = "The limit-of-detection (2 ng/L), rule-out (5 ng/L), and sex-specific 99th centile (16 ng/L in women; 34 ng/L in men) thresholds were compared." },
]

