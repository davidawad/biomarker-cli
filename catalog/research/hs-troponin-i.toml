slug = "hs-troponin-i"
name = "High-Sensitivity Cardiac Troponin I"
loinc = "89579-7"
category = "cardiac"
unit = "ng/L"
description = "High-sensitivity cardiac troponin I, a protein released from injured heart muscle. Measured with a high-sensitivity assay it is used to rule acute myocardial infarction in or out, with sex-specific 99th percentile limits and 0/1-hour algorithms, and to detect myocardial injury."
aliases = ["hs-cTnI", "hs-TnI", "troponin I high sensitivity"]

[[range]]
set = "eurheartj-2023-troponin-early"
kind = "reference"
high = 16
unit = "ng/L"
when = { sex = "female", method = "abbott-architect-stat" }
population = "Healthy reference population used to derive sex-specific 99th percentile limits for the Abbott Architect hs-cTnI (CLIA) assay"
evidence = "reference-interval-study"
note = "Sex-specific 99th percentile upper reference limit for women on the Abbott Architect hs-cTnI assay. Values above the limit indicate myocardial injury."
citations = [
  { pmid = "37350492", doi = "10.1093/eurheartj/ehad376", title = "Troponin in early presenters to rule out myocardial infarction.", url = "https://pubmed.ncbi.nlm.nih.gov/37350492/", locator = "Abstract, Methods", quote = "sex-specific 99th centile (16 ng/L in women; 34 ng/L in men)" },
]

