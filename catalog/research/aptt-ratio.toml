slug = "aptt-ratio"
name = "aPTT Ratio"
category = "coagulation"
unit = "ratio"
description = "Patient aPTT divided by the control (mean normal) aPTT, used to monitor unfractionated heparin. The therapeutic ratio depends on the reagent and analyser, so labs should calibrate it against anti-Xa levels."

[[range]]
set = "heparin-aptt-ratio"
kind = "therapeutic"
low = 1.5
high = 2.5
when = { condition = ["on-unfractionated-heparin"] }
population = "patients receiving unfractionated heparin (commonly recommended range, as quoted in a study of 126 patients)"
evidence = "consensus"
note = "Expressed as a ratio to the control aPTT, not in seconds. The source states this range is commonly recommended but not universally applicable; reagent-specific ratios are in the next range."
citations = [
  { pmid = "11176764", doi = "10.1001/archinte.161.3.385", title = "Use of a fixed activated partial thromboplastin time ratio to establish a therapeutic range for unfractionated heparin.", locator = "Abstract, Background", quote = "The commonly recommended therapeutic range for patients receiving unfractionated heparin of 1.5 to 2.5 times the control activated partial thromboplastin time (aPTT) is not universally applicable." },
]

[[range]]
set = "heparin-aptt-ratio"
kind = "therapeutic"
low = 2.0
high = 3.5
when = { condition = ["on-unfractionated-heparin"] }
population = "patients receiving unfractionated heparin, specific reagent and coagulometer combinations (Actin, IL Test) in a study of 126 patients"
evidence = "consensus"
note = "Ratio to control aPTT that corresponded to therapeutic anti-factor Xa heparin levels for some reagent/coagulometer combinations; not a general target. Retrieved text does not give a generic range beyond this."
citations = [
  { pmid = "11176764", doi = "10.1001/archinte.161.3.385", title = "Use of a fixed activated partial thromboplastin time ratio to establish a therapeutic range for unfractionated heparin.", locator = "Abstract, Results and Conclusion", quote = "aPTT ratios necessary to achieve therapeutic anti--factor Xa heparin levels approximated 2.0 to 3.5" },
]

