]

[[range]]
set = "iss-2005"
kind = "decision"
high = 3.5
when = { markers = { albumin = ">=3.5" } }
population = "Newly diagnosed multiple myeloma patients (International Staging System derivation and validation)"
evidence = "cohort-study"
note = "ISS stage I (lowest risk) requires beta-2 microglobulin below 3.5 mg/L together with serum albumin >= 3.5 g/dL. Boundary is < 3.5 mg/L (strictly less than). Stage I median survival 62 months in the original cohort."
citations = [
  { pmid = "15809451", doi = "10.1200/JCO.2005.04.242", title = "International staging system for multiple myeloma.", url = "https://pubmed.ncbi.nlm.nih.gov/15809451/", locator = "Abstract, Results", quote = "stage I, Sbeta2M less than 3.5 mg/L plus serum albumin > or = 3.5 g/dL (median survival, 62 months); stage II, neither stage I nor III (median survival, 44 months); and stage III, Sbeta2M > or = 5.5 mg/L (median survival, 29 months)." },
]

[[range]]
