slug = "sflt1-plgf-ratio"
name = "sFlt-1/PlGF Ratio"
category = "pregnancy"
unit = "ratio"
description = "Ratio of soluble fms-like tyrosine kinase-1 (sFlt-1) to placental growth factor (PlGF), an angiogenic marker used in suspected pre-eclampsia. A low ratio makes pre-eclampsia within about one week unlikely; a high ratio signals imminent or early-onset disease. Cut-offs are assay-specific."

[[range]]
set = "prognosis-study"
kind = "diagnostic"
high = 38
when = { pregnancy = true, conditions = ["suspected-preeclampsia"], method = "immunoassay" }
population = "Pregnant women with suspected pre-eclampsia in the PROGNOSIS study cohort (Elecsys sFlt-1/PlGF assay)"
evidence = "outcome"
note = "Rule-out cut-off: a ratio at or below 38 rules out pre-eclampsia onset within 1 week of testing (high negative predictive value). Platform-specific; other platforms use different equivalent cut-offs."
citations = [
  { pmid = "30014562", doi = "10.1002/uog.19178", title = "Soluble fms-like tyrosine kinase-1 to placental growth factor ratio: ruling out pre-eclampsia for up to 4 weeks and value of retesting.", url = "https://pubmed.ncbi.nlm.nih.gov/30014562/", locator = "Abstract", quote = "The PROGNOSIS study validated a sFlt-1/PlGF ratio cut-off of ≤ 38 to rule out the onset of pre-eclampsia within 1 week of testing in women with suspected disease." },
]

[[range]]
set = "prognosis-asia-2021"
kind = "diagnostic"
low = 38
when = { pregnancy = true, conditions = ["suspected-preeclampsia"], method = "immunoassay" }
population = "Chinese pregnant women with suspected pre-eclampsia (PROGNOSIS Asia sub-analysis)"
evidence = "outcome"
note = "Rule-in cut-off: a ratio above 38 is used to rule in pre-eclampsia within 4 weeks. In this cohort the positive predictive value was modest (35.0%), so a high ratio warns rather than confirms."
citations = [
  { pmid = "34497833", doi = "10.3389/fcvm.2021.602560", title = "Short-Term Prediction of Preeclampsia in Chinese Women Using the Soluble fms-Like Tyrosine Kinase 1/Placental Growth Factor Ratio: A Sub-Analysis of the PROGNOSIS Asia Study.", url = "https://pubmed.ncbi.nlm.nih.gov/34497833/", locator = "Abstract, Results", quote = "With the use of an sFlt-1/PlGF ratio of >38, the positive predictive value for ruling in preeclampsia within 4 weeks was 35.0%" },
]

