  { pmid = "40992360", doi = "10.1002/uog.70075", title = "sFlt-1/PlGF ratio thresholds for diagnosing pre-eclampsia in pregnant women with high blood pressure.", url = "https://pubmed.ncbi.nlm.nih.gov/40992360/", locator = "Abstract, Results", quote = "≥ 74 for GA < 34 weeks and ≥ 95 for GA ≥ 34 weeks at biomarker measurement" },
