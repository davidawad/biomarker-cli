slug = "fecal-elastase"
name = "Faecal Elastase-1"
loinc = "25907-7"
category = "stool"
unit = "µg/g"
description = "Faecal elastase-1 is a pancreas-specific enzyme measured in a stool sample. Low concentrations indicate exocrine pancreatic insufficiency (PEI), and the result is graded as mild, moderate or severe. It is not affected by pancreatic enzyme replacement therapy because it measures only human elastase."
aliases = ["FE-1", "FEL-1", "faecal elastase", "fecal elastase", "stool elastase", "pancreatic elastase"]

[[range]]
set = "uk-pei-consensus-2021"
kind = "decision"
low = 200
population = "Adults with suspected exocrine pancreatic insufficiency (UK practical consensus)"
evidence = "consensus"
note = "Result at or above 200 µg/g is not in the moderate-PEI band. The consensus gives <200 as moderate and <100 as severe, so 200 is the boundary. The consensus does not state a normal range in these words; the lower limit is taken by implication."
citations = [
  { pmid = "34140324", doi = "10.1136/bmjgast-2021-000643", title = "Consensus for the management of pancreatic exocrine insufficiency: UK practical guidelines.", url = "https://pubmed.ncbi.nlm.nih.gov/34140324/", locator = "Section on diagnosis, Statement 1.2 and supporting text", quote = "A FEL-1 result of <200 µg/g stool suggests moderate PEI, while <100 µg/g suggests severe PEI." },
]

