slug = "lh"
name = "Luteinizing Hormone"
loinc = "10501-5"
category = "hormone"
unit = "mIU/mL"
description = "Pituitary gonadotropin that triggers ovulation and stimulates testosterone production in men. Reference values depend on sex, menstrual cycle phase and menopause; in children, basal LH is used to screen for central precocious puberty."

