[[range]]
set = "gnrha-peak-lh-2024"
kind = "diagnostic"
low = 5
unit = "IU/L"
when = { sex = "female", tanner_min = 2, tanner_max = 3, test = "subcutaneous triptorelin 100 ug GnRHa stimulation test, peak serum LH" }
population = "971 girls with premature breast development who had a subcutaneous GnRHa (100 ug triptorelin) test, Tanner stages II-III; normal-weight group of 634 girls"
evidence = "outcome"
note = "Peak LH cut-off of 5 IU/L (the commonly used value) in normal-weight girls: sensitivity 75%, specificity 90%. A peak at or above the cut-off supports central precocious puberty. Source unit IU/L (equivalent to mIU/mL). Assay dependent."
citations = [
  { pmid = "38300440", doi = "10.1111/cen.15026", title = "Peak serum luteinising hormone cut-off during gonadotropin-releasing hormone analogue test for diagnosing central precocious puberty was lower in girls with obesity as compared with girls with normal weight.", url = "https://pubmed.ncbi.nlm.nih.gov/38300440/", locator = "Abstract, Results", quote = "Peak serum LH cut-off of 5 IU/L (the current widely used cut-off) had a sensitivity and a specificity of 75% and 90%, respectively in NW group." },
]

