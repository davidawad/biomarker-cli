[[range]]
set = "gnrh-test-basal-lh-2026"
kind = "diagnostic"
low = 0.5
unit = "U/L"
when = { age_max = 9, specimen = "serum", test = "early-morning fasting basal LH before GnRH stimulation test" }
population = "258 children evaluated for suspected central precocious puberty with a first GnRH stimulation test, Edinburgh 2011-2025"
evidence = "outcome"
note = "Optimal basal LH threshold for a pubertal GnRH response (sensitivity 0.61, specificity 0.97). Assay dependent (Abbott LOD 0.5 U/L; Roche LOD 0.3 U/L). Source unit U/L (equivalent to IU/L). Eligibility: girls under 8 and boys under 9 years."
citations = [
  { pmid = "42440719", doi = "10.1210/jendso/bvag131", title = "Diagnostic utility of basal luteinizing hormone in evaluating central precocious puberty.", url = "https://pubmed.ncbi.nlm.nih.gov/42440719/", locator = "Abstract, Results", quote = "The optimal threshold was 0.5 U/L (sensitivity 0.61, specificity 0.97)" },
]

