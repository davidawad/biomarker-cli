category = "urinalysis"
unit = "pH"
description = "Acidity or alkalinity of a urine sample, measured by dipstick or meter. It guides kidney stone prevention, for example urine alkalinisation for uric acid stones and cystine stones."
aliases = ["urinary pH", "urine acidity"]

[[range]]
set = "uric-acid-stone-alkalinization-2025"
kind = "optimal"
low = 6.5
high = 7.2
population = "Patients with uric acid kidney stones, targets for urine alkalinisation"
evidence = "consensus"
note = "Target urine pH above 6.5, preferably 7 to 7.2, for uric acid stone dissolution. The evidence is an in vitro dissolution-kinetics study that supports expert-based recommendations, not a clinical outcome study. Boundary >6.5 (exclusive)."
citations = [
  { pmid = "40958884", doi = "10.1016/j.euros.2025.04.003", title = "Revisiting Uric Acid Stone Dissolution Kinetics: Insights for Optimizing Medical Therapy.", url = "https://pubmed.ncbi.nlm.nih.gov/40958884/", locator = "Abstract, Conclusions and Clinical Implications", quote = "by maintaining urine pH >6.5, preferably 7-7.2" },
]

