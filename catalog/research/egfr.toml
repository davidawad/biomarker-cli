name = "eGFR"
loinc = "98979-8"
category = "kidney"
unit = "mL/min/1.73m²"
description = "Estimated glomerular filtration rate from a creatinine- and/or cystatin C-based equation. Used to classify GFR categories G1-G5 and to define chronic kidney disease (CKD) together with albuminuria."

