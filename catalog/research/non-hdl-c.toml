slug = "non-hdl-c"
name = "Non-HDL Cholesterol"
loinc = "43396-1"
category = "lipid"
unit = "mg/dL"
description = "Total cholesterol minus HDL-C, capturing all atherogenic apolipoprotein B particles. Used as a secondary target when triglycerides are elevated (ATP III: goal set 30 mg/dL above the LDL-C goal), with the NICE secondary-prevention target, pediatric NHLBI cut-points and the EAS/EFLM non-fasting and fasting flags."

[[range]]
set = "clinical"
kind = "target"
high = 130
when = { risk = "chd-or-risk-equivalent" }
population = "Adults with coronary heart disease or CHD risk equivalents"
evidence = "guideline"
note = "ATP III non-HDL-C goal (<130 mg/dL), set 30 mg/dL above the LDL-C goal of <100. ATP III (2001) is superseded; the 2018 AHA/ACC text was not retrievable here."
citations = [
  { url = "https://www.nhlbi.nih.gov/files/docs/guidelines/atp3xsum.pdf", locator = "Table 9", quote = "Risk Category LDL Goal (mg/dL) Non-HDL-C Goal (mg/dL) CHD and CHD Risk Equivalent <100 <130 (10-year risk for CHD >20%) Multiple (2+) Risk Factors and <130 <160 10-year risk <=20% 0-1 Risk Factor <160 <190" },
]

[[range]]
set = "clinical"
kind = "target"
high = 160
when = { risk = "two-or-more-risk-factors" }
population = "Adults with two or more risk factors and 10-year CHD risk of 20% or less"
evidence = "guideline"
note = "ATP III non-HDL-C goal (<160 mg/dL) for multiple (2+) risk factors."
citations = [
  { url = "https://www.nhlbi.nih.gov/files/docs/guidelines/atp3xsum.pdf", locator = "Table 9", quote = "Risk Category LDL Goal (mg/dL) Non-HDL-C Goal (mg/dL) CHD and CHD Risk Equivalent <100 <130 (10-year risk for CHD >20%) Multiple (2+) Risk Factors and <130 <160 10-year risk <=20% 0-1 Risk Factor <160 <190" },
]

