[[range]]
set = "clinical"
kind = "warn"
low = 150
when = { fasting = false }
population = "Non-fasting samples (lab flagging, EAS/EFLM consensus)"
evidence = "consensus"
note = "Laboratory flag for abnormal non-fasting non-HDL-C. The consensus full text gives 3.9 mmol/L (155 mg/dL) in one place and 3.9 mmol/L (150 mg/dL) in the abstract; the abstract value is used here."
citations = [
  { pmid = "27122601", doi = "10.1093/eurheartj/ehw152", title = "Fasting is not routinely required for determination of a lipid profile: clinical and laboratory implications including flagging at desirable concentration cut-points-a joint consensus statement from the European Atherosclerosis Society and European Federation of Clinical Chemistry and Laboratory Medicine.", locator = "Abstract", quote = "calculated non-HDL cholesterol >=3.9 mmol/L (150 mg/dL)" },
]

