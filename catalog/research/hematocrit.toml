[[range]]
set = "who"
kind = "diagnostic"
low = 49
source_unit = "L/L"
source_factor = 100
when = { sex = "male", age_min = 18 }
population = "adult men, WHO 2016 criteria for polycythaemia vera (as quoted in a 2021 Annals of Hematology paper)"
evidence = "guideline"
note = "Haematocrit above this value is a WHO 2016 diagnostic criterion for polycythaemia vera (with Hb above 16.5 g/dL in men). Not a general reference limit."
citations = [
  { pmid = "34013406", doi = "10.1007/s00277-021-04546-4", title = "Diagnosis and management of non-clonal erythrocytosis remains challenging: a single centre clinical experience.", locator = "Introduction", quote = "haematocrit (Hct) (> 0.49 in men and > 0.48 in women) according to the 2016 WHO criteria for the diagnosis of polycythaemia vera" },
]

