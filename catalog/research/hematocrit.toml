slug = "hematocrit"
name = "Hematocrit"
loinc = "4544-3"
category = "cbc"
unit = "%"
description = "Percentage of whole blood volume occupied by red blood cells (packed cell volume). Low values indicate anemia; high values indicate erythrocytosis (for example polycythemia vera) or dehydration."

[[range]]
set = "norip"
kind = "reference"
low = 39.5
high = 50.0
source_unit = "L/L"
source_factor = 100
when = { sex = "male", age_min = 18, age_max = 90 }
population = "1826 healthy Nordic adults aged 18-90 (NORIP), venous EDTA blood, 12 analyser types"
evidence = "reference-interval"
note = "Non-parametric 2.5th-97.5th percentiles; NORIP reports EVF as a fraction."
citations = [
  { pmid = "15223702", doi = "10.1080/00365510410002797", title = "A multicentre study of reference intervals for haemoglobin, basic blood cell counts and erythrocyte indices in the adult population of the Nordic countries.", locator = "Abstract", quote = "B-EVF (females 0.348-0.459, males 0.395-0.500)" },
]

