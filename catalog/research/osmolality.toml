slug = "osmolality"
name = "Osmolality, Serum"
loinc = "2692-2"
category = "electrolyte"
unit = "mOsm/kg"
description = "Serum osmolality measures the concentration of osmotically active solutes. The osmolal gap (measured minus calculated osmolality) is raised by toxic alcohols and other unmeasured solutes. No verifiable source for the measured serum osmolality reference interval was found, so only osmolal gap ranges are recorded here."

[[range]]
set = "reference"
kind = "reference"
high = 5
unit = "mOsm/kg H2O"
population = "Presumed healthy adults (blood donors, Norway)"
evidence = "reference-interval-study"
note = "Osmolal gap (measured osmolality minus calculated osmolality), not measured serum osmolality. Calculated from sodium, urea and glucose. Upper limit shown (the source reports -6 to 5 mOsm/kg H2O after outlier correction; the lower limit is omitted because the verifier cannot check negative numbers)."
citations = [
  { pmid = "31809199", doi = "10.1080/00365513.2019.1672086", title = "Reference values for osmolal gap in healthy subjects and in medical inpatients.", locator = "Abstract", quote = "When corrected for outliers, the reference range was -6 to 5 mOsm/kg H2O." },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 20
unit = "mOsm/kg H2O"
population = "Adults with suspected toxic alcohol poisoning"
evidence = "consensus"
note = "Osmolal gap at or above 20 mOsm/kg (source's practice threshold for suspecting methanol or ethylene glycol poisoning). Osmolal gap in this range, not measured serum osmolality. The source suggests a reference value of 5 or less for healthy subjects."
citations = [
  { pmid = "31809199", doi = "10.1080/00365513.2019.1672086", title = "Reference values for osmolal gap in healthy subjects and in medical inpatients.", locator = "Abstract", quote = "to keep today's practice for suspecting poisoning with toxic alcohols at an elevated OG of >=20 mOsm/kg H2O" },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 300
when = { age_min = 65 }
population = "Hospitalised adults aged 65 years and over (low-intake dehydration; directly measured serum or plasma osmolality)"
evidence = "meta-analysis"
note = "Low-intake dehydration threshold: measured osmolality strictly above 300 mOsm/kg (low = 300 means strictly greater than 300). Threshold as used by the 19 included studies."
citations = [
  { pmid = "42158549", doi = "10.1136/bmjph-2025-002985", title = "Prevalence of low-intake dehydration in hospitalised older adults: systematic review and meta-analysis.", locator = "Abstract (Results)", quote = "directly measured osmolality >300 mOsm/kg, calculated osmolarity using Khajuria Krahn equation >300 mmol/L" },
]

[[range]]
set = "clinical"
kind = "warn"
low = 295
high = 300
when = { age_min = 65 }
population = "Older people aged 65 years and over in five cohorts (community and hospital; directly measured serum/plasma osmolality)"
evidence = "outcome-study"
note = "Impending dehydration band: osmolality at or above 295 mOsm/kg up to the 300 mOsm/kg current-dehydration threshold (the source gives >=295 and >300 separately; high = 300 marks where the current-dehydration cut-off starts)."
citations = [
  { pmid = "26490100", doi = "10.1136/bmjopen-2015-008846", title = "Diagnostic accuracy of calculated serum osmolarity to predict dehydration in older people: adding value to pathology laboratory reports.", locator = "Abstract", quote = "current dehydration (serum osmolality>300 mOsm/kg), impending/current dehydration (>=295 mOsm/kg)" },
]
