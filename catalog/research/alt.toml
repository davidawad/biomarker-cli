slug = "alt"
name = "ALT (Alanine Aminotransferase)"
loinc = "1742-6"
category = "liver"
unit = "U/L"
description = "Hepatocellular enzyme; the most specific routine marker of hepatocyte injury. Upper reference limits depend on sex, age and body weight."

[[range]]
set = "reference"
kind = "reference"
high = 57
