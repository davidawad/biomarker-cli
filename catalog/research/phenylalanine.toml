slug = "phenylalanine"
name = "Phenylalanine"
category = "amino-acid"
unit = "µmol/L"
description = "Plasma concentration of the essential amino acid phenylalanine. In phenylketonuria (PKU) it accumulates because phenylalanine hydroxylase is deficient, so treatment targets are set as ranges; persistently high values signal poor metabolic control."

[[range]]
set = "acmg-2014"
kind = "therapeutic"
low = 120
high = 360
when = { condition = ["pku"] }
population = "Individuals with phenylalanine hydroxylase deficiency (PKU) of all ages, treated lifelong with diet and/or pharmacotherapy (ACMG 2014 guideline)"
evidence = "guideline"
note = "Treatment goal for blood Phe; the guideline states it for all ages without an age split."
citations = [
  { pmid = "24385074", doi = "10.1038/gim.2013.157", title = "Phenylalanine hydroxylase deficiency: diagnosis and management guideline.", locator = "Abstract", quote = "with a goal of maintaining blood phenylalanine in the range of 120-360 µmol/l" },
]

[[range]]
set = "eu-pku-2017"
kind = "therapeutic"
low = 120
high = 360
when = { condition = ["pku"], age_max = 12 }
population = "Patients with PKU younger than 12 years (European PKU guideline 2017)"
evidence = "guideline"
note = "Lower target 120 umol/L stated as advised; upper target 360 umol/L stated as the upper target for under-12s."
citations = [
  { pmid = "29025426", doi = "10.1186/s13023-017-0685-2", title = "The complete European guidelines on phenylketonuria: diagnosis and treatment.", locator = "Treatment goals section", quote = "We advise a lower target level at 120 μmol/l ... a Phe concentration of 360 μmol/l should be considered as the upper target Phe concentration" },
]

[[range]]
set = "eu-pku-2017"
kind = "therapeutic"
low = 120
high = 600
when = { condition = ["pku"], age_min = 12 }
population = "Patients with PKU aged 12 years and older (European PKU guideline 2017)"
evidence = "guideline"
citations = [
  { pmid = "29025426", doi = "10.1186/s13023-017-0685-2", title = "The complete European guidelines on phenylketonuria: diagnosis and treatment.", locator = "Treatment goals section", quote = "After the age of 12 years, patients with PKU should aim for blood Phe levels of 120–600 μmol/L." },
]

[[range]]
set = "eu-pku-2017"
kind = "therapeutic"
low = 120
high = 360
when = { condition = ["pku"], pregnant = true }
population = "Women with PKU during pregnancy (European PKU guideline 2017, pregnancy section)"
evidence = "guideline"
note = "The guideline's pregnancy text gives 120-360 umol/L as the range of well-treated pregnancies and advises avoiding values below 120; the explicit range is taken from that pregnancy section, not from a single target statement."
citations = [
  { pmid = "29025426", doi = "10.1186/s13023-017-0685-2", title = "The complete European guidelines on phenylketonuria: diagnosis and treatment.", locator = "Pregnancy section", quote = "well-treated pregnancies with blood Phe control between 120 and 360 μmol/l" },
]
