slug = "zinc"
name = "Zinc"
loinc = "5763-8"
category = "trace-element"
unit = "µg/dL"
description = "Concentration of the trace element zinc in plasma or serum, a marker of population and individual zinc status. Low values suggest zinc deficiency, although inflammation, fasting, time of draw and haemolysis strongly affect the result."

[[range]]
set = "izincg"
kind = "deficient"
high = 70
when = { sex = "female", age_min = 15, age_max = 50, pregnant = false, fasting = true }
population = "Nonpregnant women of reproductive age 15-49 y in 13 nationally representative surveys (BRINDA); cut-off applies to a morning fasting sample"
evidence = "consensus"
note = "IZiNCG plasma zinc cut-off as applied in BRINDA. Morning nonfasting cut-off is 66 (separate range); afternoon nonfasting cut-off is 59 µg/dL, not encoded because there is no time-of-day key."
citations = [
  { pmid = "32266402", doi = "10.1093/ajcn/nqz304", title = "Adjusting plasma or serum zinc concentrations for inflammation: Biomarkers Reflecting Inflammation and Nutritional Determinants of Anemia (BRINDA) project.", locator = "Methods, Case definitions", quote = "In WRA, a PZC cutoff of <70 μg/dL was used if the blood sample was drawn in the morning in a fasting state" },
]

