set = "clinbiochem-2026-hb-tdp"
kind = "reference"
low = 88
high = 181
specimen = "whole-blood"
when = {}
population = "130 healthy adults aged 18-65 y, HPLC with fluorescence detection, reference interval per CLSI EP28-A3c; excludes thiamine supplementation, malnutrition, hepatic disease"
evidence = "reference-interval"
note = "Volumetric 90% range from the study; it lists 90% CIs of 83-92 and 175-189 for the limits. Hemoglobin-normalised TDP (249-531 ng/g Hb) is reported alongside and the authors favour it in anaemia. No sex or age partition was needed."
citations = [
  { pmid = "42833437", doi = "10.1016/j.clinbiochem.2026.111215", title = "Hemoglobin-normalized thiamine diphosphate (vitamin B1) in whole blood: Reference intervals and clinical implications for status assessment.", locator = "Abstract, Results", quote = "the volumetric RI was 88-181 nmol/L (90% CI: 83-92, 175-189)" },
]

