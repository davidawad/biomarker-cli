[[range]]
set = "zimbabwe-adults-2003-c3c4"
kind = "reference"
low = 12
high = 49
unit = "mg/dL"
when = { age_min = 18, age_max = 41 }
population = "Apparently healthy adult blood donors aged 18-60 years in Zimbabwe (n=95, 50 males and 45 females)"
evidence = "reference-interval-study"
note = "Local adult C4 interval for ages 18-40 (12-49 mg/dL), not partitioned by sex. Small single-country sample."
citations = [
  { pmid = "14562600", title = "Determination of normal ranges for serum C3 and C4 levels in an adult Zimbabwean population.", url = "https://pubmed.ncbi.nlm.nih.gov/14562600/", locator = "Abstract, Results", quote = "C4 levels were lower (12 to 49 mg/dl) in the younger adults (18 to 40 years) than in those aged 41 to 60 years (24 to 53 mg/dl)." },
]

