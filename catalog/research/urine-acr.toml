set = "kdigo-2024"
kind = "decision"
high = 30
population = "People with chronic kidney disease, albuminuria category A1 (normal to mildly increased)"
evidence = "guideline"
note = "KDIGO 2024 A1 band: ACR below 30 mg/g (boundary <30, so 30 itself is not in A1). The mg/mmol equivalent is <3."
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", locator = "Table 3 | Albuminuria categories in chronic kidney disease", quote = "A1 <30 <3 <30 Normal to mildly increased" },
