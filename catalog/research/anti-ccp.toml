slug = "anti-ccp"
name = "Anti-Cyclic Citrullinated Peptide Antibodies"
loinc = "53027-9"
category = "autoimmune"
unit = "U/mL"
description = "Antibodies against citrullinated protein antigens (ACPA). They are highly specific for rheumatoid arthritis and are used in diagnosis and classification, often together with rheumatoid factor."
aliases = ["anti-CCP", "ACPA", "CCP antibodies"]

[[range]]
set = "acr-eular-2010-ra"
kind = "decision"
low = 3
unit = "x ULN"
population = "Adults with synovitis not better explained by another disease (2010 ACR/EULAR RA classification)"
evidence = "consensus"
note = "High-positive ACPA is above 3 times the laboratory upper limit of normal (ULN), scoring 3 points. Low-positive ACPA (above ULN up to and including 3x ULN) scores 2 points. ULN is laboratory-specific. Thresholds are taken from a 2026 analysis that quotes the 2010 criteria; the primary paper's text was not retrievable."
citations = [
  { pmid = "42476632", doi = "10.1136/rmdopen-2026-007007", title = "Refining serological scores in rheumatoid arthritis classification: an international study.", url = "https://pubmed.ncbi.nlm.nih.gov/42476632/", locator = "Full text, Introduction (ACR/EULAR 2010 serological scoring)", quote = "a high-positive RF or ACPA (>3 times the ULN) contributes three points" },
]

[[range]]
set = "thermo-fisher-acpa-cutoff"
kind = "decision"
low = 10
high = 30
unit = "U/mL"
when = { method = "thermo-fisher" }
population = "RA and control patients in a review of autoimmune serology (Thermo Fisher assay)"
evidence = "consensus"
note = "Manufacturer-based low-positive band for this assay: above the 10 U/mL cut-off up to 30 U/mL; above 30 U/mL is high positive. Assay-specific and not transferable to other ACPA methods."
citations = [
  { pmid = "35036891", doi = "10.1016/j.jtauto.2022.100142", title = "Impact of autoimmune serology test results on RA classification and diagnosis.", url = "https://pubmed.ncbi.nlm.nih.gov/35036891/", locator = "Full text, Figure 3 legend", quote = "(<10 U/mL (cut-off), 10–30 U/mL, > 30 U/mL)" },
]
