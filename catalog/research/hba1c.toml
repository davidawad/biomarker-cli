slug = "hba1c"
name = "Hemoglobin A1c"
loinc = "4548-4"
category = "glycemic"
unit = "%"
description = "Glycated haemoglobin, reflecting average glucose over about 2-3 months. Used to diagnose and monitor prediabetes and diabetes, and to set individual treatment goals. Diagnostic and target values are given in % (NGSP) and mmol/mol (IFCC)."

