[[range]]
set = "eshre-poi-2024"
kind = "diagnostic"
low = 25
unit = "IU/L"
when = { sex = "female", conditions = ["suspected-poi"] }
population = "Women with disordered menstrual cycles (spontaneous amenorrhoea or irregular cycles for at least 4 months); ESHRE evidence-based guideline 2024"
evidence = "review"
note = "Restates the ESHRE 2024 premature ovarian insufficiency guideline, cited via its open-access abstract. Values strictly above 25 IU/L (low = 25 is the lower bound of the zone) support POI with the clinical picture. The 2024 guideline needs only one elevated FSH; the 2015/2016 ESHRE guidance required two occasions. Repeat FSH after 4-6 weeks if uncertain. Source unit IU/L (equivalent to mIU/mL)."
citations = [
  { pmid = "39660328", doi = "10.1093/hropen/hoae065", title = "Evidence-based guideline: premature ovarian insufficiency.", url = "https://pubmed.ncbi.nlm.nih.gov/39660328/", locator = "Recommendations (diagnosis)", quote = "an elevated FSH concentration > 25 IU/l" },
]
