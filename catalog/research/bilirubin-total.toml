slug = "bilirubin-total"
name = "Bilirubin, Total"
loinc = "1975-2"
category = "liver"
unit = "mg/dL"
description = "Total (direct plus indirect) serum bilirubin. Reference intervals differ by age and sex; mildly elevated values in the adult range are a Gilbert-syndrome-type pattern."

