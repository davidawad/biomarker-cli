note = "Glycaemic target as used by the source study: GMI below 7% (strict upper bound, <7%), one of three combined CGM targets with time-in-range above 70% and time below 70 mg/dL under 4%. The source attributes the targets to the ADA Standards of Care; the ADA text itself could not be retrieved, so the target is cited through this study."
