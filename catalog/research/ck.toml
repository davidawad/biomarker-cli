slug = "ck"
name = "Creatine Kinase"
category = "chemistry"
unit = "U/L"
description = "Creatine kinase is a marker of skeletal and cardiac muscle damage. Reference limits are higher in men and in people of African ancestry, so a single laboratory interval can misclassify results (for example, in people taking statins)."

