slug = "ck"
name = "Creatine Kinase"
loinc = "2157-6"
category = "cardiac"
unit = "U/L"
description = "Creatine kinase, an enzyme found mainly in skeletal muscle and the heart. Raised levels indicate muscle damage, for example after strenuous exercise, injury or rhabdomyolysis, and reference limits vary with sex and ethnicity."
aliases = ["CK", "CPK", "creatine phosphokinase"]

[[range]]
set = "ck-ethnicity-2026"
kind = "reference"
high = 389
unit = "IU/L"
when = { sex = "female", age_min = 13, ethnicity = "black" }
population = "Primary care patients in a West Midlands (UK) laboratory dataset, Black females aged 13 years and older"
evidence = "reference-interval-study"
note = "Upper reference limit (URL) for CK in Black females aged 13 and over, from a multi-ethnic UK dataset. Above this limit the result is flagged high. Limit is higher than the White female limit."
citations = [
  { pmid = "42142664", doi = "10.1016/j.clinme.2026.100596", title = "Age, sex and ethnicity changes in creatine kinase and sex- and ethnicity-specific reference intervals of creatine kinase.", url = "https://pubmed.ncbi.nlm.nih.gov/42142664/", locator = "Abstract, Results", quote = "Female URLs for ≥13 years were 389 IU/L (Black), 188 IU/L (Asian) and 170 IU/L (White); male URLs were 757 IU/L, 357 IU/L and 314 IU/L, respectively." },
]

