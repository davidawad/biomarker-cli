slug = "bmi"
name = "Body Mass Index"
loinc = "39156-5"
category = "body"
unit = "kg/m²"
description = "Body mass index, weight in kilograms divided by height in metres squared. Used to classify underweight, overweight and obesity, and as a proxy for adiposity-related health risk."
aliases = ["BMI", "body mass index", "Quetelet index"]

[[range]]
set = "global-bmi-mortality-2016"
kind = "optimal"
low = 20.0
high = 25.0
population = "Adults in 239 prospective cohorts across Asia, Australia and New Zealand, Europe and North America (never-smokers without chronic disease at recruitment who survived 5 years)"
evidence = "meta-analysis"
note = "All-cause mortality was minimal across BMI 20.0 to <25.0 kg/m2 (reference 22.5 to <25.0). Outcome-based optimal band, not a diagnostic cut-off."
citations = [
  { pmid = "27423262", doi = "10.1016/S0140-6736(16)30175-1", title = "Body-mass index and all-cause mortality: individual-participant-data meta-analysis of 239 prospective studies in four continents.", url = "https://pubmed.ncbi.nlm.nih.gov/27423262/", locator = "Abstract, Findings", quote = "All-cause mortality was minimal at 20·0-25·0 kg/m(2)" },
]

