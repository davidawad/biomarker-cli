name = "Vitamin C (ascorbic acid)"
category = "vitamin"
unit = "mg/dL"
description = "Ascorbic acid (vitamin C) concentration in serum or plasma, a measure of recent intake. Low values indicate deficiency (scurvy risk) or depletion; smoking markedly lowers levels."

