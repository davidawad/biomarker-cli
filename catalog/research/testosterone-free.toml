slug = "testosterone-free"
name = "Testosterone, Free"
loinc = "2991-8"
category = "hormone"
unit = "pg/mL"
description = "Unbound (free) testosterone in serum, measured by equilibrium dialysis or calculated from total testosterone and SHBG. Preferred when SHBG is altered or total testosterone is near the lower limit of normal."

[[range]]
set = "mft-age-strat-2026"
kind = "reference"
low = 184
high = 749
unit = "pmol/L"
when = { sex = "male", age_min = 18, age_max = 39, method = "equilibrium-dialysis" }
population = "Healthy, nonobese (BMI under 30) men aged 18-39 from large community cohorts (1202 men), free testosterone by equilibrium dialysis with LC-MS/MS"
evidence = "reference-interval"
note = "2.5th to 97.5th percentile (CLSI guidelines). Source unit is pmol/L; canonical here is pg/mL. Values are age-decline dependent (about -4.5 pmol/L per year)."
citations = [
  { pmid = "40929374", doi = "10.1210/clinem/dgaf507", title = "Age-Stratified Reference Ranges for Directly Measured Serum Free Testosterone in Community-Dwelling and Healthy Men.", url = "https://pubmed.ncbi.nlm.nih.gov/40929374/", locator = "Abstract, Results", quote = "The reference range for mFT in healthy, nonobese men aged 18 to 39 years was 184 to 749 pmol/L." },
]

