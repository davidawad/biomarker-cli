slug = "fib-4"
name = "FIB-4 Index"
category = "derived"
unit = "index"
description = "Non-invasive fibrosis index calculated from age, AST, ALT and platelet count to estimate the risk of advanced liver fibrosis in NAFLD/MASLD and viral hepatitis. It performs poorly under age 35, and its cut-offs are age-adjusted because specificity falls with age."
aliases = ["Fibrosis-4", "FIB4"]

[[range]]
set = "mcpherson-2017"
kind = "decision"
high = 1.3
population = "Adults with biopsy-proven NAFLD aged 35-65 (established cut-offs)"
evidence = "cohort-study"
note = "Low risk: a score below 1.3 is used to exclude advanced fibrosis (F3-F4). The paper states the score is not suitable for patients aged under 35."
citations = [
  { pmid = "27725647", doi = "10.1038/ajg.2016.453", title = "Age as a Confounding Factor for the Accurate Non-Invasive Diagnosis of Advanced NAFLD Fibrosis.", url = "https://pubmed.ncbi.nlm.nih.gov/27725647/", locator = "Results, established cut-offs", quote = "35% at cutoff 1.3 for FIB-4" },
]

[[range]]
set = "mcpherson-2017"
kind = "decision"
high = 2.0
population = "Adults aged 65 and over with biopsy-proven NAFLD"
evidence = "cohort-study"
note = "Age-adjusted lower cut-off for 65 and over: below 2.0 excludes advanced fibrosis. The abstract writes the revised threshold as 2.0; the text also writes >2.0. The upper cut-off is unchanged for this age group."
when = { age_min = 65 }
citations = [
  { pmid = "27725647", doi = "10.1038/ajg.2016.453", title = "Age as a Confounding Factor for the Accurate Non-Invasive Diagnosis of Advanced NAFLD Fibrosis.", url = "https://pubmed.ncbi.nlm.nih.gov/27725647/", locator = "Abstract, Results", quote = "New cutoffs were derived (and validated) for those aged ≥65 years" },
  { pmid = "27725647", doi = "10.1038/ajg.2016.453", title = "Age as a Confounding Factor for the Accurate Non-Invasive Diagnosis of Advanced NAFLD Fibrosis.", url = "https://pubmed.ncbi.nlm.nih.gov/27725647/", locator = "Abstract, Results", quote = "FIB-4 2.0, sensitivity 77%" },
]

