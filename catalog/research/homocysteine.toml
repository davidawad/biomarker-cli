when = { sex = "female", age_min = 60 }
population = "NHANES III (1991-1994) participants aged 60 and over who were folate- and vitamin B12-replete with normal creatinine; serum tHcy, 5th-95th percentiles"
evidence = "reference-interval"
note = "Same study as the male band. A high tHcy was defined as at least 10.4 micromol/L in women and 11.4 micromol/L in men, using the sex-specific 95th percentile in participants aged 20-39."
