slug = "homocysteine"
name = "Homocysteine"
loinc = "13965-9"
category = "inflammation"
unit = "µmol/L"
description = "Sulphur amino acid produced in methionine metabolism; its plasma level depends on folate, vitamin B12 and B6 status and renal function. Elevated levels (hyperhomocysteinaemia) are a cardiovascular and thrombotic risk marker."
aliases = ["Hcy", "total homocysteine", "tHcy"]

