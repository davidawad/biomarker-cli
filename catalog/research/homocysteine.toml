slug = "homocysteine"
name = "Homocysteine (total)"
loinc = "13965-9"
category = "inflammation"
unit = "µmol/L"
description = "Total homocysteine (tHcy) is a sulfur amino acid whose blood level rises with low folate, vitamin B12 or B6 status and with reduced kidney function. Raised values (hyperhomocysteinaemia) are a metabolic marker of B-vitamin insufficiency and are associated with vascular disease risk."

[[range]]
set = "nhanes-iii-1999"
kind = "reference"
low = 5.9
high = 15.3
when = { sex = "male", age_min = 60 }
population = "NHANES III (1991-1994) participants aged 60 and over who were folate- and vitamin B12-replete with normal creatinine; serum tHcy, 5th-95th percentiles"
evidence = "reference-interval"
note = "Upper reference limits rise with age and are higher in men than women at all ages. Reference values assume folate and B12 replete status; in NHANES III about two thirds of high values were linked to low vitamin concentrations."
citations = [
  { pmid = "10475885", doi = "10.7326/0003-4819-131-5-199909070-00003", title = "Serum total homocysteine concentrations in the third National Health and Nutrition Examination Survey (1991-1994): population reference ranges and contribution of vitamin status to high serum concentrations.", locator = "Results (Abstract)", quote = "from 5.9 to 15.3 micromol/L for men and 4.9 to 11.6 micromol/L for women 60 years of age or older" },
]

[[range]]
set = "nhanes-iii-1999"
kind = "reference"
low = 4.9
