slug = "vo2max"
name = "VO2 Max"
loinc = "94122-9"
category = "vitals"
unit = "mL/kg/min"
description = "Maximal oxygen uptake per kilogram of body weight, the standard measure of cardiorespiratory fitness. Higher values are associated with lower all-cause and cardiovascular mortality. Some cut-offs below are published in METs (1 MET = 3.5 mL/kg/min by convention)."
aliases = ["VO2peak", "maximal oxygen consumption", "cardiorespiratory fitness", "CRF"]

[[range]]
set = "kodama-2009-crf-mets"
kind = "decision"
high = 7.9
unit = "METs"
population = "Healthy men and women pooled from observational cohorts (meta-analysis of 33 studies)"
evidence = "meta-analysis"
note = "Low cardiorespiratory fitness band, maximal aerobic capacity below 7.9 METs (published as '< 7.9 METs'). Low CRF carried about 1.70 times the all-cause mortality of high CRF."
citations = [
  { pmid = "19454641", doi = "10.1001/jama.2009.681", title = "Cardiorespiratory fitness as a quantitative predictor of all-cause mortality and cardiovascular events in healthy men and women: a meta-analysis.", url = "https://pubmed.ncbi.nlm.nih.gov/19454641/", locator = "Abstract, Data Extraction", quote = "low CRF (< 7.9 METs)" },
]

