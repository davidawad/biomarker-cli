slug = "ionized-calcium"
name = "Calcium, Ionized"
category = "mineral"
unit = "mmol/L"
description = "Ionized (free) calcium, the physiologically active fraction of serum calcium, independent of albumin. Reference intervals are wider and shift with age in early life, so age-specific values are needed in neonates and young children."

[[range]]
set = "reference"
kind = "reference"
low = 1.14
high = 1.46
when = { age_min = 0, age_max = 1 }
population = "Danish children on day 0 of life (median with 2.5th and 97.5th fractiles, non-pH-corrected data set)"
evidence = "reference-interval-study"
note = "Neonatal range on day 0. Values rise to a peak on day 8 (1.29-1.59 mmol/L in the source)."
citations = [
  { pmid = "40785088", doi = "10.1515/cclm-2025-0353", title = "Reference ranges for ionized calcium in plasma in Danish children aged 0 days to 3 years using laboratory registry data.", locator = "Results", quote = "1.14-1.46 (pH corrected 1.13-1.43) mmol/L on day zero" },
]

[[range]]
set = "reference"
kind = "reference"
low = 1.16
high = 1.36
when = { age_min = 1, age_max = 2 }
population = "Danish children at 18-24 months of age (non-pH-corrected data set)"
evidence = "reference-interval-study"
note = "Value at 18-24 months, after the post-neonatal decline in the source."
citations = [
  { pmid = "40785088", doi = "10.1515/cclm-2025-0353", title = "Reference ranges for ionized calcium in plasma in Danish children aged 0 days to 3 years using laboratory registry data.", locator = "Results", quote = "1.16-1.36 (pH corrected 1.17-1.35) mmol/L at 18-24 months of age" },
]

[[range]]
set = "reference"
kind = "reference"
low = 0.88
high = 1.4
when = { sex = "female" }
population = "Women of reproductive age from six primary health-care facilities in Abuja, Nigeria (n = 240)"
evidence = "reference-interval-study"
note = "Single-country, small sample (n = 240). Lower than the commonly quoted adult range; the source itself recommends a national derivation before wider use."
citations = [
  { pmid = "33642323", doi = "10.4103/npmj.npmj_274_20", title = "Ionised serum calcium reference interval among rural women of reproductive age in Abuja, Nigeria.", locator = "Abstract", quote = "The obtained normal reference interval of ionised serum calcium (iCa) was 0.88-1.4 mmol/L." },
]
