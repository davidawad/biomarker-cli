slug = "copeptin"
name = "Copeptin"
category = "pituitary"
unit = "pmol/L"
description = "C-terminal fragment of the vasopressin precursor, released in equimolar amounts with arginine vasopressin (AVP) and far more stable to measure. Used as a surrogate for AVP in the work-up of polyuria: basal, hypertonic saline-stimulated and arginine-stimulated levels help separate AVP deficiency (central diabetes insipidus), nephrogenic diabetes insipidus and primary polydipsia."

[[range]]
set = "pediatric-ppsy-copeptin-2025"
kind = "diagnostic"
low = 21.4
when = { age_max = 18, specimen = "plasma", test = "basal (unstimulated) copeptin in polyuria work-up" }
population = "Children with polyuria-polydipsia syndrome (single-centre cohort) and children undergoing glucagon-stimulated copeptin testing"
evidence = "outcome"
note = "Basal copeptin at or above this value suggests arginine vasopressin resistance (nephrogenic diabetes insipidus). Pediatric data; the adult threshold has not been separately validated here."
citations = [
  { pmid = "40564913", doi = "10.3390/ijms26125449", title = "Comparative Diagnostic Performance of Copeptin After Hypertonic Saline Infusion Versus Water Deprivation Test in Pediatric Patients with Polyuria-Polydipsia Syndrome.", url = "https://pubmed.ncbi.nlm.nih.gov/40564913/", locator = "Abstract, Results", quote = "Basal copeptin ≥21.4 pmol/L accurately identified all NDI cases." },
  { pmid = "42369064", doi = "10.3389/fendo.2026.1833629", title = "Glucagon-stimulated copeptin response in children: a proof-of-concept study.", url = "https://pubmed.ncbi.nlm.nih.gov/42369064/", locator = "Abstract, Results", quote = "Baseline copeptin, if ≥21.4 pmol/L, can identify AVP-R with high accuracy." },
]

[[range]]
set = "nejm-copeptin-hypertonic-2018"
kind = "diagnostic"
high = 4.9
when = { specimen = "plasma", test = "hypertonic saline infusion, copeptin measured once plasma sodium reached at least 150 mmol/L" }
population = "Adults with hypotonic polyuria at 11 centres (141 analysed; final diagnoses primary polydipsia, central and nephrogenic diabetes insipidus)"
evidence = "outcome"
note = "Copeptin above 4.9 pmol/L after hypertonic saline indicates primary polydipsia; at or below this value indicates AVP deficiency (central diabetes insipidus). Diagnostic accuracy 96.5% in the derivation study."
citations = [
  { pmid = "30067922", doi = "10.1056/NEJMoa1803760", title = "A Copeptin-Based Approach in the Diagnosis of Diabetes Insipidus.", url = "https://pubmed.ncbi.nlm.nih.gov/30067922/", locator = "Abstract, Results", quote = "the hypertonic saline infusion test (with a copeptin cutoff level of >4.9 pmol per liter) determined the correct diagnosis in 136 patients (96.5%" },
  { pmid = "37966286", doi = "10.1056/NEJMoa2306263", title = "Arginine or Hypertonic Saline-Stimulated Copeptin to Diagnose AVP Deficiency.", url = "https://pubmed.ncbi.nlm.nih.gov/37966286/", locator = "Abstract, Methods", quote = "4.9 pmol per liter once the sodium level was more than 149 mmol per liter for hypertonic saline" },
]

[[range]]
set = "nejm-copeptin-arginine-2023"
kind = "diagnostic"
high = 3.8
when = { specimen = "plasma", test = "arginine stimulation, copeptin measured at 60 minutes" }
population = "Adults with polyuria-polydipsia syndrome or known AVP deficiency (head-to-head trial, 158 patients)"
evidence = "outcome"
note = "Copeptin at 60 min after arginine at or below this value suggests AVP deficiency. Less accurate than hypertonic saline testing in the head-to-head comparison (74.4% vs 95.6%). Winzeler 2019 (Lancet) derived the same 3.8 pmol/L cut-off in a development and validation cohort."
citations = [
  { pmid = "37966286", doi = "10.1056/NEJMoa2306263", title = "Arginine or Hypertonic Saline-Stimulated Copeptin to Diagnose AVP Deficiency.", url = "https://pubmed.ncbi.nlm.nih.gov/37966286/", locator = "Abstract, Methods", quote = "cutoff values of 3.8 pmol per liter after 60 minutes for arginine" },
  { pmid = "31303316", doi = "10.1016/S0140-6736(19)31255-3", title = "Arginine-stimulated copeptin measurements in the differential diagnosis of diabetes insipidus: a prospective diagnostic study.", url = "https://pubmed.ncbi.nlm.nih.gov/31303316/", locator = "Findings", quote = "a cutoff of 3·8 pM copeptin at 60 min" },
]
