slug = "eosinophils-abs"
name = "Absolute eosinophil count"
loinc = "711-2"
category = "cbc"
unit = "10^3/µL"
description = "Absolute count of circulating eosinophils, involved in allergy, asthma and parasitic infection. High values (eosinophilia) suggest allergy, drug reaction (DRESS), parasitosis, or hypereosinophilic / myeloid disorders; a count of 1.5 x 10^9/L or more defines eosinophilia for hypereosinophilic syndrome work-up."

[[range]]
set = "hes-definition-review"
kind = "diagnostic"
low = 1.5
source_unit = "10^9/L"
source_factor = 1
when = {}
population = "Patients with peripheral blood eosinophilia evaluated for hypereosinophilic syndrome (HES); review of the diagnostic definition"
evidence = "consensus"
note = "Diagnostic threshold for eosinophilia used in HES definition (count >= 1.5 plus end-organ involvement). The 0.5 x 10^9/L eosinophilia cutoff was not found in retrieved text and is not encoded."
citations = [
  { pmid = "25964669", doi = "10.1182/blood-2014-11-551614", title = "How I treat hypereosinophilic syndromes.", locator = "Abstract", quote = "peripheral blood eosinophilia of 1.5 × 10(9)/L or higher" },
]

