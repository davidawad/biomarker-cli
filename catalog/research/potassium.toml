slug = "potassium"
name = "Potassium"
loinc = "2823-3"
category = "electrolyte"
unit = "mmol/L"
description = "Serum potassium governs cardiac excitability. Hypokalaemia (<3.5 mmol/L) and hyperkalaemia (>=5.5 mmol/L) both carry arrhythmic risk, and outcome studies in CKD and heart failure show a U-shaped relation with mortality, with the lowest risk around 4-5 mmol/L. Serum values are usually higher than plasma values."

[[range]]
set = "reference"
kind = "reference"
low = 3.80
high = 4.98
when = { sex = "male" }
population = "Adults (Turkish population, indirect reference interval, reflimR, male)"
evidence = "reference-interval-study"
note = "Sex-specific indirect reference interval (reflimR); the manufacturer interval was 3.50-5.10 mmol/L. Plasma reference intervals are not covered here; serum values are usually higher than plasma."
citations = [
  { pmid = "41671238", doi = "10.1371/journal.pone.0342530", title = "Verification of reference intervals for routine biochemical tests using the reflimR in Turkish adults.", locator = "Table 2", quote = "| Potassium | mmol/L | 18,031 | 53 (39-63) | M | 3.50-5.10 | 3.80-4.98 | 3.79-3.82 | 4.96-4.99 |" },
]

