slug = "aptt"
name = "Activated partial thromboplastin time"
loinc = "3173-2"
category = "coagulation"
unit = "s"
description = "Clotting time of citrated plasma after a contact activator and calcium are added, reflecting the intrinsic and common pathways. Prolonged values suggest heparin effect, factor VIII, IX or XI deficiency, lupus anticoagulant or other factor deficits; it is the usual monitor of unfractionated heparin."

[[range]]
set = "parturient-coag-ri"
kind = "reference"
low = 22.9
high = 42.3
when = { pregnant = true }
population = "10,472 parturient women (women at delivery) in one laboratory, age-specific intervals pooled"
evidence = "reference-interval"
note = "Reference interval calculated per CLSI C28-A3 on an ACL TOP 700 analyser. Pooled across age groups."
citations = [
  { pmid = "30934105", doi = "10.1055/s-0039-1683932", title = "Age-Specific Reference Intervals for PT, aPTT, Fibrinogen and Thrombin Time for Parturient Women.", locator = "Abstract, Results", quote = "The RIs of PT, aPTT, FIB and TT were 8.7 to 12.1 seconds ... 22.9 to 42.3 seconds" },
]

