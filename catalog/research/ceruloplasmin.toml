slug = "ceruloplasmin"
name = "Ceruloplasmin"
category = "mineral"
unit = "mg/dL"
description = "Serum ceruloplasmin, the main copper-carrying protein. It is the first-line biochemical marker for Wilson disease, and it is also an acute-phase reactant that rises in inflammation and pregnancy and falls in liver disease. Interpret with copper, urinary copper and clinical findings, not alone."

[[range]]
set = "reference"
kind = "reference"
low = 20
high = 40
population = "Adults (general, unspecified)"
evidence = "textbook"
note = "Normal serum ceruloplasmin as stated in a narrative review of Wilson disease diagnosis. Assay-dependent; not a measured reference-interval study. A value of 20-40 mg/dL does not exclude Wilson disease."
citations = [
  { pmid = "37970614", doi = "10.4254/wjh.v15.i10.1109", title = "Challenges and dilemmas in pediatric hepatic Wilson's disease.", locator = "Diagnosis section (text)", quote = "The normal value of ceruloplasmin ranges between 20-40 mg/dL." },
]

