slug = "ceruloplasmin"
name = "Ceruloplasmin"
category = "trace-element"
unit = "mg/dL"
description = "Copper-carrying plasma protein (ferroxidase) measured by immunoassay. Low values support Wilson disease, but also occur with liver failure, malnutrition and some other conditions; high values are an acute-phase response."

