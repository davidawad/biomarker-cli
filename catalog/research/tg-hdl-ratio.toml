slug = "tg-hdl-ratio"
name = "Triglyceride to HDL-C Ratio"
category = "derived"
unit = "ratio"
description = "Fasting triglycerides divided by HDL cholesterol, both in mg/dL, used as a simple surrogate marker of insulin resistance. Cut-offs vary between studies and ethnic groups, and this ratio is not valid when the units are mixed."
aliases = ["TG/HDL ratio", "TG:HDL", "triglyceride/HDL-C"]

