slug = "tg-hdl-ratio"
name = "Triglyceride/HDL-C Ratio"
category = "lipid"
unit = "ratio"
description = "Ratio of fasting triglycerides to HDL cholesterol, used as a simple surrogate marker of insulin resistance and atherogenic dyslipidaemia. The numeric cut-off depends on the units of the two inputs (mg/dL-based or mmol/L-based ratios differ)."

[[range]]
set = "clinical"
kind = "warn"
low = 3.0
when = { method = "mg/dL-based" }
population = "Nondiabetic overweight adults (BMI 25 kg/m2 or greater) in a general clinical research center cohort"
evidence = "outcome-study"
note = "Optimal cut-point for identifying insulin resistance (top tertile of insulin-mediated glucose disposal), mg/dL-based ratio. Derived from a cross-sectional ROC analysis, not an outcome study. Equivalent to 1.8 in SI units (mmol/L-based)."
citations = [
  { pmid = "14623617", doi = "10.7326/0003-4819-139-10-200311180-00007", title = "Use of metabolic markers to identify overweight individuals who are insulin resistant.", locator = "Abstract (Results)", quote = "1.8 in SI units (3.0 in traditional units) for the triglyceride-high-density lipoprotein cholesterol ratio" },
]

[[range]]
set = "clinical"
kind = "warn"
low = 0.89
when = { method = "mmol/L-based", age_min = 13, age_max = 17, conditions = ["obesity"] }
population = "Adolescents aged 13-16 years with obesity"
evidence = "outcome-study"
note = "Youden-optimal cut-off for insulin resistance (HOMA-IR >= 4.0) in adolescents with obesity, mmol/L-based ratio. Cross-sectional ROC analysis in a single small sample (n = 215); not validated against outcomes and not a guideline threshold."
citations = [
  { pmid = "42650436", doi = "10.3390/children13081098", title = "Ratio That Reveals Risk: Defining TG:HDL-C Ratio Cutoff for Insulin Resistance in Adolescents with Obesity.", locator = "Abstract", quote = "The optimal TG:HDL-C ratio cutoff identified using the maximum Youden index was 0.89, with 62% sensitivity and 75% specificity." },
]

[[range]]
set = "tg-hdl-review-2024"
kind = "decision"
low = 3.5
population = "Overweight and obese adults, as cited in a 2024 review of the TG/HDL ratio"
evidence = "cohort-study"
note = "Insulin resistance cut-off of 3.5 (mg/dL units) as reported in the cited 2024 review. The review's sentence does not name the study year explicitly, so check the original McLaughlin paper before relying on the attribution."
citations = [
  { pmid = "39062066", doi = "10.3390/biomedicines12071493", title = "The Triglyceride/HDL Ratio as a Surrogate Biomarker for Insulin Resistance.", url = "https://pubmed.ncbi.nlm.nih.gov/39062066/", locator = "Introduction", quote = "the cutoff utilized this time was 3.5, which has been described as indicative of IR" },
]

[[range]]
set = "tg-hdl-review-2024"
kind = "decision"
low = 2.0
population = "Non-Hispanic Black adults (ethnicity-specific cut-off)"
evidence = "cohort-study"
note = "Ethnicity-specific cut-off for non-Hispanic Black adults (2.0). Non-Hispanic White and Mexican American adults used 3.0 in the same comparison, as reported in the cited review."
when = { ethnicity = "black" }
citations = [
  { pmid = "39062066", doi = "10.3390/biomedicines12071493", title = "The Triglyceride/HDL Ratio as a Surrogate Biomarker for Insulin Resistance.", url = "https://pubmed.ncbi.nlm.nih.gov/39062066/", locator = "Introduction", quote = "race/ethnicity-specific cutoff points of 3.0 for non-Hispanic whites and Mexican Americans and 2.0 for non-Hispanic blacks" },
]

[[range]]
set = "iraqi-adults-2023"
kind = "decision"
low = 3.1
population = "Healthy Iraqi adults (single study, ROC best cut-off against insulin resistance)"
evidence = "cohort-study"
note = "Study-derived best cut-off (Youden index) in one sample, not a guideline threshold. Sensitivity 83% and specificity 81%."
citations = [
  { pmid = "37520476", doi = "10.25122/jml-2022-0239", title = "Triglyceride/high-density lipoprotein ratio as a predictor for insulin resistance in a sample of healthy Iraqi adults.", url = "https://pubmed.ncbi.nlm.nih.gov/37520476/", locator = "Abstract, Results", quote = "The sensitivity and specificity of the test were 83% and 81%, respectively, at a best cut-off value of 3.1 (TG/HDL ratio)." },
]
