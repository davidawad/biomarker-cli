name = "Retinol (vitamin A)"
category = "vitamin"
unit = "µg/dL"
description = "Serum retinol, the circulating form of vitamin A, which reflects liver vitamin A stores when inflammation is absent. Low values indicate vitamin A deficiency, which causes night blindness and xerophthalmia and raises infection risk."

