[[range]]
set = "china-multicenter-pa-2026"
kind = "diagnostic"
low = 9.3
when = { method = "lc-ms/ms", test = "captopril challenge test, 2 h post-dose" }
population = "Chinese adults at high risk of primary aldosteronism at seven tertiary centres (117 PA, 354 essential hypertension)"
evidence = "outcome"
note = "ARR two hours after the captopril challenge, LC-MS/MS (sensitivity 61%, specificity 85%). Study-derived threshold; the 19.0 seated-saline cut-off is a separate range."
citations = [
  { pmid = "41633645", doi = "10.3760/cma.j.cn112138-20250721-00423", title = "[Establishing LC-MS/MS-based cutoffs for the confirmatory testing for primary aldosteronism: a prospective multi-center study].", url = "https://pubmed.ncbi.nlm.nih.gov/41633645/", locator = "Abstract, Results", quote = "At a diagnostic cutoff of PAC ≥5.7 ng/dl (158.1 pmol/L) or ARR ≥9.3 (ng/dl)/(ng·ml⁻¹·h⁻¹), sensitivity was 61% and specificity was 85%." },
]

[[range]]
