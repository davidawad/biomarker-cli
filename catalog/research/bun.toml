slug = "bun"
name = "Blood Urea Nitrogen"
loinc = "3094-0"
category = "kidney"
unit = "mg/dL"
description = "Blood urea nitrogen (BUN), a marker of kidney function and hydration status that also depends on protein intake and liver urea production. Age- and sex-specific reference intervals are reported in the source as urea in mmol/L."

