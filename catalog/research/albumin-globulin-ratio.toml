slug = "albumin-globulin-ratio"
name = "Albumin/Globulin Ratio"
category = "liver"
unit = "ratio"
description = "Ratio of serum albumin to calculated globulin. Low values are associated with higher mortality in dialysis and critically ill patients."

[[range]]
set = "reference"
kind = "reference"
low = 1.1
high = 1.8
when = { age_min = 18, sex = "male" }
population = "Healthy adult males (Gandaki Province, Nepal; dry-chemistry method)"
evidence = "reference-interval-study"
citations = [
  { pmid = "38722987", doi = "10.1371/journal.pgph.0001865", title = "Establishment of dry-chemistry-based reference intervals of routine liver function tests for the adult population of Gandaki Province, Nepal.", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11081272/", locator = "Results (sex-specific 95% RIs)", quote = "A/G ratio: 1.1-1.8 and 1.0-1.7" },
]

[[range]]
set = "reference"
kind = "reference"
low = 1.0
high = 1.7
when = { age_min = 18, sex = "female" }
population = "Healthy adult females (Gandaki Province, Nepal; dry-chemistry method)"
evidence = "reference-interval-study"
citations = [
  { pmid = "38722987", doi = "10.1371/journal.pgph.0001865", title = "Establishment of dry-chemistry-based reference intervals of routine liver function tests for the adult population of Gandaki Province, Nepal.", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11081272/", locator = "Results (sex-specific 95% RIs)", quote = "A/G ratio: 1.1-1.8 and 1.0-1.7" },
