[[range]]
set = "reference"
kind = "reference"
low = 1.0
high = 1.8
when = { age_min = 18 }
population = "Healthy adults (Gandaki Province, Nepal; dry-chemistry method), sexes combined"
evidence = "reference-interval-study"
citations = [
  { pmid = "38722987", doi = "10.1371/journal.pgph.0001865", title = "Establishment of dry-chemistry-based reference intervals of routine liver function tests for the adult population of Gandaki Province, Nepal.", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11081272/", locator = "Results (combined 95% RIs)", quote = "total protein: 6.8-8.9g/dL; albumin: 3.9-5.2 g/dL; globulin: 2.7-4.2g/dL; A/G ratio: 1.0-1.8" },
