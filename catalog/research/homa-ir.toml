[[range]]
set = "clinical"
kind = "warn"
low = 2.29
when = { fasting = true }
population = "Nondiabetic Caucasian rural adults with a standard 75 g OGTT (n=1156)"
evidence = "reference-interval-study"
note = "75th percentile of HOMA-IR used as the insulin resistance cut-off (HOMA1 formula per the abstract). Population-derived."
citations = [
  { pmid = "16804799", doi = "10.1055/s-2006-924233", title = "Insulin sensitivity indices: a proposal of cut-off points for simple identification of insulin-resistant subjects.", locator = "Abstract", quote = "The 75th percentile value as the cut-off point to define IR corresponded with a HOMA-IR of 2.29" },
]

[[range]]
set = "clinical"
kind = "warn"
low = 3.82
when = { sex = "female", conditions = ["obesity"], age_min = 5, age_max = 19, fasting = true }
population = "Obese girls aged 5-18 years in the pubertal period (OGTT-based ROC cut-off)"
evidence = "reference-interval-study"
note = "Pubertal status is not a when key; this range applies to the pubertal group only (see the companion prepubertal ranges). Population-derived."
citations = [
  { pmid = "21274322", doi = "10.4274/jcrpe.v2i3.100", title = "Insulin resistance in obese children and adolescents: HOMA-IR cut-off levels in the prepubertal and pubertal periods.", locator = "Abstract, Results", quote = "HOMA-IR cut-off values for insulin resistance in the prepubertal period were calculated to be 2.67 (sensitivity 88.2%, specificity 65.5%) in boys and 2.22 (sensitivity 100%, specificity 42.3%) in girls, and in the pubertal period, they were 5.22 (sensitivity 56%, specificity 93.3%) in boys and 3.82 (sensitivity 77.1%, specificity 71.4%) in girls." },
]

