slug = "homa-ir"
name = "HOMA-IR"
category = "derived"
unit = "index"
description = "Homeostasis model assessment of insulin resistance, calculated from fasting glucose and fasting insulin. Higher values indicate greater insulin resistance. Cut-offs vary by assay, HOMA version, sex, menopausal status and population, so the values below are population-specific rather than universal."
aliases = ["HOMA", "homeostasis model assessment of insulin resistance", "HOMA1-IR", "HOMA2-IR"]

[[range]]
set = "brams-2009"
kind = "decision"
low = 2.7
when = { fasting = true, method = "homa1-ir" }
population = "Brazilian adults in the Brazilian Metabolic Syndrome Study (westernised, admixed multi-ethnic population); cut-off set at the 90th percentile of the healthy group (n = 297)"
evidence = "validation-study"
note = "Insulin resistance cut-off for HOMA1-IR: above 2.7 (boundary > 2.7). The same study's metabolic syndrome cut-off for HOMA1-IR (> 2.3) is a different purpose and is not used here."
citations = [
  { pmid = "19466221", doi = "10.1590/s0004-27302009000200020", title = "HOMA1-IR and HOMA2-IR indexes in identifying insulin resistance and metabolic syndrome: Brazilian Metabolic Syndrome Study (BRAMS).", url = "https://pubmed.ncbi.nlm.nih.gov/19466221/", locator = "Abstract, Results", quote = "The cut-off values for IR were: HOMA1-IR > 2.7 and HOMA2-IR > 1.8" },
]

[[range]]
set = "brams-2009"
kind = "decision"
low = 1.8
when = { fasting = true, method = "homa2-ir" }
population = "Brazilian adults in the Brazilian Metabolic Syndrome Study (westernised, admixed multi-ethnic population); cut-off set at the 90th percentile of the healthy group (n = 297)"
evidence = "validation-study"
note = "Insulin resistance cut-off for HOMA2-IR: above 1.8 (boundary > 1.8). HOMA2 values are on a different scale from HOMA1 and must not be mixed with the 2.7 cut-off."
citations = [
  { pmid = "19466221", doi = "10.1590/s0004-27302009000200020", title = "HOMA1-IR and HOMA2-IR indexes in identifying insulin resistance and metabolic syndrome: Brazilian Metabolic Syndrome Study (BRAMS).", url = "https://pubmed.ncbi.nlm.nih.gov/19466221/", locator = "Abstract, Results", quote = "The cut-off values for IR were: HOMA1-IR > 2.7 and HOMA2-IR > 1.8" },
]

[[range]]
set = "knhanes-2016-homa-ir-cutoff"
kind = "decision"
low = 2.23
when = { fasting = true, sex = "male" }
population = "Korean adults from KNHANES 2008-2010; cut-offs derived against metabolic syndrome (ROC analysis)"
evidence = "validation-study"
note = "First ROC-derived HOMA-IR cut-off in Korean men: above 2.23 (boundary as published, >). The cut-off is tied to metabolic syndrome in this survey, so it is a population-specific marker rather than a universal insulin resistance threshold."
citations = [
  { pmid = "27128847", doi = "10.1371/journal.pone.0154593", title = "Insulin Resistance Distribution and Cut-Off Value in Koreans from the 2008-2010 Korean National Health and Nutrition Examination Survey.", url = "https://pubmed.ncbi.nlm.nih.gov/27128847/", locator = "Abstract, Results", quote = "The first cut-off values in men, premenopausal women, and postmenopausal women were 2.23 (sensitivity 70.6%, specificity 66.9%), 2.39 (sensitivity 72.3%, specificity 76.4%), and 2.48 (sensitivity 51.9%, specificity 80.2%), respectively." },
]

