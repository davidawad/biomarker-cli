[[range]]
set = "finrisk-fin-d2d-homa-ir-p95"
kind = "reference"
high = 2.0
when = { fasting = true }
population = "Healthy individuals in the FINRISK (n = 1167) and FIN-D2D (n = 459) cohorts in Finland"
evidence = "reference-interval-study"
note = "Upper 95th percentile of HOMA-IR in healthy Finnish adults: 2.0 (FIN-D2D) and 1.9 (FINRISK). A HOMA-IR of 2.0 measured in one laboratory corresponded to 1.3 to 2.1 in six other laboratories, so the limit is assay-dependent."
citations = [
  { pmid = "28660493", doi = "10.1007/s00125-017-4340-1", title = "Use of HOMA-IR to diagnose non-alcoholic fatty liver disease: a population-based and inter-laboratory study.", url = "https://pubmed.ncbi.nlm.nih.gov/28660493/", locator = "Abstract, Results", quote = "The upper 95th percentiles of HOMA-IR were 1.9 and 2.0 in healthy individuals in the FINRISK (n = 1167) and FIN-D2D (n = 459) cohorts." },
]

[[range]]
set = "qatar-biobank-2025-homa-ir"
kind = "decision"
low = 1.878
when = { fasting = true }
population = "Fasting adults from the Qatar Biobank (n = 7,875) classified as insulin sensitive (lean, non-diabetic, no hypertriglyceridaemia) versus type 2 diabetes"
evidence = "validation-study"
note = "Quartile-derived HOMA-IR cut-off for Qatari (Middle Eastern) adults: 1.878, from the quartile values in the insulin-sensitive group. Use as reported; the study compares several insulin resistance indices and recommends TyG as the most robust."
citations = [
  { pmid = "40421243", doi = "10.3389/fendo.2025.1591677", title = "Evaluating indices of insulin resistance and estimating the prevalence of insulin resistance in a large biobank cohort.", url = "https://pubmed.ncbi.nlm.nih.gov/40421243/", locator = "Abstract, Results", quote = "The cut-off for HOMA-IR was determined at 1.878" },
]

[[range]]
set = "pediatric-obesity-2026-homa-ir"
kind = "decision"
low = 4.22
when = { fasting = true, sex = "female" }
population = "Pubertal girls with obesity at a tertiary paediatric endocrinology centre (10-year retrospective study); cut-off predicts OGTT-defined insulin resistance"
evidence = "cohort-study"
note = "Pubertal girls with obesity: HOMA-IR cut-off 4.22 for OGTT-defined insulin resistance (boundary as published). Paediatric, obesity-specific; not applicable to adults."
citations = [
  { pmid = "42449312", doi = "10.1186/s12887-026-07183-w", title = "Diagnostic performance of insulin resistance indices and their association with metabolic outcomes in children with obesity: a 10-year retrospective study from a tertiary pediatric endocrinology center.", url = "https://pubmed.ncbi.nlm.nih.gov/42449312/", locator = "Abstract, Results", quote = "Among pubertal participants, the optimal HOMA-IR cut-off values for predicting OGTT-defined insulin resistance were 4.22 in girls and 4.18 in boys." },
]

