slug = "procalcitonin"
name = "Procalcitonin"
loinc = "33959-8"
category = "inflammation"
unit = "ng/mL"
description = "Precursor of calcitonin that rises markedly in systemic bacterial infection and sepsis, and falls as infection resolves. Used mainly to support decisions about starting or stopping antibiotics."
aliases = ["PCT", "PCT test"]

[[range]]
set = "pct-ed-algorithm-review-2019"
kind = "decision"
high = 0.1
unit = "µg/L"
population = "Adults with suspected community-acquired pneumonia in the emergency department (algorithm from a randomised trial, as summarised in a review)"
evidence = "outcome-study"
note = "Antibiotics strongly discouraged when PCT is below 0.1 ug/L (1 ug/L equals 1 ng/mL). Boundary < 0.1."
citations = [
  { pmid = "31803264", doi = "10.1183/20734735.0258-2019", title = "Procalcitonin in respiratory disease: use as a biomarker for diagnosis and guiding antibiotic therapy.", url = "https://pubmed.ncbi.nlm.nih.gov/31803264/", locator = "Section on antibiotic guidance, para describing trial algorithm", quote = "PCT <0.1 μg·L −1 strongly discouraged, PCT <0.25 μg·L −1 discouraged, PCT >0.25 μg·L −1 encouraged, PCT >0.5 μg·L −1 strongly encouraged" },
]

