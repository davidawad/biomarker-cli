[[range]]
set = "viability-meta-2022"
kind = "diagnostic"
low = 20
when = { pregnancy = true, trimester = 1, conditions = ["symptomatic-first-trimester"] }
population = "symptomatic first-trimester pregnant patients (pain or bleeding); 15,878 patients in the pooled studies"
evidence = "meta-analysis"
note = "Single serum progesterone at or above about 20 ng/mL (about 63.6 nmol/L) makes a viable pregnancy likely (NPV 0.89-0.99 across the prevalences reported in the review). Pregnancy-viability decision value, not a reference interval."
citations = [
  { pmid = "35921048", doi = "10.1007/s43678-022-00332-x", title = "Performance of single serum progesterone in the evaluation of symptomatic first-trimester pregnant patients: a systematic review and meta-analysis.", url = "https://pubmed.ncbi.nlm.nih.gov/35921048/", locator = "Abstract, Results", quote = "more than 90% of patients with a level ≥ 20-25 ng/mL (63.6-79.5 nmol/L) will have a viable pregnancy confirmed" },
]

[[range]]
set = "viability-meta-2022"
kind = "diagnostic"
high = 6.3
when = { pregnancy = true, trimester = 1, conditions = ["symptomatic-first-trimester"] }
population = "symptomatic first-trimester pregnant patients (pain or bleeding); 15,878 patients in the pooled studies"
evidence = "meta-analysis"
note = "Single serum progesterone below about 6.3 ng/mL (about 20 nmol/L) makes a non-viable pregnancy likely (specificity 99.2% in the review). Pregnancy-viability decision value, not a reference interval."
citations = [
  { pmid = "35921048", doi = "10.1007/s43678-022-00332-x", title = "Performance of single serum progesterone in the evaluation of symptomatic first-trimester pregnant patients: a systematic review and meta-analysis.", url = "https://pubmed.ncbi.nlm.nih.gov/35921048/", locator = "Abstract, Results", quote = "More than nine out of ten patients with a level < 6.3 ng/mL (< 20.034 nmol/L) will be diagnosed with a non-viable pregnancy" },
]

