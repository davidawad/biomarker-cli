note = "5th percentile for the whole luteal phase, not a mid-luteal-only threshold; the 95th percentile is 46.3 nmol/L. A value at or above 13.1 nmol/L is consistent with luteal activity after ovulation, but one value does not confirm ovulation or cycle day. Source unit nmol/L, not converted. Phase order in the source: follicular, ovulation, luteal."
