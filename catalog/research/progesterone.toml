slug = "progesterone"
name = "Progesterone"
category = "hormone"
unit = "ng/mL"
description = "Steroid produced mainly by the corpus luteum after ovulation and by the placenta in pregnancy. Used to judge cycle phase and ovulation, and as a single-value marker of early pregnancy viability. Values are cycle-phase and assay dependent."

