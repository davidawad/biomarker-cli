slug = "selenium"
name = "Selenium, Serum/Plasma"
category = "mineral"
unit = "µg/L"
description = "Serum or plasma selenium, the marker of selenium status used with selenoprotein P and glutathione peroxidase activity. Low status is linked to mortality, immune and cognitive outcomes, and high status is not automatically beneficial, so the U-shaped relation with status matters."

[[range]]
set = "reference"
kind = "reference"
low = 90
high = 125
population = "Healthy people (plasma or serum selenium), as described in a critical-care review"
evidence = "textbook"
note = "The source describes 90-125 ug/L as the normal physiologic range associated with maximal GPX3 activity (daily intake 55-70 ug). It is a narrative citation of earlier work, not a measured reference interval. Assay and selenoprotein P status are not stated."
citations = [
  { pmid = "33049573", doi = "10.1016/j.nut.2020.110989", title = "Pharmaconutrition revisited for critically ill patients with coronavirus disease 2019 (COVID-19): Does selenium have a place?", locator = "Discussion (selenium kinetics paragraph)", quote = "maximal activity of GPX3 is achieved at a daily intake of 55 to 70 ug (0.70-0.89 umol) selenium and is associated with a plasma selenium in the normal physiologic range of 90 to 125 ug/L" },
]

[[range]]
set = "clinical"
kind = "warn"
low = 120
population = "Adults (observational and dose-response data)"
evidence = "outcome-study"
note = "Blood selenium at or above 120 ug/L was associated with increased risk of type 2 diabetes in the source's pooled observational data. This is a risk signal from observational studies, not a treatment or toxicity limit."
citations = [
  { pmid = "37880477", doi = "10.1007/s12011-023-03900-z", title = "Selenium Species in Diabetes Mellitus Type 2.", locator = "Discussion (dose-response paragraph)", quote = "the increased risk of diabetes mellitus occurs when blood selenium concentration is equal to or greater than 120 ug/L" },
]
