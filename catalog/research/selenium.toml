slug = "selenium"
name = "Selenium, Serum/Plasma"
category = "mineral"
unit = "µg/L"
description = "Serum or plasma selenium, the marker of selenium status used with selenoprotein P and glutathione peroxidase activity. Low status is linked to mortality, immune and cognitive outcomes, and high status is not automatically beneficial, so the U-shaped relation with status matters."

[[range]]
set = "reference"
kind = "reference"
low = 90
high = 125
population = "Healthy people (plasma or serum selenium), as described in a critical-care review"
evidence = "textbook"
note = "The source describes 90-125 ug/L as the normal physiologic range associated with maximal GPX3 activity (daily intake 55-70 ug). It is a narrative citation of earlier work, not a measured reference interval. Assay and selenoprotein P status are not stated."
citations = [
  { pmid = "33049573", doi = "10.1016/j.nut.2020.110989", title = "Pharmaconutrition revisited for critically ill patients with coronavirus disease 2019 (COVID-19): Does selenium have a place?", locator = "Discussion (selenium kinetics paragraph)", quote = "maximal activity of GPX3 is achieved at a daily intake of 55 to 70 ug (0.70-0.89 umol) selenium and is associated with a plasma selenium in the normal physiologic range of 90 to 125 ug/L" },
]

[[range]]
set = "clinical"
kind = "warn"
low = 120
population = "Adults (observational and dose-response data)"
evidence = "outcome-study"
note = "Blood selenium at or above 120 ug/L was associated with increased risk of type 2 diabetes in the source's pooled observational data. This is a risk signal from observational studies, not a treatment or toxicity limit."
citations = [
  { pmid = "37880477", doi = "10.1007/s12011-023-03900-z", title = "Selenium Species in Diabetes Mellitus Type 2.", locator = "Discussion (dose-response paragraph)", quote = "the increased risk of diabetes mellitus occurs when blood selenium concentration is equal to or greater than 120 ug/L" },
]

[[range]]
set = "combs-2015"
kind = "optimal"
low = 50
high = 70
source_unit = "ng/mL"
source_factor = 1
when = { specimen = "plasma" }
population = "Adults in general; a review of selenium biomarkers based on plasma and selenoprotein data"
evidence = "review"
note = "Plasma selenium at which GPX3 and SEPP1 selenoprotein expression reaches its maximum (plateau). The same review also quotes a point value of about 80 ng/mL and gives no deficiency cut-off. Not a clinical reference interval."
citations = [
  { pmid = "25835046", doi = "10.3390/nu7042209", title = "Biomarkers of selenium status.", locator = "Section on plasma selenium and selenoproteins", quote = "Those selenoproteins show maximal expression at plasma Se concentrations of 50–70 ng/mL" },
]

[[range]]
set = "us-epa-2002"
kind = "toxic"
low = 1000
when = { specimen = "whole-blood" }
population = "Adults with selenium exposure; threshold taken from the US EPA (2002) value quoted in a 2020 review"
evidence = "guideline"
note = "Whole-blood selenium considered toxic. Value cited secondhand from a review (Rayman 2020); the primary EPA document was not retrieved."
citations = [
  { pmid = "31388899", doi = "10.1007/s42000-019-00125-5", title = "Selenium intake, status, and health: a complex relationship.", locator = "Section on mercury exposure in the Brazilian Amazon", quote = "concentrations considered toxic [blood Se: 1000 μg/L (US EPA 2002)]" },
]

[[range]]
set = "epic-reference-2020"
kind = "deficient"
high = 45.7
when = { specimen = "serum" }
population = "Adults with COVID-19 compared with the EPIC reference population (n=1915) for total serum selenium"
evidence = "outcome"
note = "Authors' low-status cut-off: below the 2.5th percentile of the EPIC reference population. It is a reference-derived lower limit, not a clinical deficiency cut-off. The same paper gives only mean and SD for the reference group."
citations = [
  { pmid = "32708526", doi = "10.3390/nu12072098", title = "Selenium Deficiency Is Associated with Mortality Risk from COVID-19.", locator = "Results, paragraph 1", quote = "A Se status below the 2.5th percentile of the reference population, i.e., [Se] < 45.7 µg/L" },
]
