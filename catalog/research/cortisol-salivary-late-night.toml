slug = "cortisol-salivary-late-night"
name = "Cortisol, Late-Night Salivary"
category = "adrenal"
unit = "ng/dL"
description = "Cortisol measured in saliva collected at bedtime or late evening. Loss of the normal circadian fall of cortisol makes it a sensitive screening test for Cushing's syndrome. Cut-offs differ widely by assay (immunoassay vs LC-MS/MS), so use the cut-off for your own method."

[[range]]
set = "lnsc-ecl-immunoassay-2023"
kind = "diagnostic"
low = 6.73
unit = "nmol/L"
when = { time_of_day = "late-night", specimen = "saliva", method = "electrochemiluminescence immunoassay", age_min = 18, age_max = 60, ethnicity = "south-asian" }
population = "155 healthy controls aged 18-60 years and 92 adults with endogenous Cushing syndrome (South-Asian population)"
evidence = "outcome"
note = "Cut-off for second-generation Elecsys cortisol II immunoassay (sensitivity 97.8%, specificity 94.8%). Samples collected at home."
citations = [
  { pmid = "37052382", doi = "10.1111/cen.14920", title = "Late-night salivary cortisol cut-offs for diagnosis of Cushing syndrome using second-generation electrochemiluminescence immunoassay kits.", url = "https://pubmed.ncbi.nlm.nih.gov/37052382/", locator = "Abstract, Conclusions", quote = "Based on this study, we propose a LNSC cutoff ≥6.73 nmol/L to diagnose CS." },
]

[[range]]
set = "lnsc-chemiluminescence-2021"
kind = "diagnostic"
low = 10.1
unit = "nmol/L"
when = { time_of_day = "late-night", specimen = "saliva", method = "chemiluminescence immunoassay" }
population = "217 patients prospectively evaluated for suspected hypercortisolism (36 with hypercortisolism, 149 negative controls, 32 in remission)"
evidence = "outcome"
note = "ROC-derived cut-off for hypercortisolism with an automated chemiluminescence immunoassay (sensitivity 94%, specificity 84%). The source reports slightly lower thresholds for obesity (9.1), hypertension or adrenal tumours (9.8), and pituitary adenomas (9.5)."
citations = [
  { pmid = "34607366", doi = "10.1055/a-1608-1720", title = "Distinct Late-Night Salivary Cortisol Cut-Off Values for the Diagnosis of Hypercortisolism.", url = "https://pubmed.ncbi.nlm.nih.gov/34607366/", locator = "Abstract, Results", quote = "The calculated cut-off value for the diagnosis of hypercortisolism was 10.1 nmol/l (sensitivity 94%; specificity 84%)." },
]

