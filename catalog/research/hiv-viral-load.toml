slug = "hiv-viral-load"
name = "HIV-1 RNA (Viral Load)"
loinc = "20447-9"
category = "infectious"
unit = "copies/mL"
description = "Amount of HIV-1 RNA in plasma. It is the main measure of HIV treatment response; the goal of antiretroviral therapy is to keep it below the assay threshold for suppression."
aliases = ["HIV viral load", "HIV-1 RNA PCR", "HIV RNA"]

[[range]]
set = "jama-2016-serodifferent-couples"
kind = "decision"
high = 200
population = "People with HIV on suppressive antiretroviral therapy in serodifferent couples (Undetectable = Untransmittable, U=U)"
evidence = "cohort-study"
when = { conditions = ["hiv"] }
note = "U=U threshold: HIV-1 RNA strictly less than 200 copies/mL (boundary <200; 200 itself is not included)."
citations = [
  { pmid = "27404185", doi = "10.1001/jama.2016.5148", title = "Sexual Activity Without Condoms and Risk of HIV Transmission in Serodifferent Couples When the HIV-Positive Partner Is Using Suppressive Antiretroviral Therapy.", url = "https://pubmed.ncbi.nlm.nih.gov/27404185/", locator = "Abstract, Objective", quote = "when the HIV-positive partner had HIV-1 RNA load less than 200 copies/mL" },
]

[[range]]
set = "ias-usa-2020"
kind = "warn"
low = 50
population = "Adults with HIV receiving antiretroviral therapy"
evidence = "guideline"
when = { conditions = ["hiv"] }
note = "Warning band: after previous suppression, an HIV RNA above 50 copies/mL (boundary >50) should prompt a repeat test and a review of adherence and tolerability."
citations = [
  { pmid = "33052386", doi = "10.1001/jama.2020.17025", title = "Antiretroviral Drugs for Treatment and Prevention of HIV Infection in Adults: 2020 Recommendations of the International Antiviral Society-USA Panel.", url = "https://pubmed.ncbi.nlm.nih.gov/33052386/", locator = "Section: monitoring after viral suppression", quote = "If an HIV RNA level above 50 copies/mL is detected after a patient previously had viral suppression" },
]

[[range]]
set = "ias-usa-2020"
kind = "decision"
low = 200
population = "Adults with HIV receiving antiretroviral therapy"
evidence = "guideline"
when = { conditions = ["hiv"] }
note = "Virological failure: a confirmed HIV RNA strictly above 200 copies/mL on 2 consecutive measurements (boundary >200). Values of 200 or below are not failure by this definition."
citations = [
  { pmid = "33052386", doi = "10.1001/jama.2020.17025", title = "Antiretroviral Drugs for Treatment and Prevention of HIV Infection in Adults: 2020 Recommendations of the International Antiviral Society-USA Panel.", url = "https://pubmed.ncbi.nlm.nih.gov/33052386/", locator = "Full text, Virological failure definition", quote = "virological failure is defined as a confirmed HIV RNA level above 200 copies/mL on 2 consecutive measurements" },
]
