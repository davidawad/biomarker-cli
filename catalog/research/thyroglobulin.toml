[[range]]
set = "kta-2026-dtc-followup"
kind = "diagnostic"
high = 0.2
when = { test = "TSH-unstimulated serum Tg", conditions = ["total-thyroidectomy-with-rai"] }
population = "Adults with differentiated thyroid cancer after total thyroidectomy and radioiodine (RAI) therapy"
evidence = "guideline"
note = "Excellent response threshold (unstimulated, on TSH suppression) as stated by the Korean Thyroid Association 2026 guideline; requires negative TgAb and no structural disease."
citations = [
  { pmid = "42705671", doi = "10.3803/EnM.2026.3149", title = "Korean Thyroid Association Guidelines on the Management of Differentiated Thyroid Cancers, Part II: Follow-up Surveillance after Initial Treatment 2026.", url = "https://pubmed.ncbi.nlm.nih.gov/42705671/", locator = "Table II.1 / Recommendations", quote = "In patients who underwent total thyroidectomy and RAI therapy, excellent response is defined as the absence of structural or functional evidence of disease, together with a TSH-unstimulated serum Tg <0.2 ng/mL or TSH-stimulated serum Tg <1.0 ng/mL, and negative serum TgAb" },
]

