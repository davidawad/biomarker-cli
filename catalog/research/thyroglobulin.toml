slug = "thyroglobulin"
name = "Thyroglobulin"
category = "thyroid"
unit = "ng/mL"
description = "Protein made only by thyroid follicular cells; a tumour marker after thyroid cancer treatment. Healthy values depend on the assay, and post-thyroidectomy thresholds depend on whether radioiodine ablation was given and whether TSH was suppressed or stimulated."

[[range]]
set = "liaison-tg-healthy-cohort-2021"
kind = "reference"
high = 37.93
when = { sex = "female" }
population = "Healthy adults without thyroid abnormalities (cohort A, 99 women, nuclear medicine practice, Germany)"
evidence = "reference-interval"
note = "Upper reference limit (CLSI C28-A3c) for the LIAISON Tg II Gen immunoassay; assay dependent, not transferable to other platforms."
citations = [
  { pmid = "34386567", doi = "10.1016/j.plabm.2021.e00250", title = "Evaluation of a new automated assay for high-sensitivity thyroglobulin measurement and comparison with two established high-sensitivity thyroglobulin assays.", url = "https://pubmed.ncbi.nlm.nih.gov/34386567/", locator = "Results", quote = "Reference intervals of healthy subjects (cohort A) were calculated up to 37.93 ng/ml (90% confidence interval (CI) for the upper value: 36.44–39.67 ng/ml) for women and up to 24.59 ng/ml (23.07–26.10 ng/ml) for men with the LIAISON® Tg II Gen assay." },
]

