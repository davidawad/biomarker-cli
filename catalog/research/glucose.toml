slug = "glucose"
name = "Glucose"
loinc = "2345-7"
category = "glycemic"
unit = "mg/dL"
description = "Plasma glucose, usually fasting, used to screen for and diagnose prediabetes, diabetes and gestational diabetes, and to detect hypoglycaemia. Thresholds differ between ADA, WHO, IADPSG and NICE, so the source and population matter."

[[range]]
set = "clinical"
kind = "warn"
low = 100
high = 125
when = { fasting = true }
population = "Adults without a previous diabetes diagnosis"
evidence = "guideline"
note = "Impaired fasting glucose (prediabetes) by ADA criteria."
citations = [
  { pmid = "41928882", doi = "10.3389/fendo.2026.1789777", title = "The impact of glucose and metabolic disturbances on white matter hyperintensity volume in apparently healthy adults.", locator = "Table 1", quote = "No previous diabetes diagnosis and fasting glucose between 100 and 125 mg/dL or 2 h post glucose load between 140 and 199 mg/dL or glycated hemoglobin between 5.7% and 6.4%" },
]

[[range]]
set = "clinical"
kind = "warn"
low = 110
high = 125
when = { fasting = true }
population = "Adults without a previous diabetes diagnosis"
evidence = "guideline"
note = "Impaired fasting glucose by WHO criteria (ADA uses 100-125 mg/dL)."
citations = [
  { pmid = "41598648", doi = "10.3390/jcm15020710", title = "Should Prediabetes Be Classified as a Treatable Disease?", locator = "Section 3 (Definition of Prediabetes)", quote = "the ADA criteria is 100-125 mg/dL (5.6-6.9 mmol/L) and the WHO criteria is 110-125 mg/dL (6.1-6.9 mmol/L)" },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 126
when = { fasting = true }
population = "Adults"
evidence = "guideline"
note = "Diabetes by fasting plasma glucose (ADA); confirm on a second day unless unequivocal symptoms."
citations = [
  { pmid = "41928882", doi = "10.3389/fendo.2026.1789777", title = "The impact of glucose and metabolic disturbances on white matter hyperintensity volume in apparently healthy adults.", locator = "Table 1", quote = "Fasting glucose >= 126 mg/dL in two measurements in two different days * or 2 h post glucose load >= 200 mg/dL or glycated hemoglobin >= 6.5%" },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 92
when = { pregnant = true, fasting = true }
population = "Pregnant women, 75 g OGTT (IADPSG criteria)"
evidence = "consensus"
note = "Gestational diabetes if any one OGTT value meets or exceeds the threshold (IADPSG 2010)."
citations = [
  { pmid = "20190296", doi = "10.2337/dc09-1848", title = "International association of diabetes and pregnancy study groups recommendations on the diagnosis and classification of hyperglycemia in pregnancy.", locator = "Threshold table (consensus thresholds)", quote = "| FPG | 5.1 | 92 | 8.3" },
]

[[range]]
set = "clinical"
kind = "diagnostic"
low = 5.6
unit = "mmol/L"
when = { pregnant = true, fasting = true }
population = "Pregnant women"
evidence = "guideline"
note = "Gestational diabetes by NICE: fasting glucose at or above this value at diagnosis."
citations = [
  { url = "https://www.nice.org.uk/guidance/ng3/chapter/recommendations", locator = "Recommendation 1.2.8", quote = "a fasting plasma glucose level of 5.6 mmol/litre or above or" },
]

[[range]]
set = "clinical"
kind = "target"
high = 5.3
unit = "mmol/L"
when = { pregnant = true, fasting = true, conditions = ["diabetes"] }
population = "Pregnant women with pre-existing diabetes"
evidence = "guideline"
note = "Pregnancy capillary glucose target (fasting), if achievable without problematic hypoglycaemia."
citations = [
  { url = "https://www.nice.org.uk/guidance/ng3/chapter/recommendations", locator = "Recommendation 1.3.5", quote = "fasting: 5.3 mmol/litre and" },
]

[[range]]
set = "optimal"
kind = "optimal"
low = 70
high = 100
when = { fasting = true }
population = "Adults in prospective cohorts (individual-participant data, 97 studies)"
evidence = "outcome-study"
note = "Fasting glucose 70-100 mg/dL was not associated with excess cause-specific death; levels above 100 were. Derived from the ERFC pooled cohort analysis."
citations = [
  { pmid = "21366474", doi = "10.1056/NEJMoa1008862", title = "Diabetes mellitus, fasting glucose, and risk of cause-specific death.", locator = "Abstract (Results)", quote = "Fasting glucose levels exceeding 100 mg per deciliter (5.6 mmol per liter), but not levels of 70 to 100 mg per deciliter (3.9 to 5.6 mmol per liter), were associated with death." },
]

[[range]]
set = "clinical"
kind = "warn"
low = 54
high = 70
population = "People with diabetes (CGM consensus definition)"
evidence = "consensus"
note = "Level 1 hypoglycaemia: glucose below 70 mg/dL, 54-69 mg/dL band. Consensus thresholds apply to CGM and plasma glucose monitoring."
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table 1 (CGM metrics)", quote = "9. Time below range (TBR): % of readings and time 54-69 mg/dL (3.0-3.8 mmol/L) | Level 1 ... 9. Time <70 mg/dL (<3.9 mmol/L)" },
]

[[range]]
set = "clinical"
kind = "critical"
high = 54
population = "People with diabetes (CGM consensus definition)"
evidence = "consensus"
note = "Level 2 (clinically significant) hypoglycaemia: strictly below 54 mg/dL."
citations = [
  { pmid = "31177185", doi = "10.2337/dci19-0028", title = "Clinical Targets for Continuous Glucose Monitoring Data Interpretation: Recommendations From the International Consensus on Time in Range.", locator = "Table 1 (CGM metrics)", quote = "10. Time below range (TBR): % of readings and time <54 mg/dL (<3.0 mmol/L) | Level 2" },
]

