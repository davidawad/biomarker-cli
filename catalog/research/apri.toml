slug = "apri"
name = "AST to Platelet Ratio Index"
category = "derived"
unit = "index"
description = "APRI is a simple serum score calculated from the AST level and platelet count. It is used as a low-cost, non-invasive estimate of liver fibrosis and cirrhosis, mainly in chronic hepatitis B and C."
aliases = ["APRi", "AST-to-platelet ratio index", "AST/PLT ratio"]

[[range]]
set = "who-2024-hbv-apri"
kind = "decision"
low = 0.5
population = "Adults with chronic hepatitis B; thresholds from the WHO 2024 hepatitis B guidelines"
evidence = "guideline"
note = "Significant fibrosis (F2 or above) threshold: APRI greater than 0.5 (boundary > 0.5), used with or without HBV DNA or ALT levels to decide on treatment. Quoted from the WHO 2024 guideline text extract. Hepatitis C thresholds were not retrieved."
citations = [
  { pmid = "39391287", doi = "10.1097/ID9.0000000000000128", title = "Guidelines for the Prevention, Diagnosis, Care and Treatment for People with Chronic Hepatitis B Infection (Text Extract): Executive Summary.", url = "https://pubmed.ncbi.nlm.nih.gov/39391287/", locator = "Full text, treatment recommendations", quote = "APRI score > 0.5 or transient elastography (if available) >7 KPa" },
]

