low = 1
population = "Adults with chronic hepatitis B; thresholds from the WHO 2024 hepatitis B guidelines"
evidence = "guideline"
note = "Cirrhosis (F4) threshold: APRI greater than 1 (boundary > 1), as reproduced in a 2025 paper quoting the WHO 2024 wording. The source paper is about LLM treatment recommendations, so this is a secondary reproduction of the guideline text. A supporting meta-analysis (PMID 39983746) gives the same cut-off (greater than 1.0) but its quote uses a decimal-comma style that the checker cannot match."
citations = [
