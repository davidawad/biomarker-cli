slug = "estradiol"
name = "Estradiol"
loinc = "2243-4"
category = "hormone"
unit = "pg/mL"
description = "Most potent estrogen; reflects ovarian follicular and luteal activity in women and testicular and adrenal sources in men. Interpretation depends strongly on cycle phase, menopausal status, age and assay method (LC-MS/MS preferred at low concentrations)."

