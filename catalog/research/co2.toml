population = "Adults with chronic kidney disease"
evidence = "guideline"
note = "KDIGO 2024: in people with CKD, consider pharmacological treatment (with or without diet) to prevent acidosis when bicarbonate is below 18 mmol/L. Monitor so that bicarbonate does not exceed the upper limit of normal."
