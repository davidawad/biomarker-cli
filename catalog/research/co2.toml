  { pmid = "23348878", doi = "10.1093/ndt/gfs609", title = "Serum bicarbonate and mortality in adults in NHANES III.", locator = "Results", quote = "the hazards of death in the <22 mM serum bicarbonate category were 1.75 (95% CI: 1.12-2.74), 1.56 (95% CI: 0.78-3.09) and 2.56 (95% CI: 1.49-4.38) in the entire population, non-CKD subgroup and CKD subgroup" },
]

