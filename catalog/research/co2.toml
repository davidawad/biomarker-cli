slug = "co2"
name = "Carbon Dioxide (Bicarbonate)"
loinc = "2028-9"
category = "electrolyte"
unit = "mmol/L"
description = "Serum bicarbonate (total CO2) reflects the metabolic component of acid-base balance. In CKD, low bicarbonate is common and associated with worse outcomes, and KDIGO recommends considering treatment of acidosis when bicarbonate falls below 18 mmol/L."

[[range]]
set = "reference"
kind = "reference"
low = 18
high = 37
population = "Healthy elderly adults (Asmara, Eritrea; CLSI C28-A3 reference interval study)"
evidence = "reference-interval-study"
note = "Reference interval for healthy elderly Eritrean adults (combined sexes, 2.5th-97.5th percentile). Broader than typical adult intervals; use with care."
citations = [
  { pmid = "29258577", doi = "10.1186/s13104-017-3087-6", title = "Biochemistry reference intervals for healthy elderly population in Asmara, Eritrea.", locator = "Table 1", quote = "| Carbon dioxide (CO2) (mmol/L) | Combined | 238 | 26.0 | 25-27 | 25.0 | 11-58.0 | 18-37.0 |" },
]

[[range]]
set = "clinical"
kind = "warn"
high = 18
when = { conditions = ["ckd"] }
population = "Adults with chronic kidney disease"
evidence = "guideline"
note = "KDIGO 2024: in people with CKD, consider pharmacological treatment (with or without diet) to prevent acidosis when bicarbonate is below 18 mmol/L. Monitor so that bicarbonate does not exceed the upper limit of normal."
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", locator = "Practice Point 3.10.1", quote = "bicarbonate <18 mmol/l in adults" },
]

