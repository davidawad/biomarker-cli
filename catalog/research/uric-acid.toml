slug = "uric-acid"
name = "Uric Acid"
loinc = "3084-1"
category = "chemistry"
unit = "mg/dL"
description = "Serum urate. Hyperuricaemia is the main risk factor for gout; treat-to-target urate-lowering therapy aims for a serum urate below 6 mg/dL in people with gout. Reference intervals are sex-specific."

[[range]]
set = "reference"
kind = "reference"
low = 2.8
high = 7.9
when = { sex = "male", age_min = 18, age_max = 65 }
population = "Adults aged 18 to 65 years, apparently healthy Egyptian volunteers (IFCC C-RIDL protocol, parametric method); males"
evidence = "reference-interval-study"
note = "Values in mg/dL as stated in the source table (the source gives the matching umol/L limits as 168-479). Male RI is not age-partitioned in the source."
citations = [
  { pmid = "33740794", doi = "10.1371/journal.pone.0236772", title = "Establishment of reference intervals of clinical chemistry analytes for the adult population in Egypt.", locator = "Table 3", quote = "| UA | umol/L | (-) | M | 18~65 | 289 | 149 | 188 | 168 | 326 | 479 | 463 | 495 | mg/dL | 2.8 | 5.4 | 7.9" },
]

