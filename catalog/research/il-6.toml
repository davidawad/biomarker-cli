  { pmid = "42210961", doi = "10.3389/fmed.2026.1789886", title = "Establishment of reference intervals for plasma IL-6, IL-8, IL-10, and IL-1β in healthy adults from Lianyungang, Jiangsu, China: a single-center flow cytometry analysis.", url = "https://pubmed.ncbi.nlm.nih.gov/42210961/", locator = "Abstract, Results", quote = "IL-6 ≤ 2.23 pg/mL (90% CI: 2.18-2.27 pg/mL)" },
