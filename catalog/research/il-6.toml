loinc = "26881-3"
category = "inflammation"
unit = "pg/mL"
description = "Pro-inflammatory cytokine released by immune and other cells in response to infection, injury and tissue stress. Circulating levels rise quickly in acute inflammation and sepsis; it is mainly used in research and specialist settings."
