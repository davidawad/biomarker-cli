kind = "warn"
low = 348.92
when = { setting = "sepsis" }
population = "Adults with sepsis and septic shock (Sepsis-3), prospective controlled study"
evidence = "cohort-study"
note = "Single-study Youden cut-off for 28-day mortality: IL-6 at or above 348.92 pg/mL (boundary >=). Not externally validated; cut-offs in other sepsis cohorts differ (see the 135.14 pg/mL range)."
citations = [
  { pmid = "31718563", doi = "10.1186/s12879-019-4618-7", title = "Diagnostic and prognostic value of interleukin-6, pentraxin 3, and procalcitonin levels among sepsis and septic shock patients: a prospective controlled study according to the Sepsis-3 definitions.", url = "https://pubmed.ncbi.nlm.nih.gov/31718563/", locator = "Abstract, Results", quote = "Twenty-eight-day mortality was significantly higher in the group with high IL-6 (≥ 348.92 pg/mL)" },
]

