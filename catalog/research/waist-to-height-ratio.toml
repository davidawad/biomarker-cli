low = 0.6
population = "Adults (NICE guidance for England, based on the committee's review of the evidence)"
evidence = "guideline"
note = "NICE rationale: a value of 0.6 or more indicates a further increase in risk. The NICE text uses 'further increase in risk' rather than the word 'high', so this is the top band by wording. NICE also notes that WHtR may add little for people with BMI over 35 kg/m2, who are likely to have a high ratio anyway."
citations = [
