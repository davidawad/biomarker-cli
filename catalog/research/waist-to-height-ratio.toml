evidence = "guideline"
note = "Increased health risk band per NICE. Lower bound 0.5 inclusive, upper bound 0.59 inclusive as written in the quote ('0.5 to 0.59'). Applied in conjunction with BMI for adults with BMI under 35 kg/m2, per the same rationale section."
citations = [
  { url = "https://www.nice.org.uk/guidance/ng246/chapter/rationale-and-impact", title = "Overweight and obesity management", locator = "Rationale and impact, waist-to-height ratio section", quote = "a range of 0.5 to 0.59 corresponds to increased health risks" },
]

