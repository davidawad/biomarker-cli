slug = "fibrinogen"
name = "Fibrinogen"
loinc = "3255-7"
category = "coagulation"
unit = "g/L"
description = "Clottable plasma protein that forms the fibrin clot, measured functionally (Clauss method). Low levels indicate consumption, dilution or reduced synthesis and raise bleeding risk; levels rise physiologically in pregnancy and are an acute-phase reactant."

[[range]]
set = "burkina-faso-donor-ri"
kind = "reference"
low = 2.04
high = 3.83
when = { sex = "female" }
population = "140 healthy female blood donors at a transfusion centre in Ouagadougou, Burkina Faso (CLSI C28-A3)"
evidence = "reference-interval"
note = "Central 95 percentile method, as stated in the abstract. Local population; not separated by age in the abstract."
citations = [
  { pmid = "37987309", doi = "10.1684/abc.2023.1835", title = "Establishment of reference values for prothrombin time, activated partial thromboplastin time and fibrinogen in adults in Burkina Faso.", locator = "Abstract, Results", quote = "[2.04-3.83] g/L for females" },
]

