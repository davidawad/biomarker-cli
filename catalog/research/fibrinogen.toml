slug = "fibrinogen"
name = "Fibrinogen"
loinc = "3255-7"
category = "coagulation"
unit = "g/L"
description = "Clottable plasma protein that forms the fibrin clot, measured functionally (Clauss method). Low levels indicate consumption, dilution or reduced synthesis and raise bleeding risk; levels rise physiologically in pregnancy and are an acute-phase reactant."

