[[range]]
set = "abpa-review-2026"
kind = "decision"
low = 500
unit = "IU/mL"
population = "Patients with asthma evaluated for allergic bronchopulmonary aspergillosis (ABPA)"
evidence = "consensus"
note = "Diagnostic criterion for ABPA: total IgE at or above 500 IU/mL (rule-in, together with fungal sensitisation and other features). The same review also says a level above 500 IU/mL is considered positive, and that lower levels may be acceptable with other supportive features. Cited as a summary of guideline criteria; the primary ISHAM document was not retrieved."
citations = [
  { pmid = "41835114", doi = "10.2147/JIR.S546322", title = "Asthma and Allergic Bronchopulmonary Aspergillosis: Understanding, Insights, and State-of-the-Art.", url = "https://pubmed.ncbi.nlm.nih.gov/41835114/", locator = "Full text, ABPA diagnosis section", quote = "The diagnosis of ABPA requires evidence of fungal sensitization (positive AfIgE) and immunological disease activity (total IgE ≥ 500 IU/mL)" },
]

