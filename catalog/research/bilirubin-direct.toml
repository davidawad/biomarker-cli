slug = "bilirubin-direct"
name = "Bilirubin, Direct (Conjugated)"
category = "liver"
unit = "mg/dL"
description = "Conjugated (direct) serum bilirubin. Used with total bilirubin to separate conjugated from unconjugated hyperbilirubinaemia; elevated direct bilirubin in infancy warrants cholestasis evaluation."

