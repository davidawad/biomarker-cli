slug = "uacr"
name = "Urine Albumin/Creatinine Ratio"
category = "kidney"
unit = "mg/g"
description = "Urinary albumin-to-creatinine ratio on a spot urine sample. Staging marker for albuminuria (categories A1-A3) in chronic kidney disease, and a continuous marker of kidney and cardiovascular risk."

[[range]]
set = "clinical"
kind = "reference"
high = 30
when = { specimen = "spot-urine" }
population = "Adults and children with or at risk of CKD (persistent albuminuria categories)"
evidence = "guideline"
note = "KDIGO albuminuria category A1 (normal to mildly increased), strictly below 30 mg/g."
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", title = "KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD", locator = "Table 3 | Albuminuria categories in chronic kidney disease", quote = "A1 <30 <3 <30 Normal to mildly increased" },
]

[[range]]
set = "clinical"
kind = "warn"
low = 30
high = 300
when = { specimen = "spot-urine" }
population = "Adults and children with or at risk of CKD (persistent albuminuria categories)"
evidence = "guideline"
note = "KDIGO albuminuria category A2 (moderately increased), 30 to 300 mg/g inclusive. A3 starts strictly above 300 mg/g."
citations = [
  { url = "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf", title = "KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD", locator = "Table 3 | Albuminuria categories in chronic kidney disease", quote = "A2 30-300 3-30 30-300 Moderately increased" },
]

