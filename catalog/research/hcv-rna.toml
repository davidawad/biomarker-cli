  { pmid = "31816111", doi = "10.1002/hep.31060", title = "Hepatitis C Guidance 2019 Update: American Association for the Study of Liver Diseases-Infectious Diseases Society of America Recommendations for Testing, Managing, and Treating Hepatitis C Virus Infection.", url = "https://pubmed.ncbi.nlm.nih.gov/31816111/", locator = "Full text, SVR section", quote = "Undetectable HCV RNA represents SVR and virologic cure." },
