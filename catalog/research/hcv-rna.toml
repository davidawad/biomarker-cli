slug = "hcv-rna"
name = "Hepatitis C Virus RNA"
loinc = "11011-4"
category = "infectious"
unit = "IU/mL"
description = "Amount of hepatitis C virus RNA in blood. Used to diagnose active infection and to confirm cure: undetectable HCV RNA about 12 weeks after completing treatment is sustained virologic response (SVR), which is treated as virologic cure."
aliases = ["HCV RNA", "HCV viral load", "hepatitis C viral load"]

[[range]]
set = "aasld-idsa-2019-hcv"
kind = "decision"
high = 25
population = "Adults with chronic hepatitis C, tested for treatment response or SVR"
evidence = "guideline"
note = "Assay requirement, not a treatment-outcome cut-off: the guidance asks for an HCV RNA assay with a detection level of 25 IU/mL or lower (boundary <=25) so that undetectable results can be reported. The guidance gives no 15 IU/mL value. SVR is undetectable HCV RNA 12 or more weeks after completing DAA therapy."
citations = [
