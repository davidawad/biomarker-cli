slug = "blood-lead"
name = "Lead, Blood"
category = "pediatric"
unit = "µg/dL"
description = "Concentration of lead in whole blood, the main biomarker of childhood lead exposure. Results are compared with the CDC blood lead reference value to decide when to act on an elevated level."

[[range]]
set = "cdc-blrv-2021"
kind = "reference"
high = 3.5
when = { age_min = 1, age_max = 5, specimen = "blood" }
population = "US children aged 1-5 years; CDC blood lead reference value based on the 97.5th percentile of NHANES children's blood lead levels"
evidence = "review"
note = "CDC blood lead reference value (BLRV), lowered from 5 µg/dL in 2021. Values at or above 3.5 µg/dL flag a child for follow-up. The cited sentence does not state unambiguously which NHANES survey period matches which threshold. The BLRV is a population-based reference value, not a toxicity limit."
citations = [
  { pmid = "40434772", doi = "10.1001/jamanetworkopen.2025.12796", title = "Early-Life Low Lead Levels and Academic Achievement in Childhood and Adolescence.", url = "https://pubmed.ncbi.nlm.nih.gov/40434772/", locator = "Introduction", quote = "In 2021, the CDC lowered the threshold from 5 μg/dL or higher, which was in effect from 2012 to 2021, to 3.5 μg/dL or higher; these thresholds represent the 97.5th percentiles in 2015 through 2018 and 2007 through 2010 samples, respectively." },
  { pmid = "40434772", doi = "10.1001/jamanetworkopen.2025.12796", title = "Early-Life Low Lead Levels and Academic Achievement in Childhood and Adolescence.", url = "https://pubmed.ncbi.nlm.nih.gov/40434772/", locator = "Introduction", quote = "the mean lead blood level among children aged 1 to 5 years in the US declined from 15.2 to 0.83 μg/dL" },
]
