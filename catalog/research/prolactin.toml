[[range]]
set = "pcos-prolactinoma-threshold-2018"
kind = "diagnostic"
low = 85.2
when = { sex = "female", conditions = ["pcos"] }
population = "Women with PCOS and hyperprolactinaemia, retrospective case-control (n=528 PCOS women, 60 with elevated PRL)"
evidence = "outcome"
note = "ROC threshold for prolactinoma (MRI-confirmed) among hyperprolactinaemic PCOS women: 77% sensitivity, 100% specificity. Values above this favour pituitary imaging. Single-centre, small case count."
citations = [
  { pmid = "29845629", doi = "10.1111/eci.12961", title = "The value of prolactin in predicting prolactinοma in hyperprolactinaemic polycystic ovarian syndrome.", url = "https://pubmed.ncbi.nlm.nih.gov/29845629/", locator = "Abstract, Conclusions", quote = "PRL levels exceeding 85.2 ng/mL are highly suggestive of a prolactinoma warranting pituitary imaging." },
]

[[range]]
