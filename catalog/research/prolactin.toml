kind = "diagnostic"
low = 52.9
when = { sex = "female", conditions = ["pcos"] }
population = "Women with PCOS referred to a neurosurgical centre, retrospective study, 2009-2020 (657 PCOS patients)"
evidence = "outcome"
note = "ROC cut-off for detecting a pituitary adenoma in hyperprolactinaemic PCOS patients; PRL at or above this value warrants sella MRI. Differs from the 85.2 ng/mL value in a different cohort, so use with caution."
citations = [
  { pmid = "37057215", doi = "10.7150/ijms.80891", title = "What is the optimal prolactin cutoff for predicting the presence of a pituitary adenoma in patients with polycystic ovary syndrome?", url = "https://pubmed.ncbi.nlm.nih.gov/37057215/", locator = "Abstract, Results", quote = "PCOS patients with a PRL level of ≥ 52.9 ng/mL may need to undergo sella MRI for detecting PAs." },
]

[[range]]
set = "endocrine-review-hyperprolactinaemia-2018"
kind = "diagnostic"
low = 250
when = {}
population = "Patients with hyperprolactinaemia; overview by the Neuroendocrinology Department of the Brazilian Society of Endocrinology and Metabolism"
evidence = "review"
note = "Restates the prolactinoma threshold from an open-access review rather than the primary Endocrine Society or Pituitary Society guideline text. PRL above 250 ng/mL is highly suggestive of prolactinoma. Lower values are common with stalk dysfunction, drugs or systemic disease. Macroprolactin should be excluded when values are discordant (hook effect)."
citations = [
  { pmid = "29768629", doi = "10.20945/2359-3997000000032", title = "Controversial issues in the management of hyperprolactinemia and prolactinomas - An overview by the Neuroendocrinology Department of the Brazilian Society of Endocrinology and Metabolism.", url = "https://pubmed.ncbi.nlm.nih.gov/29768629/", locator = "Full text", quote = "PRL levels > 250 ng/mL are highly suggestive of the presence of a prolactinoma." },
]
