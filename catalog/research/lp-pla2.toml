slug = "lp-pla2"
name = "Lipoprotein-associated Phospholipase A2"
loinc = "79639-2"
category = "cardiac"
unit = "nmol/min/mL"
description = "Lipoprotein-associated phospholipase A2, an enzyme carried on LDL particles that is linked to vascular inflammation. Its activity is measured as a cardiovascular risk marker, with cut-offs that depend on the assay and are less well established than for troponin or natriuretic peptides."
aliases = ["Lp-PLA2", "PLAC test", "LpPLA2"]

[[range]]
set = "lp-pla2-review-2021"
kind = "decision"
low = 225
unit = "nmol/min/mL"
when = { method = "plac-test" }
population = "Adults at cardiovascular risk, assessed with the PLAC Test Activity (manufacturer cut-off)"
evidence = "consensus"
note = "Manufacturer-declared enzyme activity cut-off of the PLAC Test that identifies high cardiovascular risk (at or above 225 nmol/min/mL, boundary inclusive). The source is a review that reports the manufacturer cut-off; it is not an independent guideline value. Activity thresholds are assay specific and may need to be sex and race specific."
citations = [
  { pmid = "34336025", doi = "10.5114/aoms.2020.98195", title = "On the present and future role of Lp-PLA(2) in atherosclerosis-related cardiovascular risk prediction and management.", url = "https://pubmed.ncbi.nlm.nih.gov/34336025/", locator = "Full text, Lp-PLA2 measurement section", quote = "declares an enzyme activity cut-off point at 225 nmol/min/ml that identifies high cardiovascular risk patients" },
]

