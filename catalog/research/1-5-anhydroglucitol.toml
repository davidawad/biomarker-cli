slug = "1-5-anhydroglucitol"
name = "1,5-Anhydroglucitol (GlycoMark)"
category = "glycemic"
unit = "µg/mL"
description = "1,5-Anhydroglucitol reflects glucose excursions over about 1-2 weeks; it falls when blood glucose exceeds the renal threshold. Low values indicate short-term hyperglycaemia."

