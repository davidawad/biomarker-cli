slug = "ca-19-9"
name = "Carbohydrate Antigen 19-9"
loinc = "24108-3"
category = "tumour"
unit = "U/mL"
description = "Carbohydrate antigen 19-9, a sialylated glycan marker used mainly to monitor pancreatic and biliary cancers. It is not produced in people who lack the Lewis antigen, so a low value does not exclude cancer in them, and it can be raised by benign biliary obstruction and inflammation."
aliases = ["CA19-9", "CA 19-9", "CA19.9"]

[[range]]
set = "ca19-9-ipmn-meta-2026"
kind = "decision"
low = 37
population = "Patients with intraductal papillary mucinous neoplasm (IPMN) who underwent resection (systematic review and meta-analysis)"
evidence = "meta-analysis"
note = "Guideline-referenced threshold: serum CA19-9 >= 37 U/mL is considered a worrisome feature. Boundary is >= 37. Used as a diagnostic cut-off in this IPMN meta-analysis; not a general screening threshold."
citations = [
  { pmid = "42360746", doi = "10.1001/jamanetworkopen.2026.17587", title = "Serum CA19.9 for Detecting High-Grade Dysplasia and Invasive Carcinoma in Patients With Intraductal Papillary Mucinous Neoplasm: A Systematic Review and Meta-Analysis.", url = "https://pubmed.ncbi.nlm.nih.gov/42360746/", locator = "Abstract, Introduction", quote = "Guidelines consider an elevated serum CA19.9 level (≥37 U/mL) a worrisome feature and a relative indication for surgery." },
]

[[range]]
set = "ca199-fut3-cutoff-2026"
kind = "decision"
high = 7
population = "Patients with pancreatic ductal adenocarcinoma (PDAC) with FUT3-null (Lewis-negative) status, training and validation cohorts"
evidence = "cohort-study"
note = "Lewis-negative caveat: a CA19-9 at or below 7 U/mL suggests FUT3-null (Lewis-negative) status, in which CA19-9 is not produced and a low value does not exclude cancer. Boundary is <= 7 U/mL. Derived in one PDAC cohort."
citations = [
  { pmid = "42162970", doi = "10.1158/1078-0432.CCR-25-4564", title = "A New CA19-9 Cutoff Value Identifies Lewis Antigen Status and Refines Prognostic Stratification in PDAC.", url = "https://pubmed.ncbi.nlm.nih.gov/42162970/", locator = "Abstract, Results", quote = "ROC analysis identified 7 U/mL as the optimal CA19-9 cutoff for FUT3-null (positive predictive value 95.1%; accuracy 87.9%)." },
]

