high = 2.48
when = { sex = "female", age_min = 20, age_max = 30 }
population = "China National Health Survey adults (females aged 20-29, n=189), Sysmex XN-B3 analyser"
evidence = "reference-interval"
note = "LMS-smoothed 5th-95th centiles; analyser-specific."
