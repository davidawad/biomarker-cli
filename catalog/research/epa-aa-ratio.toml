slug = "epa-aa-ratio"
name = "EPA/arachidonic acid ratio"
category = "fatty-acid"
unit = "ratio"
description = "Ratio of serum eicosapentaenoic acid to arachidonic acid, an index of the balance between omega-3 and omega-6 eicosanoid precursors. Low values indicate a relative excess of arachidonic acid over EPA."

[[range]]
set = "epa-aa-cad-2025"
kind = "warn"
high = 0.3
when = { specimen = "serum", condition = ["coronary-artery-disease"] }
population = "Patients with coronary artery disease receiving statin therapy (n=150 consecutive patients); threshold used to select patients for EPA therapy"
evidence = "outcome"
note = "Operational low-ratio threshold from a single small study (impaired FMD and low EPA/AA); not a validated population reference interval. Serum fatty acids."
citations = [
