slug = "tc-hdl-ratio"
name = "Total Cholesterol to HDL-C Ratio"
category = "derived"
unit = "ratio"
description = "Total cholesterol divided by HDL cholesterol, also called the atherogenic or Castelli index. A higher ratio means more cholesterol carried in atherogenic particles relative to protective HDL, and it predicts coronary risk. Thresholds differ by sex and by primary or secondary prevention."
aliases = ["TC/HDL ratio", "TC:HDL ratio", "total/HDL cholesterol ratio", "Castelli index I", "atherogenic index"]

[[range]]
set = "millan-2009-table1"
kind = "decision"
low = 5.0
when = { sex = "male", setting = "primary-prevention" }
population = "Adults stratified by sex; risk categories and target levels for primary and secondary prevention as tabulated in this review (sources cited in the table)"
evidence = "consensus"
note = "Primary prevention, men: risk level above 5.0 (boundary > 5.0) for total cholesterol/HDL-C ratio."
citations = [
  { pmid = "19774217", doi = "10.2147/vhrm.s6269", title = "Lipoprotein ratios: Physiological significance and clinical usefulness in cardiovascular prevention.", url = "https://pubmed.ncbi.nlm.nih.gov/19774217/", locator = "Table 1, Risk categories and target levels for total cholesterol/HDL-C ratio", quote = "TC/HDL-C >5.0 >4.5 <4.5 <4.0 >4.0 >3.5 <3.5 <3.0" },
]

