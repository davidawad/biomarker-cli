[[range]]
set = "spain-municipality-2019-esr"
kind = "reference"
high = 20
when = { sex = "male" }
population = "Adults of a Spanish municipality (n=1472, age 18-91 years); the hospital laboratory limits quoted in the study's Methods"
evidence = "cohort-study"
note = "Laboratory ESR upper limit for men used by one Spanish hospital (0-20 mm/h), applied without age adjustment. ESR rises with age, so this is a single flat limit, not an age-specific interval."
citations = [
  { pmid = "31441853", doi = "10.1097/MD.0000000000016816", title = "Factors influencing erythrocyte sedimentation rate in adults: New evidence for an old test.", url = "https://pubmed.ncbi.nlm.nih.gov/31441853/", locator = "Full text, Methods", quote = "The hospital's reference ESR values are 0 to 20 mm/h for males and 0 to 30 mm/h for females." },
]

