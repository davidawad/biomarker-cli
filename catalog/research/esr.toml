[[range]]
set = "bjog-2001"
kind = "reference"
low = 18
high = 48
when = { sex = "female", pregnant = true, gestation_week_max = 20 }
population = "1019 healthy pregnant women at routine antenatal visits, London (Westergren method), non-anaemic women; source reports the first half of pregnancy"
evidence = "reference-interval"
note = "Source gives first-half and second-half ranges without gestational weeks; the 20-week split is an approximation of half of a ~40-week pregnancy. Non-anaemic women only (anaemic women: 21-62 mm/h first half, 40-95 mm/h second half). 95% reference range."
citations = [
  { locator = "Abstract, Results", title = "Pregnancy and the erythrocyte sedimentation rate.", quote = "For non-anaemic women the 95% reference range rose from 18-48 mm/h in the first half of pregnancy to 30-70 mm/h in the second half of pregnancy.", pmid = "11762656" },
]

