evidence = "reference-interval-study"
note = "95th percentile upper limit for the BC-720 automated analyser (Easy-W method), not for manual Westergren tubes. Lower limit 0 mm/h."
citations = [
  { pmid = "36172102", doi = "10.21037/atm-22-3486", title = "Performance evaluation of the BC-720 auto hematology analyzer and establishment of the reference intervals of erythrocyte sedimentation rate in healthy adults.", url = "https://pubmed.ncbi.nlm.nih.gov/36172102/", locator = "Abstract, Results", quote = "The 95th percentile of the biological reference interval for BC-720 ESR is 15 mm/h for men and 24 mm/h for women." },
]

