slug = "esr"
name = "Erythrocyte Sedimentation Rate"
loinc = "4537-7"
category = "inflammation"
unit = "mm/h"
description = "Distance red cells settle in one hour in an anticoagulated tube (Westergren method). A non-specific marker of inflammation that rises with age and in many inflammatory, infectious and malignant conditions."
aliases = ["ESR", "sedimentation rate", "Westergren ESR"]

[[range]]
set = "norway-oslo-1996-esr"
kind = "reference"
high = 12
when = { sex = "male", age_min = 20, age_max = 55 }
population = "Subjectively healthy Norwegian adults (93% blood donors), age 20-90 years, Oslo area; Westergren or modified Westergren"
evidence = "reference-interval-study"
note = "Upper reference limit (exceeded by chance in 5% of readings) at age 20 years, applied across the 20-54 band. Step approximation of an age-rising limit (14 at 55 years), so limits are underestimated within the band."
citations = [
  { pmid = "8862121", doi = "10.1046/j.1365-2796.1996.30295851000.x", title = "Population-based erythrocyte sedimentation rates in 3910 subjectively healthy Norwegian adults. A statistical study based on men and women from the Oslo area.", url = "https://pubmed.ncbi.nlm.nih.gov/8862121/", locator = "Abstract, Conclusions", quote = "The upper reference levels expected to be exceeded only by chance in 5% of single individual recordings at the ages of 20, 55 or 90 years, respectively, were estimated to be 12, 14 and 19 mm h-1 for men, and 18, 21 and 23 mm h-1 for women." },
]

