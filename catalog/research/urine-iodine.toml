slug = "urine-iodine"
name = "Iodine, Urine (median, population)"
category = "mineral"
unit = "µg/L"
description = "Median urinary iodine concentration in a population sample, the WHO/UNICEF/ICCIDD indicator of population iodine intake. These criteria apply to population medians, not to an individual's urinary iodine, which varies day to day."

[[range]]
set = "clinical"
kind = "diagnostic"
high = 20
population = "Population median, school-age children and non-pregnant adults (WHO/UNICEF/ICCIDD criteria as quoted in the cited paper)"
evidence = "consensus"
note = "Severe iodine deficiency: population median strictly below 20 ug/L. Applies to population medians, not individuals."
citations = [
  { pmid = "40432435", title = "Iodine Intake and Iodine Status in the Czech Republic - Past, Present, Future.", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC12148121/", locator = "Background (iodine status paragraph)", quote = "below 20 ug/L denotes severe iodine deficiency, between 20-49 moderate, between 50-99 mild iodine deficiency, UlC between 100-199 is adequate iodine intake, UlC between 200-299 more than adequate, and UlC more than 300 ug/L is excessive iodine intake" },
]

