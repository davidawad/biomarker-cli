[package]
name = "biomarker-cli"
version = "0.2.0"
edition = "2021"
description = "Track biomarkers (lab results) for any number of people, backed by FrankenSQLite (fsqlite)"
license = "MIT"
repository = "https://gitlab.com/davidawad/biomarker-cli"
readme = "README.md"
default-run = "biomarker"

[[bin]]
name = "biomarker"
path = "src/main.rs"

[lib]
name = "biomarker_cli"
path = "src/lib.rs"

[dependencies]
fsqlite = { version = "0.4.7", default-features = false, features = ["native"] }
asupersync = { version = "0.5", default-features = false }
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "string"] }
clap_complete = "4.5"
clap_complete_nushell = "4.5"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
chacha20poly1305 = "0.11"
argon2 = "0.6"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.4"
rpassword = "7"
age = { version = "0.12", features = ["armor"] }
calamine = "0.36.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rust_xlsxwriter = "0.99.1"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
strip = "symbols"
